apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: {{ include "relay.image" . }}
          args: ["eval", "Relay.Release.migrate()"]
          env:
            {{- include "relay.env" . | nindent 12 }}
            - name: RELAY_ROLES
              value: worker
          volumeMounts:
            - name: database-password
              mountPath: /run/secrets/relay
              readOnly: true
      volumes:
        - name: database-password
          secret:
            secretName: {{ .Values.database.passwordSecret }}
            items:
              - key: password
                path: database-password
