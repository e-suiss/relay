components:
  securitySchemes:
    access_bearer:
      type: oauth2
      description: "Short-lived Access access token obtained with OAuth 2.0 client credentials for an API client registered in Access. The client is bound to one tenant, one environment and optionally one subtenant. Relay validates the token with the cached Access JWKS: iss, aud (Relay server API), exp and nbf on every request, an allow-list of algorithms, no unsigned tokens. Relay has no API keys of its own. The token endpoint is discovered from the Access issuer."
      flows:
        clientCredentials:
          tokenUrl: "https://access.example.com/oauth2/token"
          scopes:
            publish: Send events and batches, and cancel.
            read: Query events, notifications, deliveries and history.
            subscribers: Write subscribers, devices, topics and subscriptions.
            config: Write workflows, templates, layouts, partials, routes, recurrences, CloudEvents mappings and webhook endpoints.
            kill_switch: Engage and tighten kill switches of campaign and workflow scope only.
    mtls:
      type: mutualTLS
      description: "Optional additional layer for enterprise tenants: RFC 8705 certificate-bound Access tokens. It is used together with access_bearer, never alone."
    operator_session:
      type: apiKey
      in: cookie
      name: relay_operator_session
      description: "Operator session started through Access OIDC on the operator API. Requests carry Relay-Tenant and Relay-Environment; mutating requests carry Relay-Csrf-Token."
      x-relay-choice: true
    operator_bearer:
      type: oauth2
      description: Access access token of an operator whose audience is the Relay operator API, used by the CLI. Step-up uses the RFC 9470 challenge.
      flows:
        authorizationCode:
          authorizationUrl: "https://access.example.com/oauth2/authorize"
          tokenUrl: "https://access.example.com/oauth2/token"
          scopes: {}
      x-relay-choice: true
    suiss_webhook_signature:
      type: apiKey
      in: header
      name: webhook-signature
      description: "Shared Suiss webhook profile: webhook-id, webhook-timestamp and webhook-signature (v1a Ed25519 by default, v1 HMAC only for compatibility), verified against the Access keys from discovery."
