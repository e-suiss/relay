    - hms_app
    - vapid
    - slack_app
    - teams_bot
    - telegram_bot
    - discord_bot
ChannelIdentity:
  type: object
  description: "A channel identity of a platform (C-26) with the fingerprint of its secret."
  required:
    - object
    - id
    - channel
    - kind
    - app_ref
    - secret
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: channel_identity
    id:
      "$ref": "#/Id_chi"
    channel:
      "$ref": "#/Channel"
    kind:
      "$ref": "#/ChannelIdentityKind"
    app_ref:
      type: string
      minLength: 1
      maxLength: 256
    secret:
      oneOf:
        - "$ref": "#/SecretView"
        - type: "null"
    state:
      type: string
      enum:
        - active
        - retired
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
ChannelIdentityList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/ChannelIdentity"
ChannelIdentityPatch:
  type: object
  description: "JSON Merge Patch of a channel identity."
  properties:
    app_ref:
      type: string
      minLength: 1
      maxLength: 256
  additionalProperties: false
SecretRef:
  type: string
