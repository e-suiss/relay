          minimum: 1
          maximum: 99
        - type: "null"
    paused_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    reason:
      type: string
      maxLength: 2000
    ticket_ref:
      oneOf:
        - type: string
          maxLength: 512
        - type: "null"
    origin:
      type: string
      enum:
        - operator
        - dead_man
    created_by:
      type: string
      maxLength: 256
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    supersedes_id:
      oneOf:
        - "$ref": "#/Id_ksw"
        - type: "null"
    status:
      type: string
      enum:
        - active
        - released
    released_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    released_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    release_reason:
      oneOf:
        - type: string
          maxLength: 2000
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
KillSwitchList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/KillSwitch"
KillSwitchEngage:
  type: object
  required:
    - scope_kind
    - reason
  properties:
    scope_kind:
      type: string
      enum:
        - tenant
        - subtenant
        - campaign
        - workflow
        - api_client
        - sender
      description: API clients with the kill_switch scope may use only campaign and workflow.
    scope_ref:
      type: string
      description: Identifier of the scoped object (stn_, campaign, workflow key, cli_, sender).
      maxLength: 128
    channel:
      "$ref": "#/Channel"
    target_kind:
      type: string
      enum:
        - all
        - provider_account
        - template
      default: all
    target_ref:
      type: string
      maxLength: 128
    message_class:
      "$ref": "#/MessageClass"
      description: Omit to stop every class except security. Stopping security is a separate choice that needs step-up.
    state:
      type: string
      enum:
        - "off"
        - canary
        - paused_until
      default: "off"
    canary_percent:
      type: integer
      minimum: 1
      maximum: 99
    paused_until:
      "$ref": "#/Timestamp"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    ticket_ref:
      type: string
      maxLength: 512
    ttl:
      "$ref": "#/Duration"
      description: "Time to live; required unless no_ttl is true."
    no_ttl:
      type: boolean
      description: A record without TTL needs explicit approval (operator session with step-up).
  additionalProperties: false
PlatformKillSwitchEngage:
  type: object
  description: "Platform kill switch; applies to every tenant and both environments."
  required:
    - reason
  properties:
    channel:
      "$ref": "#/Channel"
    target_kind:
      type: string
      enum:
        - all
        - provider_account
        - template
      default: all
    target_ref:
      type: string
      maxLength: 128
    message_class:
      "$ref": "#/MessageClass"
      description: Omit to stop every class except security. Stopping security is a separate choice that needs step-up.
    state:
      type: string
      enum:
        - "off"
        - canary
        - paused_until
      default: "off"
    canary_percent:
      type: integer
      minimum: 1
      maximum: 99
    paused_until:
      "$ref": "#/Timestamp"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    ticket_ref:
      type: string
      maxLength: 512
    ttl:
      "$ref": "#/Duration"
      description: "Time to live; required unless no_ttl is true."
    no_ttl:
      type: boolean
      description: A record without TTL needs explicit approval (operator session with step-up).
  additionalProperties: false
KillSwitchReplace:
  type: object
  description: "Replace the state of a kill switch, keeping its dimensions. Tightening needs no step-up; relaxing needs an operator session with step-up."
  required:
    - state
    - reason
  properties:
    state:
      type: string
      enum:
        - "off"
        - canary
        - paused_until
    canary_percent:
      type: integer
      minimum: 1
      maximum: 99
    paused_until:
      "$ref": "#/Timestamp"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    ttl:
      "$ref": "#/Duration"
    no_ttl:
      type: boolean
  additionalProperties: false
KillSwitchRelease:
  type: object
  description: "Release is a relaxation: operator session with step-up only. PAUSED deliveries are not resumed automatically."
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
KillSwitchResume:
  type: object
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
KillSwitchBulkCancel:
  type: object
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
KillSwitchActionResult:
  type: object
  required:
    - object
    - kill_switch_id
    - action
    - affected
    - has_more
  properties:
    object:
      type: string
      const: kill_switch_action
    kill_switch_id:
      "$ref": "#/Id_ksw"
    action:
      type: string
      enum:
        - resume
        - bulk_cancel
    affected:
      type: integer
      minimum: 0
    has_more:
      type: boolean
  additionalProperties: false
ErrorDescription:
  type: object
  description: Description of one error code, served from the error catalog.
  required:
    - object
    - code
    - family
    - type
    - title
    - status
    - retryable
    - retry_after
    - description
  properties:
    object:
      type: string
      const: error_code
    code:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    family:
      type: string
    type:
      type: string
      format: uri
    title:
      type: string
    status:
      type: integer
      minimum: 400
      maximum: 599
    retryable:
      type: boolean
    retry_after:
      type: object
      required:
        - kind
        - seconds
        - max_seconds
      properties:
        kind:
          type: string
          enum:
            - none
            - fixed
            - window
            - range
        seconds:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        max_seconds:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
      additionalProperties: false
    description:
      type: string
  additionalProperties: false
VirtualClock:
  type: object
  description: Virtual clock of the test environment.
  required:
    - object
    - offset_ms
    - business_now
  properties:
    object:
      type: string
      const: virtual_clock
    offset_ms:
      type: integer
      minimum: 0
    business_now:
      "$ref": "#/Timestamp"
  additionalProperties: false
SimulatedResult:
  type: object
  description: "One result of the fake provider with the addresses that produce it on each kind of target."
  required:
    - object
    - result
    - email
    - phone
    - token
    - description
  properties:
    object:
      type: string
      const: simulated_result
    result:
      type: string
      enum:
        - delivered
        - sent_only
        - delayed_delivery
        - hard_bounce
        - soft_bounce
        - complaint
        - not_delivered
        - unregistered
        - rate_limited
        - transient_error
        - timeout
        - auth_error
        - sender_config_error
        - content_rejected
        - unknown_code
    email:
      type: string
      description: "The email address <result>@sim.relay.test."
    phone:
      type: string
      description: "The E.164 number +9905550000NN."
      pattern: "^\\+9905550000[0-9]{2}$"
    token:
      type: string
      description: "The push, Web Push, WhatsApp or messaging target sim:<result>."
    description:
      type: string
  additionalProperties: false
SimulatedResultList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/SimulatedResult"
VirtualClockAdvance:
  type: object
  required:
    - by
  properties:
    by:
      "$ref": "#/Duration"
      description: Forward step, at most 366 days. The clock never moves back.
  additionalProperties: false
AccessSecurityEventToken:
  type: string
  description: "A Security Event Token (RFC 8417) Access pushed: a compact JWS of typ secevent+jwt whose claims are iss, aud, iat, jti, sub_id, events with one member keyed urn:suiss:access:event:<type>, and access_tenant on a platform product subscription. Event types and their members are in the event catalog."
  maxLength: 65536
  pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\s*$"
AccessSetError:
  type: object
  description: The RFC 8935 error body of a refused SET.
  required:
    - err
    - description
  properties:
    err:
      type: string
      enum:
        - invalid_request
        - invalid_key
        - invalid_issuer
        - invalid_audience
        - authentication_failed
        - access_denied
    description:
      type: string
      maxLength: 512
  additionalProperties: false
Role:
  type: object
  required:
    - object
    - key
    - scope
    - rank
    - description
  properties:
    object:
      type: string
      const: role
    key:
      type: string
      enum:
        - installation_operator
        - tenant_admin
        - tenant_operator
    scope:
      type: string
      enum:
        - installation
        - tenant
    rank:
      type: integer
      description: "installation_operator 3 > tenant_admin 2 > tenant_operator 1."
    description:
      type: string
  additionalProperties: false
CategoryState:
  type: string
  enum:
    - active
    - archived
PreferenceValue:
  type: string
  enum:
    - opt_in
    - opt_out
    - unset
  description: "Stored preference value; unset falls back to the next level."
PreferenceLevel:
  type: string
  enum:
    - category_channel
    - channel
    - workflow
    - scope_key
PreferenceSource:
  type: string
  enum:
    - user
    - tenant
    - category_default
    - class_default
    - locked
  description: "Where the effective value of a cell comes from: the subscriber's own switch, the tenant (an opt_out it wrote or the category being turned off), the category's channel default, the class default matrix, or the lock of a locked category."
ConsentStatus:
  type: string
  enum:
    - none
    - pending
    - active
    - revoked
    - expired
  description: "Status of a commercial consent as Access records it. none means never asked and is not revoked; a revoked record of any source wins."
ConsentKind:
  type: string
  enum:
    - explicit_opt_in
    - soft_opt_in
    - legitimate_interest
    - none
SuppressionReason:
  type: string
  enum:
    - hard_bounce
    - complaint
    - invalid
    - soft_bounce
    - manual
FrequencyFate:
  type: string
  enum:
    - drop
    - defer
    - digest
    - inbox_only
  description: "What happens to a notification over the frequency limit. Class defaults: marketing drop, operational defer, social digest."
SuppressionState:
  type: string
  enum:
    - active
    - expired
    - lifted
  description: "active until lifted or, for a suppression with expires_at, until that time passes (expired)."
  x-relay-choice: true
  x-relay-choice-note: "Derived from lifted_at and expires_at; the names are chosen by the contract."
CategoryKey:
  type: string
  description: Tenant category key, unique in the environment.
  pattern: "^[a-z][a-z0-9_]{0,63}$"
  examples:
    - order_updates
ChannelDefaults:
  type: object
  description: "Default of each channel for subscribers who set nothing. A channel left out falls back to the class default matrix. A marketing category may not default email, sms, voice or whatsapp to on."
  propertyNames:
    "$ref": "#/Channel"
  additionalProperties:
    type: string
    enum:
      - "on"
      - "off"
ChannelDefaultsPatch:
  type: object
  description: "Merge patch of channel defaults: on or off sets a channel, null removes it so it falls back to the class default matrix."
  propertyNames:
    "$ref": "#/Channel"
  additionalProperties:
    oneOf:
      - type: string
        enum:
          - "on"
          - "off"
      - type: "null"
CategoryFrequency:
  type: object
  description: "Frequency limit of a category: at most limit notifications per subscriber in each window. Only marketing, social and operational categories have one."
  required:
    - limit
    - window
    - fate
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 10000
    window:
      description: "ISO 8601 duration from PT1H to P7D."
      "$ref": "#/Duration"
    fate:
      "$ref": "#/FrequencyFate"
  additionalProperties: false
Category:
  type: object
  description: "Tenant category. A workflow names its category, and the workflow's message class must be the category's class."
  required:
    - object
    - id
    - key
    - name
    - message_class
    - locked
    - enabled
    - channel_defaults
    - default_expires_in
    - frequency
    - digest_allowed
    - state
    - builtin
    - version
    - created_at
    - updated_at
    - archived_at
  properties:
    object:
      type: string
      const: category
    id:
      "$ref": "#/Id_ctg"
    key:
      "$ref": "#/CategoryKey"
    name:
      type: string
      minLength: 1
      maxLength: 200
    message_class:
      "$ref": "#/MessageClass"
    locked:
      type: boolean
      description: "A locked category keeps at least one channel open for every subscriber. Always true for security."
    enabled:
      type: boolean
      description: "false turns the category off for the whole tenant."
    channel_defaults:
      "$ref": "#/ChannelDefaults"
    default_expires_in:
      description: "Expiry of notifications of this category, PT1M to P30D. null applies the class default: transactional PT6H, operational PT24H, social PT48H, marketing P2D, action_required PT24H, system PT1H. Never set for security."
      oneOf:
        - "$ref": "#/Duration"
        - type: "null"
    frequency:
      oneOf:
        - "$ref": "#/CategoryFrequency"
        - type: "null"
    digest_allowed:
      type: boolean
      description: "Whether subscribers may choose a digest for this operational category. Social categories are always digestible."
    state:
      "$ref": "#/CategoryState"
    builtin:
      type: boolean
      description: "true for the built-in security category of the Access platform tenant; it cannot be archived."
    version:
      type: integer
      minimum: 1
      description: "Optimistic concurrency version; the ETag carries it."
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
CategoryList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Category"
CategoryCreate:
  type: object
  description: "Create a category. message_class is fixed here. locked defaults to false (always true for security), enabled to true, channel_defaults to empty and digest_allowed to false; default_expires_in and frequency left out apply the class defaults."
  required:
    - key
    - name
    - message_class
  properties:
    key:
      "$ref": "#/CategoryKey"
    name:
      type: string
      minLength: 1
      maxLength: 200
    message_class:
      "$ref": "#/MessageClass"
    locked:
      type: boolean
    enabled:
      type: boolean
    channel_defaults:
      "$ref": "#/ChannelDefaults"
    default_expires_in:
      description: "ISO 8601 duration from PT1M to P30D; not allowed for security."
      "$ref": "#/Duration"
    frequency:
      "$ref": "#/CategoryFrequency"
    digest_allowed:
      type: boolean
      description: Only operational categories may allow a digest.
  additionalProperties: false
CategoryPatch:
  type: object
  description: "JSON Merge Patch of a category. key, message_class and builtin cannot be changed."
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    locked:
      type: boolean
    enabled:
      type: boolean
    channel_defaults:
      "$ref": "#/ChannelDefaultsPatch"
    default_expires_in:
      description: "ISO 8601 duration from PT1M to P30D; null applies the class default."
      oneOf:
        - "$ref": "#/Duration"
        - type: "null"
    frequency:
      description: "Written as a whole object; null removes the limit."
      oneOf:
        - "$ref": "#/CategoryFrequency"
        - type: "null"
    digest_allowed:
      type: boolean
  additionalProperties: false
CategorySubtenantSetting:
  type: object
  description: "Overrides of a category for one subtenant. A null override inherits the category's value."
  required:
    - object
    - category
    - subtenant_id
    - enabled
    - channel_defaults
    - frequency
    - default_expires_in
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: category_subtenant_setting
    category:
      "$ref": "#/CategoryKey"
    subtenant_id:
      "$ref": "#/Id_stn"
    enabled:
      oneOf:
        - type: boolean
        - type: "null"
    channel_defaults:
      oneOf:
        - "$ref": "#/ChannelDefaults"
        - type: "null"
    frequency:
      oneOf:
        - "$ref": "#/CategoryFrequency"
        - type: "null"
    default_expires_in:
      oneOf:
        - "$ref": "#/Duration"
        - type: "null"
    version:
      type: integer
      minimum: 0
      description: "Version of the setting; 0 when the subtenant has none."
    created_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    updated_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
CategorySubtenantSettingWrite:
  type: object
  description: "Full replacement of a subtenant's overrides; an absent or null field inherits the category's value."
  properties:
    enabled:
      oneOf:
        - type: boolean
        - type: "null"
    channel_defaults:
      oneOf:
        - "$ref": "#/ChannelDefaults"
        - type: "null"
    frequency:
      oneOf:
        - "$ref": "#/CategoryFrequency"
        - type: "null"
    default_expires_in:
      description: "ISO 8601 duration from PT1M to P30D; not allowed for security."
      oneOf:
        - "$ref": "#/Duration"
        - type: "null"
  additionalProperties: false
PreferenceCell:
  type: object
  description: "One category and channel of a subscriber. web_push follows push and voice follows sms."
  required:
    - category
    - channel
    - value
    - effective
    - source
  properties:
    category:
      "$ref": "#/CategoryKey"
    channel:
      "$ref": "#/Channel"
    value:
      "$ref": "#/PreferenceValue"
    effective:
      type: boolean
      description: Whether the channel is open for this category after every level is applied.
    source:
      "$ref": "#/PreferenceSource"
  additionalProperties: false
ChannelPreference:
  type: object
  description: Channel-level switch across all categories.
  required:
    - channel
    - value
  properties:
    channel:
      "$ref": "#/Channel"
    value:
      "$ref": "#/PreferenceValue"
  additionalProperties: false
WorkflowPreference:
  type: object
  required:
    - workflow
    - value
  properties:
    workflow:
      "$ref": "#/WorkflowKey"
    value:
      "$ref": "#/PreferenceValue"
  additionalProperties: false
ScopeKeyPreference:
  type: object
  required:
    - scope_key
    - value
  properties:
    scope_key:
      type: string
      minLength: 1
      maxLength: 256
    value:
      "$ref": "#/PreferenceValue"
  additionalProperties: false
TimeRange:
  type: object
  description: "Weekly time range in the subscriber's time zone. An end before the start crosses midnight; start and end differ."
  required:
    - day
    - start
    - end
  properties:
    day:
      type: string
      enum:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
    start:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples:
        - "22:00"
    end:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples:
        - "07:30"
  additionalProperties: false
DigestChoices:
  type: object
  description: "Digest choice by category key. Only social categories and operational categories that allow a digest may be chosen."
  propertyNames:
    "$ref": "#/CategoryKey"
  additionalProperties:
    type: string
    enum:
      - instant
      - digest
PreferenceProfile:
  type: object
  description: "The subscriber's delivery profile. Only the subscriber writes it."
  required:
    - quiet_hours
    - schedule
    - dnd_until
    - quiet_hours_email
    - digest
  properties:
    quiet_hours:
      type: array
      items:
        "$ref": "#/TimeRange"
      maxItems: 28
    schedule:
      type: array
      description: Weekly availability.
      items:
        "$ref": "#/TimeRange"
      maxItems: 28
    dnd_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    quiet_hours_email:
      type: boolean
      description: "Email is outside quiet hours unless this is true."
    digest:
      "$ref": "#/DigestChoices"
  additionalProperties: false
SubscriberPreferences:
  type: object
  description: "A subscriber's preferences: one cell for every active category other than system and every channel, so no cell is undefined, beside the channel, workflow and scope key switches and the profile."
  required:
    - object
    - subscriber_id
    - cells
    - channels
    - workflows
    - scope_keys
    - profile
  properties:
    object:
      type: string
      const: subscriber_preferences
    subscriber_id:
      "$ref": "#/Id_sub"
    cells:
      type: array
      items:
        "$ref": "#/PreferenceCell"
    channels:
      type: array
      items:
        "$ref": "#/ChannelPreference"
    workflows:
      type: array
      items:
        "$ref": "#/WorkflowPreference"
    scope_keys:
      type: array
      items:
        "$ref": "#/ScopeKeyPreference"
    profile:
      "$ref": "#/PreferenceProfile"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "subscriber_id is added so a client can match the response to the subscriber."
PreferenceWrite:
  type: object
  description: "One preference switch. category_channel needs category and channel; channel needs channel only; workflow needs workflow; scope_key needs scope_key."
  required:
    - level
    - value
  properties:
    level:
      "$ref": "#/PreferenceLevel"
    category:
      "$ref": "#/CategoryKey"
    channel:
      "$ref": "#/Channel"
    workflow:
      "$ref": "#/WorkflowKey"
    scope_key:
      type: string
      minLength: 1
      maxLength: 256
    value:
      "$ref": "#/PreferenceValue"
  additionalProperties: false
PreferencesPatch:
  type: object
  description: "Preference writes of the tenant on behalf of a subscriber; the tenant may only write opt_out."
  required:
    - preferences
  properties:
    preferences:
      type: array
      items:
        "$ref": "#/PreferenceWrite"
      minItems: 1
      maxItems: 100
  additionalProperties: false
PreferenceProfileWrite:
  type: object
  description: "Profile fields to write; an absent field is untouched and digest is replaced as a whole."
  properties:
    quiet_hours:
      type: array
      items:
        "$ref": "#/TimeRange"
      maxItems: 28
    schedule:
      type: array
      items:
        "$ref": "#/TimeRange"
      maxItems: 28
    dnd_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    quiet_hours_email:
      type: boolean
    digest:
      "$ref": "#/DigestChoices"
  additionalProperties: false
MyPreferencesPatch:
  type: object
  description: "The subscriber's own preference writes and profile; at least one of them."
  minProperties: 1
  properties:
    preferences:
      type: array
      items:
        "$ref": "#/PreferenceWrite"
      minItems: 1
      maxItems: 100
    profile:
      "$ref": "#/PreferenceProfileWrite"
  additionalProperties: false
Consent:
  type: object
  description: "Read-only copy of a commercial consent recorded by Access for one brand and channel."
  required:
    - object
    - id
    - brand
    - channel
    - status
    - consent_kind
    - recipient_type
    - source
    - occurred_at
  properties:
    object:
      type: string
      const: consent
    id:
      "$ref": "#/Id_cns"
    brand:
      description: "Subtenant that is the brand of the consent; null is the tenant itself."
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    channel:
      "$ref": "#/Channel"
    status:
      "$ref": "#/ConsentStatus"
    consent_kind:
      oneOf:
        - "$ref": "#/ConsentKind"
        - type: "null"
    recipient_type:
      oneOf:
        - "$ref": "#/LegalType"
        - type: "null"
    source:
      type: string
      description: Where the consent was given, as Access names it.
      maxLength: 64
    occurred_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
ConsentList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Consent"
Suppression:
  type: object
  description: "An address that Relay does not deliver to on one channel. The address is held only as a keyed digest and is never returned."
  required:
    - object
    - id
    - channel
    - reason
    - state
    - expires_at
    - created_at
    - lifted_at
    - lifted_by
    - lift_reason
  properties:
    object:
      type: string
      const: suppression
    id:
      "$ref": "#/Id_sup"
    channel:
      "$ref": "#/Channel"
    reason:
      "$ref": "#/SuppressionReason"
    state:
      "$ref": "#/SuppressionState"
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    lifted_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    lifted_by:
      description: Reference of the actor that lifted the suppression.
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    lift_reason:
      oneOf:
        - type: string
          maxLength: 2000
        - type: "null"
  additionalProperties: false
SuppressionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Suppression"
SuppressionCreate:
  type: object
  description: "Manual suppression of an address on one channel."
  required:
    - channel
    - address
  properties:
    channel:
      "$ref": "#/Channel"
    address:
      type: string
      description: "The email address, E.164 phone number or device token to suppress. It is digested and never stored or returned in clear."
      minLength: 1
      maxLength: 512
      writeOnly: true
    reason:
      type: string
      enum:
        - manual
        - invalid
      default: manual
    expires_at:
      description: "Future time the suppression ends; only for reason manual."
      "$ref": "#/Timestamp"
  additionalProperties: false
SuppressionLift:
  type: object
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
DryRunDecision:
  type: object
  description: "The decision Relay would make for one channel in dry_run."
  required:
    - channel
    - decision
    - reason
    - rule_id
    - deferred_until
  properties:
    channel:
      "$ref": "#/Channel"
    decision:
      type: string
      enum:
        - send
        - skip
        - defer
    reason:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    deferred_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
Id_tpv:
  type: string
  description: "Template version identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^tpv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - tpv_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_lay:
  type: string
  description: "Layout identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^lay_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - lay_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_lyv:
  type: string
  description: "Layout version identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^lyv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - lyv_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_prt:
  type: string
  description: "Partial identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^prt_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - prt_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_ptv:
  type: string
  description: "Partial version identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^ptv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - ptv_01j9zq3k4m5n6p7q8r9s0t1v2w
TemplateKey:
  type: string
  description: "Key of a template, layout or partial, unique in its tenant or subtenant: a slug of lowercase letters and digits joined by single hyphens, the same form as a workflow step's template key."
  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  minLength: 1
  maxLength: 100
  examples:
    - order-shipped
TemplateOwner:
  type: string
  description: "Owner of a template: the tenant, a subtenant, or a producer product whose template is protected."
  enum:
    - tenant
    - subtenant
    - producer
TemplateType:
  type: string
  description: "Transactional or marketing; follows the message class of the category (marketing for a marketing category) and never converts into the other after the first publication."
  enum:
    - transactional
    - marketing
Sensitivity:
  type: string
  description: "Sensitivity class of a template. A sensitive push shows only lock_screen_body on the lock screen and fetches in_app_body when the app opens."
  enum:
    - public
    - personal
    - sensitive
SmsEncodingPolicy:
  type: string
  description: "SMS encoding policy of a template; turkish_shift is the default. A provider not verified for the Turkish single shift table receives ucs2."
  enum:
    - transliterate
    - turkish_shift
    - ucs2
SmsEncoding:
  type: string
  description: Planned SMS encoding of a render.
  enum:
    - GSM7
    - GSM7_TR
    - UCS2
SensitivityApproval:
  type: object
  description: "Explicit confirmation of the sensitivity class after the sensitive term dictionary matched the fixed text or variable names."
  required:
    - matched_terms
    - approved_by
    - approved_at
  properties:
    matched_terms:
      type: array
      items:
        type: string
        maxLength: 64
      maxItems: 200
    approved_by:
      type: string
      maxLength: 256
    approved_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
SmsCell:
  type: object
  required:
    - body
  properties:
    body:
      type: string
      maxLength: 262144
      description: "Liquid source; no emoji in the template text."
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
VoiceCell:
  type: object
  description: "The text a voice call reads in the cell's language (otp_oob and commercial voice messages). A commercial voice variant names its sender by the brand's legal_name, the trade name."
  required:
    - body
  properties:
    body:
      type: string
      maxLength: 262144
      description: "Liquid source of the spoken text."
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
PushCell:
  type: object
  required:
    - title
    - body
  properties:
    title:
      type: string
      maxLength: 262144
    subtitle:
      type: string
      maxLength: 262144
    body:
      type: string
      maxLength: 262144
    lock_screen_body:
      type: string
      maxLength: 262144
      description: "Neutral text for the lock screen; required for a sensitive template."
    in_app_body:
      type: string
      maxLength: 262144
      description: "Full content fetched when the app opens; required for a sensitive template."
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
EmailCell:
  type: object
  required:
    - subject
    - html
    - text
  properties:
    subject:
      type: string
      maxLength: 262144
    preheader:
      type: string
      maxLength: 262144
    html_kind:
      type: string
      enum:
        - mjml
        - raw_html
      default: mjml
      description: "raw_html is for enterprise tenants; it is shown only in the sandboxed preview."
    html:
      type: string
      maxLength: 262144
    text:
      type: string
      maxLength: 262144
      description: Plain text body; required and separate from the HTML.
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
WhatsappCell:
  type: object
  required:
    - template_name
    - parameters
  properties:
    template_name:
      type: string
      maxLength: 512
      description: Approved Meta template name; new content is a new name.
    language:
      type: string
      maxLength: 35
    parameters:
      type: array
      maxItems: 100
      items:
        type: object
        required:
          - name
          - value
        properties:
          name:
            type: string
            maxLength: 128
          value:
            type: string
            maxLength: 262144
        additionalProperties: false
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
InboxCell:
  type: object
  required:
    - title
    - body
  properties:
    title:
      type: string
      maxLength: 262144
    body:
      type: string
      maxLength: 262144
    avatar_url:
      type: string
      maxLength: 2048
    actions:
      type: array
      maxItems: 5
      items:
        type: object
        required:
          - label
          - url
        properties:
          label:
            type: string
            maxLength: 262144
          url:
            type: string
            maxLength: 262144
        additionalProperties: false
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
WebhookCell:
  type: object
  required:
    - body
  properties:
    body:
      type: string
      maxLength: 262144
      description: "JSON body template in restricted mode; values are encoded with the JSON encoder."
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
TemplateCells:
  type: object
  description: "The channel × locale matrix: content is written per channel and never derived from another channel. A channel without a variant is skipped with rule_id template.variant_missing."
  properties:
    sms:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/SmsCell"
    push:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/PushCell"
    web_push:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/PushCell"
    email:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/EmailCell"
    whatsapp:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/WhatsappCell"
    in_app:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/InboxCell"
    webhook:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/WebhookCell"
    voice:
      type: object
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "The spec names a voice channel and its linter rule but no voice variant; a text variant read by the call is chosen."
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/VoiceCell"
  additionalProperties: false
BrandFields:
  type: object
  description: "Brand fields (brand.*). A subtenant inherits every field it does not set from the tenant."
  properties:
    logo_url:
      type: string
      format: uri
      maxLength: 2048
    primary_color:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
    secondary_color:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
    sender_name:
      type: string
      maxLength: 100
    footer:
      type: string
      maxLength: 2000
    legal_name:
      type: string
      maxLength: 200
    mersis:
      type: string
      pattern: "^[0-9]{16}$"
    contact:
      type: string
      maxLength: 500
    postal_address:
      type: string
      maxLength: 500
  additionalProperties: false
TemplateDefinition:
  type: object
  description: "Template definition: the shared layer and the channel × locale matrix. The same definition is accepted by the file format, the management API and the producer API. The variable schema comes from the workflow version that uses the template."
  required:
    - default_locale
    - cells
  properties:
    default_locale:
      "$ref": "#/Locale"
    sensitivity:
      oneOf:
        - "$ref": "#/Sensitivity"
        - type: "null"
    sensitivity_approval:
      oneOf:
        - "$ref": "#/SensitivityApproval"
        - type: "null"
    sms_encoding:
      "$ref": "#/SmsEncodingPolicy"
    transliterate:
      type: boolean
      default: false
      description: "Transliterate SMS text outside the legal text; off by default except for security messages."
    allow_raw:
      type: boolean
      default: false
      description: "Allows the raw filter in this template."
    layout:
      oneOf:
        - "$ref": "#/TemplateKey"
        - type: "null"
    partials:
      type: array
      items:
        "$ref": "#/TemplateKey"
      maxItems: 50
      uniqueItems: true
    producer_brand:
      oneOf:
        - "$ref": "#/BrandFields"
        - type: "null"
      description: "Producer templates only: the producer's brand values; the tenant overrides only logo_url, primary_color, sender_name and footer."
    cells:
      "$ref": "#/TemplateCells"
  additionalProperties: false
TemplateCreate:
  type: object
  required:
    - key
    - name
    - category
    - definition
  properties:
    key:
      "$ref": "#/TemplateKey"
    name:
      type: string
      minLength: 1
      maxLength: 200
    category:
      "$ref": "#/CategoryKey"
    definition:
      "$ref": "#/TemplateDefinition"
  additionalProperties: false
TemplateDraft:
  type: object
  required:
    - definition
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    category:
      "$ref": "#/CategoryKey"
    definition:
      "$ref": "#/TemplateDefinition"
  additionalProperties: false
Template:
  type: object
  required:
    - object
    - id
    - key
    - name
    - owner
    - category
    - message_class
    - type
    - protected
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: template
    id:
      "$ref": "#/Id_tpl"
    key:
      "$ref": "#/TemplateKey"
    name:
      type: string
      maxLength: 200
    owner:
      "$ref": "#/TemplateOwner"
    product:
      oneOf:
        - type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: "null"
      description: Producer product of a producer-owned template.
    subtenant:
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    category:
      "$ref": "#/CategoryKey"
    message_class:
      "$ref": "#/MessageClass"
    type:
      "$ref": "#/TemplateType"
    protected:
      type: boolean
      description: "True for a producer-owned template: the tenant cannot change its text."
    state:
      type: string
      enum:
        - active
        - archived
    live_version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    draft:
      oneOf:
        - "$ref": "#/TemplateDefinition"
        - type: "null"
    draft_checksum:
      oneOf:
        - type: string
          pattern: "^[0-9a-f]{64}$"
        - type: "null"
      description: "SHA-256 of the draft content, lowercase hex; publication can name it to refuse a draft changed meanwhile."
    version:
      type: integer
      minimum: 1
      description: "Optimistic concurrency version; the ETag carries it."
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
TemplateList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Template"
GateFinding:
  type: object
  description: "One publication gate result. A hard finding blocks publication; warnings pass only when accepted and are recorded on the version."
  required:
    - check
    - level
    - message
  properties:
    check:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      maxLength: 64
      examples:
        - plain_text_missing
    level:
      type: string
      enum:
        - hard
        - warning
    channel:
      "$ref": "#/Channel"
    locale:
      "$ref": "#/Locale"
    message:
      type: string
      maxLength: 1000
    detail:
      type: object
  additionalProperties: false
TemplateVariables:
  type: object
  description: "Variable paths the template reads, extracted at publication: always read and read only under a condition."
  required:
    - always
    - conditional
  properties:
    always:
      type: array
      items:
        type: string
        maxLength: 256
    conditional:
      type: array
      items:
        type: string
        maxLength: 256
  additionalProperties: false
TemplateVersion:
  type: object
  description: "Published template version; immutable."
  required:
    - object
    - id
    - template_key
    - version
    - state
    - definition
    - checksum
    - variables
    - measures
    - findings
    - warnings_accepted
    - published_at
    - published_by
  properties:
    object:
      type: string
      const: template_version
    id:
      "$ref": "#/Id_tpv"
    template_key:
      "$ref": "#/TemplateKey"
    version:
      type: integer
      minimum: 1
    state:
      type: string
      enum:
        - published
        - archived
    live:
      type: boolean
    definition:
      "$ref": "#/TemplateDefinition"
    checksum:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: SHA-256 of the version content, lowercase hex.
    variables:
      "$ref": "#/TemplateVariables"
    measures:
      type: object
      description: "Worst-case measures per channel and locale (length, bytes, SMS segments and encoding, email size)."
    findings:
      type: array
      items:
        "$ref": "#/GateFinding"
    warnings_accepted:
      type: boolean
    warnings_accepted_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    previous_version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    diff:
      oneOf:
        - type: object
        - type: "null"
      description: Difference from the previous live version.
    published_at:
      "$ref": "#/Timestamp"
    published_by:
      type: string
      maxLength: 256
  additionalProperties: false
TemplateVersionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/TemplateVersion"
TemplatePublishRequest:
  type: object
  description: "Publication of the draft. accept_warnings publishes despite warning findings and records them on the version; checksum, when given, must be the draft checksum that was reviewed."
  properties:
    accept_warnings:
      type: boolean
      default: false
    checksum:
      type: string
      pattern: "^[0-9a-f]{64}$"
    note:
      type: string
      maxLength: 500
  additionalProperties: false
TemplateTranslations:
  type: object
  required:
    - object
    - template_key
    - source
    - default_locale
    - locales
    - cells
  properties:
    object:
      type: string
      const: template_translations
    template_key:
      "$ref": "#/TemplateKey"
    source:
      type: string
      enum:
        - draft
        - live
    version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    default_locale:
      "$ref": "#/Locale"
    locales:
      type: array
      items:
        "$ref": "#/Locale"
    cells:
      type: array
      items:
        type: object
        required:
          - channel
          - locale
          - status
        properties:
          channel:
            "$ref": "#/Channel"
          locale:
            "$ref": "#/Locale"
          status:
            type: string
            enum:
              - present
              - missing
              - machine_translated
              - approved
        additionalProperties: false
  additionalProperties: false
ProducerTemplatePublish:
  type: object
  description: "Producer template publication: created on first use, otherwise a new draft published at once."
  required:
    - name
    - category
    - definition
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    category:
      "$ref": "#/CategoryKey"
    definition:
      "$ref": "#/TemplateDefinition"
    accept_warnings:
      type: boolean
      default: false
  additionalProperties: false
LayoutDefinition:
  type: object
  description: "Email layout: MJML with one content slot, plus the plain text header and footer. The MJML is compiled at publication, never at send time."
  required:
    - mjml
  properties:
    mjml:
      type: string
      maxLength: 262144
    text_header:
      type: string
      maxLength: 262144
    text_footer:
      type: string
      maxLength: 262144
  additionalProperties: false
LayoutCreate:
  type: object
  required:
    - key
    - name
    - definition
  properties:
    key:
      "$ref": "#/TemplateKey"
    name:
      type: string
      minLength: 1
      maxLength: 200
    definition:
      "$ref": "#/LayoutDefinition"
  additionalProperties: false
LayoutDraft:
  type: object
  required:
    - definition
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    definition:
      "$ref": "#/LayoutDefinition"
  additionalProperties: false
Layout:
  type: object
  required:
    - object
    - id
    - key
    - name
    - owner
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: layout
    id:
      "$ref": "#/Id_lay"
    key:
      "$ref": "#/TemplateKey"
    name:
      type: string
      maxLength: 200
    owner:
      type: string
      enum:
        - tenant
        - subtenant
    subtenant:
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    state:
      type: string
      enum:
        - active
        - archived
    live_version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    draft:
      oneOf:
        - "$ref": "#/LayoutDefinition"
        - type: "null"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
LayoutList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Layout"
LayoutVersion:
  type: object
  description: "Published layout version; immutable."
  required:
    - object
    - id
    - layout_key
    - version
    - state
    - definition
    - checksum
    - findings
    - warnings_accepted
    - published_at
    - published_by
  properties:
    object:
      type: string
      const: layout_version
    id:
      "$ref": "#/Id_lyv"
    layout_key:
      "$ref": "#/TemplateKey"
    version:
      type: integer
      minimum: 1
    state:
      type: string
      enum:
        - published
        - archived
    live:
      type: boolean
    definition:
      "$ref": "#/LayoutDefinition"
    checksum:
      type: string
      pattern: "^[0-9a-f]{64}$"
    findings:
      type: array
      items:
        "$ref": "#/GateFinding"
    warnings_accepted:
      type: boolean
    previous_version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    diff:
      oneOf:
        - type: object
        - type: "null"
    published_at:
      "$ref": "#/Timestamp"
    published_by:
      type: string
      maxLength: 256
  additionalProperties: false
LayoutVersionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/LayoutVersion"
LayoutPublishRequest:
  "$ref": "#/TemplatePublishRequest"
PartialDefinition:
  type: object
  description: "A named, versioned block a template includes by key. A partial cannot include another partial."
  required:
    - default_locale
    - bodies
  properties:
    default_locale:
      "$ref": "#/Locale"
    bodies:
      type: object
      description: Liquid source per locale.
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        type: string
        maxLength: 262144
  additionalProperties: false
PartialCreate:
  type: object
  required:
    - key
    - name
    - definition
  properties:
    key:
      "$ref": "#/TemplateKey"
    name:
      type: string
      minLength: 1
      maxLength: 200
    definition:
      "$ref": "#/PartialDefinition"
  additionalProperties: false
PartialDraft:
  type: object
  required:
    - definition
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    definition:
      "$ref": "#/PartialDefinition"
  additionalProperties: false
Partial:
  type: object
  required:
    - object
    - id
    - key
    - name
    - owner
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: partial
    id:
      "$ref": "#/Id_prt"
    key:
      "$ref": "#/TemplateKey"
    name:
      type: string
      maxLength: 200
    owner:
      type: string
      enum:
        - tenant
        - subtenant
    subtenant:
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    state:
      type: string
      enum:
        - active
        - archived
    live_version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    draft:
      oneOf:
        - "$ref": "#/PartialDefinition"
        - type: "null"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
PartialList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Partial"
PartialVersion:
  type: object
  description: "Published partial version; immutable."
  required:
    - object
    - id
    - partial_key
    - version
    - state
    - definition
    - checksum
    - findings
    - warnings_accepted
    - published_at
    - published_by
  properties:
    object:
      type: string
      const: partial_version
    id:
      "$ref": "#/Id_ptv"
    partial_key:
      "$ref": "#/TemplateKey"
    version:
      type: integer
      minimum: 1
    state:
      type: string
      enum:
        - published
        - archived
    live:
      type: boolean
    definition:
      "$ref": "#/PartialDefinition"
    checksum:
      type: string
      pattern: "^[0-9a-f]{64}$"
    findings:
      type: array
      items:
        "$ref": "#/GateFinding"
    warnings_accepted:
      type: boolean
    previous_version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    diff:
      oneOf:
        - type: object
        - type: "null"
    published_at:
      "$ref": "#/Timestamp"
    published_by:
      type: string
      maxLength: 256
  additionalProperties: false
PartialVersionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/PartialVersion"
PartialPublishRequest:
  "$ref": "#/TemplatePublishRequest"
BrandField:
  type: object
  required:
    - value
    - source
  properties:
    value:
      oneOf:
        - type: string
          maxLength: 2048
        - type: "null"
    source:
      type: string
      enum:
        - subtenant
        - tenant
        - none
  additionalProperties: false
Brand:
  type: object
  required:
    - object
    - subtenant
    - fields
  properties:
    object:
      type: string
      const: brand
    subtenant:
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    fields:
      type: object
      properties:
        logo_url:
          "$ref": "#/BrandField"
        primary_color:
          "$ref": "#/BrandField"
        secondary_color:
          "$ref": "#/BrandField"
        sender_name:
          "$ref": "#/BrandField"
        footer:
          "$ref": "#/BrandField"
        legal_name:
          "$ref": "#/BrandField"
        mersis:
          "$ref": "#/BrandField"
        contact:
          "$ref": "#/BrandField"
        postal_address:
          "$ref": "#/BrandField"
      additionalProperties: false
  additionalProperties: false
BrandPatch:
  type: object
  description: "JSON Merge Patch of the brand fields; null clears a field at this level."
  properties:
    logo_url:
      oneOf:
        - type: string
          format: uri
          maxLength: 2048
        - type: "null"
    primary_color:
      oneOf:
        - type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        - type: "null"
    secondary_color:
      oneOf:
        - type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        - type: "null"
    sender_name:
      oneOf:
        - type: string
          maxLength: 100
        - type: "null"
    footer:
      oneOf:
        - type: string
          maxLength: 2000
        - type: "null"
    legal_name:
      oneOf:
        - type: string
          maxLength: 200
        - type: "null"
    mersis:
      oneOf:
        - type: string
          pattern: "^[0-9]{16}$"
        - type: "null"
    contact:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    postal_address:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
  additionalProperties: false
PreviewSample:
  type: string
  description: "Sample data source: the schema examples, the newest 20 accepted events of the workflow in the last 7 days masked at preview time (letters to X or x, digits to 0, lengths kept; events whose content is not kept are excluded), or boundary values (maxLength and empty strings, array and number bounds, Turkish letters, emoji, right-to-left text)."
  enum:
    - schema_examples
    - masked_recent
    - boundary
PreviewVersion:
  oneOf:
    - type: string
      enum:
        - draft
        - live
    - type: integer
      minimum: 1
  description: The draft, the live version or a published version number.
TemplatePreviewRequest:
  type: object
  required:
    - workflow
  properties:
    workflow:
      "$ref": "#/WorkflowKey"
      description: Workflow whose event schema types the template's variables and supplies the samples.
    version:
      "$ref": "#/PreviewVersion"
    sample:
      "$ref": "#/PreviewSample"
    data:
      type: object
      description: Explicit event data; replaces the sample source when given.
    channels:
      type: array
      items:
        "$ref": "#/Channel"
      uniqueItems: true
    locale:
      "$ref": "#/Locale"
  additionalProperties: false
PreviewWarning:
  type: object
  required:
    - code
    - message
  properties:
    code:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      maxLength: 64
      examples:
        - missing_variable
    variable:
      type: string
      maxLength: 256
    message:
      type: string
      maxLength: 1000
  additionalProperties: false
SmsMeasure:
  type: object
  required:
    - encoding
    - encoding_unverified_provider
    - segments
    - characters
  properties:
    encoding:
      "$ref": "#/SmsEncoding"
    encoding_unverified_provider:
      "$ref": "#/SmsEncoding"
    segments:
      type: integer
      minimum: 0
    characters:
      type: integer
      minimum: 0
  additionalProperties: false
ChannelRender:
  type: object
  required:
    - channel
    - locale
    - warnings
  properties:
    channel:
      "$ref": "#/Channel"
    locale:
      "$ref": "#/Locale"
    locale_fallback:
      type: boolean
      description: True when the render fell back to the tenant default locale.
    content:
      oneOf:
        - type: object
        - type: "null"
      description: "Rendered fields of the channel; raw HTML is returned for the sandboxed preview origin only."
    failure_reason:
      oneOf:
        - type: string
          enum:
            - missing_variable
            - render_timeout
            - output_too_large
            - schema_violation
        - type: "null"
    warnings:
      type: array
      items:
        "$ref": "#/PreviewWarning"
    measures:
      type: object
      properties:
        characters:
          type: integer
          minimum: 0
        bytes:
          type: integer
          minimum: 0
        graphemes:
          type: integer
          minimum: 0
    sms:
      oneOf:
        - "$ref": "#/SmsMeasure"
        - type: "null"
  additionalProperties: false
TemplatePreview:
  type: object
  required:
    - object
    - template_key
    - version
    - sample
    - renders
  properties:
    object:
      type: string
      const: template_preview
    template_key:
      "$ref": "#/TemplateKey"
    version:
      "$ref": "#/PreviewVersion"
    sample:
      oneOf:
        - "$ref": "#/PreviewSample"
        - type: string
          const: data
    renders:
      type: array
      items:
        "$ref": "#/ChannelRender"
  additionalProperties: false
WorkflowPreviewRequest:
  type: object
  properties:
    version:
      "$ref": "#/PreviewVersion"
    sample:
      "$ref": "#/PreviewSample"
    data:
      type: object
      description: Explicit event data; replaces the sample source when given.
    to:
      "$ref": "#/ExternalId"
      description: "Subscriber whose preferences, consents and addresses decide each step; without it the decisions use a recipient with no preferences and every channel reachable."
    locale:
      "$ref": "#/Locale"
  additionalProperties: false
WorkflowPreviewStep:
  type: object
  required:
    - step
    - channel
    - template
    - would_send
    - reason
    - rule_id
    - render
  properties:
    step:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,63}$"
    channel:
      "$ref": "#/Channel"
    template:
      type: string
      maxLength: 100
    would_send:
      type: boolean
    reason:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    render:
      oneOf:
        - "$ref": "#/ChannelRender"
        - type: "null"
  additionalProperties: false
WorkflowPreview:
  type: object
  required:
    - object
    - workflow_key
    - version
    - sample
    - steps
  properties:
    object:
      type: string
      const: workflow_preview
    workflow_key:
      "$ref": "#/WorkflowKey"
    version:
      "$ref": "#/PreviewVersion"
    sample:
      oneOf:
        - "$ref": "#/PreviewSample"
        - type: string
          const: data
    steps:
      type: array
      items:
        "$ref": "#/WorkflowPreviewStep"
  additionalProperties: false
Id_esp:
  type: string
  description: "Escalation policy identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^esp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - esp_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_whe:
  type: string
  description: "Webhook endpoint identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^whe_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - whe_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_acd:
  type: string
  description: "Agent ceiling decision identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^acd_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - acd_01j9zq3k4m5n6p7q8r9s0t1v2w
Region:
  type: string
  description: "Data region of the installation."
  enum:
    - tr
    - eu
    - us
Sha256Digest:
  type: string
  description: "SHA-256 digest: sha256: and 64 lowercase hexadecimal characters."
  pattern: "^sha256:[0-9a-f]{64}$"
CorrelationId:
  type: string
  description: "The sender's correlation identifier, 1 to 128 printable ASCII characters. Returned in outgoing events as the correlationid extension."
  minLength: 1
  maxLength: 128
  pattern: "^[\\x20-\\x7E]+$"
CorrelationKey:
  type: string
  description: "Exact correlation key of a waitpoint match: printable ASCII without spaces, 1 to 256 characters. Matched exactly, never by pattern."
  pattern: "^[\\x21-\\x7E]{1,256}$"
Interruption:
  type: string
  description: "Interruption level of the notification; the only accepted name of this field, no alias is accepted."
  enum:
    - passive
    - active
    - time-sensitive
    - critical
EventLink:
  type: object
  description: "A link of the notification."
  required:
    - rel
    - href
  properties:
    rel:
      type: string
      description: "Link relation, unique in the request. Templates read the link as links.<rel>; primary is the target of a push tap and of the inbox item."
      pattern: "^[a-z][a-z0-9_]{0,31}$"
    href:
      type: string
      description: "Absolute https URI; another scheme is rejected with 422 link_scheme_not_allowed (a mobile deep link uses a universal or app link). Click tracking wraps the link."
      format: uri
      maxLength: 2048
    title:
      type: string
      maxLength: 200
  additionalProperties: false
ItemRef:
  type: object
  description: "The sender's item reference. Relay does not interpret it; it is stored with the notification and returned in notification and delivery events and in the inbox item."
  required:
    - ref
    - version
    - digest
  properties:
    ref:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    version:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[\\x20-\\x7E]+$"
    digest:
      "$ref": "#/Sha256Digest"
  additionalProperties: false
Capability:
  type: string
  description: "Capability URN under the Suiss urn:suiss: prefix; the suffix grows only with an incompatible change. Defined capabilities: urn:suiss:relay:events:1, urn:suiss:relay:waitpoint:1, urn:suiss:relay:escalation:1, urn:suiss:relay:agent_ceiling:1, urn:suiss:relay:webhook_endpoints:1, urn:suiss:relay:product_events:1."
  pattern: "^urn:suiss:relay:[a-z][a-z_]*:[1-9][0-9]*$"
  maxLength: 128
  examples:
    - "urn:suiss:relay:events:1"
RelayConfiguration:
  type: object
  description: "Relay discovery document of the installation."
  required:
    - issuer
    - api_base
    - region
    - access_issuer
    - access_client_id
    - contract_version
    - contract_versions_supported
    - jwks_uri
    - capabilities
  properties:
    issuer:
      type: string
      format: uri
      description: "Base URL of the installation without a trailing slash; the source of outgoing events. Equals byte for byte the suiss_relay value of the Access Suiss discovery document, and this document is found at <suiss_relay>/.well-known/relay-configuration."
    api_base:
      type: string
      format: uri
      description: "<issuer>/v1."
    region:
      "$ref": "#/Region"
    access_issuer:
      type: string
      format: uri
      description: "Issuer of the Access the installation is bound to."
    access_client_id:
      type: string
      minLength: 1
      maxLength: 256
      description: "client_id of Relay's own Access client registration. Every subscriber external_id and responder sub is the pairwise Access sub in this client's sector; resolve PartyRef to sub with Access subjects:resolve using this client_id."
    contract_version:
      "$ref": "#/ApiVersion"
      description: "Latest dated API version."
    contract_versions_supported:
      type: array
      items:
        "$ref": "#/ApiVersion"
      minItems: 1
    jwks_uri:
      type: string
      format: uri
      description: "<issuer>/.well-known/relay-jwks.json: the product event key set."
    capabilities:
      type: array
      items:
        "$ref": "#/Capability"
      uniqueItems: true
    events_endpoint:
      type: string
      format: uri
      description: "Present with urn:suiss:relay:events:1."
    waitpoints_endpoint:
      type: string
      format: uri
      description: "Present with urn:suiss:relay:waitpoint:1."
    escalation_policies_endpoint:
      type: string
      format: uri
      description: "Present with urn:suiss:relay:escalation:1."
    agents_endpoint:
      type: string
      format: uri
      description: "Present with urn:suiss:relay:agent_ceiling:1."
    webhook_endpoints_endpoint:
      type: string
      format: uri
      description: "Present with urn:suiss:relay:webhook_endpoints:1."
  additionalProperties: false
JsonWebKey:
  type: object
  description: "Public Ed25519 key of the product event signature."
  required:
    - kty
    - crv
    - kid
    - use
    - x
  properties:
    kty:
      type: string
      const: OKP
    crv:
      type: string
      const: Ed25519
    kid:
      type: string
      minLength: 1
      maxLength: 128
    use:
      type: string
      const: sig
    x:
      type: string
      description: "Public key, base64url without padding."
      pattern: "^[A-Za-z0-9_-]{43}$"
  additionalProperties: false
JsonWebKeySet:
  type: object
  description: "JSON Web Key Set (RFC 7517)."
  required:
    - keys
  properties:
    keys:
      type: array
      items:
        "$ref": "#/JsonWebKey"
  additionalProperties: false
WaitpointKind:
  type: string
  enum:
    - question
    - review
    - event
WaitpointState:
  type: string
  enum:
    - open
    - stalled
    - resolved
    - expired
    - cancelled
WaitpointTag:
  type: string
  pattern: "^[a-z0-9][a-z0-9_.:-]{0,63}$"
Waiter:
  type: object
  description: "Who waits: an agent or an API client. Result events and the early-response buffer live in the waiter's mailbox."
  required:
    - kind
    - id
  properties:
    kind:
      type: string
      enum:
        - agent
        - api_client
    id:
      type: string
      description: "agt_ for an agent, cli_ for an API client."
      pattern: "^(agt|cli)_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "The spec names the waiter as an agent or an API client; the object shape is chosen by the contract."
Responder:
  type: object
  description: "A responder of a waitpoint or an escalation tier."
  required:
    - kind
    - id
  properties:
    kind:
      type: string
      enum:
        - subscriber
        - agent
    id:
      type: string
      description: "The subscriber's external_id, or an agent's agt_ identifier."
      maxLength: 256
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "The object shape of a responder reference is chosen by the contract."
WaitpointMatch:
  type: object
  description: "First-stage exact match: event type and correlation key."
  required:
    - type
    - correlation_key
  properties:
    type:
      "$ref": "#/EventName"
    correlation_key:
      "$ref": "#/CorrelationKey"
  additionalProperties: false
EscalationTier:
  type: object
  description: "One escalation tier."
  required:
    - after
  properties:
    after:
      "$ref": "#/Duration"
      description: "Time after the previous tier, or after creation for the first tier; at least PT1M."
    add_responders:
      type: array
      description: "Responders invited at this tier; each must be in the waitpoint's responders."
      items:
        "$ref": "#/Responder"
      maxItems: 50
    channels:
      type: array
      description: "Channel escalation of this tier."
      items:
        "$ref": "#/Channel"
      uniqueItems: true
    repeat:
      type: integer
      description: "Repeats of this tier at the same interval."
      minimum: 0
      maximum: 5
      default: 0
    skip_if_empty:
      type: boolean
      description: "A tier without a reachable responder is skipped and escalation_tier_skipped is recorded."
      default: true
  additionalProperties: false
EscalationPolicyKey:
  type: string
  description: "Key of an escalation policy, unique in its environment."
  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  minLength: 1
  maxLength: 100
EscalationPolicyDefinition:
  type: object
  description: "An escalation policy definition: 1 to 10 tiers."
  required:
    - tiers
  properties:
    tiers:
      type: array
      items:
        "$ref": "#/EscalationTier"
      minItems: 1
      maxItems: 10
  additionalProperties: false
EscalationPolicyReference:
  type: object
  description: "Reference to a stored escalation policy."
  required:
    - key
  properties:
    key:
      "$ref": "#/EscalationPolicyKey"
    version:
      type: integer
      minimum: 1
      description: "Without a version the latest version at creation is pinned."
  additionalProperties: false
WaitpointEscalation:
  type: object
  description: "The escalation policy version the waitpoint pinned."
  required:
    - version
    - inline
  properties:
    key:
      oneOf:
        - "$ref": "#/EscalationPolicyKey"
        - type: "null"
    version:
      type: integer
      minimum: 1
    inline:
      type: boolean
      description: "true for an inline definition stored as an anonymous version of this waitpoint; key is then null."
  additionalProperties: false
WaitpointCreate:
  type: object
  description: "Waitpoint creation request."
  required:
    - kind
    - match
    - expires_at
  properties:
    kind:
      "$ref": "#/WaitpointKind"
    waiter:
      "$ref": "#/Waiter"
      description: "Defaults to the calling API client."
    match:
      "$ref": "#/WaitpointMatch"
    condition:
      type: object
      description: "Second-stage condition, at most 16 kB."
    response_schema:
      type: object
      description: "JSON Schema the response value must follow, at most 64 kB."
    responders:
      type: array
      items:
        "$ref": "#/Responder"
      maxItems: 50
    expires_at:
      "$ref": "#/Timestamp"
      description: "Deadline, at most 30 days ahead."
    heartbeat_interval:
      "$ref": "#/Duration"
      description: "Waiter heartbeat interval, PT1S to P1D; a missed heartbeat makes the waitpoint stalled."
    surface_policy:
      type: object
      description: "Where the waitpoint is surfaced to responders, at most 16 kB."
    default_response:
      description: "Response value used when the waitpoint expires; it follows response_schema."
    subject_digest:
      "$ref": "#/Sha256Digest"
    content:
      type: object
      description: "What responders see, encrypted at rest."
    claim_text:
      type: string
      maxLength: 2000
      description: "Claim the responder confirms, encrypted at rest."
    deliver_to:
      type: array
      description: "Topics the waitpoint is delivered to."
      items:
        "$ref": "#/TopicTarget"
      maxItems: 10
    tags:
      type: array
      items:
        "$ref": "#/WaitpointTag"
      maxItems: 20
      uniqueItems: true
    correlation_id:
      "$ref": "#/CorrelationId"
    escalation_policy:
      oneOf:
        - "$ref": "#/EscalationPolicyReference"
        - "$ref": "#/EscalationPolicyDefinition"
  additionalProperties: false
WaitpointResponder:
  type: object
  description: "Who responded; a human subscriber's external_id is its pairwise Access sub."
  required:
    - recipient_id
    - kind
  properties:
    recipient_id:
      "$ref": "#/RecipientId"
    kind:
      type: string
      enum:
        - subscriber
        - agent
    external_id:
      "$ref": "#/ExternalId"
  additionalProperties: false
EvidenceLevel:
  type: string
  enum:
    - channel_claim
    - relay_session
    - access_aas_ref
WaitpointResponse:
  type: object
  description: "The response that resolved the waitpoint."
  required:
    - id
    - responder
    - evidence_level
    - responded_at
    - response_digest
  properties:
    id:
      "$ref": "#/Id_wpr"
    responder:
      "$ref": "#/WaitpointResponder"
    channel:
      oneOf:
        - "$ref": "#/Channel"
        - type: "null"
    evidence_level:
      "$ref": "#/EvidenceLevel"
    responded_at:
      "$ref": "#/Timestamp"
    value:
      description: "The response value."
    response_digest:
      "$ref": "#/Sha256Digest"
      description: "sha256 of the RFC 8785 (JCS) form of the value."
  additionalProperties: false
Waitpoint:
  type: object
  description: "A waitpoint."
  required:
    - object
    - id
    - kind
    - waiter
    - match
    - expires_at
    - state
    - created_at
    - state_changed_at
  properties:
    object:
      type: string
      const: waitpoint
    id:
      "$ref": "#/Id_wp"
    kind:
      "$ref": "#/WaitpointKind"
    waiter:
      "$ref": "#/Waiter"
    match:
      "$ref": "#/WaitpointMatch"
    condition:
      type: object
      description: "Second-stage condition, at most 16 kB."
    response_schema:
      type: object
      description: "JSON Schema the response value must follow, at most 64 kB."
    responders:
      type: array
      items:
        "$ref": "#/Responder"
      maxItems: 50
    expires_at:
      "$ref": "#/Timestamp"
      description: "Deadline, at most 30 days ahead."
    heartbeat_interval:
      "$ref": "#/Duration"
      description: "Waiter heartbeat interval, PT1S to P1D; a missed heartbeat makes the waitpoint stalled."
    surface_policy:
      type: object
      description: "Where the waitpoint is surfaced to responders, at most 16 kB."
    default_response:
      description: "Response value used when the waitpoint expires; it follows response_schema."
    subject_digest:
      "$ref": "#/Sha256Digest"
    content:
      type: object
      description: "What responders see, encrypted at rest."
    claim_text:
      type: string
      maxLength: 2000
      description: "Claim the responder confirms, encrypted at rest."
    deliver_to:
      type: array
      description: "Topics the waitpoint is delivered to."
      items:
        "$ref": "#/TopicTarget"
      maxItems: 10
    tags:
      type: array
      items:
        "$ref": "#/WaitpointTag"
      maxItems: 20
      uniqueItems: true
    correlation_id:
      "$ref": "#/CorrelationId"
    escalation_policy:
      oneOf:
        - "$ref": "#/WaitpointEscalation"
        - type: "null"
    state:
      "$ref": "#/WaitpointState"
    response:
      oneOf:
        - "$ref": "#/WaitpointResponse"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    state_changed_at:
      "$ref": "#/Timestamp"
    heartbeat_due_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    cancel_reason:
      oneOf:
        - type: string
          maxLength: 200
        - type: "null"
  additionalProperties: false
WaitpointList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/Waitpoint"
  description: "A page of waitpoints."
WaitpointCancel:
  type: object
  description: "Cancellation of a waitpoint."
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 200
  additionalProperties: false
EscalationPolicyState:
  type: string
  enum:
    - active
    - archived
EscalationPolicyWrite:
  type: object
  description: "A new version of an escalation policy."
  required:
    - tiers
  properties:
    tiers:
      type: array
      items:
        "$ref": "#/EscalationTier"
      minItems: 1
      maxItems: 10
    description:
      type: string
      maxLength: 500
  additionalProperties: false
EscalationPolicy:
  type: object
  description: "An escalation policy with its latest version."
  required:
    - object
    - id
    - key
    - version
    - state
    - tiers
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: escalation_policy
    id:
      "$ref": "#/Id_esp"
    key:
      "$ref": "#/EscalationPolicyKey"
    version:
      type: integer
      minimum: 1
      description: "Latest version."
    state:
      "$ref": "#/EscalationPolicyState"
    description:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    tiers:
      type: array
      items:
        "$ref": "#/EscalationTier"
      minItems: 1
      maxItems: 10
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
EscalationPolicyList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/EscalationPolicy"
  description: "A page of escalation policies."
EscalationPolicyVersion:
  type: object
  description: "An immutable escalation policy version."
  required:
    - object
    - key
    - version
    - tiers
    - created_at
  properties:
    object:
      type: string
      const: escalation_policy_version
    key:
      "$ref": "#/EscalationPolicyKey"
    version:
      type: integer
      minimum: 1
    description:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    tiers:
      type: array
      items:
        "$ref": "#/EscalationTier"
      minItems: 1
      maxItems: 10
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
EscalationPolicyVersionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/EscalationPolicyVersion"
  description: "A page of escalation policy versions."
CeilingDecisionCreate:
  type: object
  description: "The owner's decision on held agent notifications."
  required:
    - decision
    - ceiling_event_id
    - decision_ref
  properties:
    decision:
      type: string
      enum:
        - send_all
        - cancel
        - stop
    ceiling_event_id:
      type: string
      description: "id of the agent.ceiling_exceeded event the decision answers."
      minLength: 1
      maxLength: 512
    decision_ref:
      type: string
      description: "The owner's record of the decision (for Suiss, the Work record), 1 to 256 printable ASCII characters."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    note:
      type: string
      maxLength: 1000
      x-relay-choice: true
      x-relay-choice-note: "The bound of note is chosen by the contract."
  additionalProperties: false
AgentRunState:
  type: string
  enum:
    - active
    - stopped
CeilingDecision:
  type: object
  description: "A recorded ceiling decision."
  required:
    - object
    - id
    - agent_id
    - ceiling_event_id
    - decision
    - decision_ref
    - applied_count
    - agent_state
    - decided_at
  properties:
    object:
      type: string
      const: ceiling_decision
    id:
      "$ref": "#/Id_acd"
    agent_id:
      "$ref": "#/Id_agt"
    ceiling_event_id:
      type: string
      maxLength: 512
    decision:
      type: string
      enum:
        - send_all
        - cancel
        - stop
    decision_ref:
      type: string
      description: "The owner's record of the decision (for Suiss, the Work record), 1 to 256 printable ASCII characters."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    note:
      oneOf:
        - type: string
          maxLength: 1000
        - type: "null"
    applied_count:
      type: integer
      minimum: 0
      description: "Held notifications the decision applied to."
    agent_state:
      "$ref": "#/AgentRunState"
    decided_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
AgentResume:
  type: object
  description: "Lifting a stop decision."
  required:
    - decision_ref
  properties:
    decision_ref:
      type: string
      description: "The owner's record of the decision (for Suiss, the Work record), 1 to 256 printable ASCII characters."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    note:
      type: string
      maxLength: 1000
  additionalProperties: false
AgentState:
  type: object
  description: "The run state of an agent."
  required:
    - object
    - agent_id
    - state
    - changed_at
  properties:
    object:
      type: string
      const: agent_state
    agent_id:
      "$ref": "#/Id_agt"
    state:
      "$ref": "#/AgentRunState"
    decision_ref:
      oneOf:
        - type: string
          description: "The owner's record of the decision (for Suiss, the Work record), 1 to 256 printable ASCII characters."
          minLength: 1
          maxLength: 256
          pattern: "^[\\x20-\\x7E]+$"
        - type: "null"
    changed_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WebhookEndpointUse:
  type: string
  description: "relay_events: Relay's own events (use A). destination: target of a webhook channel step (use B)."
  enum:
    - relay_events
    - destination
WebhookEndpointState:
  type: string
  enum:
    - active
    - disabled
    - archived
  x-relay-choice: true
  x-relay-choice-note: "The state names are chosen by the contract; disabled is the automatic disable of webhook_endpoint.disabled."
WebhookEventTypes:
  type: array
  description: "Subscribed event types; * is an explicit choice of every type, an empty selection receives nothing."
  items:
    oneOf:
      - "$ref": "#/EventName"
      - type: string
        const: "*"
  maxItems: 100
  uniqueItems: true
WebhookSnapshot:
  type: array
  description: "Snapshot whitelist: the payload fields added to the thin event. A change opens a new endpoint version."
  items:
    type: string
    pattern: "^[a-z][a-z0-9_]{0,63}(\\.[a-z][a-z0-9_]{0,63}){0,3}$"
  maxItems: 50
  uniqueItems: true
  x-relay-choice: true
  x-relay-choice-note: "The shape of the snapshot whitelist is chosen by the contract."
SignatureScheme:
  type: string
  description: "v1a Ed25519 (default) or v1 HMAC for compatibility."
  enum:
    - v1a
    - v1
WebhookEndpointCreate:
  type: object
  description: "Webhook endpoint creation request."
  required:
    - url
    - use
    - event_types
  properties:
    url:
      type: string
      description: "https URL of the endpoint."
      format: uri
      pattern: "^https://"
      maxLength: 2048
    use:
      "$ref": "#/WebhookEndpointUse"
    consumer:
      type: string
      description: "The tenant's customer reference; only for use destination."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x21-\\x7E]+$"
    event_types:
      "$ref": "#/WebhookEventTypes"
    signature_scheme:
      "$ref": "#/SignatureScheme"
      default: v1a
    snapshot:
      "$ref": "#/WebhookSnapshot"
    description:
      type: string
      maxLength: 500
  additionalProperties: false
WebhookEndpointPatch:
  type: object
  description: "Changes to a webhook endpoint; absent fields are left untouched."
  properties:
    url:
      type: string
      description: "https URL of the endpoint."
      format: uri
      pattern: "^https://"
      maxLength: 2048
    event_types:
      "$ref": "#/WebhookEventTypes"
    signature_scheme:
      "$ref": "#/SignatureScheme"
    snapshot:
      "$ref": "#/WebhookSnapshot"
    description:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    state:
      type: string
      description: "active enables a disabled endpoint; disabled stops deliveries."
      enum:
        - active
        - disabled
  additionalProperties: false
  minProperties: 1
WebhookEndpoint:
  type: object
  description: "A webhook endpoint."
  required:
    - object
    - id
    - url
    - use
    - event_types
    - signature_scheme
    - state
    - managed_by
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: webhook_endpoint
    id:
      "$ref": "#/Id_whe"
    url:
      type: string
      format: uri
    use:
      "$ref": "#/WebhookEndpointUse"
    consumer:
      oneOf:
        - type: string
          description: "The tenant's customer reference; only for use destination."
          minLength: 1
          maxLength: 256
          pattern: "^[\\x21-\\x7E]+$"
        - type: "null"
    event_types:
      "$ref": "#/WebhookEventTypes"
    signature_scheme:
      "$ref": "#/SignatureScheme"
    snapshot:
      "$ref": "#/WebhookSnapshot"
    description:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    state:
      "$ref": "#/WebhookEndpointState"
    managed_by:
      type: string
      description: "product for an endpoint opened for a Suiss product client; the tenant sees it and may narrow its event types but cannot delete or close it."
      enum:
        - tenant
        - product
    product:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WebhookEndpointList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookEndpoint"
  description: "A page of webhook endpoints."
WebhookEndpointSecret:
  type: object
  description: "A webhook endpoint with the secret of its new signing key."
  required:
    - object
    - id
    - url
    - use
    - event_types
    - signature_scheme
    - state
    - managed_by
    - version
    - created_at
    - updated_at
    - secret
  properties:
    object:
      type: string
      const: webhook_endpoint
    id:
      "$ref": "#/Id_whe"
    url:
      type: string
      format: uri
    use:
      "$ref": "#/WebhookEndpointUse"
    consumer:
      oneOf:
        - type: string
          description: "The tenant's customer reference; only for use destination."
          minLength: 1
          maxLength: 256
          pattern: "^[\\x21-\\x7E]+$"
        - type: "null"
    event_types:
      "$ref": "#/WebhookEventTypes"
    signature_scheme:
      "$ref": "#/SignatureScheme"
    snapshot:
      "$ref": "#/WebhookSnapshot"
    description:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    state:
      "$ref": "#/WebhookEndpointState"
    managed_by:
      type: string
      description: "product for an endpoint opened for a Suiss product client; the tenant sees it and may narrow its event types but cannot delete or close it."
      enum:
        - tenant
        - product
    product:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    secret:
      type: string
      description: "Signing secret of the new key, returned only in this response."
      minLength: 32
      maxLength: 512
      x-relay-choice: true
      x-relay-choice-note: "Returning the secret once in the create and rotate responses is chosen by the contract."
    previous_key_expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
DevicePlatform:
  type: string
  description: "Push platform of a device: Apple Push Notification service, Firebase Cloud Messaging, Huawei Push Kit, a Web Push subscription or a UnifiedPush distributor."
  enum:
    - apns
    - fcm
    - hms
    - web_push
    - unified_push
DevicePermission:
  type: string
  description: "The operating system's notification permission as the app reports it. Relay sends push only to granted devices, and to provisional ones for marketing and social messages; any other device is skipped with no_permission and the route moves on. The permission never changes a preference."
  enum:
    - granted
    - denied
    - provisional
    - not_determined
DeviceState:
  type: string
  description: "active: registered and seen recently. stale: not seen for the stale period, still a target. disabled: soft deleted, never a target again; a new registration of the same token creates a new device."
  enum:
    - active
    - stale
    - disabled
DeviceDisabledReason:
  type: string
  description: "Why a device was disabled: unregistered (the push service reported the token invalid), logout (the app removed it), removed (the tenant removed it), replaced (the app registered a new token for it), inactive (not seen for the inactivity period), device_limit (the subscriber registered more than the active device limit), reassigned (another subscriber registered the token) or erased (the subscriber was erased)."
  enum:
    - unregistered
    - logout
    - removed
    - replaced
    - inactive
    - device_limit
    - reassigned
    - erased
ApnsEnvironment:
  type: string
  description: "The APNs environment the token was issued for. It is not the Relay environment (live or test)."
  enum:
    - production
    - sandbox
AndroidChannelImportance:
  type: string
  description: "Importance of an Android notification channel as the app reports it."
  enum:
    - none
    - min
    - low
    - default
    - high
AndroidChannel:
  type: object
  description: "An Android notification channel the app created and its current importance."
  required:
    - id
    - importance
  properties:
    id:
      type: string
      pattern: "^[A-Za-z0-9._-]{1,64}$"
    importance:
      "$ref": "#/AndroidChannelImportance"
  additionalProperties: false
DeviceAppId:
  type: string
  description: "The app the token belongs to: an iOS bundle id, an Android package name, a Firebase or HMS app id, or the tenant's name for a web app."
  pattern: "^[A-Za-z0-9._:/-]{1,256}$"
DeviceToken:
  type: string
  description: "The push token: an APNs device token, an FCM or HMS registration token, or the push service endpoint URL of a Web Push or UnifiedPush subscription. Relay stores it encrypted, finds it by a keyed digest and never returns it; logs and responses carry only its fingerprint."
  minLength: 1
  maxLength: 4096
WebPushKeys:
  type: object
  description: "The keys of a Web Push or UnifiedPush subscription (RFC 8291), as the browser's PushSubscription returns them in base64url. Stored encrypted with the token and never returned."
  required:
    - p256dh
    - auth
  properties:
    p256dh:
      type: string
      pattern: "^[A-Za-z0-9_-]{86,88}={0,2}$"
    auth:
      type: string
      pattern: "^[A-Za-z0-9_-]{22,24}={0,2}$"
  additionalProperties: false
DeviceRegistration:
  type: object
  description: "Registers a push token for the subscriber, or refreshes it: the mobile SDK sends it on every app start. Registering a token the subscriber already has is idempotent and updates last_seen_at, the permission and the channels. A token registered by another subscriber is moved to this one and device.reassigned is emitted. previous_token names the token this one replaces (onNewToken, pushsubscriptionchange); that device is disabled. When the subscriber has more active devices than the limit, the least recently seen one is disabled with device_limit; a registration is never refused for the limit."
  required:
    - platform
    - token
    - app
    - permission
  properties:
    platform:
      "$ref": "#/DevicePlatform"
    token:
      "$ref": "#/DeviceToken"
    keys:
      "$ref": "#/WebPushKeys"
      description: "Required for web_push and unified_push; not allowed for other platforms."
    app:
      "$ref": "#/DeviceAppId"
    apns_environment:
      "$ref": "#/ApnsEnvironment"
      description: "Required for apns; not allowed for other platforms."
    permission:
      "$ref": "#/DevicePermission"
    android_channels:
      type: array
      maxItems: 50
      uniqueItems: true
      items:
        "$ref": "#/AndroidChannel"
    locale:
      "$ref": "#/Locale"
    previous_token:
      "$ref": "#/DeviceToken"
  additionalProperties: false
DeviceTokenRemoval:
  type: object
  description: "Names a device by its token, as the app or the tenant holds it."
  required:
    - token
  properties:
    token:
      "$ref": "#/DeviceToken"
  additionalProperties: false
Device:
  type: object
  description: "A push target of a subscriber. The token is never returned; token_fingerprint is a short keyed digest of it that also appears in device events."
  required:
    - object
    - id
    - subscriber_id
    - platform
    - app
    - token_fingerprint
    - apns_environment
    - permission
    - android_channels
    - locale
    - state
    - disabled_reason
    - registered_at
    - last_seen_at
    - deleted_at
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: device
    id:
      "$ref": "#/Id_dev"
    subscriber_id:
      "$ref": "#/Id_sub"
    platform:
      "$ref": "#/DevicePlatform"
    app:
      "$ref": "#/DeviceAppId"
    token_fingerprint:
      type: string
      pattern: "^[0-9a-f]{16}$"
    apns_environment:
      oneOf:
        - "$ref": "#/ApnsEnvironment"
        - type: "null"
    permission:
      "$ref": "#/DevicePermission"
    android_channels:
      type: array
      items:
        "$ref": "#/AndroidChannel"
    locale:
      oneOf:
        - "$ref": "#/Locale"
        - type: "null"
    state:
      "$ref": "#/DeviceState"
    disabled_reason:
      oneOf:
        - "$ref": "#/DeviceDisabledReason"
        - type: "null"
    registered_at:
      "$ref": "#/Timestamp"
    last_seen_at:
      "$ref": "#/Timestamp"
    deleted_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
DeviceList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Device"
MessagingChannel:
  type: string
  enum:
    - slack
    - teams
    - telegram
    - discord
TeamsConversationReference:
  type: object
  description: "The conversation reference a Teams bot captured: the Bot Framework service URL (https, a Bot Framework host) and the conversation ID."
  required:
    - service_url
    - conversation_id
  properties:
    service_url:
      type: string
      format: uri
      maxLength: 512
    conversation_id:
      type: string
      minLength: 1
      maxLength: 512
  additionalProperties: false
MessagingTargetPut:
  type: object
  required:
    - provider_account_id
    - conversation
  properties:
    provider_account_id:
      "$ref": "#/Id_pva"
    conversation:
      oneOf:
        - type: string
          description: "A Slack user or conversation ID, a Telegram chat ID, or a Discord channel ID (user:<id> for a direct message)."
          pattern: "^(user:)?[A-Za-z0-9_.:@-]{1,128}$"
        - "$ref": "#/TeamsConversationReference"
  additionalProperties: false
MessagingTarget:
  type: object
  description: "Where a subscriber is reached on a messaging channel. The conversation itself is never returned."
  required:
    - object
    - id
    - subscriber_id
    - channel
    - provider_account_id
    - state
    - created_at
    - updated_at
    - deleted_at
  properties:
    object:
      type: string
      const: messaging_target
    id:
      "$ref": "#/Id_mtg"
    subscriber_id:
      "$ref": "#/Id_sub"
    channel:
      "$ref": "#/MessagingChannel"
    provider_account_id:
      "$ref": "#/Id_pva"
    state:
      type: string
      enum:
        - active
        - disabled
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    deleted_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
MessagingInstallationCreate:
  type: object
  required:
    - channel
    - channel_identity_id
  properties:
    channel:
      type: string
      enum:
        - slack
        - discord
        - telegram
    channel_identity_id:
      "$ref": "#/Id_chi"
    redirect_uri:
      type: string
      format: uri
      pattern: "^https://"
      maxLength: 2048
  additionalProperties: false
MessagingInstallation:
  type: object
  required:
    - object
    - channel
    - state
    - authorize_url
    - expires_at
    - provider_account_id
  properties:
    object:
      type: string
      const: messaging_installation
    channel:
      "$ref": "#/MessagingChannel"
    state:
      type: string
      enum:
        - pending
        - installed
    authorize_url:
      oneOf:
        - type: string
          format: uri
        - type: "null"
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    provider_account_id:
      oneOf:
        - "$ref": "#/Id_pva"
        - type: "null"
  additionalProperties: false
ChannelAdapter:
  type: object
  required:
    - object
    - provider
    - channels
    - adapter_version
    - activated
    - in_use
    - warning
    - deprecations
  properties:
    object:
      type: string
      const: channel_adapter
    provider:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,31}$"
    channels:
      type: array
      items:
        "$ref": "#/Channel"
    adapter_version:
      type: string
      pattern: "^[0-9]{1,4}\\.[0-9]{1,4}\\.[0-9]{1,4}$"
    activated:
      type: boolean
    in_use:
      type: boolean
    warning:
      type: boolean
    deprecations:
      type: array
      items:
        type: object
        required:
          - api
          - sunset_on
        properties:
          api:
            type: string
            maxLength: 128
          sunset_on:
            oneOf:
              - type: string
                format: date
              - type: "null"
        additionalProperties: false
  additionalProperties: false
ChannelAdapterList:
  type: object
  required:
    - object
    - data
  properties:
    object:
      type: string
      const: list
    data:
      type: array
      items:
        "$ref": "#/ChannelAdapter"
  additionalProperties: false
MessagingInboundRequest:
  type: object
  description: "A provider's own request body; Relay reads it only after the signature verified on the raw body."
MessagingInboundAnswer:
  type: object
  description: "What the provider expects in return, or an error name."

Id_wtp:
  type: string
  description: "WhatsApp template identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^wtp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - wtp_01j9zq3k4m5n6p7q8r9s0t1v2w
WhatsappTemplateStatus:
  type: string
  description: "Relay's lifecycle of a WhatsApp template: pending_approval until Meta approves it; only approved is sent. rejected carries Meta's reason; paused and disabled follow Meta's PAUSED and DISABLED (and deletion or archiving)."
  enum:
    - pending_approval
    - approved
    - rejected
    - paused
    - disabled
WhatsappTemplateCategory:
  type: string
  description: "WhatsApp template category. Relay's class maps to a fixed category: security to authentication; transactional, operational and action_required to utility; marketing and social to marketing."
  enum:
    - authentication
    - utility
    - marketing
WhatsappTemplateComponent:
  type: object
  description: A component of the Meta template as it is submitted to Meta; text placeholders are {{1}} or {{name}}.
  required:
    - type
  properties:
    type:
      type: string
      enum:
        - HEADER
        - BODY
        - FOOTER
        - BUTTONS
    format:
      type: string
      maxLength: 32
    text:
      type: string
      maxLength: 1024
    buttons:
      type: array
      maxItems: 10
      items:
        type: object
  additionalProperties: false
WhatsappTemplateRegistration:
  type: object
  description: "Registers a Meta template of a WhatsApp provider account. Templates are immutable and named with their version (order_shipped_v3): new content is a new name, going back is going back to the older name."
  required:
    - provider_account_id
    - waba_id
    - name
    - language
    - message_class
    - components
  properties:
    provider_account_id:
      type: string
      format: uuid
      description: The WhatsApp provider account the template belongs to.
    waba_id:
      type: string
      pattern: "^[0-9]{1,32}$"
      description: The WhatsApp Business Account of the template.
    name:
      type: string
      pattern: "^[a-z0-9_]{1,512}$"
      description: The Meta template name.
    language:
      type: string
      pattern: "^[a-z]{2,3}([_-][A-Za-z0-9]{2,8}){0,2}$"
      description: "The template language, as a Meta code (en_US) or a locale (en-US)."
    message_class:
      "$ref": "#/MessageClass"
    components:
      type: array
      minItems: 1
      maxItems: 10
      items:
        "$ref": "#/WhatsappTemplateComponent"
  additionalProperties: false
WhatsappTemplate:
  type: object
  description: "A registered WhatsApp template with Relay's state next to Meta's status and category. preview is the text Meta approved, with its placeholders; category_drift is set when Meta's category differs from the class's category; edit_quota is what is left of Meta's edit limits."
  required:
    - object
    - id
    - provider_account_id
    - waba_id
    - name
    - language
    - message_class
    - category
    - meta_category
    - status
    - meta_status
    - meta_template_id
    - rejection_reason
    - quality
    - sendable
    - components
    - approved_components
    - preview
    - category_drift
    - edit_quota
    - status_changed_at
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: whatsapp_template
    id:
      "$ref": "#/Id_wtp"
    provider_account_id:
      type: string
      format: uuid
    waba_id:
      type: string
      maxLength: 32
    name:
      type: string
      maxLength: 512
    language:
      type: string
      maxLength: 35
    message_class:
      "$ref": "#/MessageClass"
    category:
      "$ref": "#/WhatsappTemplateCategory"
    meta_category:
      oneOf:
        - "$ref": "#/WhatsappTemplateCategory"
        - type: "null"
    status:
      "$ref": "#/WhatsappTemplateStatus"
    meta_status:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    meta_template_id:
      oneOf:
        - type: string
          maxLength: 32
        - type: "null"
    rejection_reason:
      oneOf:
        - type: string
          maxLength: 512
        - type: "null"
    quality:
      oneOf:
        - type: string
          maxLength: 32
        - type: "null"
    sendable:
      type: boolean
      description: Only an approved template is sent.
    components:
      type: array
      items:
        "$ref": "#/WhatsappTemplateComponent"
    approved_components:
      oneOf:
        - type: array
          items:
            "$ref": "#/WhatsappTemplateComponent"
        - type: "null"
    preview:
      type: object
      required:
        - header
        - body
        - footer
        - placeholders
      properties:
        header:
          oneOf:
            - type: string
            - type: "null"
        body:
          oneOf:
            - type: string
            - type: "null"
        footer:
          oneOf:
            - type: string
            - type: "null"
        placeholders:
          type: array
          items:
            type: string
      additionalProperties: false
    category_drift:
      oneOf:
        - type: object
          required:
            - expected
            - actual
            - cost_increase
          properties:
            expected:
              "$ref": "#/WhatsappTemplateCategory"
            actual:
              "$ref": "#/WhatsappTemplateCategory"
            cost_increase:
              type: boolean
          additionalProperties: false
        - type: "null"
    edit_quota:
      type: object
      required:
        - remaining
        - next_at
        - reason
      properties:
        remaining:
          type: integer
          minimum: 0
        next_at:
          oneOf:
            - "$ref": "#/Timestamp"
            - type: "null"
        reason:
          oneOf:
            - type: string
              enum:
                - daily
                - monthly
            - type: "null"
      additionalProperties: false
    status_changed_at:
      "$ref": "#/Timestamp"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WhatsappTemplateList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/WhatsappTemplate"
WhatsappWebhookNotification:
  type: object
  description: "A WhatsApp Business Account notification as Meta sends it; Relay verifies X-Hub-Signature-256 over the raw body before it reads it. Changes Relay does not subscribe to are acknowledged and ignored."
  required:
    - object
    - entry
  properties:
    object:
      type: string
      maxLength: 64
    entry:
      type: array
      maxItems: 1000
      items:
        type: object
  additionalProperties: false
Id_snd:
  type: string
  description: "Sender identity identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^snd_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - snd_01j9zq3k4m5n6p7q8r9s0t1v2w
ProviderName:
  type: string
  description: "Adapter name of a provider, as its declaration names it."
  pattern: "^[a-z][a-z0-9_]{1,31}$"
ProviderAccountRole:
  type: string
  description: "Route role of a provider account (CH-13)."
  enum:
    - primary
    - backup
TransferBasis:
  type: string
  description: "Transfer basis of a provider that processes data outside the installation (CH-6)."
  enum:
    - none
    - adequacy
    - scc
    - explicit_consent
    - derogation
CountryList:
  type: array
  description: "ISO 3166-1 alpha-2 countries where the provider processes the data (CH-6)."
  maxItems: 16
  uniqueItems: true
  items:
    type: string
    pattern: "^[A-Z]{2}$"
ProviderSettings:
  type: object
  description: "Non-secret provider settings, such as a sender number identifier or a region; a secret never goes here."
  maxProperties: 64
SecretView:
  type: object
  description: "A stored secret reference as it is shown: its fingerprint (HMAC-SHA256 under the installation's fingerprint key), version and state. The reference and the secret are never returned (INV-51)."
  required:
    - fingerprint
    - version
    - state
  properties:
    fingerprint:
      type: string
      pattern: "^[0-9a-f]{64}$"
    version:
      type: integer
      minimum: 1
    state:
      type: string
      enum:
        - active
        - retired
  additionalProperties: false
ProviderAccount:
  type: object
  description: "A provider account of a channel (C-45): its route role, verification, health, data residency and the fingerprint of its credential. Only a verified, active account receives traffic (CH-14)."
  required:
    - object
    - id
    - channel
    - provider
    - ownership
    - role
    - priority
    - weight
    - state
    - traffic
    - verification_state
    - verified_at
    - verification_rule_id
    - health
    - health_checked_at
    - in_installation
    - processing_countries
    - transfer_basis
    - scc_notified_on
    - settings
    - credential
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: provider_account
    id:
      "$ref": "#/Id_pva"
    channel:
      "$ref": "#/Channel"
    provider:
      "$ref": "#/ProviderName"
    ownership:
      type: string
      enum:
        - shared
        - tenant
    role:
      "$ref": "#/ProviderAccountRole"
    priority:
      type: integer
      minimum: 0
      maximum: 99
    weight:
      type: integer
      minimum: 0
      maximum: 10000
    state:
      type: string
      enum:
        - active
        - disabled
        - archived
    traffic:
      type: string
      enum:
        - standard
        - security
    verification_state:
      type: string
      enum:
        - unverified
        - pending
        - verified
        - failed
    verified_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    verification_rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    health:
      type: string
      enum:
        - unknown
        - healthy
        - degraded
        - down
    health_checked_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    in_installation:
      type: boolean
    processing_countries:
      "$ref": "#/CountryList"
    transfer_basis:
      "$ref": "#/TransferBasis"
    scc_notified_on:
      oneOf:
        - type: string
          format: date
        - type: "null"
    settings:
      "$ref": "#/ProviderSettings"
    credential:
      oneOf:
        - "$ref": "#/SecretView"
        - type: "null"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
ProviderAccountList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/ProviderAccount"
ProviderAccountPatch:
  type: object
  description: "JSON Merge Patch of the fields of a provider account that hold no secret. A provider outside the installation needs at least one processing country, and the scc basis needs its notification date (CH-6)."
  properties:
    role:
      "$ref": "#/ProviderAccountRole"
    priority:
      type: integer
      minimum: 0
      maximum: 99
    weight:
      type: integer
      minimum: 0
      maximum: 10000
    in_installation:
      type: boolean
    processing_countries:
      "$ref": "#/CountryList"
    transfer_basis:
      "$ref": "#/TransferBasis"
    scc_notified_on:
      oneOf:
        - type: string
          format: date
        - type: "null"
    settings:
      "$ref": "#/ProviderSettings"
  additionalProperties: false
SenderIdentityKind:
  type: string
  enum:
    - email_domain
    - email_address
    - sms_sender
    - phone_number
    - whatsapp_number
    - bot
SenderIdentity:
  type: object
  description: "A sender identity of a provider account (C-25). Only an approved identity that is neither suspended nor archived is used to send."
  required:
    - object
    - id
    - provider_account_id
    - subtenant_id
    - channel
    - kind
    - value
    - country
    - approval_state
    - suspended_at
    - suspension_rule_id
    - sms_type
    - state
    - archived_at
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: sender_identity
    id:
      "$ref": "#/Id_snd"
    provider_account_id:
      "$ref": "#/Id_pva"
    subtenant_id:
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    channel:
      "$ref": "#/Channel"
    kind:
      "$ref": "#/SenderIdentityKind"
    value:
      type: string
      minLength: 1
      maxLength: 320
    country:
      oneOf:
        - type: string
          pattern: "^[A-Z]{2}$"
        - type: "null"
    approval_state:
      type: string
      enum:
        - pending
        - approved
        - rejected
    suspended_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    suspension_rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    sms_type:
      oneOf:
        - type: string
          enum:
            - alphanumeric
            - short_code
            - long_number
            - toll_free
            - ten_dlc
        - type: "null"
    state:
      type: string
      enum:
        - active
        - archived
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
SenderIdentityList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/SenderIdentity"
SenderIdentityCreate:
  type: object
  required:
    - provider_account_id
    - kind
    - value
  properties:
    provider_account_id:
      "$ref": "#/Id_pva"
    subtenant_id:
      "$ref": "#/Id_stn"
    kind:
      "$ref": "#/SenderIdentityKind"
    value:
      type: string
      minLength: 1
      maxLength: 320
    country:
      type: string
      pattern: "^[A-Z]{2}$"
  additionalProperties: false
SenderIdentityPatch:
  type: object
  description: "JSON Merge Patch of a sender identity; null clears the sub-tenant or the country."
  properties:
    subtenant_id:
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    country:
      oneOf:
        - type: string
          pattern: "^[A-Z]{2}$"
        - type: "null"
  additionalProperties: false
ChannelIdentityKind:
  type: string
  enum:
    - apns_key
    - fcm_project
    - hms_app
    - vapid
    - slack_app
    - teams_bot
    - telegram_bot
    - discord_bot
ChannelIdentity:
  type: object
  description: "A channel identity of a platform (C-26) with the fingerprint of its secret."
  required:
    - object
    - id
    - channel
    - kind
    - app_ref
    - secret
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: channel_identity
    id:
      "$ref": "#/Id_chi"
    channel:
      "$ref": "#/Channel"
    kind:
      "$ref": "#/ChannelIdentityKind"
    app_ref:
      type: string
      minLength: 1
      maxLength: 256
    secret:
      oneOf:
        - "$ref": "#/SecretView"
        - type: "null"
    state:
      type: string
      enum:
        - active
        - retired
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
ChannelIdentityList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/ChannelIdentity"
ChannelIdentityPatch:
  type: object
  description: "JSON Merge Patch of a channel identity."
  properties:
    app_ref:
      type: string
      minLength: 1
      maxLength: 256
  additionalProperties: false
SecretRef:
  type: string
  description: "A secret reference, write-only: ${VAR} names an environment variable of the node, pkcs11:object=<label> a secret data object in the key store. A reference that carries a PIN or a password is refused (TN-26)."
  minLength: 4
  maxLength: 512
  writeOnly: true
Id_trc:
  type: string
  description: "Test recipient identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^trc_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - trc_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_emr:
  type: string
  description: "E-mail report identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^emr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - emr_01j9zq3k4m5n6p7q8r9s0t1v2w
TestRecipientState:
  type: string
  description: "pending until the subscriber confirms it with its own subscriber token within the verification window; verified once confirmed; expired when the window passed unconfirmed; removed once removed or when the subscriber is erased."
  enum:
    - pending
    - verified
    - expired
    - removed
TestRecipient:
  type: object
  description: "A person or one of their devices on the tenant's test recipient list. Only a verified entry receives test sends; pending and verified entries count toward the list limit."
  required:
    - object
    - id
    - subscriber_id
    - device_id
    - state
    - verify_by
    - verified_at
    - removed_at
    - created_at
  properties:
    object:
      type: string
      const: test_recipient
    id:
      "$ref": "#/Id_trc"
    subscriber_id:
      description: "External id of the subscriber; null once the subscriber is erased."
      oneOf:
        - "$ref": "#/ExternalId"
        - type: "null"
    device_id:
      description: "The one device a device entry reaches on push and Web Push; null for a person entry."
      oneOf:
        - "$ref": "#/Id_dev"
        - type: "null"
    state:
      "$ref": "#/TestRecipientState"
    verify_by:
      description: "End of the verification window of a pending entry."
      "$ref": "#/Timestamp"
    verified_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    removed_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
TestRecipientList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/TestRecipient"
TestRecipientCreate:
  type: object
  description: "Adds a subscriber, or one of its devices, to the test recipient list as pending."
  required:
    - subscriber_id
  properties:
    subscriber_id:
      "$ref": "#/ExternalId"
    device_id:
      "$ref": "#/Id_dev"
  additionalProperties: false
WorkflowTestRequest:
  type: object
  description: "A test send of the workflow's published version to verified test recipients."
  required:
    - to
  properties:
    to:
      type: array
      description: "Verified test recipients, 1 to 5."
      items:
        "$ref": "#/Id_trc"
      minItems: 1
      maxItems: 5
      uniqueItems: true
    data:
      type: object
      description: Event data, validated against the event schema of the published workflow version.
    channels:
      type: array
      description: "Narrows the workflow's steps to these channels; never adds steps."
      items:
        "$ref": "#/Channel"
      minItems: 1
      uniqueItems: true
    overrides:
      "$ref": "#/Overrides"
    metadata:
      "$ref": "#/Metadata"
  additionalProperties: false
Id_piv:
  type: string
  description: "Provider invoice identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^piv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - piv_01j9zq3k4m5n6p7q8r9s0t1v2w
Micros:
  type: string
  description: "An amount in millionths of its currency's unit, as a string."
  pattern: "^(0|[1-9][0-9]{0,18})$"
  examples:
    - "1250000"
SignedMicros:
  type: string
  description: "A signed amount in millionths of its currency's unit, as a string."
  pattern: "^(0|-?[1-9][0-9]{0,18})$"
  examples:
    - "-12500"
CurrencyCode:
  type: string
  description: ISO 4217 currency code.
  pattern: "^[A-Z]{3}$"
  examples:
    - EUR
ProviderInvoiceRaw:
  type: object
  description: "The invoice or price object as the provider sent it, kept for reconciliation; at most 64 KiB."
  maxProperties: 256
ProviderInvoiceReconciliation:
  type: object
  description: "The latest reconciliation of an invoice against the immutable usage records of its provider, channel and period (OP-42): the usage cost in the invoice's currency, the billable units, the billable units without a price in that currency, and the drift of the invoice amount from the usage cost in micros and in basis points of the usage cost. drift means the drift is above the tolerance."
  required:
    - checked_at
    - result
    - usage_cost_micros
    - usage_units
    - unpriced_units
    - drift_micros
    - drift_bp
  properties:
    checked_at:
      "$ref": "#/Timestamp"
    result:
      type: string
      enum:
        - matched
        - drift
    usage_cost_micros:
      "$ref": "#/Micros"
    usage_units:
      type: integer
      minimum: 0
    unpriced_units:
      type: integer
      minimum: 0
    drift_micros:
      "$ref": "#/SignedMicros"
    drift_bp:
      oneOf:
        - type: integer
        - type: "null"
  additionalProperties: false
ProviderInvoice:
  type: object
  description: "A provider invoice of the tenant environment with its latest reconciliation (OP-38, OP-42). An invoice never changes."
  required:
    - object
    - id
    - provider
    - channel
    - invoice_ref
    - period_start
    - period_end
    - currency
    - amount_micros
    - units
    - raw
    - reconciliation
    - created_at
  properties:
    object:
      type: string
      const: provider_invoice
    id:
      "$ref": "#/Id_piv"
    provider:
      "$ref": "#/ProviderName"
    channel:
      oneOf:
        - "$ref": "#/Channel"
        - type: "null"
    invoice_ref:
      type: string
      minLength: 1
      maxLength: 128
    period_start:
      type: string
      format: date
    period_end:
      type: string
      format: date
    currency:
      "$ref": "#/CurrencyCode"
    amount_micros:
      "$ref": "#/Micros"
    units:
      oneOf:
        - type: integer
          minimum: 0
        - type: "null"
    raw:
      oneOf:
        - "$ref": "#/ProviderInvoiceRaw"
        - type: "null"
    reconciliation:
      oneOf:
        - "$ref": "#/ProviderInvoiceReconciliation"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
ProviderInvoiceList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/ProviderInvoice"
ProviderInvoiceCreate:
  type: object
  description: "A provider invoice: the period starts on period_start and ends before period_end, at most 92 days."
  required:
    - provider
    - invoice_ref
    - period_start
    - period_end
    - currency
    - amount_micros
  properties:
    provider:
      "$ref": "#/ProviderName"
    channel:
      "$ref": "#/Channel"
    invoice_ref:
      type: string
      minLength: 1
      maxLength: 128
    period_start:
      type: string
      format: date
    period_end:
      type: string
      format: date
    currency:
      "$ref": "#/CurrencyCode"
    amount_micros:
      "$ref": "#/Micros"
    units:
      type: integer
      minimum: 0
    raw:
      "$ref": "#/ProviderInvoiceRaw"
  additionalProperties: false
DeliveryReportRow:
  type: object
  description: "Exact counts of the deliveries created on one UTC day for one channel, provider and test flag (DS-35, DS-36, DS-39). engaged counts deliveries with a human action; opens exclude machine opens; sdk_receipts is the push funnel's own row."
  required:
    - day
    - channel
    - provider
    - is_test
    - accepted
    - enqueued
    - dispatched
    - provider_accepted
    - delivered
    - engaged
    - sdk_receipts
    - skipped
    - failed
    - uncertain
    - expired
    - cancelled
    - duplicate_delivered
    - conflicts
    - human_clicks
    - bot_clicks
    - opens
    - machine_opens
    - recomputed_at
  properties:
    day:
      type: string
      format: date
    channel:
      "$ref": "#/Channel"
    provider:
      oneOf:
        - "$ref": "#/ProviderName"
        - type: "null"
    is_test:
      type: boolean
    accepted:
      type: integer
      minimum: 0
    enqueued:
      type: integer
      minimum: 0
    dispatched:
      type: integer
      minimum: 0
    provider_accepted:
      type: integer
      minimum: 0
    delivered:
      type: integer
      minimum: 0
    engaged:
      type: integer
      minimum: 0
    sdk_receipts:
      type: integer
      minimum: 0
    skipped:
      type: integer
      minimum: 0
    failed:
      type: integer
      minimum: 0
    uncertain:
      type: integer
      minimum: 0
    expired:
      type: integer
      minimum: 0
    cancelled:
      type: integer
      minimum: 0
    duplicate_delivered:
      type: integer
      minimum: 0
    conflicts:
      type: integer
      minimum: 0
    human_clicks:
      type: integer
      minimum: 0
    bot_clicks:
      type: integer
      minimum: 0
    opens:
      type: integer
      minimum: 0
    machine_opens:
      type: integer
      minimum: 0
    recomputed_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
DeliveryReport:
  type: object
  description: "The delivery report of a period of the tenant environment."
  required:
    - object
    - from
    - to
    - rows
  properties:
    object:
      type: string
      const: delivery_report
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    rows:
      type: array
      items:
        "$ref": "#/DeliveryReportRow"
  additionalProperties: false
SkipReportRow:
  type: object
  description: "The deliveries created on one UTC day for one channel and test flag that were not sent, by reason and rule_id (DS-35)."
  required:
    - day
    - channel
    - is_test
    - reason
    - rule_id
    - skipped
    - recomputed_at
  properties:
    day:
      type: string
      format: date
    channel:
      "$ref": "#/Channel"
    is_test:
      type: boolean
    reason:
      type: string
      maxLength: 128
    rule_id:
      type: string
      maxLength: 128
    skipped:
      type: integer
      minimum: 0
    recomputed_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
SkipReport:
  type: object
  description: "The skip distribution of a period of the tenant environment."
  required:
    - object
    - from
    - to
    - rows
  properties:
    object:
      type: string
      const: skip_report
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    rows:
      type: array
      items:
        "$ref": "#/SkipReportRow"
  additionalProperties: false
CostReportRow:
  type: object
  description: "One immutable daily usage record (DS-53, OP-38, CH-18). billable_units is zero for failed and simulated attempts; billable_unit is null on rows written before billable units were recorded."
  required:
    - day
    - channel
    - provider
    - destination_country
    - whatsapp_category
    - outcome
    - is_test
    - deliveries
    - attempts
    - sms_segments
    - billable_unit
    - billable_units
    - voice_seconds
    - cost_micros
    - currency
  properties:
    day:
      type: string
      format: date
    channel:
      "$ref": "#/Channel"
    provider:
      type: string
      maxLength: 64
    destination_country:
      oneOf:
        - type: string
          pattern: "^[A-Z]{2}$"
        - type: "null"
    whatsapp_category:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    outcome:
      type: string
      enum:
        - accepted
        - uncertain
        - failed
        - late_adjustment
    is_test:
      type: boolean
    deliveries:
      type: integer
      minimum: 0
    attempts:
      type: integer
      minimum: 0
    sms_segments:
      oneOf:
        - type: integer
          minimum: 0
        - type: "null"
    billable_unit:
      oneOf:
        - type: string
          enum:
            - segment
            - answered_call
            - message
            - recipient
            - attempt
        - type: "null"
    billable_units:
      oneOf:
        - type: integer
          minimum: 0
        - type: "null"
    voice_seconds:
      oneOf:
        - type: integer
          minimum: 0
        - type: "null"
    cost_micros:
      oneOf:
        - "$ref": "#/Micros"
        - type: "null"
    currency:
      oneOf:
        - "$ref": "#/CurrencyCode"
        - type: "null"
  additionalProperties: false
CostReport:
  type: object
  description: "The cost report of a period of the tenant environment."
  required:
    - object
    - from
    - to
    - rows
  properties:
    object:
      type: string
      const: cost_report
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    rows:
      type: array
      items:
        "$ref": "#/CostReportRow"
  additionalProperties: false
Id_exp:
  type: string
  description: "Raw data export identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^exp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - exp_01j9zq3k4m5n6p7q8r9s0t1v2w
ExportKind:
  type: string
  description: "What an export holds: the deliveries with their decisions and outcomes, the delivery ledger events, or the daily usage records."
  enum:
    - deliveries
    - delivery_events
    - usage_records
Export:
  type: object
  description: "A raw data export of the tenant environment (DS-37). pending until its job wrote it; ready with its content until it expires; failed as too_large or unavailable; expired once its content was cleared. download_path is set only while it is ready."
  required:
    - object
    - id
    - kind
    - format
    - from
    - to
    - state
    - failure
    - row_count
    - byte_size
    - sha256
    - download_path
    - expires_at
    - completed_at
    - created_at
  properties:
    object:
      type: string
      const: export
    id:
      "$ref": "#/Id_exp"
    kind:
      "$ref": "#/ExportKind"
    format:
      type: string
      const: csv
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    state:
      type: string
      enum:
        - pending
        - ready
        - failed
        - expired
    failure:
      oneOf:
        - type: string
          enum:
            - too_large
            - unavailable
        - type: "null"
    row_count:
      oneOf:
        - type: integer
          minimum: 0
        - type: "null"
    byte_size:
      oneOf:
        - type: integer
          minimum: 0
        - type: "null"
    sha256:
      oneOf:
        - type: string
          pattern: "^[0-9a-f]{64}$"
        - type: "null"
    download_path:
      oneOf:
        - type: string
          pattern: "^/exports/v1\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
        - type: "null"
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    completed_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
ExportList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Export"
ExportCreate:
  type: object
  description: "A raw data export request: the kind and the UTC days from to to (exclusive, at most 92 days)."
  required:
    - kind
    - from
    - to
  properties:
    kind:
      "$ref": "#/ExportKind"
    from:
      type: string
      format: date
    to:
      type: string
      format: date
  additionalProperties: false
EmailReputationCircuit:
  type: object
  description: "The reputation circuit of a sending domain (CH-41, CH-87)."
  additionalProperties: false
  required:
    - object
    - domain
    - state
    - rates
    - warned_at
    - stopped_at
    - closed_at
    - updated_at
  properties:
    object:
      type: string
      enum:
        - email_reputation_circuit
    domain:
      type: string
      maxLength: 253
    state:
      type: string
      enum:
        - ok
        - warning
        - stopped
    rates:
      description: "The window's counts and rates in basis points at the last change: bounces over sent mail, complaints over mail delivered to the inbox."
      oneOf:
        - type: object
          additionalProperties:
            type: integer
            minimum: 0
        - type: "null"
    warned_at:
      oneOf:
        - type: string
          format: date-time
        - type: "null"
    stopped_at:
      oneOf:
        - type: string
          format: date-time
        - type: "null"
    closed_at:
      oneOf:
        - type: string
          format: date-time
        - type: "null"
    updated_at:
      type: string
      format: date-time
EmailReputationCircuitList:
  type: object
  additionalProperties: false
  required:
    - object
    - data
  properties:
    object:
      type: string
      enum:
        - list
    data:
      type: array
      items:
        "$ref": "#/EmailReputationCircuit"
EmailReputationClose:
  type: object
  additionalProperties: false
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 500
EmailReportKind:
  type: string
  enum:
    - dmarc_aggregate
    - tls_rpt
EmailReportUpload:
  type: object
  additionalProperties: false
  required:
    - kind
    - encoding
    - content
  properties:
    kind:
      "$ref": "#/EmailReportKind"
    encoding:
      type: string
      description: "How the report is written: xml (DMARC) or json (TLS-RPT) as received, gzip, or zip with one file."
      enum:
        - xml
        - json
        - gzip
        - zip
    content:
      type: string
      description: "The report, base64 encoded."
      minLength: 1
      maxLength: 1000000
EmailReport:
  type: object
  description: "A stored DMARC aggregate or TLS report (CH-46)."
  additionalProperties: false
  required:
    - object
    - id
    - kind
    - reporter
    - report_id
    - domain
    - begin_at
    - end_at
    - record_count
    - summary
  properties:
    object:
      type: string
      enum:
        - email_report
    id:
      "$ref": "#/Id_emr"
    kind:
      "$ref": "#/EmailReportKind"
    reporter:
      type: string
      description: "The reporting organization."
    report_id:
      type: string
      description: "The reporter's report identifier."
    domain:
      type: string
    begin_at:
      type: string
      format: date-time
    end_at:
      type: string
      format: date-time
    record_count:
      type: integer
      minimum: 0
    summary:
      type: object
      description: "DMARC: messages, dmarc_pass, dmarc_fail, dispositions and the published policy. TLS: successful_sessions, failed_sessions and failures by result type."
      additionalProperties: true
EmailReportSummary:
  type: object
  additionalProperties: false
  required:
    - object
    - domain
    - from
    - to
    - truncated
    - dmarc
    - tls
    - reporters
  properties:
    object:
      type: string
      enum:
        - email_report_summary
    domain:
      type: string
    from:
      type: string
      format: date-time
    to:
      type: string
      format: date-time
    truncated:
      type: boolean
    dmarc:
      type: object
      additionalProperties: false
      required:
        - reports
        - messages
        - dmarc_pass
        - dmarc_fail
        - dispositions
      properties:
        reports:
          type: integer
          minimum: 0
        messages:
          type: integer
          minimum: 0
        dmarc_pass:
          type: integer
          minimum: 0
        dmarc_fail:
          type: integer
          minimum: 0
        dispositions:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    tls:
      type: object
      additionalProperties: false
      required:
        - reports
        - successful_sessions
        - failed_sessions
        - failures
      properties:
        reports:
          type: integer
          minimum: 0
        successful_sessions:
          type: integer
          minimum: 0
        failed_sessions:
          type: integer
          minimum: 0
        failures:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    reporters:
      type: array
      items:
        type: string
