    - checked_at
    - result
    - usage_cost_micros
    - usage_units
    - unpriced_units
    - drift_micros
    - drift_bp
  properties:
    checked_at:
      "$ref": "#/Timestamp"
    result:
      type: string
      enum:
        - matched
        - drift
    usage_cost_micros:
      "$ref": "#/Micros"
    usage_units:
      type: integer
      minimum: 0
    unpriced_units:
      type: integer
      minimum: 0
    drift_micros:
      "$ref": "#/SignedMicros"
    drift_bp:
      oneOf:
        - type: integer
        - type: "null"
