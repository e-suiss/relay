    access.consent.updated:
      name: consent.updated
      title: consent.updated
      summary: "A commercial consent of an Access subject changed; Relay records it idempotently in its consent copy and ignores an older sequence."
      contentType: application/cloudevents+json
      payload:
        schemaFormat: "application/schema+json;version=2020-12"
        schema:
          allOf:
            - "$ref": "#/components/schemas/CloudEventEnvelope"
            - type: object
              properties:
                type:
                  const: consent.updated
                data:
                  type: object
                  required:
                    - sub
                    - access_tenant_id
                    - channel
                    - status
                    - source
                    - occurred_at
                    - sequence
                  properties:
                    sub:
                      type: string
                      description: Pairwise Access subject of the subscriber for the Relay client.
                      maxLength: 256
                    access_tenant_id:
                      type: string
                      description: Access tenant the consent belongs to.
                      maxLength: 256
                    access_organization_id:
                      type: string
                      description: "Access organization that is the brand of the consent; absent for the tenant itself."
                      maxLength: 256
                    channel:
                      "$ref": "../openapi/components/schemas.yaml#/Channel"
                    status:
                      type: string
                      enum:
                        - NONE
                        - PENDING
                        - ACTIVE
                        - REVOKED
                        - EXPIRED
                    consent_kind:
                      "$ref": "../openapi/components/schemas.yaml#/ConsentKind"
                    recipient_type:
                      "$ref": "../openapi/components/schemas.yaml#/LegalType"
                    source:
                      type: string
                      maxLength: 64
                    occurred_at:
                      "$ref": "../openapi/components/schemas.yaml#/Timestamp"
                    text_version_digest:
                      type: string
                      description: Hex SHA-256 of the consent text version the subject saw.
                      pattern: "^[0-9a-f]{64}$"
                    evidence:
                      type: object
                      properties:
                        ip:
                          type: string
                          maxLength: 64
                        device:
                          type: string
                          maxLength: 512
                      additionalProperties: false
                    iys_transaction_id:
                      type: string
                      maxLength: 128
                    sequence:
                      type: integer
                      minimum: 0
                      description: Monotonic per subject; an event with an older sequence than the recorded one is ignored.
                  additionalProperties: false
      x-relay-surface: access
      x-relay-stage: 4
      x-relay-choice: true
      x-relay-choice-note: "Name proposed to Access; Relay follows the name Access approves in its own contract."
    access.delivery.paused:
      name: delivery.paused
      title: delivery.paused
      summary: "A delivery of an Access security message was paused by an explicit security stop."
      description: "Sent once for each blocked delivery, in the transaction that records the pause with its rule_id. It carries only the delivery status and the audit references (the kill switch and its rule). It is information: Access changes no state because of it."
      contentType: application/cloudevents+json
      payload:
        schemaFormat: "application/schema+json;version=2020-12"
        schema:
          allOf:
            - "$ref": "#/components/schemas/CloudEventEnvelope"
            - type: object
              properties:
                type:
                  const: delivery.paused
                data:
                  type: object
                  required:
                    - delivery_id
                    - notification_id
                    - channel
                    - status
                    - reason
                    - rule_id
                    - kill_switch_id
                    - paused_at
                  properties:
                    delivery_id:
                      "$ref": "../openapi/components/schemas.yaml#/Id_dlv"
                    notification_id:
                      "$ref": "../openapi/components/schemas.yaml#/Id_ntf"
                    event_id:
                      "$ref": "../openapi/components/schemas.yaml#/Id_evt"
                    channel:
                      "$ref": "../openapi/components/schemas.yaml#/Channel"
                    status:
                      type: string
                      const: queued
                    reason:
                      type: string
                      const: paused
                    rule_id:
                      "$ref": "../openapi/components/schemas.yaml#/RuleId"
                    kill_switch_id:
                      "$ref": "../openapi/components/schemas.yaml#/Id_ksw"
                    paused_at:
                      "$ref": "../openapi/components/schemas.yaml#/Timestamp"
                  additionalProperties: false
      x-relay-surface: access
      x-relay-stage: 3
      x-relay-choice: true
      x-relay-choice-note: "The product decisions require the status of a blocked Access security delivery to return to Access as information but name no event; the name delivery.paused and this payload (delivery status and audit references only) are chosen by the contract."
