        - type: integer
          minimum: 1
        - type: "null"
    windows:
      type: array
      items:
        "$ref": "#/DeliveryWindowInForce"
    tenant_windows:
      type: array
      items:
        "$ref": "#/DeliveryWindow"
  additionalProperties: false
DeliveryWindowsReplace:
  type: object
  required:
    - windows
  properties:
    windows:
      type: array
      maxItems: 64
      items:
        "$ref": "#/DeliveryWindow"
  additionalProperties: false
ComplianceRefusal:
  type: object
  description: "Consent kinds that are not accepted in a country or a region of the compliance table although the table's row accepts them."
  required:
    - country
    - consent_kinds
  properties:
    country:
      type: string
      description: "An ISO 3166-1 alpha-2 country code or a region key of the compliance table (EU)."
      pattern: "^[A-Z]{2}$"
    consent_kinds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum:
          - soft_opt_in
          - legitimate_interest
  additionalProperties: false
ComplianceSettings:
  type: object
  required:
    - object
    - version
    - refusals
    - installation_refusals
  properties:
    object:
      type: string
      const: compliance_settings
    version:
      description: "The number of the tenant's active compliance_settings version; null while the tenant refuses nothing of its own."
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    refusals:
      description: "The tenant's own refusals."
      type: array
      items:
        "$ref": "#/ComplianceRefusal"
    installation_refusals:
      description: "The refusals the installation sets for every tenant; they apply together with the tenant's own."
      type: array
      items:
        "$ref": "#/ComplianceRefusal"
  additionalProperties: false
ComplianceSettingsReplace:
  type: object
  required:
    - refusals
  properties:
    refusals:
      type: array
      maxItems: 256
      items:
        "$ref": "#/ComplianceRefusal"
  additionalProperties: false
Id_piv:
  type: string
  description: "Provider invoice identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^piv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - piv_01j9zq3k4m5n6p7q8r9s0t1v2w
Micros:
