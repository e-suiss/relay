    object:
      type: string
      const: test_recipient
    id:
      "$ref": "#/Id_trc"
    subscriber_id:
      description: "External id of the subscriber; null once the subscriber is erased."
      oneOf:
        - "$ref": "#/ExternalId"
        - type: "null"
    device_id:
      description: "The one device a device entry reaches on push and Web Push; null for a person entry."
      oneOf:
        - "$ref": "#/Id_dev"
        - type: "null"
    state:
      "$ref": "#/TestRecipientState"
    verify_by:
      description: "End of the verification window of a pending entry."
      "$ref": "#/Timestamp"
    verified_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    removed_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
TestRecipientList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/TestRecipient"
TestRecipientCreate:
  type: object
  description: "Adds a subscriber, or one of its devices, to the test recipient list as pending."
  required:
    - subscriber_id
  properties:
    subscriber_id:
      "$ref": "#/ExternalId"
    device_id:
      "$ref": "#/Id_dev"
  additionalProperties: false
WorkflowTestRequest:
  type: object
  description: "A test send of the workflow's published version to verified test recipients."
  required:
    - to
  properties:
    to:
      type: array
      description: "Verified test recipients, 1 to 5."
      items:
        "$ref": "#/Id_trc"
      minItems: 1
      maxItems: 5
      uniqueItems: true
    data:
      type: object
      description: Event data, validated against the event schema of the published workflow version.
    channels:
      type: array
      description: "Narrows the workflow's steps to these channels; never adds steps."
      items:
        "$ref": "#/Channel"
      minItems: 1
      uniqueItems: true
    overrides:
      "$ref": "#/Overrides"
    metadata:
      "$ref": "#/Metadata"
  additionalProperties: false
DeliveryWindow:
  type: object
  description: "One DLR window: without a provider it is the channel's window, with a provider it adjusts the window for that provider. Times are milliseconds after the provider accepted the delivery."
  required:
    - channel
    - provider
    - short_ms
    - long_ms
  properties:
    channel:
      type: string
      enum:
        - sms
        - email
        - whatsapp
        - voice
    provider:
      oneOf:
        - type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: "null"
    short_ms:
      type: integer
      minimum: 900000
      maximum: 1209600000
    long_ms:
      type: integer
      minimum: 900000
      maximum: 1209600000
  additionalProperties: false
DeliveryWindowInForce:
  type: object
  description: "A DLR window in force with the level it comes from."
  required:
    - channel
    - provider
    - short_ms
    - long_ms
    - source
  properties:
    channel:
      type: string
      enum:
        - sms
        - email
        - whatsapp
        - voice
    provider:
      oneOf:
        - type: string
        - type: "null"
    short_ms:
      type: integer
      minimum: 0
    long_ms:
      type: integer
      minimum: 0
    source:
      type: string
      enum:
        - installation
        - tenant
  additionalProperties: false
DeliveryWindows:
  type: object
  required:
    - object
    - version
    - windows
    - tenant_windows
  properties:
    object:
      type: string
      const: delivery_windows
    version:
      description: "The number of the tenant's active delivery_windows version; null while the installation defaults apply alone."
