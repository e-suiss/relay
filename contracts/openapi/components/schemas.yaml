            type:
              - string
              - number
              - boolean
          x-relay-choice: true
          x-relay-choice-note: "The spec mentions declared recipient attributes; shape and bounds are chosen by the contract."
        - type: "null"
  additionalProperties: false
SubscriberList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Subscriber"
SubscriberBulkRow:
  type: object
  required:
    - external_id
  properties:
    ref:
      type: string
      maxLength: 128
    external_id:
      "$ref": "#/ExternalId"
    email:
      oneOf:
        - "$ref": "#/Email"
        - type: "null"
    phone:
      oneOf:
        - "$ref": "#/E164"
        - type: "null"
    name:
      oneOf:
        - type: string
          maxLength: 200
        - type: "null"
    locale:
      oneOf:
        - "$ref": "#/Locale"
        - type: "null"
    timezone:
      oneOf:
        - "$ref": "#/TimeZone"
        - type: "null"
    legal_type:
      oneOf:
        - "$ref": "#/LegalType"
        - type: "null"
    attributes:
      oneOf:
        - type: object
          description: Recipient attributes available to templates and conditions. Values are strings, numbers or booleans.
          maxProperties: 64
          propertyNames:
            pattern: "^[a-z][a-z0-9_]{0,63}$"
          additionalProperties:
            type:
              - string
              - number
              - boolean
          x-relay-choice: true
          x-relay-choice-note: "The spec mentions declared recipient attributes; shape and bounds are chosen by the contract."
        - type: "null"
  additionalProperties: false
SubscriberBulkRequest:
  type: object
  description: "Bulk upsert; batch rules apply (one Idempotency-Key for the whole request, per-row results)."
  required:
    - subscribers
  properties:
    subscribers:
      type: array
      items:
        "$ref": "#/SubscriberBulkRow"
      minItems: 1
      maxItems: 500
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: Row limit 500 follows the event batch limit.
SubscriberBulkRowResult:
  type: object
  required:
    - index
    - status
  properties:
    index:
      type: integer
      minimum: 0
    ref:
      type: string
      maxLength: 128
    status:
      type: string
      enum:
        - created
        - updated
        - unchanged
        - rejected
    subscriber:
      "$ref": "#/Subscriber"
    error:
      "$ref": "./problem.yaml#/Problem"
  additionalProperties: false
SubscriberBulkResult:
  type: object
  required:
    - object
    - summary
    - results
  properties:
    object:
      type: string
      const: batch_result
    summary:
      "$ref": "#/BatchSummary"
    results:
      type: array
      items:
        "$ref": "#/SubscriberBulkRowResult"
  additionalProperties: false
SubscriberDeletion:
  type: object
  description: "Deletion request. It applies to queued jobs, scheduled sends, digest buffers and the inbox; personal fields become unreadable by crypto-shredding. Rows are never physically deleted."
  required:
    - object
    - id
    - subscriber_id
    - status
    - created_at
  properties:
    object:
      type: string
      const: subscriber_deletion
    id:
      "$ref": "#/Id_sdr"
    subscriber_id:
      "$ref": "#/Id_sub"
    status:
      type: string
      enum:
        - pending
        - completed
        - held
    created_at:
      "$ref": "#/Timestamp"
    completed_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
ChannelStep:
  type: object
  description: "Channel step: sends to one channel using one template. Route policies, variants and escalation come in a later stage."
  required:
    - type
    - key
    - channel
    - template
  properties:
    type:
      type: string
      const: channel
    key:
      type: string
      description: Step key, unique within the workflow.
      pattern: "^[a-z][a-z0-9_]{0,63}$"
    channel:
      "$ref": "#/Channel"
    template:
      type: string
      description: Template key the step renders.
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      maxLength: 100
  additionalProperties: false
WorkflowDefinition:
  type: object
  description: Workflow definition. The same definition is accepted by the file format and the SDK compiler.
  required:
    - name
    - category
    - message_class
    - event_schema
    - steps
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      maxLength: 2000
    category:
      type: string
      description: Tenant category key.
      pattern: "^[a-z][a-z0-9_]{0,63}$"
    message_class:
      "$ref": "#/MessageClass"
    event_schema:
      type: object
      description: "JSON Schema 2020-12 for event data; incoming data is validated against it at accept time."
    steps:
      type: array
      items:
        "$ref": "#/ChannelStep"
      minItems: 1
      maxItems: 50
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "Until tenant categories exist (later stage), the definition declares message_class next to category; afterwards the class must match the category's class."
WorkflowCreate:
  type: object
  description: Create a workflow and its first draft.
  required:
    - key
    - definition
  properties:
    key:
      "$ref": "#/WorkflowKey"
    definition:
      "$ref": "#/WorkflowDefinition"
  additionalProperties: false
WorkflowDraft:
  type: object
  description: Replace the draft of the workflow.
  required:
    - definition
  properties:
    definition:
      "$ref": "#/WorkflowDefinition"
  additionalProperties: false
Publication:
  type: object
  required:
    - status
    - requested_at
  properties:
    status:
      type: string
      enum:
        - pending
        - published
        - rejected
    version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    errors:
      type: array
      items:
        "$ref": "./problem.yaml#/FieldError"
    requested_at:
      "$ref": "#/Timestamp"
    finished_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
Workflow:
  type: object
  required:
    - object
    - id
    - key
    - name
    - managed_by
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: workflow
    id:
      "$ref": "#/Id_wfl"
    key:
      "$ref": "#/WorkflowKey"
    name:
      type: string
      maxLength: 200
    managed_by:
      type: string
      enum:
        - panel
        - code
      description: "Single manager of the workflow; managed_by rules come in a later stage."
    published_version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    draft:
      oneOf:
        - "$ref": "#/WorkflowDefinition"
        - type: "null"
    draft_version_id:
      oneOf:
        - "$ref": "#/Id_wfv"
        - type: "null"
    last_publication:
      oneOf:
        - "$ref": "#/Publication"
        - type: "null"
    state:
      type: string
      enum:
        - active
        - archived
    version:
      type: integer
      minimum: 1
      description: "Optimistic concurrency version; the ETag carries it."
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WorkflowList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Workflow"
WorkflowVersion:
  type: object
  description: "Published workflow version; immutable."
  required:
    - object
    - id
    - workflow_key
    - version
    - definition
    - definition_digest
    - published_at
  properties:
    object:
      type: string
      const: workflow_version
    id:
      "$ref": "#/Id_wfv"
    workflow_key:
      "$ref": "#/WorkflowKey"
    version:
      type: integer
      minimum: 1
    definition:
      "$ref": "#/WorkflowDefinition"
    definition_digest:
      type: string
      description: SHA-256 of the canonical definition, lowercase hex.
      pattern: "^[0-9a-f]{64}$"
    promoted_from:
      oneOf:
        - type: integer
          minimum: 1
          description: Version this one republished (rollback).
        - type: "null"
    published_at:
      "$ref": "#/Timestamp"
    published_by:
      type: string
      maxLength: 256
  additionalProperties: false
WorkflowVersionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/WorkflowVersion"
PublishRequest:
  type: object
  description: Optional publication note recorded in the audit log.
  properties:
    note:
      type: string
      maxLength: 500
  additionalProperties: false
PublicationAccepted:
  type: object
  description: "Publication accepted for the publication gate; the result appears on the workflow."
  required:
    - object
    - workflow_key
    - publication
  properties:
    object:
      type: string
      const: workflow_publication
    workflow_key:
      "$ref": "#/WorkflowKey"
    publication:
      "$ref": "#/Publication"
  additionalProperties: false
EventTypeMapping:
  type: object
  required:
    - object
    - id
    - type
    - source
    - workflow
    - to_pointer
    - data_fields
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: event_type_mapping
    id:
      "$ref": "#/Id_cem"
    type:
      type: string
      description: CloudEvents type.
      minLength: 1
      maxLength: 256
    source:
      oneOf:
        - type: string
          description: "Exact CloudEvents source to match; null matches any source."
          maxLength: 1024
        - type: "null"
    workflow:
      "$ref": "#/WorkflowKey"
    to_pointer:
      type: string
      description: JSON Pointer into data locating a recipient target or an array of them.
      maxLength: 256
    tenant_pointer:
      oneOf:
        - type: string
          description: JSON Pointer into data locating a subtenant id.
          maxLength: 256
        - type: "null"
    data_fields:
      type: array
      description: Allow-list of JSON Pointers copied into event data. The empty pointer copies the whole object.
      items:
        type: string
        maxLength: 256
      minItems: 1
      maxItems: 100
      uniqueItems: true
    state:
      type: string
      enum:
        - active
        - archived
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
EventTypeMappingWrite:
  type: object
  description: Tenant-defined mapping from a CloudEvents type to a workflow, with a field allow-list instead of a transformation script.
  required:
    - type
    - workflow
    - to_pointer
    - data_fields
  properties:
    type:
      type: string
      minLength: 1
      maxLength: 256
    source:
      oneOf:
        - type: string
          maxLength: 1024
        - type: "null"
    workflow:
      "$ref": "#/WorkflowKey"
    to_pointer:
      type: string
      maxLength: 256
    tenant_pointer:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    data_fields:
      type: array
      items:
        type: string
        maxLength: 256
      minItems: 1
      maxItems: 100
      uniqueItems: true
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "The spec defines the type-to-workflow table and a field allow-list; recipient and subtenant pointers are chosen by the contract because CloudEvents carry no recipients."
EventTypeMappingList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/EventTypeMapping"
KillSwitch:
  type: object
  required:
    - object
    - id
    - scope_kind
    - target_kind
    - state
    - reason
    - origin
    - created_by
    - status
    - created_at
  properties:
    object:
      type: string
      const: kill_switch
    id:
      "$ref": "#/Id_ksw"
    scope_kind:
      type: string
      enum:
        - platform
        - tenant
        - subtenant
        - campaign
        - workflow
        - api_client
        - sender
    scope_ref:
      oneOf:
        - type: string
          maxLength: 128
        - type: "null"
    channel:
      oneOf:
        - "$ref": "#/Channel"
        - type: "null"
    target_kind:
      type: string
      enum:
        - all
        - provider_account
        - template
    target_ref:
      oneOf:
        - type: string
          maxLength: 128
        - type: "null"
    message_class:
      oneOf:
        - "$ref": "#/MessageClass"
          description: null means every class except security.
        - type: "null"
    state:
      type: string
      enum:
        - "on"
        - "off"
        - canary
        - paused_until
    canary_percent:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 99
        - type: "null"
    paused_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    reason:
      type: string
      maxLength: 2000
    ticket_ref:
      oneOf:
        - type: string
          maxLength: 512
        - type: "null"
    origin:
      type: string
      enum:
        - operator
        - dead_man
    created_by:
      type: string
      maxLength: 256
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    supersedes_id:
      oneOf:
        - "$ref": "#/Id_ksw"
        - type: "null"
    status:
      type: string
      enum:
        - active
        - released
    released_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    released_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    release_reason:
      oneOf:
        - type: string
          maxLength: 2000
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
KillSwitchList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/KillSwitch"
KillSwitchEngage:
  type: object
  required:
    - scope_kind
    - reason
  properties:
    scope_kind:
      type: string
      enum:
        - tenant
        - subtenant
        - campaign
        - workflow
        - api_client
        - sender
      description: API clients with the kill_switch scope may use only campaign and workflow.
    scope_ref:
      type: string
      description: Identifier of the scoped object (stn_, campaign, workflow key, cli_, sender).
      maxLength: 128
    channel:
      "$ref": "#/Channel"
    target_kind:
      type: string
      enum:
        - all
        - provider_account
        - template
      default: all
    target_ref:
      type: string
      maxLength: 128
    message_class:
      "$ref": "#/MessageClass"
      description: Omit to stop every class except security. Stopping security is a separate choice that needs step-up.
    state:
      type: string
      enum:
        - "off"
        - canary
        - paused_until
      default: "off"
    canary_percent:
      type: integer
      minimum: 1
      maximum: 99
    paused_until:
      "$ref": "#/Timestamp"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    ticket_ref:
      type: string
      maxLength: 512
    ttl:
      "$ref": "#/Duration"
      description: "Time to live; required unless no_ttl is true."
    no_ttl:
      type: boolean
      description: A record without TTL needs explicit approval (operator session with step-up).
  additionalProperties: false
PlatformKillSwitchEngage:
  type: object
  description: "Platform kill switch; applies to every tenant and both environments."
  required:
    - reason
  properties:
    channel:
      "$ref": "#/Channel"
    target_kind:
      type: string
      enum:
        - all
        - provider_account
        - template
      default: all
    target_ref:
      type: string
      maxLength: 128
    message_class:
      "$ref": "#/MessageClass"
      description: Omit to stop every class except security. Stopping security is a separate choice that needs step-up.
    state:
      type: string
      enum:
        - "off"
        - canary
        - paused_until
      default: "off"
    canary_percent:
      type: integer
      minimum: 1
      maximum: 99
    paused_until:
      "$ref": "#/Timestamp"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    ticket_ref:
      type: string
      maxLength: 512
    ttl:
      "$ref": "#/Duration"
      description: "Time to live; required unless no_ttl is true."
    no_ttl:
      type: boolean
      description: A record without TTL needs explicit approval (operator session with step-up).
  additionalProperties: false
KillSwitchReplace:
  type: object
  description: "Replace the state of a kill switch, keeping its dimensions. Tightening needs no step-up; relaxing needs an operator session with step-up."
  required:
    - state
    - reason
  properties:
    state:
      type: string
      enum:
        - "off"
        - canary
        - paused_until
    canary_percent:
      type: integer
      minimum: 1
      maximum: 99
    paused_until:
      "$ref": "#/Timestamp"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    ttl:
      "$ref": "#/Duration"
    no_ttl:
      type: boolean
  additionalProperties: false
KillSwitchRelease:
  type: object
  description: "Release is a relaxation: operator session with step-up only. PAUSED deliveries are not resumed automatically."
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
KillSwitchResume:
  type: object
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
KillSwitchBulkCancel:
  type: object
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
KillSwitchActionResult:
  type: object
  required:
    - object
    - kill_switch_id
    - action
    - affected
    - has_more
  properties:
    object:
      type: string
      const: kill_switch_action
    kill_switch_id:
      "$ref": "#/Id_ksw"
    action:
      type: string
      enum:
        - resume
        - bulk_cancel
    affected:
      type: integer
      minimum: 0
    has_more:
      type: boolean
  additionalProperties: false
ErrorDescription:
  type: object
  description: Description of one error code, served from the error catalog.
  required:
    - object
    - code
    - family
    - type
    - title
    - status
    - retryable
    - retry_after
    - description
  properties:
    object:
      type: string
      const: error_code
    code:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    family:
      type: string
    type:
      type: string
      format: uri
    title:
      type: string
    status:
      type: integer
      minimum: 400
      maximum: 599
    retryable:
      type: boolean
    retry_after:
      type: object
      required:
        - kind
        - seconds
        - max_seconds
      properties:
        kind:
          type: string
          enum:
            - none
            - fixed
            - window
            - range
        seconds:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        max_seconds:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
      additionalProperties: false
    description:
      type: string
  additionalProperties: false
VirtualClock:
  type: object
  description: Virtual clock of the test environment.
  required:
    - object
    - offset_ms
    - business_now
  properties:
    object:
      type: string
      const: virtual_clock
    offset_ms:
      type: integer
      minimum: 0
    business_now:
      "$ref": "#/Timestamp"
  additionalProperties: false
VirtualClockAdvance:
  type: object
  required:
    - by
  properties:
    by:
      "$ref": "#/Duration"
      description: Forward step, at most 366 days. The clock never moves back.
  additionalProperties: false
AccessEventDelivery:
  type: object
  description: Access event delivered to Relay with the shared Suiss webhook profile. Event types and data schemas are in the event catalog.
  required:
    - specversion
    - id
    - source
    - type
    - time
    - data
  properties:
    specversion:
      type: string
      const: "1.0"
    id:
      type: string
      minLength: 1
      maxLength: 512
    source:
      type: string
      maxLength: 1024
    type:
      "$ref": "#/EventName"
    time:
      "$ref": "#/Timestamp"
    subject:
      type: string
      maxLength: 512
    datacontenttype:
      type: string
      const: application/json
    data:
      type: object
    traceparent:
      type: string
      pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
  additionalProperties: false
Role:
  type: object
  required:
    - object
    - key
    - scope
    - rank
    - description
  properties:
    object:
      type: string
      const: role
    key:
      type: string
      enum:
        - installation_operator
        - tenant_admin
        - tenant_operator
    scope:
      type: string
      enum:
        - installation
        - tenant
    rank:
      type: integer
      description: "installation_operator 3 > tenant_admin 2 > tenant_operator 1."
    description:
      type: string
  additionalProperties: false
