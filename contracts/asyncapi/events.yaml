components:
  schemas:
    CloudEventEnvelope:
      type: object
      description: CloudEvents 1.0 structured envelope shared by Relay and Access (common Suiss webhook profile).
      required:
        - specversion
        - id
        - source
        - type
        - time
        - datacontenttype
        - data
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          description: "Event id; equals webhook-id on webhook delivery."
          maxLength: 512
        source:
          type: string
          description: "Producer source. In use A it is the installation issuer of the discovery document; for tenant-defined event types (use B) it is the tenant's value. Relay's internal tenant id is never included."
          maxLength: 1024
        type:
          "$ref": "../openapi/components/schemas.yaml#/EventName"
        time:
          "$ref": "../openapi/components/schemas.yaml#/Timestamp"
        subject:
          type: string
          maxLength: 512
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
          description: Versioned data schema URI of the event type.
          format: uri
        seq:
          type: integer
          minimum: 1
          description: Monotonic sequence per subject (CloudEvents extension).
        traceparent:
          type: string
          pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
        environment:
          "$ref": "../openapi/components/schemas.yaml#/Environment"
        accesstenant:
          type: string
          description: "Identifier of the Access tenant bound to the Relay tenant. Use A only."
          maxLength: 256
        accessorganization:
          type: string
          description: "Identifier of the Access organization bound to the subtenant, when there is one. Use A only."
          maxLength: 256
        correlationid:
          type: string
          description: "The sender's correlation_id; for waitpoint events the value of the creation request. Absent when none was given. Use A only."
          minLength: 1
          maxLength: 128
          pattern: "^[\\x20-\\x7E]+$"
        data:
          type: object
      additionalProperties: false
    RealtimeEnvelope:
      type: object
      description: "Realtime envelope {t, v, ts, d}; every message carries counters."
      required:
        - t
        - v
        - ts
        - d
        - counters
      properties:
        t:
          "$ref": "../openapi/components/schemas.yaml#/EventName"
        v:
          type: integer
          minimum: 1
          description: Schema version of the message type.
        ts:
          "$ref": "../openapi/components/schemas.yaml#/Timestamp"
        d:
          type: object
        counters:
          type: object
          required:
            - unseen
            - unread
            - total
            - version
          properties:
            unseen:
              type: integer
              minimum: 0
            unread:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
            version:
              type: integer
              minimum: 0
          additionalProperties: false
      additionalProperties: false
    AuditRecord:
      type: object
      description: "The fields of one audit log record as the audit export carries them: who acted, on whose behalf and under which Access record, on what and why. Encrypted details are not exported."
      required:
        - actor_kind
        - actor_ref
        - on_behalf_of
        - target_type
      properties:
        actor_kind:
          type: string
          enum:
            - operator
            - installation_operator
            - api_client
            - access
            - system
        actor_ref:
          type: string
          maxLength: 256
        on_behalf_of:
          type: string
          maxLength: 256
        access_record_ref:
          oneOf:
            - type: string
              maxLength: 256
            - type: "null"
        target_type:
          type: string
          maxLength: 64
        target_id:
          oneOf:
            - type: string
              maxLength: 256
            - type: "null"
        reason:
          oneOf:
            - type: string
              maxLength: 2000
            - type: "null"
      additionalProperties: false
  messages:
    webhook.notification.suppressed:
      name: notification.suppressed
      title: notification.suppressed
      summary: "A notification or delivery was not sent; the reason and rule_id say why."
      contentType: application/cloudevents+json
      payload:
        schemaFormat: "application/schema+json;version=2020-12"
        schema:
          allOf:
            - "$ref": "#/components/schemas/CloudEventEnvelope"
            - type: object
              properties:
                type:
                  const: notification.suppressed
                data:
                  type: object
                  required:
                    - notification_id
                    - recipient_id
                    - workflow
                    - reason
                    - rule_id
                  properties:
                    notification_id:
                      type: string
                      pattern: "^ntf_[0-7][0-9a-hjkmnp-tv-z]{25}$"
                    delivery_id:
                      oneOf:
                        - type: string
                          pattern: "^dlv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
                        - type: "null"
                    recipient_id:
                      "$ref": "../openapi/components/schemas.yaml#/RecipientId"
                    external_id:
                      "$ref": "../openapi/components/schemas.yaml#/ExternalId"
                    workflow:
                      type: object
                      required:
                        - key
                        - version
                      properties:
                        key:
                          "$ref": "../openapi/components/schemas.yaml#/WorkflowKey"
                        version:
                          type: integer
                          minimum: 1
                      additionalProperties: false
                    tenant:
                      oneOf:
                        - type: string
                          pattern: "^stn_[0-7][0-9a-hjkmnp-tv-z]{25}$"
                        - type: "null"
                    channel:
                      oneOf:
                        - "$ref": "../openapi/components/schemas.yaml#/Channel"
                        - type: "null"
                    reason:
                      type: string
                      maxLength: 64
                    rule_id:
                      "$ref": "../openapi/components/schemas.yaml#/RuleId"
                    metadata:
                      "$ref": "../openapi/components/schemas.yaml#/Metadata"
                  additionalProperties: false
      x-relay-surface: webhook
      x-relay-stage: 4
