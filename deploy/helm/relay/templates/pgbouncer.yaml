{{- if .Values.pgbouncer.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pgbouncer
  labels:
    app.kubernetes.io/name: relay-pgbouncer
    app.kubernetes.io/part-of: {{ .Release.Name }}
data:
  pgbouncer.ini: |
    [databases]
    * = host={{ required "pgbouncer.databaseHost is required" .Values.pgbouncer.databaseHost }} port={{ .Values.pgbouncer.databasePort }}

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    unix_socket_dir =
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist/userlist.txt
    pool_mode = transaction
    max_client_conn = {{ .Values.pgbouncer.maxClientConnections }}
    default_pool_size = {{ .Values.pgbouncer.defaultPoolSize }}
    max_prepared_statements = {{ .Values.pgbouncer.maxPreparedStatements }}
    server_reset_query =
    server_tls_sslmode = {{ .Values.pgbouncer.serverTlsSslMode }}
    ignore_startup_parameters = extra_float_digits
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pgbouncer
  labels:
    app.kubernetes.io/name: relay-pgbouncer
    app.kubernetes.io/part-of: {{ .Release.Name }}
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-pgbouncer
      app.kubernetes.io/part-of: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-pgbouncer
        app.kubernetes.io/part-of: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image.repository }}@{{ required "pgbouncer.image.digest is required" .Values.pgbouncer.image.digest }}
          command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
          ports:
            - name: pgbouncer
              containerPort: 6432
          readinessProbe:
            tcpSocket: {port: pgbouncer}
          livenessProbe:
            tcpSocket: {port: pgbouncer}
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: userlist
              mountPath: /etc/pgbouncer/userlist
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-pgbouncer
        - name: userlist
          secret:
            secretName: {{ .Values.pgbouncer.userlistSecret }}
            items:
              - key: userlist.txt
                path: userlist.txt
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pgbouncer
  labels:
    app.kubernetes.io/name: relay-pgbouncer
    app.kubernetes.io/part-of: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: relay-pgbouncer
    app.kubernetes.io/part-of: {{ .Release.Name }}
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: pgbouncer
{{- end }}
