openapi: "3.1.0"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: Relay Subscriber API
  version: "2026-11-01"
  description: "Client family used by browsers, mobile apps and UI components with a Relay subscriber token. This file holds the token exchange, preferences and device registration; the inbox is added in a later stage. Clients never hold secret credentials and can never send events. JSON in UTF-8, snake_case fields, RFC 3339 UTC times, ISO 8601 durations, amounts and large integers as strings. Unknown fields are rejected with 422 unknown_field at every depth, including overrides; null clears a field and an absent field is left untouched. HTTPS only (TLS 1.2 or later, HSTS). Every response carries Request-Id and Relay-Version. Errors are RFC 9457 problem details whose type resolves to /v1/errors/{code} on the same region. The token exchange is an OAuth endpoint and takes no Idempotency-Key; later write endpoints require one (24 hours, fixed). Relay delivers at least once and, with durable idempotency, processes effectively once. Identifiers are opaque, prefixed and time ordered (x-relay-id-prefixes). Resources of other tenants and environments return 404. Health endpoints are not part of this API."
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: "https://{host}"
    description: "Base address of a data region. A region's address never reaches another region's data and never routes between regions."
    variables:
      host:
        default: relay.example.com
tags:
  - name: token
    description: Subscriber token issuance.
  - name: preferences
    description: "The subscriber's own preferences and profile (scope preferences)."
  - name: devices
    description: "The subscriber's own push devices (scope devices:write)."
paths:
  "/v1/subscriber/token":
    post:
      operationId: exchangeSubscriberToken
      tags:
        - token
      summary: Exchange an Access token for a subscriber token
      description: "The only way to obtain a subscriber token. The client sends its Access access token (RFC 8693); the tenant backend needs no code. The subscriber is matched by the Access pairwise sub for this tenant, which is the subscriber's external_id; an unknown sub creates an inbox-only subscriber. Tenant and environment come from the Access client registration the token was issued to, never from the request. When Access cannot be reached no new token is issued and the error is visible; an Access token is never accepted directly for inbox, preferences or realtime. Errors are problem details that also carry the OAuth error member. This OAuth endpoint takes no Idempotency-Key and its response is never stored: issuing a token has no side effect beyond the external_id keyed subscriber upsert."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
      requestBody:
        required: true
        content:
          "application/x-www-form-urlencoded":
            schema:
              "$ref": "#/components/schemas/TokenExchangeRequest"
      security: []
      responses:
        "200":
          description: Subscriber token issued.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Cache-Control:
              description: no-store
              schema:
                type: string
                const: no-store
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TokenExchangeResponse"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "413":
          "$ref": "./components/responses.yaml#/PayloadTooLarge"
        "415":
          "$ref": "./components/responses.yaml#/UnsupportedMediaType"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
        "504":
          "$ref": "./components/responses.yaml#/GatewayTimeout"
      x-relay-errors:
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - malformed_request
        - unsupported_media_type
        - payload_too_large
        - validation_failed
        - unknown_field
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - auth_subscriber_suspended
        - auth_environment_mismatch
        - upstream_timeout
      x-relay-weight: 1
      x-relay-idempotency: none
      x-relay-step-up: false
      x-relay-choice: true
      x-relay-choice-note: "The spec names RFC 8693 token exchange but no path; /v1/subscriber/token is chosen. Creation of an unknown subscriber, the default scope set and the OAuth error member are contract choices."
      x-relay-subscriber-scopes:
        - "inbox:read"
        - "inbox:write"
        - preferences
        - "devices:write"
        - "presence:write"
  "/v1/subscriber/preferences":
    get:
      operationId: getMyPreferences
      tags:
        - preferences
      summary: Get my preferences
      description: "Returns the token subscriber's preferences in the same shape as the server API: one cell for every active category other than system and every channel, the channel, workflow and scope key switches and the profile."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
      security:
        - subscriber_bearer:
            - preferences
      responses:
        "200":
          description: The subscriber's preferences.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/SubscriberPreferences"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_missing_credentials
        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_insufficient_scope
        - auth_tenant_suspended
        - auth_subscriber_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
      x-relay-scopes:
        - preferences
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
      x-relay-choice: true
      x-relay-choice-note: "Path chosen by the contract; the subscriber comes from the token, never from the request."
    patch:
      operationId: updateMyPreferences
      tags:
        - preferences
      summary: Update my preferences
      description: "The subscriber writes any preference value (opt_in, opt_out or unset) and its profile: quiet hours, weekly schedule, do not disturb, whether quiet hours apply to email, and digest choices. Closing the last open channel of a locked or security category is 422 preference_last_channel. A digest choice for a category that is neither social nor a digest-allowed operational category is 422 preference_digest_not_allowed. The writes are applied together or not at all; the response is the read shape."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./components/schemas.yaml#/MyPreferencesPatch"
      security:
        - subscriber_bearer:
            - preferences
      responses:
        "200":
          description: Updated.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/SubscriberPreferences"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "413":
          "$ref": "./components/responses.yaml#/PayloadTooLarge"
        "415":
          "$ref": "./components/responses.yaml#/UnsupportedMediaType"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_missing_credentials
        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_insufficient_scope
        - auth_tenant_suspended
        - auth_subscriber_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - malformed_request
        - unsupported_media_type
        - payload_too_large
        - validation_failed
        - unknown_field
        - category_not_found
        - preference_last_channel
        - preference_digest_not_allowed
      x-relay-scopes:
        - preferences
      x-relay-weight: 1
      x-relay-idempotency: required
      x-relay-step-up: false
      x-relay-choice: true
      x-relay-choice-note: "Path, the combined body of preference writes and profile, and applying them atomically are chosen by the contract."
  "/v1/subscriber/devices":
    post:
      operationId: registerMyDevice
      tags:
        - devices
      summary: Register my device
      description: "Registers or refreshes a push token for the token's subscriber. 201 for a new device, including a token moved from another subscriber (device.reassigned); 200 when the subscriber already had the token. The token is never returned. A Web Push or UnifiedPush token is the subscription endpoint and needs its keys; an APNs token needs apns_environment. The subscriber comes from the token; a token can never register a device for another subscriber."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./components/schemas.yaml#/DeviceRegistration"
      security:
        - subscriber_bearer:
            - "devices:write"
      responses:
        "200":
          description: The subscriber already had this token; it was refreshed.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/Device"
        "201":
          description: Registered.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/Device"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "404":
          "$ref": "./components/responses.yaml#/NotFound"
        "413":
          "$ref": "./components/responses.yaml#/PayloadTooLarge"
        "415":
          "$ref": "./components/responses.yaml#/UnsupportedMediaType"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_missing_credentials
        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_insufficient_scope
        - auth_tenant_suspended
        - auth_subscriber_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - malformed_request
        - unsupported_media_type
        - payload_too_large
        - validation_failed
        - unknown_field
        - subscriber_not_found
      x-relay-scopes:
        - "devices:write"
      x-relay-weight: 1
      x-relay-idempotency: required
      x-relay-step-up: false
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "Path chosen by the contract; the subscriber comes from the token, never from the request."
  "/v1/subscriber/devices/{device_id}":
    delete:
      operationId: deleteMyDevice
      tags:
        - devices
      summary: Remove my device
      description: "Disables one of the token subscriber's own devices with logout and emits device.unregistered; the SDK calls it when the user signs out. The row is kept (soft delete) and preferences are untouched. Another subscriber's device is device_not_found."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
        - "$ref": "./components/parameters.yaml#/DeviceId"
      security:
        - subscriber_bearer:
            - "devices:write"
      responses:
        "200":
          description: The device, disabled.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/Device"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "404":
          "$ref": "./components/responses.yaml#/NotFound"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_missing_credentials
        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_insufficient_scope
        - auth_tenant_suspended
        - auth_subscriber_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - device_not_found
      x-relay-scopes:
        - "devices:write"
      x-relay-weight: 1
      x-relay-idempotency: required
      x-relay-step-up: false
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "Path and the logout reason are chosen by the contract."
components:
  securitySchemes:
    subscriber_bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Relay subscriber token from the token exchange. Scopes: inbox:read, inbox:write, preferences, devices:write, presence:write. Access tokens are never accepted here."
  schemas:
    TokenExchangeRequest:
      type: object
      description: RFC 8693 token exchange request.
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          type: string
          const: "urn:ietf:params:oauth:grant-type:token-exchange"
        subject_token:
          type: string
          description: "The end user's Access access token."
          minLength: 1
          maxLength: 8192
        subject_token_type:
          type: string
          const: "urn:ietf:params:oauth:token-type:access_token"
        requested_token_type:
          type: string
          const: "urn:suiss:relay:token-type:subscriber"
          x-relay-choice: true
          x-relay-choice-note: Token type URI chosen by the contract.
        scope:
          type: string
          description: "Space-separated subset of inbox:read inbox:write preferences devices:write presence:write. Default: inbox:read inbox:write preferences."
          pattern: "^(inbox:read|inbox:write|preferences|devices:write|presence:write)( (inbox:read|inbox:write|preferences|devices:write|presence:write))*$"
      additionalProperties: false
    TokenExchangeResponse:
      type: object
      description: RFC 8693 token exchange response. The tenant identifier is never written into a field the client can see.
      required:
        - access_token
        - issued_token_type
        - token_type
        - expires_in
        - scope
        - subscriber_id
        - environment
      properties:
        access_token:
          type: string
          description: "Relay subscriber token: asymmetrically signed, audience is the Relay inbox and realtime surface, carries the environment and the allowed realtime streams."
        issued_token_type:
          type: string
          const: "urn:suiss:relay:token-type:subscriber"
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 900
          description: "Lifetime in seconds; 15 minutes by default. SDKs renew before expiry."
        scope:
          type: string
        subscriber_id:
          "$ref": "./components/schemas.yaml#/Id_sub"
          x-relay-choice: true
        environment:
          "$ref": "./components/schemas.yaml#/Environment"
      additionalProperties: false
x-relay-family:
  - client
x-relay-subscriber-scopes:
  - "inbox:read"
  - "inbox:write"
  - preferences
  - "devices:write"
  - "presence:write"
x-relay-error-catalog: "../errors.yaml"
