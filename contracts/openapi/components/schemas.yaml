Id_cns:
  type: string
  description: "Consent copy record identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^cns_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - cns_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_sup:
  type: string
  description: "Suppression identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^sup_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - sup_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_sds:
  type: string
  description: "SMS destination stop identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^sds_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - sds_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_dev:
  type: string
  description: "Device identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^dev_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - dev_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_pva:
  type: string
  description: "Provider account identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^pva_[0-7][0-9a-hjkmnp-tv-z]{25}$"
Id_chi:
  type: string
  description: "Channel identity identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^chi_[0-7][0-9a-hjkmnp-tv-z]{25}$"
Id_mtg:
  type: string
  description: "Messaging conversation identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^mtg_[0-7][0-9a-hjkmnp-tv-z]{25}$"
RecipientId:
  description: "Relay identifier of a recipient: sub_ for a subscriber, agt_ for an agent."
  oneOf:
    - "$ref": "#/Id_sub"
    - "$ref": "#/Id_agt"
Timestamp:
  type: string
  description: RFC 3339 timestamp in UTC.
  format: date-time
  examples:
    - "2026-11-01T09:30:00Z"
Duration:
  type: string
  description: ISO 8601 duration.
  pattern: "^P(?!$)([0-9]+Y)?([0-9]+M)?([0-9]+W)?([0-9]+D)?(T(?=[0-9])([0-9]+H)?([0-9]+M)?([0-9]+S)?)?$"
  examples:
    - PT30M
    - P1D
ApiVersion:
  type: string
  description: Dated API version.
  format: date
  pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  examples:
    - "2026-11-01"
Locale:
  type: string
  description: BCP 47 language tag.
  pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  maxLength: 35
  examples:
    - tr-TR
TimeZone:
  type: string
  description: Canonical IANA time zone identifier. Etc/GMT offsets and UTC or GMT offsets are rejected.
  pattern: "^[A-Za-z]+(/[A-Za-z0-9_+-]+)*$"
  maxLength: 64
  examples:
    - Europe/Istanbul
E164:
  type: string
  description: Phone number in E.164 format.
  pattern: "^\\+[1-9][0-9]{6,14}$"
  examples:
    - "+905321234567"
Email:
  type: string
  description: "Email address; normalised to lowercase before storage."
  format: email
  maxLength: 254
ExternalId:
  type: string
  description: "The tenant's own identifier for a subscriber: printable ASCII without spaces, 1 to 256 characters. Must not be personal data such as an email address."
  pattern: "^[\\x21-\\x7E]{1,256}$"
  examples:
    - user-4821
  x-relay-choice: true
  x-relay-choice-note: "Character set and length are chosen by the contract; the spec does not bound external ids."
WorkflowKey:
  type: string
  description: Readable workflow slug.
  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  minLength: 1
  maxLength: 100
  examples:
    - siparis-kargolandi
  x-relay-choice: true
  x-relay-choice-note: Slug alphabet and maximum length are chosen by the contract.
Environment:
  type: string
  enum:
    - live
    - test
  description: Data plane. It always comes from the credential, never from a request body.
MessageClass:
  type: string
  enum:
    - security
    - transactional
    - operational
    - social
    - marketing
    - system
    - action_required
  description: Fixed message class. It is assigned at accept time and never changes.
Channel:
  type: string
  enum:
    - push
    - web_push
    - email
    - sms
    - voice
    - whatsapp
    - slack
    - teams
    - telegram
    - discord
    - in_app
    - webhook
Priority:
  type: string
  enum:
    - low
    - normal
    - high
  description: "Fine tuning within the class lane; clamped to the class ceiling."
SecuritySubtype:
  type: string
  enum:
    - otp_oob
    - email_verification
OnExpire:
  type: string
  enum:
    - drop
    - inbox_only
SendMode:
  type: string
  enum:
    - live
    - shadow
    - dry_run
    - "off"
RuleId:
  type: string
  description: Identifier from the single rule dictionary.
  pattern: "^[a-z][a-z0-9_]*([.:][A-Za-z0-9_-]+)*$"
  maxLength: 128
EventName:
  type: string
  description: Event name in noun.verb_past form.
  pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
  maxLength: 128
ScopeName:
  type: string
  enum:
    - publish
    - read
    - subscribers
    - config
    - kill_switch
Metadata:
  type: object
  description: "Opaque key-value pairs returned in events and webhooks. At most 16 keys; values are strings of at most 512 characters. Do not put personal data here."
  maxProperties: 16
  propertyNames:
    pattern: "^[a-z][a-z0-9_]{0,63}$"
  additionalProperties:
    type: string
    maxLength: 512
Money:
  type: object
  description: Amount of money. Amounts are strings, never JSON numbers.
  required:
    - amount
    - currency
  properties:
    amount:
      type: string
      description: Decimal amount as a string.
      pattern: "^-?[0-9]{1,18}(\\.[0-9]{1,6})?$"
      examples:
        - "1234.50"
    currency:
      type: string
      description: ISO 4217 currency code.
      pattern: "^[A-Z]{3}$"
      examples:
        - TRY
  additionalProperties: false
Cursor:
  type: string
  description: Opaque, signed pagination cursor bound to the tenant and environment.
  minLength: 1
  maxLength: 512
ListEnvelope:
  type: object
  description: "Cursor-paginated list. limit is 1 to 100 (default 50); related objects are never expanded in lists."
  required:
    - object
    - data
    - has_more
    - next_cursor
  properties:
    object:
      type: string
      const: list
    data:
      type: array
      description: "Items of the list; the concrete list schema narrows this."
      items: {}
    has_more:
      type: boolean
    next_cursor:
      oneOf:
        - "$ref": "#/Cursor"
        - type: "null"
    previous_cursor:
      oneOf:
        - "$ref": "#/Cursor"
        - type: "null"
      x-relay-choice: true
      x-relay-choice-note: "The spec defines ending_before but returns only next_cursor; previous_cursor makes ending_before usable."
  additionalProperties: false
Warning:
  type: object
  description: Non-fatal notice about how the request was applied.
  required:
    - code
  properties:
    code:
      type: string
      enum:
        - priority_clamped
        - send_at_ignored
        - timing_ignored
      description: "Warning code. send_at_ignored: the security class is never scheduled; the send_at of a security request is not applied and the notification is sent at once (WF-40, WF-41). timing_ignored: the security class (OTP included) never waits for a break; timing next_break is not applied (WF-56)."
      x-relay-choice: true
      x-relay-choice-note: "WF-41 passes the security class straight through scheduling without naming how the sender learns it; the request is accepted and a send_at_ignored warning is returned."
    pointer:
      type: string
      description: JSON Pointer of the field the warning is about.
    detail:
      type: string
  additionalProperties: false
CountryCode:
  type: string
  description: "The profile country of a recipient as an ISO 3166-1 alpha-2 code. With the country calling code of the phone number it selects the rows of the compliance table and the legal send window; when the two name different countries the more restrictive row applies."
  pattern: "^[A-Z]{2}$"
  examples:
    - TR
LegalType:
  type: string
  enum:
    - individual
    - merchant
RecipientObject:
  type: object
  description: Recipient object. With contact details it creates or updates the subscriber (explicit upsert). With only id it creates an inbox-only subscriber.
  required:
    - id
  properties:
    id:
      "$ref": "#/ExternalId"
    email:
      "$ref": "#/Email"
    phone:
      "$ref": "#/E164"
    name:
      type: string
      description: Display name used in templates.
      maxLength: 200
      x-relay-choice: true
      x-relay-choice-note: "Profile field chosen by the contract; the spec lists recipient fields as id, email, phone, locale, timezone and more."
    locale:
      "$ref": "#/Locale"
    timezone:
      "$ref": "#/TimeZone"
    legal_type:
      "$ref": "#/LegalType"
    country:
      "$ref": "#/CountryCode"
    attributes:
      type: object
      description: Recipient attributes available to templates and conditions. Values are strings, numbers or booleans.
      maxProperties: 64
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,63}$"
      additionalProperties:
        type:
          - string
          - number
          - boolean
      x-relay-choice: true
      x-relay-choice-note: "The spec mentions declared recipient attributes; shape and bounds are chosen by the contract."
  additionalProperties: false
TopicTarget:
  type: object
  description: "Topic target (WF-51, WF-52). The event reaches the active subscribers of the topic and, for a child topic, of its active parent, frozen when the event is accepted; a subscriber reached through several topics or also named directly gets one notification. The topic matches by key only, with no wildcard or context condition (WF-53). An unknown topic is recipient_not_found and an archived one recipient_invalid, both with the target's pointer; an event whose topics reach no subscriber is still accepted and its frozen audience is recorded with rule audience.no_subscribers. All recipients together are at most x-relay-limits event.max_recipients (422 audience_too_large); a larger audience is a campaign."
  required:
    - topic
  properties:
    topic:
      "$ref": "#/TopicKey"
  additionalProperties: false
TopicKey:
  type: string
  description: "The tenant's key of a topic, such as project:42 or project:42.task:7."
  pattern: "^[a-z0-9][a-z0-9_.:-]{0,127}$"
  examples:
    - "project:42"
  x-relay-choice: true
  x-relay-choice-note: "Character set and length are chosen by the contract."
RecipientTarget:
