name: sdk-dotnet

on:
  pull_request:
    paths:
      - "sdks/dotnet/**"
      - "contracts/**"
      - "conformance/sdk/**"
      - "conformance/webhooks/**"
      - ".github/workflows/sdk-dotnet.yml"
  push:
    branches: [main]
    paths:
      - "sdks/dotnet/**"
      - "contracts/**"
      - "conformance/sdk/**"
      - "conformance/webhooks/**"
      - ".github/workflows/sdk-dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-dotnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: sdks/dotnet/global.json
      - id: scope
        name: drift check scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          own=true
          BASE="$BEFORE"
          if [ "$EVENT" = "pull_request" ]; then
            BASE=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^1)
          fi
          if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            if git -C "$GITHUB_WORKSPACE" diff --quiet "$BASE" HEAD -- sdks/dotnet .github/workflows/sdk-dotnet.yml; then
              own=false
            fi
          fi
          echo "own=$own" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.own == 'true'
        run: dotnet restore Esuiss.Relay.slnx --force-evaluate
      - if: steps.scope.outputs.own == 'true'
        run: dotnet run --project generator/Esuiss.Relay.Generator --no-restore -- ../../contracts/openapi/server.yaml ../../contracts/errors.yaml src/Esuiss.Relay/Generated
      - if: steps.scope.outputs.own == 'true'
        run: dotnet format Esuiss.Relay.slnx --no-restore
      - run: dotnet restore Esuiss.Relay.slnx --locked-mode
      - run: dotnet build Esuiss.Relay.slnx --no-restore --configuration Release
      - run: dotnet test Esuiss.Relay.slnx --no-build --configuration Release
      - run: dotnet pack src/Esuiss.Relay --no-build --configuration Release --output "$RUNNER_TEMP/packages"
      - id: drift
        if: ${{ !cancelled() && steps.scope.outputs.own == 'true' }}
        run: |
          git add --intent-to-add .
          if git diff --quiet -- .; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            git diff -- . > "$RUNNER_TEMP/sdk-dotnet.patch"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ !cancelled() && steps.drift.outputs.drift == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-dotnet-patch
          path: ${{ runner.temp }}/sdk-dotnet.patch
      - if: ${{ !cancelled() && steps.drift.outputs.drift == 'true' }}
        run: |
          git diff --stat -- .
          exit 1
