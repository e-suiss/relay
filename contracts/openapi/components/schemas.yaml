    cancellation_key:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "^[\\x21-\\x7E]+$"
    recipients:
      type: array
      description: Only these recipients.
      items:
        "$ref": "#/ExternalId"
      minItems: 1
      maxItems: 100
      uniqueItems: true
    channels:
      type: array
      description: Only these channels.
      items:
        "$ref": "#/Channel"
      minItems: 1
      uniqueItems: true
    reason:
      type: string
      maxLength: 500
  additionalProperties: false
ChannelReachability:
  type: object
  required:
    - reachable
    - reason
  properties:
    reachable:
      type: boolean
    reason:
      oneOf:
        - type: string
          enum:
