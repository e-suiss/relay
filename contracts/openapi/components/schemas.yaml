    - id
    - key
    - name
    - managed_by
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: workflow
    id:
      "$ref": "#/Id_wfl"
    key:
      "$ref": "#/WorkflowKey"
    name:
      type: string
      maxLength: 200
    managed_by:
      type: string
      enum:
        - panel
        - code
      description: "Single manager of the workflow (WF-4): a code-managed workflow's structure is not changed from the panel, which edits only the definition's controls fields; changing the manager is an explicit, audited action (POST /v1/workflows/{workflow_key}/manager)."
    published_version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    draft:
      oneOf:
        - "$ref": "#/WorkflowDefinition"
        - type: "null"
    draft_version_id:
      oneOf:
        - "$ref": "#/Id_wfv"
        - type: "null"
    last_publication:
      oneOf:
        - "$ref": "#/Publication"
        - type: "null"
    state:
      type: string
      enum:
        - active
        - archived
    version:
      type: integer
      minimum: 1
      description: "Optimistic concurrency version; the ETag carries it."
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WorkflowList:
  allOf:
