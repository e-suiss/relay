  "/v1/subscriber/devices/status":
    get:
      operationId: getMyDeviceStatus
      tags:
        - presence
      summary: Read the status of my devices
      description: "The device status snapshot of the token subscriber's own clients (IN-47): every device that is not disabled, most recently seen first, with each signal of dictionary v1 as true, false or unknown. A signal is unknown when it expired, was never written or the short-lived store cannot be read. The status is held only for its time to live and has no history."
