      type: string
      description: "Business key; the same key opens no new notification for the same recipient."
      minLength: 1
      maxLength: 512
    channels:
      type: array
      description: "Narrows the workflow's steps to these channels; never adds steps."
      items:
        "$ref": "#/Channel"
      minItems: 1
      uniqueItems: true
    overrides:
      "$ref": "#/Overrides"
    send_at:
      description: Future send time, at most 90 days ahead.
      "$ref": "#/Timestamp"
    expires_at:
      description: "After this instant nothing is sent; the notification ends expired. Required for security subtypes."
      "$ref": "#/Timestamp"
    priority:
      "$ref": "#/Priority"
    security_subtype:
      "$ref": "#/SecuritySubtype"
    security_signals:
      description: "Only with security_subtype otp_oob: the sender's own signals as router inputs."
      "$ref": "#/SecuritySignals"
    on_expire:
      "$ref": "#/OnExpire"
    timing_precision:
      "$ref": "#/TimingPrecision"
    timing:
      "$ref": "#/Timing"
    max_defer:
      "$ref": "#/MaxDefer"
