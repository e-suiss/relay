    QuotaPolicy:
      type: object
      description: Sending quota of the tenant and environment. Without a policy no quota applies.
      required:
        - object
        - period
        - limit
        - class_caps
        - security_reserve_bp
        - used
        - period_start
        - version
        - updated_at
      properties:
        object:
          type: string
          const: quota_policy
        period:
          type: string
          enum:
            - day
            - month
        limit:
          type: integer
          minimum: 0
          description: Notifications (one per recipient) accepted per period across all classes.
        class_caps:
          type: object
          description: "Optional per-class share of the limit in basis points (for example marketing 8000 = 80 percent)."
          propertyNames:
            "$ref": "./components/schemas.yaml#/MessageClass"
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 10000
        security_reserve_bp:
          type: integer
          minimum: 0
          maximum: 10000
          description: "Extra share open only to the security class once the limit is reached; default 1000 (10 percent)."
        used:
          type: integer
          minimum: 0
        period_start:
          "$ref": "./components/schemas.yaml#/Timestamp"
        version:
          type: integer
          minimum: 1
        updated_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    QuotaPolicyList:
      type: object
      required:
        - object
        - data
        - has_more
        - next_cursor
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            "$ref": "#/components/schemas/QuotaPolicy"
        has_more:
          type: boolean
          const: false
        next_cursor:
          type: "null"
      additionalProperties: false
    QuotaPolicyWrite:
      type: object
      description: "limit null removes the policy of this period. Lowering the limit, a class cap or the reserve is immediate and open to the tenant admin; raising any of them, dropping a class cap, removing the policy or creating the first policy of a period needs the installation operator with step-up."
      required:
        - period
        - reason
      properties:
        period:
          type: string
          enum:
            - day
            - month
        limit:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        class_caps:
          type: object
          propertyNames:
            "$ref": "./components/schemas.yaml#/MessageClass"
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 10000
        security_reserve_bp:
          type: integer
          minimum: 0
          maximum: 10000
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
