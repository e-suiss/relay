Id_ten:
  type: string
  description: "Tenant identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^ten_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - ten_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_stn:
  type: string
  description: "Subtenant identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^stn_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - stn_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_sub:
  type: string
  description: "Subscriber (recipient of kind subscriber) identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^sub_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - sub_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_agt:
  type: string
  description: "Agent recipient (recipient of kind agent) identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^agt_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - agt_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_rcp:
  type: string
  description: "Recipient of either kind (resolves to the same table as sub_ and agt_) identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^rcp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - rcp_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_ntf:
  type: string
  description: "Notification identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^ntf_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - ntf_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_dlv:
  type: string
  description: "Delivery identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^dlv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - dlv_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_att:
  type: string
  description: "Delivery attempt identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^att_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - att_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_dle:
  type: string
  description: "Delivery ledger event identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^dle_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - dle_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_whr:
  type: string
  description: "Inbound provider webhook receipt identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^whr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - whr_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_oev:
  type: string
  description: "Outgoing event identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^oev_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - oev_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_aud:
  type: string
  description: "Audit record identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^aud_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - aud_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_ckp:
  type: string
  description: "Audit checkpoint identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^ckp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - ckp_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_dsv:
  type: string
  description: "Dataset version identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^dsv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - dsv_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_usg:
  type: string
  description: "Usage record identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^usg_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - usg_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_sec:
  type: string
  description: "Secret reference identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^sec_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - sec_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_hld:
  type: string
  description: "Legal hold identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^hld_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - hld_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_ers:
  type: string
  description: "Erasure record identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^ers_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - ers_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_dlq:
  type: string
  description: "Dead letter identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^dlq_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - dlq_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_ksw:
  type: string
  description: "Kill switch identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^ksw_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - ksw_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_fan:
  type: string
  description: "Fan-out or batch identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^fan_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - fan_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_mbx:
  type: string
  description: "Mailbox identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^mbx_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - mbx_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_mbr:
  type: string
  description: "Mailbox record identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^mbr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - mbr_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_wp:
  type: string
  description: "Waitpoint identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^wp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - wp_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_wpr:
  type: string
  description: "Waitpoint response identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^wpr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - wpr_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_evt:
  type: string
  description: "Event identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^evt_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - evt_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_wfl:
  type: string
  description: "Workflow identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^wfl_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - wfl_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_wfv:
  type: string
  description: "Workflow version identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^wfv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - wfv_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_cli:
  type: string
  description: "API client (Relay-side trace of an Access client) identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^cli_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - cli_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_opr:
  type: string
  description: "Operator identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^opr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - opr_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_rla:
  type: string
  description: "Role assignment identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^rla_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - rla_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_cem:
  type: string
  description: "CloudEvents type mapping identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^cem_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - cem_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_dlg:
  type: string
  description: "Support access delegation identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^dlg_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - dlg_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_cnl:
  type: string
  description: "Cancellation (tombstone) identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^cnl_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - cnl_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_adr:
  type: string
  description: "Subscriber address identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^adr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - adr_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_oss:
  type: string
  description: "Operator session identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^oss_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - oss_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_tsp:
  type: string
  description: "Tenant or subtenant suspension identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^tsp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - tsp_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_sdr:
  type: string
  description: "Subscriber deletion request identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^sdr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - sdr_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_tpl:
  type: string
  description: "Template identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^tpl_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - tpl_01j9zq3k4m5n6p7q8r9s0t1v2w
RecipientId:
  description: "Relay identifier of a recipient: sub_ for a subscriber, agt_ for an agent."
  oneOf:
    - "$ref": "#/Id_sub"
    - "$ref": "#/Id_agt"
Timestamp:
  type: string
  description: RFC 3339 timestamp in UTC.
  format: date-time
  examples:
    - "2026-11-01T09:30:00Z"
Duration:
  type: string
  description: ISO 8601 duration.
  pattern: "^P(?!$)([0-9]+Y)?([0-9]+M)?([0-9]+W)?([0-9]+D)?(T(?=[0-9])([0-9]+H)?([0-9]+M)?([0-9]+S)?)?$"
  examples:
    - PT30M
    - P1D
ApiVersion:
  type: string
  description: Dated API version.
  format: date
  pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  examples:
    - "2026-11-01"
Locale:
  type: string
  description: BCP 47 language tag.
  pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  maxLength: 35
  examples:
    - tr-TR
TimeZone:
  type: string
  description: Canonical IANA time zone identifier. Etc/GMT offsets and UTC or GMT offsets are rejected.
  pattern: "^[A-Za-z]+(/[A-Za-z0-9_+-]+)*$"
  maxLength: 64
  examples:
    - Europe/Istanbul
E164:
  type: string
  description: Phone number in E.164 format.
  pattern: "^\\+[1-9][0-9]{6,14}$"
  examples:
    - "+905321234567"
Email:
  type: string
  description: "Email address; normalised to lowercase before storage."
  format: email
  maxLength: 254
ExternalId:
  type: string
  description: "The tenant's own identifier for a subscriber: printable ASCII without spaces, 1 to 256 characters. Must not be personal data such as an email address."
  pattern: "^[\\x21-\\x7E]{1,256}$"
  examples:
    - user-4821
  x-relay-choice: true
  x-relay-choice-note: "Character set and length are chosen by the contract; the spec does not bound external ids."
WorkflowKey:
  type: string
  description: Readable workflow slug.
  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  minLength: 1
  maxLength: 100
  examples:
    - siparis-kargolandi
  x-relay-choice: true
  x-relay-choice-note: Slug alphabet and maximum length are chosen by the contract.
Environment:
  type: string
  enum:
    - live
    - test
  description: Data plane. It always comes from the credential, never from a request body.
MessageClass:
  type: string
  enum:
    - security
    - transactional
    - operational
    - social
    - marketing
    - system
    - action_required
  description: Fixed message class. It is assigned at accept time and never changes.
Channel:
  type: string
  enum:
    - push
    - web_push
    - email
    - sms
    - voice
    - whatsapp
    - slack
    - teams
    - telegram
    - discord
    - in_app
    - webhook
Priority:
  type: string
  enum:
    - low
    - normal
    - high
  description: "Fine tuning within the class lane; clamped to the class ceiling."
SecuritySubtype:
  type: string
  enum:
    - otp_oob
    - email_verification
OnExpire:
  type: string
  enum:
    - drop
    - inbox_only
SendMode:
  type: string
  enum:
    - live
    - shadow
    - dry_run
    - "off"
RuleId:
  type: string
  description: Identifier from the single rule dictionary.
  pattern: "^[a-z][a-z0-9_]*([.:][A-Za-z0-9_-]+)*$"
  maxLength: 128
EventName:
  type: string
  description: Event name in noun.verb_past form.
  pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
  maxLength: 128
ScopeName:
  type: string
  enum:
    - publish
    - read
    - subscribers
    - config
    - kill_switch
Metadata:
  type: object
  description: "Opaque key-value pairs returned in events and webhooks. At most 16 keys; values are strings of at most 512 characters. Do not put personal data here."
  maxProperties: 16
  propertyNames:
    pattern: "^[a-z][a-z0-9_]{0,63}$"
  additionalProperties:
    type: string
    maxLength: 512
Money:
  type: object
  description: Amount of money. Amounts are strings, never JSON numbers.
  required:
    - amount
    - currency
  properties:
    amount:
      type: string
      description: Decimal amount as a string.
      pattern: "^-?[0-9]{1,18}(\\.[0-9]{1,6})?$"
      examples:
        - "1234.50"
    currency:
      type: string
      description: ISO 4217 currency code.
      pattern: "^[A-Z]{3}$"
      examples:
        - TRY
  additionalProperties: false
Cursor:
  type: string
  description: Opaque, signed pagination cursor bound to the tenant and environment.
  minLength: 1
  maxLength: 512
ListEnvelope:
  type: object
  description: "Cursor-paginated list. limit is 1 to 100 (default 50); related objects are never expanded in lists."
  required:
    - object
    - data
    - has_more
    - next_cursor
  properties:
    object:
      type: string
      const: list
    data:
      type: array
      description: "Items of the list; the concrete list schema narrows this."
      items: {}
    has_more:
      type: boolean
    next_cursor:
      oneOf:
        - "$ref": "#/Cursor"
        - type: "null"
    previous_cursor:
      oneOf:
        - "$ref": "#/Cursor"
        - type: "null"
      x-relay-choice: true
      x-relay-choice-note: "The spec defines ending_before but returns only next_cursor; previous_cursor makes ending_before usable."
  additionalProperties: false
Warning:
  type: object
  description: Non-fatal notice about how the request was applied.
  required:
    - code
  properties:
    code:
      type: string
      enum:
        - priority_clamped
      description: Warning code.
    pointer:
      type: string
      description: JSON Pointer of the field the warning is about.
    detail:
      type: string
  additionalProperties: false
LegalType:
  type: string
  enum:
    - individual
    - merchant
RecipientObject:
  type: object
  description: Recipient object. With contact details it creates or updates the subscriber (explicit upsert). With only id it creates an inbox-only subscriber.
  required:
    - id
  properties:
    id:
      "$ref": "#/ExternalId"
    email:
      "$ref": "#/Email"
    phone:
      "$ref": "#/E164"
    name:
      type: string
      description: Display name used in templates.
      maxLength: 200
      x-relay-choice: true
      x-relay-choice-note: "Profile field chosen by the contract; the spec lists recipient fields as id, email, phone, locale, timezone and more."
    locale:
      "$ref": "#/Locale"
    timezone:
      "$ref": "#/TimeZone"
    legal_type:
      "$ref": "#/LegalType"
    attributes:
      type: object
      description: Recipient attributes available to templates and conditions. Values are strings, numbers or booleans.
      maxProperties: 64
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,63}$"
      additionalProperties:
        type:
          - string
          - number
          - boolean
      x-relay-choice: true
      x-relay-choice-note: "The spec mentions declared recipient attributes; shape and bounds are chosen by the contract."
  additionalProperties: false
TopicTarget:
  type: object
  description: "Topic target. Topics are introduced in a later stage; until then a topic target is rejected with validation_failed (unsupported_value)."
  required:
    - topic
  properties:
    topic:
      type: string
      description: Topic key.
      pattern: "^[a-z0-9][a-z0-9_.:-]{0,127}$"
  additionalProperties: false
RecipientTarget:
  description: "A plain string is an identity-only reference: the subscriber must exist or the request fails with recipient_not_found. An object upserts. A topic object targets a topic."
  oneOf:
    - "$ref": "#/ExternalId"
    - "$ref": "#/RecipientObject"
    - "$ref": "#/TopicTarget"
Actor:
  type: object
  description: Who caused the event.
  required:
    - type
  properties:
    type:
      type: string
      enum:
        - human
        - system
        - agent
      description: Sender type, independent of the message class.
    id:
      "$ref": "#/ExternalId"
    name:
      type: string
      maxLength: 200
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "The spec defines actor as human, system or agent; the object shape is chosen by the contract."
ChannelOverride:
  type: object
  description: Override for one channel.
  properties:
    provider:
      type: string
      description: Narrow to one verified provider of this channel.
      maxLength: 64
  additionalProperties: false
EmailOverride:
  type: object
  description: "Email override; from must be on a verified domain or the request fails with channel_not_configured."
  properties:
    provider:
      type: string
      maxLength: 64
    from:
      "$ref": "#/Email"
  additionalProperties: false
RawOverride:
  type: object
  description: Override for channels with a provider-specific raw block (push and WhatsApp).
  properties:
    provider:
      type: string
      maxLength: 64
    raw:
      type: object
      description: Provider-specific block. Policy fields cannot be set here (policy_field_not_overridable).
  additionalProperties: false
Overrides:
  type: object
  description: "Channel-keyed overrides; precedence is request, step, workflow, tenant default. Later stages add fields; unknown fields are rejected."
  properties:
    email:
      "$ref": "#/EmailOverride"
    sms:
      "$ref": "#/ChannelOverride"
    voice:
      "$ref": "#/ChannelOverride"
    push:
      "$ref": "#/RawOverride"
    web_push:
      "$ref": "#/RawOverride"
    whatsapp:
      "$ref": "#/RawOverride"
    in_app:
      "$ref": "#/ChannelOverride"
    webhook:
      "$ref": "#/ChannelOverride"
  additionalProperties: false
EventRequest:
  type: object
  description: Native event request.
  required:
    - workflow
    - to
  properties:
    workflow:
      "$ref": "#/WorkflowKey"
    to:
      type: array
      description: Recipients, 1 to 100.
      items:
        "$ref": "#/RecipientTarget"
      minItems: 1
      maxItems: 100
    actor:
      "$ref": "#/Actor"
    tenant:
      description: "Subtenant within the API client's tenant."
      "$ref": "#/Id_stn"
    data:
      type: object
      description: Event data, at most 256 kB, validated against the event schema of the published workflow version. Do not send preformatted values.
    dedup_key:
      type: string
      description: "Business key; the same key opens no new notification for the same recipient."
      minLength: 1
      maxLength: 512
    channels:
      type: array
      description: "Narrows the workflow's steps to these channels; never adds steps."
      items:
        "$ref": "#/Channel"
      minItems: 1
      uniqueItems: true
    overrides:
      "$ref": "#/Overrides"
    send_at:
      description: Future send time, at most 90 days ahead.
      "$ref": "#/Timestamp"
    expires_at:
      description: "After this instant nothing is sent; the notification ends expired. Required for security subtypes."
      "$ref": "#/Timestamp"
    priority:
      "$ref": "#/Priority"
    security_subtype:
      "$ref": "#/SecuritySubtype"
    on_expire:
      "$ref": "#/OnExpire"
    cancellation_key:
      type: string
      description: "Optional cancellation key; need not be unique."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x21-\\x7E]+$"
    retention:
      type: string
      enum:
        - none
      description: "Do not store rendered content (not for the security class; rejected together with in_app)."
    metadata:
      "$ref": "#/Metadata"
    send_mode:
      "$ref": "#/SendMode"
      description: "Explicit send mode for this request. Accepted only in the test environment; a live client gets auth_environment_mismatch."
