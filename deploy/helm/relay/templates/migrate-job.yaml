apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        {{- include "relay.bootstrap-container" (dict "root" . "name" "bootstrap") | nindent 8 }}
        - name: migrate
          image: {{ include "relay.image" . }}
          args: ["eval", "Relay.Release.migrate()"]
          env:
            - name: DATABASE_URL
              value: {{ required "database.migratorUrl is required" .Values.database.migratorUrl | quote }}
            - name: DATABASE_PASSWORD_FILE
              value: /run/secrets/relay-migrator/password
            {{- include "relay.env.shared" . | nindent 12 }}
            - name: RELAY_ROLES
              value: worker
          volumeMounts:
            - name: database-password
              mountPath: /run/secrets/relay
              readOnly: true
            - name: migrator-password
              mountPath: /run/secrets/relay-migrator
              readOnly: true
            - name: audit-store-secret
              mountPath: /run/secrets/relay-audit-store
              readOnly: true
      containers:
        {{- include "relay.bootstrap-container" (dict "root" . "name" "ownership") | nindent 8 }}
      volumes:
        - name: database-password
          secret:
            secretName: {{ .Values.database.passwordSecret }}
            items:
              - key: password
                path: database-password
              - key: queue-password
                path: queue-database-password
              - key: maint-password
                path: maint-database-password
        - name: migrator-password
          secret:
            secretName: {{ .Values.database.migratorPasswordSecret }}
            items:
              - key: password
                path: password
        - name: admin-password
          secret:
            secretName: {{ .Values.database.adminPasswordSecret }}
            items:
              - key: password
                path: password
        - name: audit-store-secret
          secret:
            secretName: {{ $.Values.auditStore.secretAccessKeySecret }}
            items:
              - key: secret-access-key
                path: secret-access-key
