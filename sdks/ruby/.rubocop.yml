plugins:
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - lib/esuiss/relay/generated/**/*
    - vendor/**/*
    - lint/vendor/**/*

Layout/LineLength:
  Max: 120

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 250

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/MethodLength:
  Max: 25

Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/PerceivedComplexity:
  Max: 10

Metrics/BlockLength:
  Exclude:
    - test/**/*

Minitest/MultipleAssertions:
  Max: 12
