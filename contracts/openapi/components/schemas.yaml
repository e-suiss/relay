    timezone:
      oneOf:
        - "$ref": "#/TimeZone"
        - type: "null"
    legal_type:
      oneOf:
        - "$ref": "#/LegalType"
        - type: "null"
    country:
      oneOf:
        - "$ref": "#/CountryCode"
        - type: "null"
    attributes:
      type: object
    channels:
