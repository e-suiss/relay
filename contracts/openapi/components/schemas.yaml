        - type: "null"
      x-relay-choice: true
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
SubscriberCreate:
  type: object
