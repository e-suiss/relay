name: relay-live

services:
  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    container_name: relay-live-kafka
    entrypoint: ["/bin/bash", "/live/kafka.sh"]
    environment:
      NODE_ID: "1"
      ROLES: "broker,controller"
      HOST: kafka.live.relay.test
      KAFKA_HEAP_OPTS: -Xmx512m
    volumes:
      - "./kafka.sh:/live/kafka.sh:ro"
      - "./kafka.properties:/live/kafka.properties:ro"
      - "./run:/live/run:ro"
    networks:
      live:
        ipv4_address: 10.123.45.11
        aliases: [kafka.live.relay.test]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 10s

  kafka-2:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    container_name: relay-live-kafka-2
    entrypoint: ["/bin/bash", "/live/kafka.sh"]
    environment:
      NODE_ID: "2"
      ROLES: broker
      HOST: kafka-2.live.relay.test
      KAFKA_HEAP_OPTS: -Xmx512m
    volumes:
      - "./kafka.sh:/live/kafka.sh:ro"
      - "./kafka.properties:/live/kafka.properties:ro"
      - "./run:/live/run:ro"
    networks:
      live:
        ipv4_address: 10.123.45.21
        aliases: [kafka-2.live.relay.test]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 10s

  kafka-3:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    container_name: relay-live-kafka-3
    entrypoint: ["/bin/bash", "/live/kafka.sh"]
    environment:
      NODE_ID: "3"
      ROLES: broker
      HOST: kafka-3.live.relay.test
      KAFKA_HEAP_OPTS: -Xmx512m
    volumes:
      - "./kafka.sh:/live/kafka.sh:ro"
      - "./kafka.properties:/live/kafka.properties:ro"
      - "./run:/live/run:ro"
    networks:
      live:
        ipv4_address: 10.123.45.22
        aliases: [kafka-3.live.relay.test]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 10s

  nats:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    container_name: relay-live-nats
    command: ["nats-server", "--config", "/live/run/nats.conf"]
    volumes: ["./run:/live/run:ro"]
    networks:
      live:
        ipv4_address: 10.123.45.12
        aliases: [nats.live.relay.test]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  nats-token:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    container_name: relay-live-nats-token
    command: ["nats-server", "--config", "/live/run/nats-token.conf"]
    volumes: ["./run:/live/run:ro"]
    networks:
      live:
        ipv4_address: 10.123.45.13
        aliases: [nats-token.live.relay.test]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  nats-mtls:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    container_name: relay-live-nats-mtls
    command: ["nats-server", "--config", "/live/run/nats-mtls.conf"]
    volumes: ["./run:/live/run:ro"]
    networks:
      live:
        ipv4_address: 10.123.45.17
        aliases: [nats-mtls.live.relay.test]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine@sha256:eb338b3fc8f5c251028c0022ac0de3fe1db2d599d1c6a08b45898f756f248881
    container_name: relay-live-rabbitmq
    volumes:
      - "./rabbitmq.conf:/etc/rabbitmq/conf.d/90-live.conf:ro"
      - "./rabbitmq.plugins:/etc/rabbitmq/enabled_plugins:ro"
      - "./run:/live/run:ro"
    networks:
      live:
        ipv4_address: 10.123.45.14
        aliases: [rabbitmq.live.relay.test]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 10s

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: relay-live-minio
    command: ["minio", "server", "/data", "--address", ":9000", "--certs-dir", "/live/certs"]
    environment:
      MINIO_ROOT_USER: RELAYLIVEACCESSKEY0
      MINIO_ROOT_PASSWORD: relay-live-secret
    volumes: ["./run/minio:/live/certs:ro"]
    networks:
      live:
        ipv4_address: 10.123.45.15
        aliases: [minio.live.relay.test]
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  tools:
    image: natsio/nats-box:0.20.2@sha256:5162fca0f56ebe6f78e612e1ded143ce978e088393476033020e6251358dba6f
    container_name: relay-live-tools
    command: ["tail", "-f", "/dev/null"]
    volumes: ["./run:/live/run:ro"]
    networks:
      live:
        ipv4_address: 10.123.45.16

networks:
  live:
    ipam:
      config:
        - subnet: 10.123.45.0/24
