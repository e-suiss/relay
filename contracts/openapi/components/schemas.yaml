      maxLength: 128
    accessenvironment:
      type: string
      description: "Access's own messages (relay.message.*.v1): the Access environment of the message, which the source names too (urn:suiss:access:environment:<id>) and which must be an environment of accesstenant; other events ignore it."
      minLength: 1
      maxLength: 64
