        - template
    key:
      type: string
      maxLength: 100
    open_pixel:
      type: boolean
      description: "The open pixel is appended to the HTML part."
    wrap_links:
      type: boolean
      description: "The HTML part's links lead through Relay's click redirect, which classifies each click as human or likely_bot."
    trackable:
      type: boolean
      description: "false for the security class, whose e-mails are never tracked."
    warnings:
      type: array
      maxItems: 1
      items:
        type: string
        enum:
          - open_pixel_unreliable
TimingPrecision:
  type: string
  description: "strict: the deterministic jitter of this send is zero; it is scheduled at send_at and released at the end of a deferral exactly (WF-42, WF-58)."
  enum:
    - strict
  x-relay-choice: true
  x-relay-choice-note: "WF-42 lets a tenant choose an exact time with a strict mode but API-20 names no field; a request field timing_precision with the single value strict is chosen."
Timing:
  type: string
  description: "When the notification is delivered (WF-56, E-77). immediate (default): at once. next_break: at the recipient's next natural break, the first of a break transition its devices report (break set, focus mode ended, screen unlocked) or the end of its quiet hours, and at the latest at max_defer; at the break the delivery passes the policy lattice again and quiet hours stay a hard limit. Applies to the channels quiet hours apply to; the inbox item is written at once. Ignored in the security class with a timing_ignored warning. In action_required it applies only when sent explicitly (WF-57)."
  enum:
    - immediate
    - next_break
  x-relay-choice: true
  x-relay-choice-note: "WF-56 names the values; that next_break leaves in_app and the channels quiet hours do not apply to undelayed follows PC-45 and is chosen by the contract."
MaxDefer:
  description: "Required with timing next_break and refused without it: the longest wait for the break, a fixed-length ISO 8601 duration above zero counted from send_at or the request time. Its instant may not pass expires_at or the class default expiry (422 validation_failed, pointer /max_defer)."
  "$ref": "#/Duration"
  x-relay-choice: true
  x-relay-choice-note: "WF-56 names max_defer without its form; a duration counted from send_at or the request time is chosen by the contract."
TimingSpreads:
  type: object
  additionalProperties: false
  required:
    - release_spread
    - scheduled_spread
  properties:
    release_spread:
      "$ref": "#/Duration"
    scheduled_spread:
      "$ref": "#/Duration"
TimingSettings:
  type: object
  description: "The tenant's jitter control (WF-42, WF-58): the spreads in force, the precision and the ceilings a tenant may shrink the spreads within."
  additionalProperties: false
  required:
    - object
    - release_spread
    - scheduled_spread
    - timing_precision
    - ceilings
  properties:
    object:
      type: string
      enum:
        - timing_settings
    release_spread:
      "$ref": "#/Duration"
      description: "Spread of deliveries released at the end of quiet hours, a weekly schedule, dnd_until or the PC-48 window."
    scheduled_spread:
      "$ref": "#/Duration"
      description: "Spread of a single send_at and of the timer of a recurrence occurrence."
    timing_precision:
      type: string
      enum:
        - jittered
        - strict
      description: "strict zeroes both spreads for every send of the environment."
    ceilings:
      "$ref": "#/TimingSpreads"
TimingSettingsWrite:
  type: object
  description: "Full replacement of the jitter control; a spread left out takes its ceiling and timing_precision jittered."
  additionalProperties: false
  properties:
    release_spread:
      "$ref": "#/Duration"
    scheduled_spread:
      "$ref": "#/Duration"
    timing_precision:
      type: string
      enum:
        - jittered
        - strict
RealtimeOrigins:
  type: object
  description: "The browser origins of a tenant environment that may open a realtime connection (IN-54)."
  additionalProperties: false
  required:
    - object
