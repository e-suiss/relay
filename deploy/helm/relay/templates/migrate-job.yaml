apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        - name: migrate
          image: {{ include "relay.image" . }}
          args: ["eval", "Relay.Release.migrate()"]
          env:
            {{- include "relay.env" . | nindent 12 }}
            - name: RELAY_ROLES
              value: worker
          volumeMounts:
            - name: database-password
              mountPath: /run/secrets/relay
              readOnly: true
      containers:
        - name: bootstrap
          image: {{ include "relay.image" . }}
          args: ["eval", "Relay.Release.bootstrap()"]
          env:
            {{- include "relay.env" . | nindent 12 }}
            - name: RELAY_ROLES
              value: worker
            - name: ADMIN_DATABASE_URL
              value: {{ required "database.adminUrl is required" .Values.database.adminUrl | quote }}
            - name: ADMIN_DATABASE_PASSWORD_FILE
              value: /run/secrets/relay-admin/password
          volumeMounts:
            - name: database-password
              mountPath: /run/secrets/relay
              readOnly: true
            - name: admin-password
              mountPath: /run/secrets/relay-admin
              readOnly: true
      volumes:
        - name: database-password
          secret:
            secretName: {{ .Values.database.passwordSecret }}
            items:
              - key: password
                path: database-password
              - key: queue-password
                path: queue-database-password
              - key: maint-password
                path: maint-database-password
        - name: admin-password
          secret:
            secretName: {{ .Values.database.adminPasswordSecret }}
            items:
              - key: password
                path: password
