  "/v1/access/events":
    post:
      operationId: receiveAccessEvent
      tags:
        - access
      summary: Receive an Access event
      description: "Access pushes its lifecycle events (tenant and organization mapping, API client and operator lifecycle, consent) here as Security Event Tokens with the Shared Signals Framework push delivery (RFC 8417, RFC 8935), through Relay's platform product subscription. Not a tenant API and outside the /v1 request rules. The SET is a compact JWS of typ secevent+jwt signed by a key of the Access realm key set from discovery; iss must be the linked Access issuer, aud Relay's Access client_id, iat at most 305 seconds old and at most 60 seconds ahead, and events must hold exactly one member keyed urn:suiss:access:event:<type>. No secret is shared. The receipt is committed with its processing job before 202; a repeated jti is acknowledged and not processed again. A refusal is 400 with the RFC 8935 error body; 503 asks Access to deliver again."
      requestBody:
        required: true
        content:
          "application/secevent+jwt":
            schema:
              "$ref": "./components/schemas.yaml#/AccessSecurityEventToken"
      security: []
      responses:
        "202":
          description: "Accepted, or a repeated jti acknowledged again."
        "400":
          description: "The SET is refused; err is an RFC 8935 error code."
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/AccessSetError"
        "415":
          description: The body is not application/secevent+jwt.
        "503":
          description: "No Access link or Relay client_id yet, or the receipt could not be committed; Access delivers again."
      x-relay-weight: 0
      x-relay-weight-note: "Installation-level inbound channel; not counted against tenant limits."
      x-relay-idempotency: derived
      x-relay-step-up: false
      x-relay-choice: true
      x-relay-choice-note: "E-94 has Access push SETs to Relay but names no receiving path; the path stays the earlier Access event path, the idempotency key is the jti, and the iat window is Work's (T-102)."
