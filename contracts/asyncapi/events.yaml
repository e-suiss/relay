      name: delivery.paused
      title: delivery.paused
      summary: "A delivery of an Access security message was paused by an explicit security stop."
      description: "Sent once for each blocked delivery, in the transaction that records the pause with its rule_id. It carries only the delivery status and the audit references (the kill switch and its rule). It is information: Access changes no state because of it."
      contentType: application/cloudevents+json
      payload:
        schemaFormat: "application/schema+json;version=2020-12"
        schema:
          allOf:
            - "$ref": "#/components/schemas/CloudEventEnvelope"
            - type: object
              properties:
                type:
                  const: delivery.paused
                data:
                  type: object
                  required:
                    - delivery_id
                    - notification_id
                    - channel
                    - status
                    - reason
                    - rule_id
                    - kill_switch_id
                    - paused_at
                  properties:
                    delivery_id:
                      "$ref": "../openapi/components/schemas.yaml#/Id_dlv"
                    notification_id:
                      "$ref": "../openapi/components/schemas.yaml#/Id_ntf"
                    event_id:
                      "$ref": "../openapi/components/schemas.yaml#/Id_evt"
                    channel:
                      "$ref": "../openapi/components/schemas.yaml#/Channel"
                    status:
                      type: string
                      const: queued
                    reason:
                      type: string
                      const: paused
                    rule_id:
                      "$ref": "../openapi/components/schemas.yaml#/RuleId"
                    kill_switch_id:
                      "$ref": "../openapi/components/schemas.yaml#/Id_ksw"
                    paused_at:
                      "$ref": "../openapi/components/schemas.yaml#/Timestamp"
                  additionalProperties: false
      x-relay-surface: access
      x-relay-stage: 3
      x-relay-choice: true
      x-relay-choice-note: "The product decisions require the status of a blocked Access security delivery to return to Access as information but name no event; the name delivery.paused and this payload (delivery status and audit references only) are chosen by the contract."
