      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    channel:
      "$ref": "#/Channel"
    kind:
      "$ref": "#/SenderIdentityKind"
    value:
      type: string
      minLength: 1
      maxLength: 320
    country:
      oneOf:
        - type: string
