    access_bearer:
      type: oauth2
      description: "Short-lived, DPoP-bound Access access token (RFC 9068, RFC 9449) obtained with OAuth 2.0 client credentials and resource=<Relay's Access client_id> (RFC 8707) for an API client registered in Access; Relay's client_id is access_client_id in Relay's discovery document. There is no bearer token: every request sends Authorization: DPoP <token> and a DPoP header with a fresh proof signed by the token's key (typ dpop+jwt, alg ES256 or Ed25519, the public jwk in the header, htm the request method, htu the request URL without query and fragment, ath the unpadded base64url SHA-256 of the token, a unique jti, iat within 60 seconds of Relay's clock). The proof key's RFC 7638 thumbprint must be the token's cnf.jkt, and a jti is accepted once. Relay validates the token with the cached Access JWKS: typ at+jwt, iss (the Access issuer for a platform product; for a tenant API client one of the realm issuers of its access_tenant, read from the Access tenant snapshot, with that realm's JWKS), aud equal to Relay's Access client_id, exp, nbf and iat on every request, an allow-list of algorithms (EdDSA or Ed25519 for Ed25519 keys, ES256, PS256), no unsigned tokens. The token names the Access tenant in access_tenant and the Access client in client_id; it only says who calls. Tenant, environment, subtenant and scopes come from Relay's registration of the API client, and the token's scope claim, when present, narrows the scopes. Relay has no API keys of its own. The token endpoint is discovered from the Access issuer. A 401 carries a WWW-Authenticate: DPoP challenge, with error=\"invalid_dpop_proof\" when the proof is refused."
      flows:
        clientCredentials:
          tokenUrl: "https://access.example.com/oauth2/token"
          scopes:
            publish: Send events and batches, and cancel.
            read: Query events, notifications, deliveries and history.
            subscribers: Write subscribers, devices, topics and subscriptions.
            config: Write workflows, templates, layouts, partials, routes, recurrences and CloudEvents mappings.
            kill_switch: Engage and tighten kill switches of campaign and workflow scope only.
            agents: "Create and manage waitpoints and escalation policies, and decide on held agent notifications."
            webhooks: Manage webhook endpoints.
    mtls:
      type: mutualTLS
      description: "Optional additional layer for enterprise tenants: RFC 8705 certificate-bound Access tokens. It is used together with access_bearer (a DPoP-bound token), never alone. Behind a proxy that terminates TLS, the client certificate is read from the RFC 9440 Client-Cert header (and Client-Cert-Chain) only when the connection comes from a trusted proxy (RELAY_TRUSTED_PROXIES); the header from any other peer is ignored."
    operator_session:
      type: apiKey
      in: cookie
      name: relay_operator_session
      description: "Operator session started through Access OIDC on the operator API. Requests carry Relay-Tenant and Relay-Environment; mutating requests carry Relay-Csrf-Token."
      x-relay-choice: true
    operator_bearer:
      type: oauth2
      description: "DPoP-bound Access access token of an operator (RFC 9068, RFC 9449), used by the CLI, in the form of the server API token: typ at+jwt, aud equal to Relay's Access client_id (access_client_id in Relay's discovery document), issued by the Access issuer or by a realm of the token's access_tenant, signed with EdDSA or Ed25519 (Ed25519 keys), ES256 or PS256. There is no bearer token and no separate operator audience: every request sends Authorization: DPoP <token> and a DPoP header with a fresh proof signed by the key of the token's cnf.jkt. A 401 carries a WWW-Authenticate: DPoP challenge; step-up uses the RFC 9470 challenge."
      flows:
        authorizationCode:
          authorizationUrl: "https://access.example.com/oauth2/authorize"
          tokenUrl: "https://access.example.com/oauth2/token"
          scopes: {}
      x-relay-choice: true
    meta_webhook_signature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: "Meta's webhook signature: sha256= and the hex HMAC-SHA256 of the raw body with the Meta app secret of the provider account, verified in constant time before the body is parsed."
      x-relay-choice: true
