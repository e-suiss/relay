name: relay

services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay_dev
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay_dev"]
      interval: 2s
      timeout: 2s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports: ["1025:1025", "8025:8025"]

  apns:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    command: ["--https-port", "8443", "--disable-banner"]
    ports: ["8443:8443"]
    volumes: ["../conformance/apns:/home/wiremock:ro"]

  fcm:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    command: ["--port", "8080", "--disable-banner"]
    ports: ["8081:8080"]
    volumes: ["../conformance/fcm:/home/wiremock:ro"]

  sms:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    command: ["--port", "8080", "--disable-banner"]
    ports: ["8082:8080"]
    volumes: ["../conformance/sms:/home/wiremock:ro"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    profiles: [chaos]
    ports: ["8474:8474"]

  otel-collector:
    image: otel/opentelemetry-collector:0.161.0@sha256:b6d2b9a85b1029d05b5ad913150c1f014eed4ae99be81a1813ca5ade4a191913
    command: ["--config=/etc/otelcol/config.yaml"]
    ports: ["4317:4317", "4318:4318"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [jaeger, prometheus]

  jaeger:
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--web.enable-otlp-receiver"]
    ports: ["9090:9090"]
    volumes: ["./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro"]

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: ["3000:3000"]
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus, jaeger]

  access:
    image: ghcr.io/e-suiss/access:unpublished
    profiles: [access]

volumes:
  postgres:
