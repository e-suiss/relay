          "$ref": "./components/responses.yaml#/UnsupportedMediaType"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_invalid_session
        - auth_insufficient_role
        - auth_missing_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - auth_csrf_failed
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - malformed_request
        - unsupported_media_type
        - payload_too_large
        - validation_failed
        - unknown_field
        - auth_step_up_required
        - auth_step_up_unavailable
        - resource_conflict
        - auth_delegation_required
      x-relay-role: tenant_admin
      x-relay-weight: 1
      x-relay-idempotency: required
      x-relay-step-up: always
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "Paths, bodies and response shapes of channel management are chosen by the contract; a secret is only ever named by its reference and shown by its fingerprint (TN-26)."
  "/v1/operator/channel_identities/{channel_identity_id}/rotate_secret":
    post:
      operationId: rotateChannelIdentitySecret
      tags:
        - channels
      summary: Rotate a channel identity key
      description: "Points a channel identity at a new secret reference after step-up (TN-21, TN-26 (5)); the old reference is retired once nothing else names it and the holders fetch the secret again without a restart. A retired identity is 409 channel_identity_retired. Audited as channel_identity.changed."
