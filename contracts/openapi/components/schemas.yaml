    - object
    - summary
    - results
  properties:
    object:
      type: string
      const: batch_result
    summary:
      "$ref": "#/BatchSummary"
    results:
      type: array
      items:
        "$ref": "#/SubscriberBulkRowResult"
  additionalProperties: false
SubscriberDeletion:
  type: object
  description: "Deletion request. It applies to queued jobs, scheduled sends, digest buffers and the inbox; personal fields become unreadable by crypto-shredding. Rows are never physically deleted."
  required:
    - object
    - id
    - subscriber_id
    - status
    - created_at
  properties:
    object:
      type: string
      const: subscriber_deletion
    id:
      "$ref": "#/Id_sdr"
    subscriber_id:
      "$ref": "#/Id_sub"
    status:
      type: string
      enum:
        - pending
        - completed
        - held
    created_at:
      "$ref": "#/Timestamp"
    completed_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
ChannelStep:
  description: "Channel step: sends to one channel or to a route policy using one template. The shape is the workflow definition contract's channel step."
  "$ref": "../../workflow/definition.schema.json#/$defs/channel_step"
WorkflowStep:
  description: "One step of a workflow definition: channel, delay, digest, throttle, condition, wait_for_event, time_window or webhook (WF-8, WF-59). The shape is the workflow definition contract's step."
  "$ref": "../../workflow/definition.schema.json#/$defs/step"
WorkflowDefinition:
  type: object
  description: Workflow definition. The same definition is accepted by the file format and the SDK compiler.
  required:
    - name
    - category
    - message_class
    - event_schema
    - steps
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      maxLength: 2000
    category:
      type: string
      description: Tenant category key.
      pattern: "^[a-z][a-z0-9_]{0,63}$"
    message_class:
      "$ref": "#/MessageClass"
    security_subtype:
      "$ref": "../../workflow/definition.schema.json#/$defs/security_subtype"
    event_schema:
      type: object
      description: "JSON Schema 2020-12 for event data; incoming data is validated against it at accept time."
    recipient_attributes:
      "$ref": "../../workflow/definition.schema.json#/$defs/recipient_attributes"
    steps:
      type: array
      description: "The step tree; at most 50 steps over the whole tree, branches nested at most 4 deep, step keys unique over the tree (checked by the publication gate)."
      items:
        "$ref": "#/WorkflowStep"
      minItems: 1
      maxItems: 50
    overrides:
      "$ref": "#/Overrides"
      description: "Workflow-level overrides of every step. Precedence is request, step, workflow, tenant default; a raw block cannot set a policy field (policy_field_not_overridable)."
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "The spec names a workflow level of overrides but no field; the definition carries an overrides field of the request's shape."
    content_dedup:
      "$ref": "../../workflow/definition.schema.json#/$defs/content_dedup"
    controls:
      "$ref": "../../workflow/definition.schema.json#/$defs/controls"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "Until tenant categories exist (later stage), the definition declares message_class next to category; afterwards the class must match the category's class."
WorkflowDefinitionRequest:
  type: object
  description: "Workflow definition as written. category names an existing category that is not archived; otherwise the write is 422 validation_failed at /definition/category (not_found, or not_allowed for an archived one). message_class may be left out: the class of the category applies and is frozen in the stored definition (an Access platform tenant has the built-in security category). A declared message_class that differs from the category's class is 422 category_class_mismatch."
  required:
    - name
    - category
    - event_schema
    - steps
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      maxLength: 2000
    category:
      type: string
      description: Tenant category key.
      pattern: "^[a-z][a-z0-9_]{0,63}$"
    message_class:
      "$ref": "#/MessageClass"
    security_subtype:
      "$ref": "../../workflow/definition.schema.json#/$defs/security_subtype"
    event_schema:
      type: object
      description: "JSON Schema 2020-12 for event data; incoming data is validated against it at accept time."
    recipient_attributes:
      "$ref": "../../workflow/definition.schema.json#/$defs/recipient_attributes"
    steps:
      type: array
      description: "The step tree; at most 50 steps over the whole tree, branches nested at most 4 deep, step keys unique over the tree (checked by the publication gate)."
      items:
        "$ref": "#/WorkflowStep"
      minItems: 1
      maxItems: 50
    overrides:
      "$ref": "#/Overrides"
      description: "Workflow-level overrides of every step. Precedence is request, step, workflow, tenant default; a raw block cannot set a policy field (policy_field_not_overridable)."
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "The spec names a workflow level of overrides but no field; the definition carries an overrides field of the request's shape."
    content_dedup:
      "$ref": "../../workflow/definition.schema.json#/$defs/content_dedup"
    controls:
      "$ref": "../../workflow/definition.schema.json#/$defs/controls"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "Until tenant categories exist (later stage), the definition declares message_class next to category; afterwards the class must match the category's class."
WorkflowCreate:
  type: object
  description: Create a workflow and its first draft.
  required:
    - key
    - definition
  properties:
    key:
      "$ref": "#/WorkflowKey"
    definition:
      "$ref": "#/WorkflowDefinitionRequest"
  additionalProperties: false
WorkflowDraft:
  type: object
  description: Replace the draft of the workflow.
  required:
    - definition
  properties:
    definition:
      "$ref": "#/WorkflowDefinitionRequest"
  additionalProperties: false
Publication:
  type: object
  required:
