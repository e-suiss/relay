image:
  repository: ghcr.io/e-suiss/relay
  digest: ""

host: relay.example.com

database:
  url: ""
  queueUrl: ""
  maintUrl: ""
  migratorUrl: ""
  adminUrl: ""
  passwordSecret: relay-database
  migratorPasswordSecret: relay-database-migrator
  adminPasswordSecret: relay-database-admin
  poolSize: 10
  serverRequirements:
    sharedPreloadLibraries: [pg_stat_statements]

valkey:
  url: ""

secretKeyBaseSecret: relay-secret-key-base

auditStore:
  endpoint: ""
  bucket: ""
  region: ""
  accessKeyId: ""
  secretAccessKeySecret: relay-audit-store

keyStore:
  module: ""
  token: ""
  kekLabel: ""
  fingerprintLabel: ""
  pinSecret: relay-key-store-pin
  env: []
  volumes: []
  volumeMounts: []

nodes:
  - name: all
    roles: [api, worker, socket]
    replicas: 1
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {memory: 1Gi}

terminationGracePeriodSeconds: 60
