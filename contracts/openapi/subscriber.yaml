  "/v1/subscriber/devices/{device_id}/status":
    patch:
      operationId: updateMyDeviceStatus
      tags:
        - presence
      summary: Write the status of my device
      description: "Writes the changed status signals of one of the token subscriber's own devices (IN-47, IN-53): only the keys that changed, each a boolean of dictionary v1, with a time to live of PT5M by default that Relay cuts at PT15M. A key or value outside the dictionary is 422 unknown_field. A device writes at most once per second; the next write in that second is 429. The status is kept only on the short-lived store, never in the database, the inbox, the delivery record or the archive, and reaches no other recipient and no server API (IN-48). Another subscriber's or a disabled device is device_not_found. Writing the same signals again is harmless, so no Idempotency-Key is taken."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/DeviceId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DeviceStatusWrite"
      security:
        - subscriber_bearer:
            - "presence:write"
      responses:
        "200":
          description: The device's status after the write.
          headers:
