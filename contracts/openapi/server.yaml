openapi: "3.1.0"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: Relay Server API
  version: "2026-11-01"
  x-relay-built-stage: 7
  description: "Sending, management and query families of Relay, called by tenant backends with Access client credentials tokens, and management by operator sessions. JSON in UTF-8, snake_case fields, RFC 3339 UTC times, ISO 8601 durations, amounts and large integers as strings. Unknown fields are rejected with 422 unknown_field at every depth, including overrides; null clears a field and an absent field is left untouched. HTTPS only (TLS 1.2 or later, HSTS); behind a proxy that terminates TLS, the scheme, host and client address come from X-Forwarded-Proto, X-Forwarded-Host and X-Forwarded-For only on a connection from a trusted proxy, and a request that is not HTTPS is answered with 400 malformed_request. Every response carries Request-Id and Relay-Version. Errors are RFC 9457 problem details whose type resolves to /v1/errors/{code} on the same region. Every POST, PUT, PATCH and DELETE needs an Idempotency-Key (24 hours, fixed); a replay returns the first response byte for byte with Idempotency-Replayed: true. Relay delivers at least once and, with durable idempotency, processes effectively once. Identifiers are opaque, prefixed and time ordered (x-relay-id-prefixes). Resources of other tenants and environments return 404. Health endpoints are not part of this API."
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: "https://{host}"
    description: "Base address of a data region. A region's address never reaches another region's data and never routes between regions."
    variables:
      host:
        default: relay.example.com
tags:
  - name: send
    description: "Sending family: events, batches and cancellation (scope publish)."
  - name: query
    description: "Query family: events, notifications, deliveries and history (scope read)."
  - name: subscribers
    description: "Management family: subscribers (scope subscribers)."
  - name: workflows
    description: "Management family: workflows, versions and recurrence rules (scope config)."
  - name: routes
    description: "Management family: named route policies (scope config)."
  - name: templates
    description: "Management family: templates, versions, translations, preview and producer templates (scope config)."
  - name: layouts
    description: "Management family: email layouts and their versions (scope config)."
  - name: partials
    description: "Management family: named, versioned partials (scope config)."
  - name: brand
    description: "Management family: brand settings of the tenant and its subtenants (scope config)."
  - name: cloudevents
    description: "Management family: CloudEvents type mappings (scope config)."
  - name: categories
    description: "Management family: categories and their subtenant settings (scope config)."
  - name: suppressions
    description: "Management family: address suppressions (scope subscribers)."
  - name: kill-switches
    description: "Management family: campaign and workflow kill switches (scope kill_switch); other scopes need an operator session."
  - name: errors
    description: Error catalog pages (unauthenticated).
  - name: test-plane
    description: Operations that exist only in the test environment.
  - name: access
    description: Inbound Access events (installation level).
  - name: agents
    description: "Agent family: waitpoints, escalation policies and agent ceiling decisions (scope agents)."
  - name: webhooks
    description: "Management family: webhook endpoints (scope webhooks)."
  - name: messaging-inbound
    description: Inbound requests of the messaging channel providers (unauthenticated, signed by the provider).
  - name: discovery
    description: Relay discovery document and product event key set (unauthenticated).
  - name: channels
    description: "Management family: provider accounts, sender identities and channel identities (scope config)."
  - name: usage
    description: "Usage family: provider invoices and their reconciliation with the usage records (scope config to record, read to read)."
  - name: campaigns
    description: "Send family: campaigns, prepared then triggered (scope publish); audience approval and resumption on the operator surface."
  - name: reports
    description: "Report family: the delivery, skip and cost reports and the raw data exports of the tenant environment (scope read)."
  - name: email-reports
    description: "Management family: DMARC aggregate and TLS report intake and summaries (scope config)."
paths:
  "/v1/events":
    post:
      operationId: createEvent
      tags:
        - send
      summary: Send an event
      description: "Accepts a native JSON event or a CloudEvents event (binary mode with ce-* headers and a JSON body, structured mode, or a CloudEvents batch). Returns 202 with one notification id per recipient; delivery is never synchronous. Policy outcomes (consent, preference, quiet hours, kill switch) are decisions recorded after acceptance, not errors. Not available to subscriber tokens. A batch body follows the batch rules and answers like POST /v1/events/batch."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKeyCloudEvents"
        - "$ref": "./components/parameters.yaml#/Traceparent"
        - "$ref": "./components/parameters.yaml#/CeSpecversion"
        - "$ref": "./components/parameters.yaml#/CeId"
        - "$ref": "./components/parameters.yaml#/CeSource"
        - "$ref": "./components/parameters.yaml#/CeType"
        - "$ref": "./components/parameters.yaml#/CeSubject"
        - "$ref": "./components/parameters.yaml#/CeTime"
        - "$ref": "./components/parameters.yaml#/CeDataschema"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./components/schemas.yaml#/EventRequest"
            examples:
              first_notification:
                summary: First notification with one curl
                value:
                  workflow: welcome
                  to:
                    - id: user-4821
                      email: "ayse@example.com"
                  data:
                    first_name: "Ayşe"
          "application/cloudevents+json":
            schema:
              "$ref": "./components/schemas.yaml#/CloudEvent"
          "application/cloudevents-batch+json":
            schema:
              "$ref": "./components/schemas.yaml#/CloudEventBatch"
      security:
        - access_bearer:
            - publish
      responses:
        "202":
          description: Accepted. For a CloudEvents batch the body is a batch result and the status follows the batch status map (202 all accepted, 207 partial).
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Location:
              "$ref": "./components/headers.yaml#/Location"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
          content:
            "application/json":
              schema:
                oneOf:
                  - "$ref": "./components/schemas.yaml#/EventAccepted"
                  - "$ref": "./components/schemas.yaml#/BatchResult"
        "207":
          description: "CloudEvents batch: some rows accepted, some rejected."
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
            Relay-Batch-Max-Events:
              "$ref": "./components/headers.yaml#/Relay-Batch-Max-Events"
            Relay-Batch-Max-Recipients-Per-Event:
              "$ref": "./components/headers.yaml#/Relay-Batch-Max-Recipients-Per-Event"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/BatchResult"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "404":
          "$ref": "./components/responses.yaml#/NotFound"
        "409":
          "$ref": "./components/responses.yaml#/Conflict"
        "413":
          "$ref": "./components/responses.yaml#/PayloadTooLarge"
        "415":
          "$ref": "./components/responses.yaml#/UnsupportedMediaType"
        "422":
          description: "A single event or the envelope failed validation (problem), or no batch row was accepted: a batch result whose rows each carry a problem. A complete failure is never 2xx."
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/BatchResult"
            "application/problem+json":
              schema:
                "$ref": "./components/problem.yaml#/Problem"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_missing_credentials
        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_revoked_client
        - auth_insufficient_scope
        - auth_tenant_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - malformed_request
        - unsupported_media_type
        - payload_too_large
        - validation_failed
        - unknown_field
        - workflow_not_found
        - workflow_not_published
        - event_type_not_mapped
        - recipient_not_found
        - recipient_invalid
        - channel_not_configured
        - policy_field_not_overridable
        - quota_exhausted
        - batch_too_large
        - link_scheme_not_allowed
        - audience_too_large
        - auth_environment_mismatch
      x-relay-scopes:
        - publish
      x-relay-weight: 1
      x-relay-weight-note: A CloudEvents batch weighs its number of events.
      x-relay-idempotency: derived
      x-relay-step-up: false
  "/v1/events/batch":
    post:
      operationId: createEventBatch
      tags:
        - send
      summary: Send a batch of events
      description: "Row-based, not all-or-nothing. 202 when every row is accepted, 207 when some are, 422 when none are (a complete failure is never 2xx), 400 for a broken envelope, 413 batch_too_large for a limit. 401, 403 and 429 apply to the whole request. One Idempotency-Key covers the whole batch; ref is not an idempotency unit. Rows are neither atomic nor ordered; results follow input order. The batch consumes rate limit and quota by its rows."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
        - "$ref": "./components/parameters.yaml#/Traceparent"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./components/schemas.yaml#/BatchRequest"
      security:
        - access_bearer:
            - publish
      responses:
        "202":
          description: Every row accepted.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
            Relay-Batch-Max-Events:
              "$ref": "./components/headers.yaml#/Relay-Batch-Max-Events"
            Relay-Batch-Max-Recipients-Per-Event:
              "$ref": "./components/headers.yaml#/Relay-Batch-Max-Recipients-Per-Event"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/BatchResult"
        "207":
          description: "Some rows accepted; each rejected row carries a full problem object."
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
            Relay-Batch-Max-Events:
              "$ref": "./components/headers.yaml#/Relay-Batch-Max-Events"
            Relay-Batch-Max-Recipients-Per-Event:
              "$ref": "./components/headers.yaml#/Relay-Batch-Max-Recipients-Per-Event"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/BatchResult"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "409":
          "$ref": "./components/responses.yaml#/Conflict"
        "413":
          "$ref": "./components/responses.yaml#/PayloadTooLarge"
        "415":
          "$ref": "./components/responses.yaml#/UnsupportedMediaType"
        "422":
          description: "A single event or the envelope failed validation (problem), or no batch row was accepted: a batch result whose rows each carry a problem. A complete failure is never 2xx."
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/BatchResult"
            "application/problem+json":
              schema:
                "$ref": "./components/problem.yaml#/Problem"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_missing_credentials
        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_revoked_client
        - auth_insufficient_scope
        - auth_tenant_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - malformed_request
        - unsupported_media_type
        - payload_too_large
        - validation_failed
        - unknown_field
        - batch_too_large
        - quota_exhausted
        - link_scheme_not_allowed
      x-relay-scopes:
        - publish
      x-relay-weight: rows
      x-relay-idempotency: required
      x-relay-step-up: false
  "/v1/events/{event_id}":
    get:
      operationId: getEvent
      tags:
        - query
      summary: Get an event
      description: Returns the event, its workflow version and the notification of each recipient.
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/EventId"
      security:
        - access_bearer:
            - read
        - access_bearer:
            - publish
      responses:
        "200":
          description: The event.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/Event"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "404":
          "$ref": "./components/responses.yaml#/NotFound"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_missing_credentials
        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_revoked_client
        - auth_insufficient_scope
        - auth_tenant_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - event_not_found
      x-relay-scopes:
        - read
        - publish
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
  "/v1/events/{event_id}/cancel":
    post:
      operationId: cancelEvent
      tags:
        - send
      summary: Cancel an event
      description: "Cancels every notification of the event that has not been handed to a provider. Processed from the same ordered key as the trigger; a run that has not started yet sees the tombstone and ends cancelled. Sent SMS, email and push cannot be recalled; delivered in-app items are withdrawn. Always 200 with counts, never 204."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
        - "$ref": "./components/parameters.yaml#/EventId"
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              "$ref": "./components/schemas.yaml#/CancelRequest"
      security:
        - access_bearer:
            - publish
      responses:
        "200":
          description: Cancellation counts.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/CancelResult"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "404":
          "$ref": "./components/responses.yaml#/NotFound"
        "409":
          "$ref": "./components/responses.yaml#/Conflict"
        "413":
          "$ref": "./components/responses.yaml#/PayloadTooLarge"
        "415":
          "$ref": "./components/responses.yaml#/UnsupportedMediaType"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_missing_credentials
        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_revoked_client
        - auth_insufficient_scope
        - auth_tenant_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - malformed_request
        - unsupported_media_type
        - payload_too_large
        - validation_failed
        - unknown_field
        - event_not_found
      x-relay-scopes:
        - publish
      x-relay-weight: 1
      x-relay-idempotency: required
      x-relay-step-up: false
  "/v1/events/cancel_by_key":
    post:
      operationId: cancelEventsByKey
      tags:
        - send
      summary: Cancel by cancellation key
      description: "Cancels every pending notification of events carrying this cancellation_key, optionally narrowed to recipients and channels. The key need not be unique and no prior registration is needed. No match is not an error: 200 with zero counts."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./components/schemas.yaml#/CancelByKeyRequest"
      security:
        - access_bearer:
            - publish
      responses:
        "200":
          description: Cancellation counts.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
