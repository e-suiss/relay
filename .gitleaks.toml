[extend]
useDefault = true

[[allowlists]]
description = "Published C2SP and golang.org/x/mod sumdb test vectors"
paths = ['''^test/vectors/c2sp/''']

[[allowlists]]
description = "Published RFC 9578 Privacy Pass test vectors: public keys, challenges and tokens"
paths = ['''^conformance/vectors/privacy_pass_rfc9578\.json$''']

[[allowlists]]
description = "Published RFC 8463 DKIM test key and signed message"
paths = ['''^test/fixtures/email/dkim/''']

[[allowlists]]
description = "Synthetic access key shape the push content check must refuse"
condition = "AND"
paths = ['''^test/relay/channels/push/content_test\.exs$''']
regexes = ['''^AKIAABCDEFGHIJKLMNOP$''']

[[allowlists]]
description = "Synthetic Access organization UUID of an earlier event test revision"
condition = "AND"
paths = ['''^test/relay/access/events_test\.exs$''']
regexes = ['''^0b6e5c1a-6f0e-4a8c-9a51-2d0c3f6e7b11$''']

[[allowlists]]
description = "Published Suiss webhook profile and Standard Webhooks signature test vectors"
paths = ['''^conformance/webhooks/vectors/''']

[[allowlists]]
description = "Synthetic idempotency key of an earlier Ruby SDK test revision"
condition = "AND"
paths = ['''^sdks/ruby/test/client_test\.rb$''']
regexes = ['''^order-4821-shipped$''']

[[allowlists]]
description = "Synthetic device token fingerprint of the mobile SDK test fixtures"
condition = "AND"
paths = ['''^sdks/(swift/Tests|kotlin/relay/src/test)/''']
regexes = ['''^0123456789abcdef$''']

[[allowlists]]
description = "Published dependency checksums of the Android SDK's Gradle verification metadata"
paths = ['''^sdks/kotlin/gradle/verification-metadata\.xml$''']
