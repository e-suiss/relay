name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: docker compose -f deploy/compose.yaml --profile chaos up -d --wait
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - run: mix deps.audit
      - run: mix test --include integration --include nightly

  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose.yaml up -d --wait postgres valkey
      - run: docker pull ghcr.io/e-suiss/relay:main
      - run: SMOKE_KEEP=1 deploy/smoke.sh ghcr.io/e-suiss/relay:main
      - run: load/run.sh load/targets/health.txt 200/1s 60s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-${{ github.run_id }}
          path: load/output
