components:
  securitySchemes:
    subscriber_bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Relay subscriber token from the token exchange. Scopes: inbox:read, inbox:write, preferences, devices:write, presence:write. Access tokens are never accepted here."
  schemas:
    TokenExchangeRequest:
      type: object
      description: RFC 8693 token exchange request.
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          type: string
          const: "urn:ietf:params:oauth:grant-type:token-exchange"
        subject_token:
          type: string
          description: "The end user's DPoP-bound Access access token: typ at+jwt, aud Relay's Access client_id, access_tenant and client_id naming the registered Access client, sub the pairwise subject."
          minLength: 1
          maxLength: 8192
        subject_token_type:
          type: string
          const: "urn:ietf:params:oauth:token-type:access_token"
        requested_token_type:
          type: string
          const: "urn:suiss:relay:token-type:subscriber"
          x-relay-choice: true
          x-relay-choice-note: Token type URI chosen by the contract.
        scope:
          type: string
          description: "Space-separated subset of inbox:read inbox:write preferences devices:write presence:write. Default: inbox:read inbox:write preferences."
          pattern: "^(inbox:read|inbox:write|preferences|devices:write|presence:write)( (inbox:read|inbox:write|preferences|devices:write|presence:write))*$"
      additionalProperties: false
    TokenExchangeResponse:
      type: object
      description: RFC 8693 token exchange response. The tenant identifier is never written into a field the client can see.
      required:
        - access_token
        - issued_token_type
        - token_type
        - expires_in
        - scope
        - subscriber_id
        - environment
      properties:
        access_token:
          type: string
          description: "Relay subscriber token: asymmetrically signed, audience is the Relay inbox and realtime surface, carries the environment and the allowed realtime streams."
        issued_token_type:
          type: string
          const: "urn:suiss:relay:token-type:subscriber"
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 900
          description: "Lifetime in seconds; 15 minutes by default. SDKs renew before expiry."
        scope:
          type: string
        subscriber_id:
          "$ref": "./components/schemas.yaml#/Id_sub"
          x-relay-choice: true
        environment:
          "$ref": "./components/schemas.yaml#/Environment"
      additionalProperties: false
    PushReceipt:
      type: object
      description: "A push receipt of the SDK (DS-13)."
      required:
        - delivery_id
        - receipt
      properties:
        delivery_id:
          "$ref": "./components/schemas.yaml#/Id_dlv"
        receipt:
          type: string
          enum:
            - displayed
            - clicked
        occurred_at:
          type: string
          format: date-time
      additionalProperties: false
    PushReceiptRecorded:
      type: object
      required:
        - object
        - delivery_id
        - receipt
      properties:
        object:
          type: string
          enum:
            - push_receipt
        delivery_id:
          "$ref": "./components/schemas.yaml#/Id_dlv"
        receipt:
          type: string
          enum:
            - displayed
            - clicked
      additionalProperties: false
    InboxItemState:
      type: object
      description: "The state of an inbox item without its content (IN-9 … IN-11): the identifier and state_version always travel together (IN-5). read is effective when the read stamp is newer than the unread stamp and the last activity, archived when the archive stamp is newer than the unarchive stamp; a cumulative update makes the item unseen and unread again."
      required:
        - id
        - state_version
        - seen
        - read
        - archived
        - hidden
        - expired
        - snoozed_until
        - seen_at
        - read_at
        - archived_at
      properties:
        id:
          "$ref": "./components/schemas.yaml#/Id_inb"
        state_version:
          type: integer
          minimum: 1
        seen:
          type: boolean
        read:
          type: boolean
        archived:
          type: boolean
        hidden:
          type: boolean
          description: "Hidden by the user or retracted by the sender; terminal for the user."
        expired:
          type: boolean
        snoozed_until:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        seen_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        read_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        archived_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
      additionalProperties: false
    InboxItem:
      type: object
      description: "An inbox item, a topic with activities (IN-4): its content as rendered when it was sent, never rendered again, its category, tags, severity and group key, the activity and actor counts of a digest that updates it, and its state. Field limits are x-relay-limits inbox (IN-49). Content that can no longer be read, as after an erasure, is null."
      required:
        - object
        - id
        - state_version
        - seen
        - read
        - archived
        - hidden
        - expired
        - snoozed_until
        - seen_at
        - read_at
        - archived_at
        - created_at
        - last_activity_at
        - category
        - tags
        - severity
        - group_key
        - title
        - body
        - avatar_url
        - url
        - actions
        - data
        - locale
        - dir
        - activity_count
        - actor_count
        - expires_at
      properties:
        object:
          type: string
          enum:
            - inbox_item
        id:
          "$ref": "./components/schemas.yaml#/Id_inb"
        state_version:
          type: integer
          minimum: 1
        seen:
          type: boolean
        read:
          type: boolean
        archived:
          type: boolean
        hidden:
          type: boolean
        expired:
          type: boolean
        snoozed_until:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        seen_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        read_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        archived_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        last_activity_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        category:
          oneOf:
            - type: string
              maxLength: 128
            - type: "null"
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        severity:
          oneOf:
            - type: string
              maxLength: 32
            - type: "null"
          x-relay-choice: true
          x-relay-choice-note: "IN-4 names severity without its values or source; it is null until they are decided."
        group_key:
          oneOf:
            - type: string
              maxLength: 128
            - type: "null"
        title:
          oneOf:
            - type: string
            - type: "null"
        body:
          oneOf:
            - type: string
            - type: "null"
        avatar_url:
          oneOf:
            - type: string
            - type: "null"
        url:
          oneOf:
            - type: string
            - type: "null"
          description: "The target of the item: the event's primary link (E-83)."
        actions:
          type: array
          maxItems: 3
          description: "Action buttons. A button is never an approval; on an approval item it only links to the Access approval surface (IN-6)."
          items:
            type: object
            required:
              - label
              - url
            properties:
              label:
                type: string
              url:
                type: string
            additionalProperties: false
        data:
          type: array
          maxItems: 10
          items:
            type: object
            required:
              - key
              - value
            properties:
              key:
                type: string
              value:
                type: string
            additionalProperties: false
        locale:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Locale"
            - type: "null"
        dir:
          oneOf:
            - type: string
              enum:
                - ltr
                - rtl
                - auto
            - type: "null"
        activity_count:
          type: integer
          minimum: 1
        actor_count:
          type: integer
          minimum: 0
        expires_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
      additionalProperties: false
    InboxCounters:
      type: object
      description: "Absolute counters computed on the server and written in the same transaction as the items (IN-18, IN-19): unseen (the default badge source), unread and total over the inbox tab. version grows with every change; a client ignores counters whose version is not newer than its own. A badge is never sent as an increment."
      required:
        - object
        - unseen
        - unread
        - total
        - version
      properties:
        object:
          type: string
          enum:
            - inbox_counters
        unseen:
          type: integer
          minimum: 0
        unread:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
      additionalProperties: false
    InboxItemList:
      type: object
      description: "A keyset page of items. The first page (without starting_after) also carries counters and the stream cursor to continue from with the changes endpoint or a realtime transport."
      required:
        - object
        - data
        - has_more
        - next_cursor
        - previous_cursor
      properties:
        object:
          type: string
          enum:
            - list
        data:
          type: array
          items:
            "$ref": "#/components/schemas/InboxItem"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Cursor"
            - type: "null"
        previous_cursor:
          type: "null"
        counters:
          "$ref": "#/components/schemas/InboxCounters"
        cursor:
          type: string
          maxLength: 64
          description: Stream cursor of the moment the page was read.
      additionalProperties: false
    InboxChange:
      type: object
      description: "One item change after the cursor: created and updated changes carry the full item, removed ones (hidden, retracted, expired) the item's state only."
      required:
        - type
        - item_id
        - state_version
        - cursor
        - item
      properties:
        type:
          type: string
          enum:
            - created
            - updated
            - removed
        item_id:
          "$ref": "./components/schemas.yaml#/Id_inb"
        state_version:
          type: integer
          minimum: 1
        cursor:
          type: string
          maxLength: 64
        item:
          anyOf:
            - "$ref": "#/components/schemas/InboxItem"
            - "$ref": "#/components/schemas/InboxItemState"
      additionalProperties: false
    InboxChanges:
      type: object
      description: "The delta sync answer (IN-29)."
      required:
        - object
        - changes
        - cursor
        - has_more
        - truncated
        - resync_required
        - counters
      properties:
        object:
          type: string
          enum:
            - inbox_changes
        changes:
          type: array
          maxItems: 500
          items:
            "$ref": "#/components/schemas/InboxChange"
        cursor:
          type: string
          maxLength: 64
          description: Stream cursor to continue from.
        has_more:
          type: boolean
        truncated:
          type: boolean
          description: More than 500 changes wait; go back to a cold sync.
        resync_required:
          type: boolean
          description: "The cursor's epoch or position no longer holds (IN-22); go back to a cold sync from cursor."
        resync_reason:
          type: string
          enum:
            - epoch_changed
            - position_out_of_range
        counters:
          "$ref": "#/components/schemas/InboxCounters"
      additionalProperties: false
    InboxIntent:
      type: object
      description: "A state intent (IN-12). base_state_version is required in effect for unread, unarchive and unsnooze: without the current version they are a conflict."
      required:
        - op
      properties:
        op:
          type: string
          enum:
            - seen
            - read
            - unread
            - archive
            - unarchive
            - hide
            - snooze
            - unsnooze
        base_state_version:
          type: integer
          minimum: 1
        client_seq:
          type: integer
          minimum: 0
          description: "The client's offline queue sequence; echoed back, never interpreted (IN-13)."
        snooze_until:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    InboxIntentResult:
      type: object
      required:
        - object
        - item_id
        - op
        - client_seq
        - result
        - state
        - counters
      properties:
        object:
          type: string
          enum:
            - inbox_intent_result
        item_id:
          "$ref": "./components/schemas.yaml#/Id_inb"
        op:
          type: string
        client_seq:
          oneOf:
            - type: integer
            - type: "null"
        result:
          type: string
          enum:
            - applied
            - unchanged
        state:
          "$ref": "#/components/schemas/InboxItemState"
        counters:
          "$ref": "#/components/schemas/InboxCounters"
      additionalProperties: false
x-relay-family:
  - client
x-relay-subscriber-scopes:
  - "inbox:read"
  - "inbox:write"
  - preferences
  - "devices:write"
  - "presence:write"
x-relay-error-catalog: "../errors.yaml"
