      x-relay-choice-note: "DS-13 makes the SDK's displayed and clicked receipts a separate evidence level but names no surface; the receipt is posted with the subscriber's own token under its devices scope."
  "/v1/subscriber/test_recipients":
    get:
      operationId: listMyTestRecipients
      tags:
