  required:
    - specversion
    - id
    - source
    - type
    - data
  properties:
    specversion:
      type: string
      const: "1.0"
    id:
      type: string
      minLength: 1
      maxLength: 512
    source:
      type: string
      format: uri-reference
      minLength: 1
      maxLength: 1024
    type:
      type: string
      minLength: 1
      maxLength: 256
    subject:
      type: string
      maxLength: 512
    time:
