{{- range .Values.nodes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    app.kubernetes.io/name: relay
    app.kubernetes.io/instance: {{ $.Release.Name }}
    relay.suiss.app/node: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      relay.suiss.app/node: {{ .name }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $.Values.metrics.port | quote }}
        prometheus.io/path: /metrics
      labels:
        app.kubernetes.io/name: relay
        app.kubernetes.io/instance: {{ $.Release.Name }}
        relay.suiss.app/node: {{ .name }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: {{ include "relay.image" $ }}
          env:
            {{- include "relay.env" $ | nindent 12 }}
            - name: RELAY_ROLES
              value: {{ join "," .roles | quote }}
          ports:
            - name: http
              containerPort: 4000
            - name: metrics
              containerPort: {{ $.Values.metrics.port }}
          livenessProbe:
            httpGet: {path: /livez, port: http}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database-password
              mountPath: /run/secrets/relay
              readOnly: true
            - name: pkcs11-pin
              mountPath: /run/secrets/relay-pkcs11
              readOnly: true
            - name: audit-store-secret
              mountPath: /run/secrets/relay-audit-store
              readOnly: true
            - name: secret-key-base
              mountPath: /run/secrets/relay-secret-key-base
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with $.Values.keyStore.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: database-password
          secret:
            secretName: {{ $.Values.database.passwordSecret }}
            items:
              - key: password
                path: database-password
              - key: queue-password
                path: queue-database-password
              - key: maint-password
                path: maint-database-password
        - name: pkcs11-pin
          secret:
            secretName: {{ $.Values.keyStore.pinSecret }}
            items:
              - key: pin
                path: pin
        - name: audit-store-secret
          secret:
            secretName: {{ $.Values.auditStore.secretAccessKeySecret }}
            items:
              - key: secret-access-key
                path: secret-access-key
        {{- include "relay.secret-key-base-volume" $ | nindent 8 }}
        - name: tmp
          emptyDir: {}
        {{- with $.Values.keyStore.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
