  "/inbound/v1/{channel}/{tenant}/{environment}/{identity}":
    post:
      operationId: receiveMessagingInbound
      tags:
        - messaging-inbound
      summary: Receive a messaging provider request
      description: "The endpoint a channel identity's provider calls (Slack Events API and interactivity, Teams bot messaging endpoint, Telegram webhook, Discord interactions). Not a tenant API and outside the /v1 request rules: the provider's signature is verified on the raw body (Slack v0, Teams Bot Framework JWT, Telegram secret token, Discord Ed25519), the receipt is committed with its processing job before the fast 2xx, and a repeated provider event is acknowledged without being processed again. Slack's URL verification and Discord's PING are answered at once. An interaction is recorded as the messaging_interaction.received event only; a card button or an inline reply is never an approval."
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum:
              - slack
              - teams
              - telegram
              - discord
        - name: tenant
          in: path
          required: true
          schema:
            "$ref": "./components/schemas.yaml#/Id_ten"
        - name: environment
          in: path
          required: true
          schema:
            "$ref": "./components/schemas.yaml#/Environment"
        - name: identity
          in: path
          required: true
          schema:
            "$ref": "./components/schemas.yaml#/Id_chi"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./components/schemas.yaml#/MessagingInboundRequest"
          "application/x-www-form-urlencoded":
            schema:
              "$ref": "./components/schemas.yaml#/MessagingInboundRequest"
      security: []
      responses:
        "200":
          description: "Received; the body is what the provider expects (a challenge, a Discord interaction response, a Teams invoke response or an empty object)."
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/MessagingInboundAnswer"
        "401":
          description: The signature did not verify.
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/MessagingInboundAnswer"
        "404":
          description: No such channel identity.
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/MessagingInboundAnswer"
        "413":
          description: The body is larger than 1 MiB.
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/MessagingInboundAnswer"
        "503":
          description: The receipt could not be committed; the provider retries.
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/MessagingInboundAnswer"
      x-relay-weight: 0
      x-relay-weight-note: "Provider inbound channel; not counted against tenant limits."
