name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
      - run: docker compose -f deploy/compose.yaml config -q
      - run: docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/etc/prometheus:ro" prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e check config /etc/prometheus/prometheus.yaml
      - run: docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e test rules alerts.test.yaml
      - run: helm lint --strict deploy/helm/relay -f deploy/helm/ci-values.yaml
      - run: helm template relay deploy/helm/relay -f deploy/helm/ci-values.yaml > /dev/null
      - run: if helm template relay deploy/helm/relay > /dev/null 2>&1; then exit 1; fi
      - run: docker compose -f deploy/compose.yaml up -d --wait postgres valkey minio
      - run: mix deps.get --check-locked
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors --force
      - run: mix credo --strict
      - run: mix sobelow --config
      - run: mix hex.audit
      - run: mix deps.audit
      - run: mix lint
      - run: mix relay.bench.reductions
      - run: mix dialyzer
      - run: mix docs --warnings-as-errors
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            native/pkcs11_port/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('native/pkcs11_port/Cargo.lock', 'native/pkcs11_port/rust-toolchain.toml') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends softhsm2 opensc
      - run: rustup toolchain install
        working-directory: native/pkcs11_port
      - run: native/build.sh
      - run: mix test --include integration --warnings-as-errors

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REDOCLY_TELEMETRY: "off"
      ASYNCAPI_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: npx --yes @redocly/cli@2.69.0 lint --extends=minimal contracts/openapi/server.yaml contracts/openapi/subscriber.yaml contracts/openapi/operator.yaml
      - run: npx --yes @asyncapi/cli@6.2.1 validate contracts/asyncapi/events.yaml
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          git archive "origin/$BASE_REF" contracts | tar -x -C "$base"
          for family in server subscriber operator; do
            if [ -f "$base/contracts/openapi/$family.yaml" ]; then
              docker run --rm -v "$base:/base:ro" -v "$PWD:/head:ro" tufin/oasdiff:v1.34.1@sha256:67a23cfea7d251e2ae34ee703ac8733c5d96bc2e7b90fd0f4d475ec99367b85f breaking "/base/contracts/openapi/$family.yaml" "/head/contracts/openapi/$family.yaml" --fail-on ERR
            fi
          done

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/pkcs11_port
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            native/pkcs11_port/target
          key: cargo-debug-${{ runner.os }}-${{ hashFiles('native/pkcs11_port/Cargo.lock', 'native/pkcs11_port/rust-toolchain.toml') }}
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix deps.get --only prod --check-locked
        env:
          MIX_ENV: prod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: relay:smoke
          cache-from: type=gha
      - run: docker compose -f deploy/compose.yaml up -d --wait postgres valkey minio
      - run: deploy/smoke.sh relay:smoke

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --log-opts=HEAD --redact --exit-code 1
