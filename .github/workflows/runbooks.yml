name: runbooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runbooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get --check-locked
      - run: mix relay.lint.runbooks
      - run: mix relay.runbooks.bundle --out relay-runbooks.html --label "${GITHUB_SHA::12}"
      - run: grep -q '<article id="kill-switch-emergency">' relay-runbooks.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-runbooks
          path: relay-runbooks.html
          if-no-files-found: error
          retention-days: 90

  status-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ops/status-page/build.sh "$RUNNER_TEMP/status"
      - run: grep -q 'All systems operational' "$RUNNER_TEMP/status/index.html"
      - run: ops/status-page/build.sh "$RUNNER_TEMP/example" ops/status-page/examples
      - run: grep -q 'Delayed push notifications on iOS' "$RUNNER_TEMP/example/index.html"
      - run: jq -e '.overall == "degraded" and .open == ["2026-11-18-push-delay"]' "$RUNNER_TEMP/example/status.json"
      - run: if grep -qi '<script' "$RUNNER_TEMP/example/index.html"; then exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: status-page
          path: ${{ runner.temp }}/status
          if-no-files-found: error
