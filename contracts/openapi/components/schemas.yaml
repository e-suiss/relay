            - address_disabled
            - suppressed_address
            - no_active_device
            - no_permission
          x-relay-choice: true
        - type: "null"
  additionalProperties: false
Subscriber:
  type: object
  description: "Subscriber. Personal fields are returned masked (for example j***@example.com); see the operator reveal operation."
  required:
    - object
    - id
    - external_id
    - channels
    - state
    - version
    - created_at
    - updated_at
  properties:
