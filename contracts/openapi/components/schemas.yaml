      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
LedgerEvent:
  type: object
  required:
    - object
    - id
    - actor
    - type
    - occurred_at
    - received_at
  properties:
    object:
      type: string
      const: delivery_event
    id:
      "$ref": "#/Id_dle"
    actor:
      type: string
      enum:
        - relay
        - provider_api
        - provider_webhook
        - client_sdk
        - user
    type:
      "$ref": "#/EventName"
    attempt_no:
      oneOf:
        - type: integer
        - type: "null"
    raw_code:
      oneOf:
        - type: string
          maxLength: 128
        - type: "null"
    provider:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    outcome:
      type: string
      description: "What the event did to the projection: applied, stale_ignored (a late or lower event, kept in the ledger and counted) or conflict_flagged."
      enum:
        - applied
        - stale_ignored
        - conflict_flagged
    reason:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    occurred_at:
      "$ref": "#/Timestamp"
    received_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
DeliveryHistory:
  type: object
  description: "Attempt history and ledger of one delivery. Raw provider responses are masked; revealing them is a sensitive operation."
  required:
    - object
    - delivery
    - attempts
    - events
  properties:
    object:
      type: string
      const: delivery_history
    delivery:
      "$ref": "#/Delivery"
    attempts:
      type: array
      items:
        "$ref": "#/Attempt"
    events:
      type: array
      items:
        "$ref": "#/LedgerEvent"
  additionalProperties: false
DecisionStep:
  type: object
  description: "One recorded decision of a delivery: the rule, its reason family, what it did and the dictionary's one sentence explanation. detail holds only the fields the rule dictionary lists for the rule."
  required:
    - type
    - rule_id
    - occurred_at
  properties:
    type:
      "$ref": "#/EventName"
    rule_id:
      "$ref": "#/RuleId"
    reason:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    outcome:
      oneOf:
        - type: string
          enum:
            - skip
            - defer
            - expire
            - cancel
            - pause
            - reject
        - type: "null"
    deferred_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    detail:
      type: object
    description:
      oneOf:
        - type: object
          required:
            - en
            - tr
          properties:
            en:
              type: string
            tr:
              type: string
          additionalProperties: false
        - type: "null"
    occurred_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
DeliveryDecision:
  type: object
  description: "A channel's result and the decisions recorded on its delivery. gates is passed when every gate let the delivery go, stopped when a rule skipped, expired or cancelled it, deferred while a rule defers or pauses it."
  required:
    - delivery_id
    - channel
    - status
    - gates
    - decisions
  properties:
    delivery_id:
      "$ref": "#/Id_dlv"
    channel:
      "$ref": "#/Channel"
    status:
      "$ref": "#/DeliveryStatus"
    reason:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    gates:
      type: string
      enum:
        - passed
        - stopped
        - deferred
    deferred_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    decisions:
      type: array
      items:
        "$ref": "#/DecisionStep"
  additionalProperties: false
NotificationDecision:
  type: object
  description: "The decision chain of one notification."
  required:
    - object
    - notification_id
    - workflow
    - state
    - created_at
    - deliveries
  properties:
    object:
      type: string
      const: notification_decision
    notification_id:
      "$ref": "#/Id_ntf"
    event_id:
      oneOf:
        - "$ref": "#/Id_evt"
        - type: "null"
    workflow:
      "$ref": "#/WorkflowRef"
    message_class:
      "$ref": "#/MessageClass"
    state:
      type: string
      enum:
        - active
        - cancelled
        - expired
    close_rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    deliveries:
      type: array
      items:
        "$ref": "#/DeliveryDecision"
  additionalProperties: false
NotificationDecisionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/NotificationDecision"
CancelDetail:
  type: object
  required:
    - result
  properties:
    notification_id:
      "$ref": "#/Id_ntf"
    delivery_id:
      "$ref": "#/Id_dlv"
    result:
      type: string
      enum:
        - cancelled
        - already_sent
        - not_found
        - already_closed
  additionalProperties: false
CancelResult:
  type: object
  description: "Cancellation counts. Sent SMS, email and push cannot be recalled; only deliveries not yet handed to a provider stop."
  required:
    - object
    - id
    - cancelled
    - already_sent
    - not_found
    - details
  properties:
    object:
      type: string
      const: cancellation
    id:
      "$ref": "#/Id_cnl"
    cancelled:
      type: integer
      minimum: 0
    already_sent:
      type: integer
      minimum: 0
    not_found:
      type: integer
      minimum: 0
    details:
      type: array
      items:
        "$ref": "#/CancelDetail"
    has_more:
      type: boolean
      description: "True when more matching work remains; repeat the call with a new Idempotency-Key."
      x-relay-choice: true
      x-relay-choice-note: One call cancels at most 1000 notifications so it fits the API statement timeout.
  additionalProperties: false
CancelRequest:
  type: object
  description: Optional cancellation reason.
  properties:
    reason:
      type: string
      maxLength: 500
  additionalProperties: false
CancelByKeyRequest:
  type: object
  required:
    - cancellation_key
