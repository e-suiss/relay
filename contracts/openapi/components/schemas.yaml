        - type: "null"
    raw:
      oneOf:
        - "$ref": "#/ProviderInvoiceRaw"
        - type: "null"
    reconciliation:
      oneOf:
        - "$ref": "#/ProviderInvoiceReconciliation"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
ProviderInvoiceList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/ProviderInvoice"
ProviderInvoiceCreate:
  type: object
  description: "A provider invoice: the period starts on period_start and ends before period_end, at most 92 days."
  required:
    - provider
    - invoice_ref
    - period_start
    - period_end
    - currency
    - amount_micros
  properties:
    provider:
      "$ref": "#/ProviderName"
    channel:
      "$ref": "#/Channel"
    invoice_ref:
      type: string
      minLength: 1
      maxLength: 128
    period_start:
      type: string
      format: date
    period_end:
      type: string
      format: date
    currency:
      "$ref": "#/CurrencyCode"
    amount_micros:
      "$ref": "#/Micros"
    units:
      type: integer
      minimum: 0
    raw:
      "$ref": "#/ProviderInvoiceRaw"
  additionalProperties: false
DeliveryReportRow:
