name: sdk-typescript

on:
  push:
    branches: [main]
    paths:
      - sdks/typescript/**
      - contracts/**
      - conformance/sdk/**
      - conformance/webhooks/**
      - .github/workflows/sdk-typescript.yml
  pull_request:
    paths:
      - sdks/typescript/**
      - contracts/**
      - conformance/sdk/**
      - conformance/webhooks/**
      - .github/workflows/sdk-typescript.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # X-53
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "own=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- . ../../.github/workflows/sdk-typescript.yml; then
            echo "own=false" >> "$GITHUB_OUTPUT"
          else
            echo "own=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      # T-78
      - run: echo "NPM_CONFIG_BEFORE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: npm install --package-lock-only --no-audit --no-fund
      - id: install
        run: npm ci --no-audit --no-fund
      # X-48
      - id: generate
        run: ./regenerate.sh
      - run: npx prettier --write .
      - id: drift
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && steps.scope.outputs.own == 'true' }}
        run: |
          git add --intent-to-add .
          if git diff --quiet -- .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- .
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ !cancelled() && steps.drift.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-typescript-regenerated
          path: |
            sdks/typescript
            !sdks/typescript/node_modules
            !sdks/typescript/dist
          include-hidden-files: true
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=critical
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - if: ${{ !cancelled() && steps.drift.outputs.changed == 'true' }}
        run: |
          echo "Generated code, lockfile or formatting differ from the commit; the regenerated tree is the sdk-typescript-regenerated artifact."
          exit 1
