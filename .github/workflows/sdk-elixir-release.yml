name: sdk-elixir-release

on:
  push:
    tags:
      - "sdk-elixir-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: hex
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: sdks/elixir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix deps.get --check-locked
      - run: mix test --warnings-as-errors
        env:
          MIX_ENV: test
      - name: tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "${TAG#sdk-elixir-v}" = "$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
      - run: mix hex.build --output esuiss_relay.tar
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sdks/elixir/esuiss_relay.tar
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
