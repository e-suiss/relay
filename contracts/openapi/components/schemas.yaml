SubscriberList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Subscriber"
SubscriberBulkRow:
  type: object
  required:
    - external_id
  properties:
    ref:
      type: string
      maxLength: 128
    external_id:
      "$ref": "#/ExternalId"
    email:
      oneOf:
        - "$ref": "#/Email"
        - type: "null"
    phone:
      oneOf:
        - "$ref": "#/E164"
        - type: "null"
    name:
      oneOf:
        - type: string
          maxLength: 200
        - type: "null"
    locale:
      oneOf:
        - "$ref": "#/Locale"
        - type: "null"
    timezone:
      oneOf:
        - "$ref": "#/TimeZone"
        - type: "null"
    legal_type:
      oneOf:
        - "$ref": "#/LegalType"
        - type: "null"
    country:
      oneOf:
        - "$ref": "#/CountryCode"
        - type: "null"
    attributes:
      oneOf:
        - type: object
          description: Recipient attributes available to templates and conditions. Values are strings, numbers or booleans.
          maxProperties: 64
          propertyNames:
            pattern: "^[a-z][a-z0-9_]{0,63}$"
          additionalProperties:
            type:
              - string
              - number
              - boolean
          x-relay-choice: true
          x-relay-choice-note: "The spec mentions declared recipient attributes; shape and bounds are chosen by the contract."
        - type: "null"
  additionalProperties: false
SubscriberBulkRequest:
  type: object
  description: "Bulk upsert; batch rules apply (one Idempotency-Key for the whole request, per-row results)."
  required:
    - subscribers
