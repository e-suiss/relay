      "$ref": "#/ChannelOverride"
    voice:
      "$ref": "#/ChannelOverride"
    push:
      "$ref": "#/RawOverride"
    web_push:
      "$ref": "#/RawOverride"
    whatsapp:
      "$ref": "#/RawOverride"
    in_app:
      "$ref": "#/ChannelOverride"
    webhook:
      "$ref": "#/ChannelOverride"
  additionalProperties: false
EventRequest:
