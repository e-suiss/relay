components:
  securitySchemes:
    subscriber_bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Relay subscriber token from the token exchange. Scopes: inbox:read, inbox:write, preferences, devices:write, presence:write. Access tokens are never accepted here."
  schemas:
    TokenExchangeRequest:
      type: object
      description: RFC 8693 token exchange request.
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          type: string
          const: "urn:ietf:params:oauth:grant-type:token-exchange"
        subject_token:
          type: string
          description: "The end user's DPoP-bound Access access token: typ at+jwt, aud Relay's Access client_id, access_tenant and client_id naming the registered Access client, sub the pairwise subject."
          minLength: 1
          maxLength: 8192
        subject_token_type:
          type: string
          const: "urn:ietf:params:oauth:token-type:access_token"
        requested_token_type:
          type: string
          const: "urn:suiss:relay:token-type:subscriber"
          x-relay-choice: true
          x-relay-choice-note: Token type URI chosen by the contract.
        scope:
          type: string
          description: "Space-separated subset of inbox:read inbox:write preferences devices:write presence:write. Default: inbox:read inbox:write preferences."
          pattern: "^(inbox:read|inbox:write|preferences|devices:write|presence:write)( (inbox:read|inbox:write|preferences|devices:write|presence:write))*$"
      additionalProperties: false
    TokenExchangeResponse:
      type: object
      description: RFC 8693 token exchange response. The tenant identifier is never written into a field the client can see.
      required:
        - access_token
        - issued_token_type
        - token_type
        - expires_in
        - scope
        - subscriber_id
        - environment
      properties:
        access_token:
          type: string
          description: "Relay subscriber token: asymmetrically signed, audience is the Relay inbox and realtime surface, carries the environment and the allowed realtime streams."
        issued_token_type:
          type: string
          const: "urn:suiss:relay:token-type:subscriber"
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 900
          description: "Lifetime in seconds; 15 minutes by default. SDKs renew before expiry."
        scope:
          type: string
        subscriber_id:
          "$ref": "./components/schemas.yaml#/Id_sub"
          x-relay-choice: true
        environment:
          "$ref": "./components/schemas.yaml#/Environment"
      additionalProperties: false
    DeviceStatusWrite:
      type: object
      description: "The changed status signals of a device (IN-53)."
      required:
        - version
        - signals
      properties:
        version:
          type: string
          enum:
            - v1
          description: "The signal dictionary version; an older version stays accepted for at least 12 months after a newer one."
        signals:
          type: object
          description: "Only the signals that changed, each true or false. A key or value outside the dictionary is 422 unknown_field."
          minProperties: 1
          properties:
            worn:
              description: "A wearable is worn."
            locked:
              description: "The screen is locked."
            headphones:
              description: "Headphones are connected."
            focus:
              description: "A focus mode is on."
            break:
              description: "The recipient's own device or agent reports a natural break."
          additionalProperties: false
          x-relay-choice: true
          x-relay-choice-note: "IN-53 makes a value outside the dictionary unknown_field, so the values carry no type here and are checked as booleans by the operation."
        ttl:
          description: "Time to live of the written signals; PT5M by default, cut at PT15M, at least PT1S."
          "$ref": "./components/schemas.yaml#/Duration"
      additionalProperties: false
    DeviceStatus:
      type: object
      description: "The status of one device (IN-47)."
      required:
        - object
        - device_id
        - version
        - signals
      properties:
        object:
          type: string
          enum:
            - device_status
        device_id:
          "$ref": "./components/schemas.yaml#/Id_dev"
        version:
          type: string
          enum:
            - v1
        signals:
          type: object
          required:
            - worn
            - locked
            - headphones
            - focus
            - break
          properties:
            worn:
              "$ref": "#/components/schemas/DeviceSignal"
            locked:
              "$ref": "#/components/schemas/DeviceSignal"
            headphones:
              "$ref": "#/components/schemas/DeviceSignal"
            focus:
              "$ref": "#/components/schemas/DeviceSignal"
            break:
              "$ref": "#/components/schemas/DeviceSignal"
          additionalProperties: false
      additionalProperties: false
    DeviceSignal:
      description: "true or false while the signal is fresh; unknown when it expired, was never written or cannot be read."
      oneOf:
        - type: boolean
        - type: string
          enum:
            - unknown
    DeviceStatusList:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          enum:
            - list
        data:
          type: array
          maxItems: 20
          items:
            "$ref": "#/components/schemas/DeviceStatus"
      additionalProperties: false
    PushReceipt:
      type: object
      description: "A push receipt of the SDK (DS-13)."
      required:
        - delivery_id
        - receipt
      properties:
        delivery_id:
          "$ref": "./components/schemas.yaml#/Id_dlv"
        receipt:
          type: string
          enum:
            - displayed
            - clicked
        occurred_at:
          type: string
          format: date-time
      additionalProperties: false
    PushReceiptRecorded:
      type: object
      required:
        - object
        - delivery_id
        - receipt
      properties:
        object:
          type: string
          enum:
            - push_receipt
        delivery_id:
          "$ref": "./components/schemas.yaml#/Id_dlv"
        receipt:
          type: string
          enum:
            - displayed
            - clicked
      additionalProperties: false
