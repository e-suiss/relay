openapi: "3.1.0"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: Relay Operator API
  version: "2026-11-01"
  description: "Operator family: Access OIDC session and step-up, roles, platform kill switch, tenant suspension, send modes, support delegation, personal data reveal, cross-tenant overview, audit log, API client view and queue panel. Sensitive operations need an Access step-up and fail closed when Access cannot be reached; every management action is audited. JSON in UTF-8, snake_case fields, RFC 3339 UTC times, ISO 8601 durations, amounts and large integers as strings. Unknown fields are rejected with 422 unknown_field at every depth, including overrides; null clears a field and an absent field is left untouched. HTTPS only (TLS 1.2 or later, HSTS). Every response carries Request-Id and Relay-Version. Errors are RFC 9457 problem details whose type resolves to /v1/errors/{code} on the same region. Every POST, PUT, PATCH and DELETE needs an Idempotency-Key (24 hours, fixed); a replay returns the first response byte for byte with Idempotency-Replayed: true. Relay delivers at least once and, with durable idempotency, processes effectively once. Identifiers are opaque, prefixed and time ordered (x-relay-id-prefixes). Resources of other tenants and environments return 404. Health endpoints are not part of this API."
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: "https://{host}"
    description: "Base address of a data region. A region's address never reaches another region's data and never routes between regions."
    variables:
      host:
        default: relay.example.com
tags:
  - name: session
    description: Operator session through Access OIDC and step-up.
  - name: roles
    description: Built-in roles and role assignments.
  - name: platform
    description: "Installation operator: platform kill switch, tenants, suspension, critical interruption opening, queue panel."
  - name: tenant-settings
    description: Send modes and API version pin.
  - name: support
    description: Support access delegation.
  - name: subscribers
    description: Subscriber suspension.
  - name: suppressions
    description: Lifting bounce and complaint suppressions with step-up.
  - name: pii
    description: Audited reveal of masked personal data.
  - name: audit
    description: Audit log read.
  - name: api-clients
    description: Relay-side view of Access API clients.
  - name: channels
    description: "Provider accounts, sender identities and channel identities: adding, archiving, credential rotation, review and suspension with step-up."
paths:
  "/v1/operator/session/login":
    get:
      operationId: startOperatorLogin
      tags:
        - session
      summary: Start operator login
      description: "Redirects to Access (OIDC authorization code with PKCE). Relay has no local users or passwords; the first installation operator also comes from Access and emergency access is Access break-glass."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - name: return_to
          in: query
          description: Panel path to return to.
          required: false
          schema:
            type: string
            pattern: "^/[^/].*$"
            maxLength: 512
      security: []
      responses:
        "302":
          description: Redirect to the Access authorization endpoint.
          headers:
            Location:
              "$ref": "./components/headers.yaml#/Location"
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - malformed_request
        - validation_failed
        - auth_invalid_token
        - auth_step_up_unavailable
        - service_unavailable
        - internal_error
      x-relay-role: null
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
  "/v1/operator/session/callback":
    get:
      operationId: completeOperatorLogin
      tags:
        - session
      summary: Complete operator login
      description: "OIDC callback. Validates state, nonce and the ID token, creates the operator record on first sign-in and starts a session cookie. The external IdP claim behind Access is identity evidence only; roles come from Relay."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - name: code
          in: query
          required: true
          description: Authorization code.
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: true
          description: State.
          schema:
            type: string
            maxLength: 512
      security: []
      responses:
        "302":
          description: "Session started; redirect to the panel."
          headers:
            Location:
              "$ref": "./components/headers.yaml#/Location"
            Set-Cookie:
              "$ref": "./components/headers.yaml#/Set-Cookie"
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - malformed_request
        - validation_failed
        - auth_invalid_token
        - auth_step_up_unavailable
        - service_unavailable
        - internal_error
      x-relay-role: null
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
  "/v1/operator/session":
    get:
      operationId: getOperatorSession
      tags:
        - session
      summary: Get the current session
      description: Returns the operator, role grants and step-up state of the session.
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
      security:
        - operator_session: []
        - operator_bearer: []
      responses:
        "200":
          description: The session.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OperatorSession"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_invalid_session
        - auth_insufficient_role
        - auth_missing_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
      x-relay-role: null
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
    delete:
      operationId: endOperatorSession
      tags:
        - session
      summary: Sign out
      description: Revokes the session.
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
        - "$ref": "./components/parameters.yaml#/CsrfToken"
      security:
        - operator_session: []
        - operator_bearer: []
      responses:
        "204":
          description: Signed out.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Set-Cookie:
              "$ref": "./components/headers.yaml#/Set-Cookie"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "409":
          "$ref": "./components/responses.yaml#/Conflict"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_invalid_session
        - auth_insufficient_role
        - auth_missing_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - auth_csrf_failed
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
      x-relay-role: null
      x-relay-weight: 1
      x-relay-idempotency: required
      x-relay-step-up: false
  "/v1/operator/session/step_up":
    post:
      operationId: startStepUp
      tags:
        - session
      summary: Start a step-up
      description: Returns an Access authorization URL that requests re-authentication (acr_values, max_age). Step-up stays valid for 5 minutes and is bound to this session. If Access cannot be reached, no sensitive operation is performed (auth_step_up_unavailable).
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
        - "$ref": "./components/parameters.yaml#/CsrfToken"
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/StepUpStart"
      security:
        - operator_session: []
        - operator_bearer: []
      responses:
        "200":
          description: Step-up challenge.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/StepUpChallenge"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "409":
          "$ref": "./components/responses.yaml#/Conflict"
        "413":
          "$ref": "./components/responses.yaml#/PayloadTooLarge"
        "415":
          "$ref": "./components/responses.yaml#/UnsupportedMediaType"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_invalid_session
        - auth_insufficient_role
        - auth_missing_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - auth_csrf_failed
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - malformed_request
        - unsupported_media_type
        - payload_too_large
        - validation_failed
        - unknown_field
        - auth_step_up_unavailable
      x-relay-role: null
      x-relay-weight: 1
      x-relay-idempotency: required
      x-relay-step-up: false
      x-relay-choice: true
      x-relay-choice-note: Step-up flow, its 5 minute validity and paths are chosen by the contract.
  "/v1/operator/session/step_up/callback":
    get:
      operationId: completeStepUp
      tags:
        - session
      summary: Complete a step-up
      description: "OIDC callback of the step-up. Records auth_time, acr and the Access step-up record reference on the session; the reference is written to the audit record of every operation that uses it."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - name: code
          in: query
          required: true
          description: Authorization code.
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: true
          description: State.
          schema:
            type: string
            maxLength: 512
      security:
        - operator_session: []
        - operator_bearer: []
      responses:
        "302":
          description: "Step-up complete; redirect to return_to."
          headers:
            Location:
              "$ref": "./components/headers.yaml#/Location"
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_invalid_session
        - auth_insufficient_role
        - auth_missing_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - auth_step_up_unavailable
        - validation_failed
      x-relay-role: null
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
  "/v1/operator/roles":
    get:
      operationId: listRoles
      tags:
        - roles
      summary: List roles
      description: "Built-in roles: installation_operator (the only role above tenants; cannot read tenant data past RLS), tenant_admin, tenant_operator."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
      security:
        - operator_session: []
        - operator_bearer: []
      responses:
        "200":
          description: Roles.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RoleList"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_invalid_session
        - auth_insufficient_role
        - auth_missing_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
      x-relay-role: null
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
  "/v1/operator/role_assignments":
    get:
      operationId: listRoleAssignments
      tags:
        - roles
      summary: List role assignments
      description: "Role assignments of the selected tenant and environment; the installation operator also sees installation assignments."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/RelayTenant"
        - "$ref": "./components/parameters.yaml#/RelayEnvironment"
        - "$ref": "./components/parameters.yaml#/Limit"
        - "$ref": "./components/parameters.yaml#/StartingAfter"
        - "$ref": "./components/parameters.yaml#/EndingBefore"
      security:
        - operator_session: []
        - operator_bearer: []
      responses:
        "200":
          description: A page of assignments.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RoleAssignmentList"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_invalid_session
        - auth_insufficient_role
        - auth_missing_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - auth_environment_mismatch
        - validation_failed
      x-relay-role: tenant_admin
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
    post:
      operationId: createRoleAssignment
      tags:
        - roles
      summary: Assign a role
      description: "Role changes need step-up. A tenant admin assigns tenant roles in its tenant; only the installation operator assigns installation_operator (through the installation tenant context)."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
        - "$ref": "./components/parameters.yaml#/RelayTenant"
        - "$ref": "./components/parameters.yaml#/RelayEnvironment"
        - "$ref": "./components/parameters.yaml#/CsrfToken"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RoleAssignmentCreate"
      security:
        - operator_session: []
        - operator_bearer: []
      responses:
        "201":
          description: Assigned.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Location:
              "$ref": "./components/headers.yaml#/Location"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RoleAssignment"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "404":
          "$ref": "./components/responses.yaml#/NotFound"
        "409":
          "$ref": "./components/responses.yaml#/Conflict"
        "413":
          "$ref": "./components/responses.yaml#/PayloadTooLarge"
        "415":
          "$ref": "./components/responses.yaml#/UnsupportedMediaType"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_invalid_session
        - auth_insufficient_role
        - auth_missing_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - auth_csrf_failed
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - malformed_request
        - unsupported_media_type
        - payload_too_large
        - validation_failed
        - unknown_field
        - auth_step_up_required
        - auth_step_up_unavailable
        - operator_not_found
        - resource_conflict
      x-relay-role: tenant_admin
      x-relay-weight: 1
      x-relay-idempotency: required
      x-relay-step-up: always
  "/v1/operator/role_assignments/{role_assignment_id}/revoke":
    post:
      operationId: revokeRoleAssignment
      tags:
