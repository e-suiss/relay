  properties:
    email:
      oneOf:
        - "$ref": "#/Email"
        - type: "null"
    phone:
      oneOf:
        - "$ref": "#/E164"
        - type: "null"
    name:
      oneOf:
        - type: string
          maxLength: 200
        - type: "null"
    locale:
      oneOf:
        - "$ref": "#/Locale"
        - type: "null"
    timezone:
      oneOf:
        - "$ref": "#/TimeZone"
        - type: "null"
    legal_type:
