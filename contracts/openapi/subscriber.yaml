      x-relay-step-up: false
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "Path and the logout reason are chosen by the contract."
  "/v1/subscriber/push_receipts":
    post:
      operationId: recordMyPushReceipt
      tags:
        - devices
      summary: Record a push receipt
      description: "The mobile or web SDK reports that a push of the token's subscriber was displayed or clicked (actor client_sdk). A displayed receipt is the only delivery evidence of a push and raises the delivery to delivered; a clicked receipt is engagement and leaves delivery as it is. Both are recorded in the delivery's ledger and are decision input (DS-13, DS-12). A delivery of another subscriber or of another channel is 404. occurred_at is the device's time, never later than the server's."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PushReceipt"
      security:
        - subscriber_bearer:
            - "devices:write"
      responses:
        "202":
          description: Recorded.
          headers:
