x-relay-api-versions:
  supported:
    - "2026-11-01"
  latest: "2026-11-01"
  x-relay-choice: true
  x-relay-choice-note: The first dated version identifier is chosen by the contract.
x-relay-limits:
  idempotency_key_ttl_hours: 24
  idempotency_key_length:
    min: 8
    max: 255
  event:
    max_recipients: 100
    max_data_bytes: 262144
    max_send_at_ahead: P90D
    metadata_max_keys: 16
    metadata_max_value_chars: 512
  batch:
    max_events: 500
    max_recipients_per_event: 100
    max_body_bytes: 5242880
    max_row_data_bytes: 262144
  pagination:
    default_limit: 50
    max_limit: 100
  rate_limit:
    burst:
      weight: 200
      window_seconds: 1
    sustained:
      weight: 6000
      window_seconds: 60
    api_client_sub_limit: equal to the tenant limit unless set lower
    invalid_token_per_ip:
      per_minute: 20
      burst: 20
  weights:
    get: 1
    single_event: 1
    batch: rows
    template_or_workflow_write_and_preview: 10
    campaign_start: 100
    other_write: 1
  api_clients_per_environment: 50
  unused_api_client_warning_days: 90
  subscriber_token_lifetime_seconds: 900
  connector_message_max_bytes: 1048576
  operator_step_up_window_seconds: 300
  support_delegation:
    default: PT4H
    min: PT15M
    max: P3D
  devices:
    max_active_per_subscriber: 20
    stale_after: P30D
    inactive_disable_after: P270D
    sweep_batch_max: 1000
    status_ttl_default: PT5M
    status_ttl_max: PT15M
    status_writes_per_second: 1
    sync_coalesce: PT60S
    sync_per_hour_ios: 3
    sync_ttl_android: PT60S
  template:
    max_source_bytes: 262144
    max_loops: 10
    max_loop_depth: 2
    max_nodes: 5000
    max_partials: 50
    preview_masked_samples: 20
    preview_masked_window: P7D
  test_send:
    max_test_recipients: 5
    verification_window: P7D
    max_notifications_per_day: 100
  topic:
    max_subscribers_per_request: 1000
  route:
    max_depth: 4
    max_leaves: 10
  workflow:
    max_steps: 50
    max_branch_depth: 4
    max_branches: 10
    variants_min: 2
    variants_max: 10
    delay_max: P90D
    wait_for_event_max: P30D
    condition_max_nodes: 64
    condition_max_depth: 8
    condition_max_bytes: 4096
    condition_max_string_bytes: 256
    condition_max_list: 100
  x-relay-choice-note: "Values are POLICY DEFAULT and tenant-adjustable; other_write weight 1 and connector_message_max_bytes are contract choices."
  recurrence:
    max_active_per_environment: 100000
    max_interval: 99
    max_count: 1000
    max_until_years: 5
    missed_grace: PT1H
    jitter_spread: PT60S
  digest:
    max_window: P31D
    max_items:
      min: 2
      max: 1000
    max_render_items: 50
  throttle:
    max_window: P31D
    limit:
      min: 1
      max: 10000
    max_key_bytes: 256
  content_dedup:
    min_window: PT1M
    max_window: PT24H
    operational_window: PT5M
  timing:
    release_jitter_spread: PT15M
    scheduled_jitter_spread: PT60S
  realtime:
    accept_per_second: 200
    accept_burst: 400
    retry_after_seconds:
      min: 1
      max: 5
    max_connections_per_subscriber: 10
    max_changes_per_read: 500
    connection_ttl_seconds: 45
    heartbeat_seconds: 15
    keepalive_seconds: 25
    long_poll_wait_seconds: 25
    reauthorize_interval_seconds: 60
    x-relay-choice: true
    x-relay-choice-note: "IN-52 sets the accept rate, burst, Retry-After range and connections per subscriber; IN-29 the 500 changes per read. The connection record lifetime and heartbeat (IN-40), the SSE keep-alive comment interval, the long-poll wait and the re-authorization interval while signals are unavailable (IN-33) are contract choices."
x-relay-error-catalog: "../errors.yaml"
