name: sdk-python

on:
  push:
    branches: [main]
    paths:
      - "sdks/python/**"
      - "contracts/**"
      - "conformance/sdk/**"
      - "conformance/webhooks/**"
      - ".github/workflows/sdk-python.yml"
  pull_request:
    paths:
      - "sdks/python/**"
      - "contracts/**"
      - "conformance/sdk/**"
      - "conformance/webhooks/**"
      - ".github/workflows/sdk-python.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-python-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  UV_EXCLUDE_NEWER: "2026-11-11T00:00:00Z"
  PYTHON_VERSION: "3.15.2"

defaults:
  run:
    working-directory: sdks/python

jobs:
  lock:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # T-78
      - run: uv pip compile pyproject.toml --extra dev --universal --generate-hashes --python-version 3.11 --no-header -o requirements-dev.lock
      - run: git diff --exit-code -- requirements-dev.lock && test -z "$(git status --porcelain -- requirements-dev.lock)"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-lock
          path: sdks/python/requirements-dev.lock

  generate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # X-53
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="origin/$BASE_REF...HEAD" ;;
            push) range="$BEFORE..HEAD" ;;
            *) echo "own=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! files="$(git diff --name-only "$range" 2>/dev/null)"; then
            echo "own=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(sdks/python/|\.github/workflows/sdk-python\.yml$)'; then
            echo "own=true" >> "$GITHUB_OUTPUT"
          else
            echo "own=false" >> "$GITHUB_OUTPUT"
          fi
      - run: ./regenerate.sh
      # X-48
      - if: steps.scope.outputs.own == 'true'
        run: git diff --stat --exit-code -- src/esuiss_relay/_generated && test -z "$(git status --porcelain -- src/esuiss_relay/_generated)"
      - if: steps.scope.outputs.own != 'true'
        run: git diff --stat -- src/esuiss_relay/_generated
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-generated
          path: sdks/python/src/esuiss_relay/_generated

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - run: python -m ruff format --diff .
      - run: python -m ruff check --output-format=github .
      - run: python -m mypy

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.18", "3.15.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - run: python -m pytest

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv build --python ${{ env.PYTHON_VERSION }} --out-dir dist
      - run: ls dist/esuiss_relay-0.1.0-py3-none-any.whl dist/esuiss_relay-0.1.0.tar.gz

  # X-48
  live:
    if: github.event_name == 'schedule' && vars.RELAY_SDK_LIVE_BASE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELAY_SDK_LIVE_BASE_URL: ${{ vars.RELAY_SDK_LIVE_BASE_URL }}
      RELAY_SDK_LIVE_ISSUER: ${{ vars.RELAY_SDK_LIVE_ISSUER }}
      RELAY_SDK_LIVE_CLIENT_ID: ${{ secrets.RELAY_SDK_LIVE_CLIENT_ID }}
      RELAY_SDK_LIVE_CLIENT_SECRET: ${{ secrets.RELAY_SDK_LIVE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - run: python -m pytest -m live tests/live
