image:
  repository: ghcr.io/e-suiss/relay
  digest: ""

host: relay.example.com

region: ""

egressIps: []

previewHost: ""

trustedProxies: []

database:
  url: ""
  queueUrl: ""
  maintUrl: ""
  archiveUrl: ""
  reportUrl: ""
  migratorUrl: ""
  adminUrl: ""
  passwordSecret: relay-database
  migratorPasswordSecret: relay-database-migrator
  adminPasswordSecret: relay-database-admin
  poolSize: 10
  serverRequirements:
    sharedPreloadLibraries: [pg_stat_statements]

valkey:
  url: ""

secretKeyBaseSecret: relay-secret-key-base

metrics:
  port: 9568
  otlpEndpoint: ""

auditStore:
  endpoint: ""
  bucket: ""
  region: ""
  accessKeyId: ""
  secretAccessKeySecret: relay-audit-store

archiveStore:
  endpoint: ""
  bucket: ""
  region: ""
  accessKeyId: ""
  secretAccessKeySecret: relay-archive-store

access:
  issuer: ""
  clientId: ""
  pepCertificateSecret: relay-access-pep

keyStore:
  module: ""
  token: ""
  kekLabel: ""
  fingerprintLabel: ""
  cursorLabel: ""
  pinSecret: relay-key-store-pin
  env: []
  volumes: []
  volumeMounts: []

nodes:
  - name: all
    roles: [api, worker, socket]
    replicas: 1
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {memory: 1Gi}

terminationGracePeriodSeconds: 75

rollout:
  maxUnavailable: 0
  maxSurge: 25%

keda:
  enabled: false
  node: all
  prometheusAddress: ""
  minReplicas: 2
  maxReplicas: 10
  pollingIntervalSeconds: 15
  cooldownPeriodSeconds: 300
  scaleDownStabilizationSeconds: 600
  lanes:
    - lane: l0
      ageSeconds: 2
      depthPerNode: 200
    - lane: l1
      ageSeconds: 15
      depthPerNode: 2000
    - lane: l2
      ageSeconds: 15
      depthPerNode: 5000
    - lane: l3
      ageSeconds: 900
      depthPerNode: 50000

pgbouncer:
  enabled: false
  image:
    repository: ghcr.io/cloudnative-pg/pgbouncer
    tag: 1.26.1-202611051526-trixie
    digest: sha256:3164c7e929c05deef00175c0bb81f3446a59f7254715b43a865ec8cdb83f869e
  replicas: 2
  databaseHost: ""
  databasePort: 5432
  maxClientConnections: 2000
  defaultPoolSize: 20
  maxPreparedStatements: 200
  serverTlsSslMode: require
  userlistSecret: relay-pgbouncer-userlist
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {memory: 128Mi}

postgresExporter:
  enabled: false
  image:
    repository: quay.io/prometheuscommunity/postgres-exporter
    tag: v0.20.1
    digest: sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
  dataSourceSecret: relay-postgres-exporter
  port: 9187
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}

postgresHA:
  enabled: false
  instances: 3
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: 18.6-202611090812-standard-trixie
    digest: sha256:de572898499fab9406f0da51929da562f96f3be40ca79fafea8ec1a8d5b42065
  storageSize: 100Gi
  walStorageSize: 50Gi
  archiveTimeout: 60s
  maxSlotWalKeepSize: 64GB
  backup:
    schedule: "0 0 3 * * *"
    retentionPolicy: 30d
    destinationPath: ""
    endpointUrl: ""
    credentialsSecret: relay-postgres-backup
