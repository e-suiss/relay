name: sdk-dotnet-release

on:
  push:
    tags:
      - "sdk-dotnet-v*"

permissions:
  contents: read

concurrency:
  group: sdk-dotnet-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: sdks/dotnet/global.json
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#sdk-dotnet-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "not a release tag: $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: dotnet restore Esuiss.Relay.slnx --locked-mode
      - run: dotnet build Esuiss.Relay.slnx --no-restore --configuration Release
      - run: dotnet test Esuiss.Relay.slnx --no-build --configuration Release
      - run: dotnet pack src/Esuiss.Relay --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }} --output "$RUNNER_TEMP/packages"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/packages/*.nupkg
      - id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "$RUNNER_TEMP/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
