components:
  schemas:
    CloudEventEnvelope:
      type: object
      description: CloudEvents 1.0 structured envelope shared by Relay and Access (common Suiss webhook profile).
      required:
        - specversion
        - id
        - source
        - type
        - time
        - datacontenttype
        - data
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          description: "Event id; equals webhook-id on webhook delivery."
          maxLength: 512
        source:
          type: string
          description: "Producer source. For tenant-defined event types it is the tenant's value; Relay's internal tenant id is never included."
          maxLength: 1024
        type:
          "$ref": "../openapi/components/schemas.yaml#/EventName"
        time:
          "$ref": "../openapi/components/schemas.yaml#/Timestamp"
        subject:
          type: string
          maxLength: 512
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
          description: Versioned data schema URI of the event type.
          format: uri
        seq:
          type: integer
          minimum: 1
          description: Monotonic sequence per subject (CloudEvents extension).
        traceparent:
          type: string
          pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
        environment:
          "$ref": "../openapi/components/schemas.yaml#/Environment"
        data:
          type: object
      additionalProperties: false
    RealtimeEnvelope:
      type: object
      description: "Realtime envelope {t, v, ts, d}; every message carries counters."
      required:
        - t
        - v
        - ts
        - d
        - counters
      properties:
        t:
          "$ref": "../openapi/components/schemas.yaml#/EventName"
        v:
          type: integer
          minimum: 1
          description: Schema version of the message type.
        ts:
          "$ref": "../openapi/components/schemas.yaml#/Timestamp"
        d:
          type: object
        counters:
          type: object
          required:
            - unseen
            - unread
            - total
            - version
          properties:
            unseen:
              type: integer
              minimum: 0
            unread:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
            version:
              type: integer
              minimum: 0
          additionalProperties: false
      additionalProperties: false
    AuditRecord:
      type: object
      description: "The fields of one audit log record as the audit export carries them: who acted, on whose behalf and under which Access record, on what and why. Encrypted details are not exported."
      required:
        - actor_kind
        - actor_ref
        - on_behalf_of
        - target_type
      properties:
        actor_kind:
          type: string
          enum:
            - operator
            - installation_operator
            - api_client
            - access
            - system
        actor_ref:
          type: string
          maxLength: 256
        on_behalf_of:
          type: string
          maxLength: 256
        access_record_ref:
          oneOf:
            - type: string
