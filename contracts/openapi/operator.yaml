      description: Link to the job queue view (Oban Web with oban_met), mounted under /v1/operator/queues for installation operators. Count queries on large tables are monitored and bounded.
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
      security:
        - operator_session: []
        - operator_bearer: []
      responses:
        "200":
          description: Queue panel link.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/QueuePanel"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_invalid_session
        - auth_insufficient_role
        - auth_missing_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
      x-relay-role: installation_operator
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
      x-relay-choice: true
      x-relay-choice-note: Mount path chosen by the contract.
components:
  securitySchemes:
    access_bearer:
      type: oauth2
      description: "Short-lived Access access token obtained with OAuth 2.0 client credentials for an API client registered in Access. The client is bound to one tenant, one environment and optionally one subtenant. Relay validates the token with the cached Access JWKS: iss, aud (Relay server API), exp and nbf on every request, an allow-list of algorithms, no unsigned tokens. Relay has no API keys of its own. The token endpoint is discovered from the Access issuer."
      flows:
        clientCredentials:
          tokenUrl: "https://access.example.com/oauth2/token"
          scopes:
            publish: Send events and batches, and cancel.
            read: Query events, notifications, deliveries and history.
            subscribers: Write subscribers, devices, topics and subscriptions.
            config: Write workflows, templates, layouts, partials, routes, recurrences, CloudEvents mappings and webhook endpoints.
            kill_switch: Engage and tighten kill switches of campaign and workflow scope only.
    mtls:
      type: mutualTLS
      description: "Optional additional layer for enterprise tenants: RFC 8705 certificate-bound Access tokens. It is used together with access_bearer, never alone."
    operator_session:
      type: apiKey
      in: cookie
      name: relay_operator_session
      description: "Operator session started through Access OIDC on the operator API. Requests carry Relay-Tenant and Relay-Environment; mutating requests carry Relay-Csrf-Token."
      x-relay-choice: true
    operator_bearer:
      type: oauth2
      description: Access access token of an operator whose audience is the Relay operator API, used by the CLI. Step-up uses the RFC 9470 challenge.
      flows:
        authorizationCode:
          authorizationUrl: "https://access.example.com/oauth2/authorize"
          tokenUrl: "https://access.example.com/oauth2/token"
          scopes: {}
      x-relay-choice: true
    suiss_webhook_signature:
      type: apiKey
      in: header
      name: webhook-signature
      description: "Shared Suiss webhook profile: webhook-id, webhook-timestamp and webhook-signature (v1a Ed25519 by default, v1 HMAC only for compatibility), verified against the Access keys from discovery."
  schemas:
    Operator:
      type: object
      required:
        - object
        - id
        - display_name
        - status
        - created_at
      properties:
        object:
          type: string
          const: operator
        id:
          "$ref": "./components/schemas.yaml#/Id_opr"
        display_name:
          type: string
          maxLength: 200
        status:
          type: string
          enum:
            - active
            - suspended
            - deleted
          description: Mirrors the Access user lifecycle.
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    RoleGrant:
      type: object
      description: tenant_id and environment are null for the installation operator role.
      required:
        - role
        - tenant_id
        - environment
      properties:
        role:
          type: string
          enum:
            - installation_operator
            - tenant_admin
            - tenant_operator
        tenant_id:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Id_ten"
            - type: "null"
        environment:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Environment"
            - type: "null"
      additionalProperties: false
    OperatorSession:
      type: object
      required:
        - object
        - id
        - operator
        - roles
        - auth_time
        - expires_at
        - csrf_token
      properties:
        object:
          type: string
          const: operator_session
        id:
          "$ref": "./components/schemas.yaml#/Id_oss"
        operator:
          "$ref": "#/components/schemas/Operator"
        roles:
          type: array
          items:
            "$ref": "#/components/schemas/RoleGrant"
        auth_time:
          "$ref": "./components/schemas.yaml#/Timestamp"
        acr:
          type: string
          maxLength: 128
        step_up_valid_until:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        expires_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        csrf_token:
          type: string
          description: Send in Relay-Csrf-Token on mutating cookie-authenticated requests.
          minLength: 32
          maxLength: 128
      additionalProperties: false
    StepUpStart:
      type: object
      properties:
        return_to:
          type: string
          description: Panel path to return to after step-up.
          pattern: "^/[^/].*$"
          maxLength: 512
      additionalProperties: false
    StepUpChallenge:
      type: object
      required:
        - object
        - authorization_url
        - expires_at
      properties:
        object:
          type: string
          const: step_up_challenge
        authorization_url:
          type: string
          description: "Access authorization URL with acr_values, max_age and prompt=login."
          format: uri
        expires_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    Role:
      "$ref": "./components/schemas.yaml#/Role"
    RoleList:
      allOf:
        - "$ref": "./components/schemas.yaml#/ListEnvelope"
        - properties:
            data:
              type: array
              items:
                "$ref": "./components/schemas.yaml#/Role"
    RoleAssignment:
      type: object
      required:
        - object
        - id
        - operator_id
        - role
        - status
        - granted_by
        - created_at
      properties:
        object:
          type: string
          const: role_assignment
        id:
          "$ref": "./components/schemas.yaml#/Id_rla"
        operator_id:
          "$ref": "./components/schemas.yaml#/Id_opr"
        role:
          type: string
          enum:
            - installation_operator
            - tenant_admin
            - tenant_operator
        tenant_id:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Id_ten"
            - type: "null"
        environment:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Environment"
            - type: "null"
        status:
          type: string
          enum:
            - active
            - revoked
        granted_by:
          type: string
          maxLength: 256
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        revoked_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        revoked_by:
          oneOf:
            - type: string
              maxLength: 256
            - type: "null"
      additionalProperties: false
    RoleAssignmentList:
      allOf:
        - "$ref": "./components/schemas.yaml#/ListEnvelope"
        - properties:
            data:
              type: array
              items:
                "$ref": "#/components/schemas/RoleAssignment"
    RoleAssignmentCreate:
      type: object
      description: Assign a tenant role in the selected tenant. The operator must have signed in once.
      required:
        - operator_id
        - role
        - reason
      properties:
        operator_id:
          "$ref": "./components/schemas.yaml#/Id_opr"
        role:
          type: string
          enum:
            - tenant_admin
            - tenant_operator
        environments:
          type: array
          items:
            "$ref": "./components/schemas.yaml#/Environment"
          minItems: 1
          uniqueItems: true
          default:
            - live
            - test
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    RevokeRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    TenantSuspension:
      type: object
      description: "Suspension. Grounds other than abuse, security or legal take effect at least 7 days after notice; abuse, security and legal take effect at once with a reasoned notice within 24 hours. The appeal window is 14 days after the suspension takes effect. These values await legal approval."
      required:
        - object
        - id
        - tenant_id
        - ground
        - reason
        - effective_at
        - notice_due_at
        - appeal_until
        - state
        - created_by
        - created_at
      properties:
        object:
          type: string
          const: tenant_suspension
        id:
          "$ref": "./components/schemas.yaml#/Id_tsp"
        tenant_id:
          "$ref": "./components/schemas.yaml#/Id_ten"
        subtenant_id:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Id_stn"
            - type: "null"
        ground:
          type: string
          enum:
            - abuse
            - security
            - legal
            - other
        reason:
          type: string
          maxLength: 2000
        effective_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        notice_due_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        appeal_until:
          "$ref": "./components/schemas.yaml#/Timestamp"
        state:
          type: string
          enum:
            - scheduled
            - effective
            - lifted
            - cancelled
        created_by:
          type: string
          maxLength: 256
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        lifted_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
      additionalProperties: false
    SuspendRequest:
      type: object
      required:
        - ground
        - reason
      properties:
        ground:
          type: string
          enum:
            - abuse
            - security
            - legal
            - other
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        subtenant_id:
          "$ref": "./components/schemas.yaml#/Id_stn"
        effective_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
          description: "Required for ground other and at least 7 days ahead; must be absent for the other grounds."
      additionalProperties: false
    ResumeRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        subtenant_id:
          "$ref": "./components/schemas.yaml#/Id_stn"
      additionalProperties: false
    TenantCounters:
      type: object
      description: "Aggregates only; never tenant record content."
      required:
        - notifications_24h
        - queued_deliveries
        - paused_deliveries
        - active_kill_switches
      properties:
        notifications_24h:
          type: integer
          minimum: 0
        queued_deliveries:
          type: integer
          minimum: 0
        paused_deliveries:
          type: integer
          minimum: 0
        active_kill_switches:
          type: integer
          minimum: 0
      additionalProperties: false
    TenantOverview:
      type: object
      required:
        - object
        - id
        - access_tenant_id
        - region
        - status
        - counters
        - created_at
      properties:
        object:
          type: string
          const: tenant_overview
        id:
          "$ref": "./components/schemas.yaml#/Id_ten"
        access_tenant_id:
          type: string
          maxLength: 128
        region:
          type: string
          enum:
            - tr
            - eu
            - us
        status:
          type: string
          enum:
            - active
            - suspended
            - closed
        platform_product:
          oneOf:
            - type: string
              enum:
                - access
                - work
                - executor
                - one
                - pay
            - type: "null"
        api_version:
          oneOf:
            - "$ref": "./components/schemas.yaml#/ApiVersion"
            - type: "null"
        suspensions:
          type: array
          items:
            "$ref": "#/components/schemas/TenantSuspension"
        counters:
          "$ref": "#/components/schemas/TenantCounters"
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    TenantOverviewList:
      allOf:
        - "$ref": "./components/schemas.yaml#/ListEnvelope"
        - properties:
            data:
              type: array
              items:
                "$ref": "#/components/schemas/TenantOverview"
    SendModeSetting:
      type: object
      required:
        - object
        - level
        - mode
        - updated_at
        - updated_by
      properties:
        object:
          type: string
          const: send_mode_setting
        level:
          type: string
          enum:
            - installation
            - tenant
            - channel
            - category_channel
        category:
          oneOf:
            - type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
            - type: "null"
        channel:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Channel"
            - type: "null"
        mode:
          "$ref": "./components/schemas.yaml#/SendMode"
        updated_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        updated_by:
          type: string
          maxLength: 256
      additionalProperties: false
    SendModeList:
      type: object
      description: "Every send mode level of the tenant and environment, plus the installation default. Resolution order: (tenant, category, channel), (tenant, channel), (tenant), installation."
      required:
        - object
        - data
        - has_more
        - next_cursor
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            "$ref": "#/components/schemas/SendModeSetting"
        has_more:
          type: boolean
          const: false
        next_cursor:
          type: "null"
      additionalProperties: false
    SendModeWrite:
      type: object
      description: "Set one level; mode null clears the level. category requires channel. off is not a kill switch."
      required:
        - mode
        - reason
      properties:
        category:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        channel:
          "$ref": "./components/schemas.yaml#/Channel"
        mode:
          oneOf:
            - "$ref": "./components/schemas.yaml#/SendMode"
            - type: "null"
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    SupportDelegation:
      type: object
      required:
        - object
        - id
        - operator_id
        - access
        - reason
        - granted_by
        - starts_at
        - expires_at
        - status
      properties:
        object:
          type: string
          const: support_delegation
        id:
          "$ref": "./components/schemas.yaml#/Id_dlg"
        operator_id:
          "$ref": "./components/schemas.yaml#/Id_opr"
        access:
          type: string
          enum:
            - read
          description: Read-only access with masked personal data.
        reason:
          type: string
          maxLength: 2000
        granted_by:
          type: string
          maxLength: 256
        starts_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        expires_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        status:
          type: string
          enum:
            - active
            - revoked
            - expired
        revoked_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
      additionalProperties: false
    SupportDelegationList:
      allOf:
        - "$ref": "./components/schemas.yaml#/ListEnvelope"
        - properties:
            data:
              type: array
              items:
                "$ref": "#/components/schemas/SupportDelegation"
    SupportDelegationCreate:
      type: object
      required:
        - operator_id
        - reason
      properties:
        operator_id:
          "$ref": "./components/schemas.yaml#/Id_opr"
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        duration:
          "$ref": "./components/schemas.yaml#/Duration"
          description: "Validity, PT15M to P3D; default PT4H."
      additionalProperties: false
    RevealRequest:
      type: object
      required:
        - fields
        - reason
      properties:
        fields:
          type: array
          items:
            type: string
            enum:
              - email
              - phone
              - name
              - attributes
          minItems: 1
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    RevealResult:
      type: object
      required:
        - object
        - subscriber_id
        - fields
        - audit_ids
      properties:
        object:
          type: string
          const: pii_reveal
        subscriber_id:
          "$ref": "./components/schemas.yaml#/Id_sub"
        fields:
          type: object
          properties:
            email:
              oneOf:
                - "$ref": "./components/schemas.yaml#/Email"
                - type: "null"
            phone:
              oneOf:
                - "$ref": "./components/schemas.yaml#/E164"
                - type: "null"
            name:
              oneOf:
                - type: string
                  maxLength: 200
                - type: "null"
            attributes:
              oneOf:
                - type: object
                - type: "null"
          additionalProperties: false
        audit_ids:
          type: array
          description: One pii.revealed audit record per revealed field.
          items:
            "$ref": "./components/schemas.yaml#/Id_aud"
      additionalProperties: false
    AuditRecord:
      type: object
      required:
        - object
        - id
        - action
        - actor_kind
        - actor_ref
        - on_behalf_of
        - created_at
      properties:
        object:
          type: string
          const: audit_record
        id:
          "$ref": "./components/schemas.yaml#/Id_aud"
        action:
          "$ref": "./components/schemas.yaml#/EventName"
        actor_kind:
          type: string
          enum:
            - operator
            - installation_operator
            - api_client
            - access
            - system
        actor_ref:
          type: string
          maxLength: 256
        on_behalf_of:
          type: string
          maxLength: 256
        access_record_ref:
          oneOf:
            - type: string
              maxLength: 256
            - type: "null"
        target_type:
          oneOf:
            - type: string
              maxLength: 64
            - type: "null"
        target_id:
          oneOf:
            - type: string
              maxLength: 128
            - type: "null"
        reason:
          oneOf:
            - type: string
              maxLength: 2000
            - type: "null"
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    AuditRecordList:
      allOf:
        - "$ref": "./components/schemas.yaml#/ListEnvelope"
        - properties:
            data:
              type: array
              items:
                "$ref": "#/components/schemas/AuditRecord"
    ApiClient:
      type: object
      description: Relay-side view of an Access API client. Creation, secret rotation and revocation happen in Access.
      required:
        - object
        - id
        - access_client_id
        - environment
        - scopes
        - status
        - unused_warning
        - created_at
        - updated_at
      properties:
        object:
          type: string
          const: api_client
        id:
          "$ref": "./components/schemas.yaml#/Id_cli"
        access_client_id:
          type: string
          maxLength: 256
        environment:
          "$ref": "./components/schemas.yaml#/Environment"
        tenant:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Id_stn"
            - type: "null"
        scopes:
          type: array
          items:
            "$ref": "./components/schemas.yaml#/ScopeName"
        status:
          type: string
          enum:
            - active
            - suspended
            - revoked
        last_used_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        last_used_ip:
          oneOf:
            - type: string
              maxLength: 45
            - type: "null"
        unused_warning:
          type: boolean
          description: True when unused for 90 days.
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        updated_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    ApiClientList:
      allOf:
        - "$ref": "./components/schemas.yaml#/ListEnvelope"
        - properties:
            data:
              type: array
              items:
                "$ref": "#/components/schemas/ApiClient"
    QueuePanel:
      type: object
      required:
        - object
        - url
      properties:
        object:
          type: string
          const: queue_panel
        url:
          type: string
          format: uri-reference
          examples:
            - "/v1/operator/queues"
      additionalProperties: false
    ApiVersionPin:
      type: object
      required:
        - object
        - pinned
        - supported
        - latest
      properties:
        object:
          type: string
          const: api_version
        pinned:
          oneOf:
            - "$ref": "./components/schemas.yaml#/ApiVersion"
            - type: "null"
        pinned_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        supported:
          type: array
          items:
            "$ref": "./components/schemas.yaml#/ApiVersion"
        latest:
          "$ref": "./components/schemas.yaml#/ApiVersion"
      additionalProperties: false
    ApiVersionWrite:
      type: object
      required:
        - version
        - reason
      properties:
        version:
          "$ref": "./components/schemas.yaml#/ApiVersion"
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    QuotaPolicy:
      type: object
      description: Sending quota of the tenant and environment. Without a policy no quota applies.
      required:
        - object
        - period
        - limit
        - class_caps
        - security_reserve_bp
        - used
        - period_start
        - version
        - updated_at
      properties:
        object:
          type: string
          const: quota_policy
        period:
          type: string
          enum:
            - day
            - month
        limit:
          type: integer
          minimum: 0
          description: Notifications (one per recipient) accepted per period across all classes.
        class_caps:
          type: object
          description: "Optional per-class share of the limit in basis points (for example marketing 8000 = 80 percent)."
          propertyNames:
            "$ref": "./components/schemas.yaml#/MessageClass"
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 10000
        security_reserve_bp:
          type: integer
          minimum: 0
          maximum: 10000
          description: "Extra share open only to the security class once the limit is reached; default 1000 (10 percent)."
        used:
          type: integer
          minimum: 0
        period_start:
          "$ref": "./components/schemas.yaml#/Timestamp"
        version:
          type: integer
          minimum: 1
        updated_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    QuotaPolicyList:
      type: object
      required:
        - object
        - data
        - has_more
        - next_cursor
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            "$ref": "#/components/schemas/QuotaPolicy"
        has_more:
          type: boolean
          const: false
        next_cursor:
