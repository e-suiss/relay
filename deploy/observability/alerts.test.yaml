    alert_rule_test:
      - eval_time: 15m
        alertname: RelayPostgresDiskHigh
        exp_alerts:
          - exp_labels: {severity: warning, decision: OP-31, persistentvolumeclaim: relay-pg-1}
            exp_annotations:
              summary: "A PostgreSQL volume is more than 70% full"
              runbook_url: runbooks/postgres-disk.md
          - exp_labels: {severity: warning, decision: OP-31, persistentvolumeclaim: relay-pg-2}
            exp_annotations:
              summary: "A PostgreSQL volume is more than 70% full"
              runbook_url: runbooks/postgres-disk.md
      - eval_time: 15m
        alertname: RelayPostgresDiskCritical
        exp_alerts:
          - exp_labels: {severity: page, decision: OP-31, persistentvolumeclaim: relay-pg-2}
            exp_annotations:
              summary: "A PostgreSQL volume is more than 85% full"
              runbook_url: runbooks/postgres-disk.md
      - eval_time: 2m
        alertname: RelayPostgresLongTransaction
        exp_alerts:
          - exp_labels: {severity: warning, decision: OP-81}
            exp_annotations:
              summary: "A PostgreSQL transaction has been open for more than five minutes"
              runbook_url: runbooks/postgres-long-transaction.md
      - eval_time: 2m
        alertname: RelayPostgresLongTransactionCritical
        exp_alerts:
          - exp_labels: {severity: page, decision: OP-81}
            exp_annotations:
              summary: "A PostgreSQL transaction has been open for more than thirty minutes"
              runbook_url: runbooks/postgres-long-transaction.md
      - eval_time: 2m
        alertname: RelayPostgresXidAge
        exp_alerts:
          - exp_labels: {severity: warning, decision: OP-81}
            exp_annotations:
              summary: "The oldest unfrozen transaction ID is more than 600 million transactions old"
              runbook_url: runbooks/postgres-xid-age.md
      - eval_time: 2m
        alertname: RelayPostgresXidAgeCritical
        exp_alerts:
          - exp_labels: {severity: page, decision: OP-81}
            exp_annotations:
              summary: "The oldest unfrozen transaction ID is more than one billion transactions old"
              runbook_url: runbooks/postgres-xid-age.md
      - eval_time: 2m
        alertname: RelayPostgresSlotInactive
        exp_alerts:
          - exp_labels: {severity: warning, decision: OP-81, slot_name: standby_1}
            exp_annotations:
              summary: "Replication slot standby_1 has had no consumer for more than thirty minutes"
              runbook_url: runbooks/postgres-replication-slot.md
      - eval_time: 15m
        alertname: RelayPostgresSlotWalRetention
        exp_alerts:
          - exp_labels: {severity: warning, decision: OP-81, slot_name: standby_1}
            exp_annotations:
              summary: "Replication slot standby_1 keeps more than 75% of max_slot_wal_keep_size"
              runbook_url: runbooks/postgres-replication-slot.md
      - eval_time: 2m
        alertname: RelayPostgresSlotWalAtRisk
        exp_alerts:
          - exp_labels: {severity: page, decision: OP-31, slot_name: standby_1}
            exp_annotations:
              summary: "Replication slot standby_1 is about to lose or has lost WAL it needs"
              runbook_url: runbooks/postgres-replication-slot.md
      - eval_time: 5m
        alertname: RelayPostgresArchiverFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: RelayPostgresArchiverFailing
        exp_alerts:
          - exp_labels: {severity: page, decision: OP-81}
            exp_annotations:
              summary: "WAL archiving has been failing for ten minutes"
              runbook_url: runbooks/postgres-archiver.md
      - eval_time: 35m
        alertname: RelayPostgresDeadTuples
        exp_alerts:
          - exp_labels: {severity: warning, decision: OP-81, schemaname: relay, relname: delivery_events_p20270114}
            exp_annotations:
              summary: "More than 20% of the rows of relay.delivery_events_p20270114 are dead"
              runbook_url: runbooks/postgres-vacuum.md
      - eval_time: 70m
        alertname: RelayPostgresInvalidIndex
        exp_alerts:
          - exp_labels: {severity: ticket, decision: OP-81}
            exp_annotations:
              summary: "An invalid index is left behind by a failed concurrent index build"
              runbook_url: runbooks/postgres-index-health.md
      - eval_time: 20m
        alertname: RelayPoolRuleExceeded
        exp_alerts:
          - exp_labels: {severity: warning, decision: OP-88}
            exp_annotations:
              summary: "The nodes' connection demand exceeds half of max_connections without a pooler"
              runbook_url: runbooks/postgres-pool-rule.md
      - eval_time: 10m
        alertname: RelayContainerMemoryHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: RelayContainerMemoryHigh
        exp_alerts:
          - exp_labels: {severity: warning, decision: OP-89, namespace: relay, pod: relay-all-1, container: relay}
            exp_annotations:
              summary: "relay-all-1 uses more than 75% of its memory limit"
              runbook_url: runbooks/container-memory.md
          - exp_labels: {severity: warning, decision: OP-89, namespace: relay, pod: relay-all-2, container: relay}
            exp_annotations:
              summary: "relay-all-2 uses more than 75% of its memory limit"
              runbook_url: runbooks/container-memory.md
      - eval_time: 5m
        alertname: RelayContainerMemoryCritical
        exp_alerts:
          - exp_labels: {severity: page, decision: OP-89, namespace: relay, pod: relay-all-2, container: relay}
            exp_annotations:
              summary: "relay-all-2 uses more than 90% of its memory limit"
              runbook_url: runbooks/container-memory.md
  - interval: 1m
