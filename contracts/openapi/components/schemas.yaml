  pattern: "^whk_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - whk_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_whm:
  type: string
  description: "Webhook message identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^whm_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - whm_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_wha:
  type: string
  description: "Webhook attempt identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^wha_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - wha_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_whb:
  type: string
  description: "Webhook object store batch identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^whb_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - whb_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_whs:
  type: string
  description: "Completion source identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^whs_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - whs_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_acd:
  type: string
  description: "Agent ceiling decision identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^acd_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - acd_01j9zq3k4m5n6p7q8r9s0t1v2w
Region:
  type: string
  description: "Data region of the installation."
  enum:
    - tr
    - eu
    - us
Sha256Digest:
  type: string
  description: "SHA-256 digest: sha256: and 64 lowercase hexadecimal characters."
  pattern: "^sha256:[0-9a-f]{64}$"
MailboxCursor:
  type: string
  description: "Opaque position in a mailbox stream: the stream epoch and the sequence number after which a reader continues."
  minLength: 1
  maxLength: 64
MailboxLeaseId:
  type: string
  description: "Identifier of one lease request: 32 lowercase hexadecimal characters. Only the lease that holds a record acknowledges it."
  pattern: "^[0-9a-f]{32}$"
MailboxRecordState:
  type: string
  description: "Delivery state of a record on the agent face: available (waiting to be leased), leased, acked or dead_lettered (past the redelivery count; kept, never deleted)."
  enum:
    - available
    - leased
    - acked
    - dead_lettered
Mailbox:
  type: object
  description: "The durable mailbox of the calling agent or API client (AG-20, AG-64): one per owner, opened lazily. cursor is the head of the stream and acked_cursor the position up to which every record is acknowledged or dead-lettered; a reader that wakes up continues from acked_cursor. lease_duration and max_redeliveries are the tenant's settings in force, within the published limits (AG-22)."
  required:
    - object
    - id
    - owner
    - state
    - cursor
    - acked_cursor
    - lease_duration
    - max_redeliveries
    - message_key
    - created_at
  properties:
    object:
      type: string
      const: mailbox
    id:
      "$ref": "#/Id_mbx"
    owner:
      type: string
      description: "The owner: an agent (agt_) or API client (cli_) identifier."
      pattern: "^(agt|cli)_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    state:
      type: string
      description: "active, or suspended while the owner is suspended in Access: a suspended mailbox is read but hands out no lease, and its records stay (AG-23)."
      enum:
        - active
        - suspended
    cursor:
      "$ref": "#/MailboxCursor"
    acked_cursor:
      "$ref": "#/MailboxCursor"
    lease_duration:
      "$ref": "#/Duration"
    max_redeliveries:
      type: integer
      minimum: 1
    message_key:
      description: "The public key that verifies the signature of every message of this mailbox (AG-40): whpk_ and the base64 of the Ed25519 key of the tenant environment. Null when the key store cannot be reached now."
      oneOf:
        - type: string
          pattern: "^whpk_[A-Za-z0-9+/]{43}=$"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
TrustLabel:
  type: string
  description: "The trust label of an incoming message (C-77, AG-38, AG-69), the first that holds: blocked (the sender is on the recipient's block list or suspended in Access), spam (the carrying channel or provider flagged the message, or the sender is over the first contact rate), authenticated (the sender's identity is verified: an Access token, a verified webhook signature, A2A authentication or an aligned DMARC pass), unauthenticated (none of them). Relay produces the label; it is never derived from the content."
  enum:
    - blocked
    - spam
    - authenticated
    - unauthenticated
AgentMessage:
  type: object
  description: "The structured message of a mailbox record, signed (C-76, AG-39, AG-40). envelope is the CloudEvents 1.0 envelope as the exact text that was signed; a reader verifies the signature over these characters before it parses them, and acts on nothing it has not verified (AG-41). The signature follows the Suiss webhook profile: the signed content is id, a dot, timestamp, a dot and envelope, and signature is v1a, a comma and the base64 of the Ed25519 signature. key is the public key the signature was made with, whpk_ and its base64; it is the message_key of the mailbox, which a reader pins from there and not from a message. What an agent receives is never a prompt: control information is in the typed fields of the envelope's data, content is data in parts, and Relay writes no free text of its own. A response token, a response link and a waitpoint credential are never part of a message (AG-30)."
  required:
    - object
    - id
    - timestamp
    - signature
    - key
    - envelope
  properties:
    object:
      type: string
      const: agent_message
    id:
      "$ref": "#/Id_mbr"
    timestamp:
      type: integer
      minimum: 0
      description: "The Unix second the envelope was signed."
    signature:
      type: string
      pattern: "^v1a,[A-Za-z0-9+/]{86}==$"
    key:
      type: string
      pattern: "^whpk_[A-Za-z0-9+/]{43}=$"
    envelope:
      type: string
      description: "The CloudEvents 1.0 structured-mode JSON of the record, an AgentMessageEnvelope, as signed."
      contentMediaType: application/cloudevents+json
      contentSchema:
        "$ref": "#/AgentMessageEnvelope"
  additionalProperties: false
AgentMessageEnvelope:
  type: object
  description: "The outer envelope of an agent message: CloudEvents 1.0 and nothing more (C-76, AG-40). id is the record's durable handle, type the record's event type (message.authenticated, message.unauthenticated, message.spam or message.blocked for a message, so the trust label is in the type; a waitpoint event type for a waitpoint event), subject the mailbox and time when the record was appended."
  required:
    - specversion
    - id
    - source
    - type
    - subject
    - time
    - datacontenttype
    - data
  properties:
    specversion:
      type: string
      const: "1.0"
    id:
      "$ref": "#/Id_mbr"
    source:
      type: string
      const: "/v1/mailbox"
    type:
      type: string
      maxLength: 128
    subject:
      "$ref": "#/Id_mbx"
    time:
      "$ref": "#/Timestamp"
    datacontenttype:
      type: string
      const: application/json
    data:
      "$ref": "#/AgentMessageData"
  additionalProperties: false
AgentMessageData:
  type: object
  description: "The typed fields and the content parts of an agent message (MD-11, INV-30, AG-39). Every field but parts is a control field that Relay produces: an identifier, an enumeration, a number or a digest, never free text. Content travels in parts only, as data. The message of a waitpoint.resolved record has one data part with the response value under the member response, untrusted like every other part. content_encryption is null for content Relay can read; a message whose content is encrypted end to end names its scheme there, carries the content as it is and is untrusted as a whole."
  required:
    - message_type
    - mailbox_id
    - epoch
    - seq
    - trust_label
    - sender
    - channel
    - waitpoint_id
    - result
    - responder
    - evidence_level
    - subject_digest
    - response_digest
    - content_encryption
    - content_marking
    - relationship
    - parts
    - links
    - links_withheld
  properties:
    message_type:
      type: string
      enum:
        - message
        - waitpoint_event
    mailbox_id:
      "$ref": "#/Id_mbx"
    epoch:
      type: integer
      minimum: 1
    seq:
      type: integer
      minimum: 1
    trust_label:
      description: "The trust label of a message; null for a waitpoint event, which Relay itself produced."
      oneOf:
        - "$ref": "#/TrustLabel"
        - type: "null"
    sender:
      description: "Who sent a message: the sender's kind, its identifier and whether its identity is verified. Null for a waitpoint event."
      oneOf:
        - type: object
          required:
            - kind
            - id
            - verified
          properties:
            kind:
              type: string
              enum:
                - human
                - system
                - agent
            id:
              type: string
              pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/+=-]{0,255}$"
            verified:
              type: boolean
          additionalProperties: false
        - type: "null"
    channel:
      description: "The channel a message arrived on, or the channel the response to a waitpoint came from."
      oneOf:
        - type: string
          pattern: "^[a-z][a-z_]{0,31}$"
        - type: "null"
    waitpoint_id:
      oneOf:
        - "$ref": "#/Id_wp"
        - type: "null"
    result:
      description: "What a waitpoint event says happened to the waitpoint: the event type without its waitpoint prefix, such as resolved, expired or cancelled."
      oneOf:
        - type: string
          pattern: "^[a-z][a-z_]{0,31}$"
        - type: "null"
    responder:
      description: "Who answered a resolved waitpoint."
      oneOf:
        - type: object
          required:
            - recipient_id
            - kind
          properties:
            recipient_id:
              type: string
              pattern: "^(sub|agt)_[0-7][0-9a-hjkmnp-tv-z]{25}$"
            kind:
              type: string
              enum:
                - subscriber
                - agent
          additionalProperties: false
        - type: "null"
    evidence_level:
      description: "The evidence level of the channel a response came from (AG-26). A response is never an authorisation."
      oneOf:
        - type: string
          enum:
            - channel_claim
            - relay_session
            - access_aas_ref
        - type: "null"
    subject_digest:
      description: "The digest of the work the message or the response is bound to."
      oneOf:
        - "$ref": "#/Sha256Digest"
        - type: "null"
    response_digest:
      oneOf:
        - "$ref": "#/Sha256Digest"
        - type: "null"
    content_encryption:
      description: "The scheme of an end-to-end encrypted envelope as its sender named it; null for content Relay can read."
      oneOf:
        - "$ref": "#/ContentEncryption"
        - type: "null"
    content_marking:
      description: "encrypted_untrusted_content for a message that carries an end-to-end encrypted envelope (AG-57): Relay cannot read it and applies no content rule to it, the message has no parts, the envelope is read with getMailboxMessage and the recipient treats what it decrypts as untrusted content. Null otherwise."
      oneOf:
        - type: string
          const: encrypted_untrusted_content
        - type: "null"
    relationship:
      description: "The relationship level the recipient holds towards the sender of a message between agents; null for any other message."
      oneOf:
        - "$ref": "#/RelationshipLevel"
        - type: "null"
    parts:
      type: array
      items:
        "$ref": "#/AgentMessagePart"
    links:
      type: array
      description: "The action links of the message whose origin is on the tenant's allow list. A link is not to be opened unverified; a URL inside a text part is text."
      items:
        type: object
        required:
          - rel
          - href
        properties:
          rel:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,31}$"
          href:
            type: string
            format: uri
            maxLength: 2048
        additionalProperties: false
    links_withheld:
      type: integer
      minimum: 0
      description: "How many links of the message were withheld because their target is not on the tenant's allow list."
  additionalProperties: false
AgentMessagePart:
  description: "A content part in the A2A shape: a text part or a data part with its mediaType, and audience, the counterpart of MCP annotations.audience (C-76, AG-40). Every part a sender supplied is untrusted and says so in untrusted: the value of its mark and its source. It is data for an unprivileged context, never an instruction (TP-44, AG-41)."
  oneOf:
    - "$ref": "#/AgentMessageTextPart"
    - "$ref": "#/AgentMessageDataPart"
AgentMessageUntrusted:
  type: object
  description: "The untrusted content mark of a part (AG-68): nonce is the 128-bit random value of this part's boundary marks, drawn anew for every part of every envelope, and source says who wrote the content, whether that author is verified and on which channel it came."
  required:
    - nonce
    - source
  properties:
    nonce:
      type: string
      pattern: "^[0-9a-f]{32}$"
    source:
      type: object
      required:
        - author
        - verified
        - channel
      properties:
        author:
          oneOf:
            - type: object
              required:
                - kind
                - id
              properties:
                kind:
                  type: string
                  enum:
                    - human
                    - system
                    - agent
                id:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/+=-]{0,255}$"
              additionalProperties: false
            - type: "null"
        verified:
          type: boolean
        channel:
          oneOf:
            - type: string
              pattern: "^[a-z][a-z_]{0,31}$"
            - type: "null"
      additionalProperties: false
  additionalProperties: false
AgentMessageContentRef:
  type: object
  description: "A reference to content of a part that is not in the envelope: the record and the index of the part, read with getMailboxRecord and content=referenced, and its size in bytes."
  required:
    - record_id
    - part
    - bytes
  properties:
    record_id:
      "$ref": "#/Id_mbr"
    part:
      type: integer
      minimum: 0
    bytes:
      type: integer
      minimum: 0
  additionalProperties: false
AgentMessageTextPart:
  type: object
  description: "Untrusted text (AG-68). text starts with <<<relay:untrusted:N>>> and ends with <<<relay:end:N>>>, N being untrusted.nonce; every <<<relay: inside the text is written <<<relay%3A. The text is normalised to what a person would see: for HTML, comments, script, style, template, head and noscript elements, elements with hidden or aria-hidden=true and elements whose inline style hides them are dropped with their content and every other tag is dropped; then Unicode NFC; then invisible characters are dropped. text is null when the text is over the message limit and travels by reference (content_ref). raw_ref is present when the normalisation changed the text: the raw form, of raw_mediaType, is read by that reference and arrives in raw_text between the same marks."
  required:
    - kind
    - mediaType
    - audience
    - text
    - untrusted
    - content_ref
    - raw_ref
    - raw_mediaType
    - raw_text
  properties:
    kind:
      type: string
      const: text
    mediaType:
      type: string
      const: text/plain
    audience:
      "$ref": "#/AgentMessageAudience"
    text:
      oneOf:
        - type: string
        - type: "null"
    untrusted:
      "$ref": "#/AgentMessageUntrusted"
    content_ref:
      oneOf:
        - "$ref": "#/AgentMessageContentRef"
        - type: "null"
    raw_ref:
      oneOf:
        - "$ref": "#/AgentMessageContentRef"
        - type: "null"
    raw_mediaType:
      type: string
      enum:
        - text/plain
        - text/html
    raw_text:
      oneOf:
        - type: string
        - type: "null"
  additionalProperties: false
AgentMessageDataPart:
  type: object
  description: "Untrusted structured data. Every string in data, a key or a value, is normalised as text is (Unicode NFC, invisible characters dropped) and has <<<relay: written <<<relay%3A."
  required:
    - kind
    - mediaType
    - audience
    - data
    - untrusted
  properties:
    kind:
      type: string
      const: data
    mediaType:
      type: string
      const: application/json
    audience:
      "$ref": "#/AgentMessageAudience"
    data:
      type: object
      additionalProperties: true
    untrusted:
      "$ref": "#/AgentMessageUntrusted"
  additionalProperties: false
AgentMessageAudience:
  type: array
  description: "Who the part is for: the user, the assistant or both."
  minItems: 1
  uniqueItems: true
  items:
    type: string
    enum:
      - user
      - assistant
MailboxRecord:
  type: object
  description: "A durable mailbox record (C-68). id is the durable handle a wake hint carries and the identifier a reader deduplicates by: delivery is at least once (AG-21). epoch and seq are the record's position in the mailbox stream; seq follows commit order, so reading in seq order is the guaranteed order (AG-24). A waitpoint_event record names its waitpoint, whose state and response are read from the waitpoint. trust_label is the label of a message record (AG-38). message is the structured message of the record, signed, for the owner of the mailbox; it is null for a reader that is not the owner, in the dead letter view (the message of a dead letter is read by its handle) and for a message whose content can no longer be opened."
  required:
    - object
    - id
    - mailbox_id
    - epoch
    - seq
    - kind
    - event_type
    - waitpoint_id
    - trust_label
    - message
    - payload_digest
    - state
    - delivery_count
    - lease_expires_at
    - acked_at
    - dead_lettered_at
    - created_at
  properties:
    object:
      type: string
      const: mailbox_record
    id:
      "$ref": "#/Id_mbr"
    mailbox_id:
      "$ref": "#/Id_mbx"
    epoch:
      type: integer
      minimum: 1
    seq:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
        - message
        - waitpoint_event
    event_type:
      type: string
      maxLength: 128
    waitpoint_id:
      oneOf:
        - "$ref": "#/Id_wp"
        - type: "null"
    trust_label:
      oneOf:
        - "$ref": "#/TrustLabel"
        - type: "null"
    message:
      oneOf:
        - "$ref": "#/AgentMessage"
        - type: "null"
    payload_digest:
      "$ref": "#/Sha256Digest"
    state:
      "$ref": "#/MailboxRecordState"
    delivery_count:
      type: integer
      minimum: 0
      description: "How many times the record was handed out with a lease."
    lease_expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    acked_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    dead_lettered_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
MailboxLeaseRequest:
  type: object
  description: "A lease request: at most max records, oldest first. max is at most the published limit mailbox.lease_max_records; a larger value is refused with the limit in the error."
  properties:
    max:
      type: integer
      minimum: 1
      default: 1
  additionalProperties: false
MailboxLease:
  type: object
  description: "The records one lease request took, in stream order, and the lease that holds them until lease_expires_at. A record that is not acknowledged with this lease_id by then is handed out again; past the redelivery count it moves to the dead letters instead (AG-20, AG-22). The lease runs on Relay's clock, never the caller's; in the test environment the virtual clock moves it. lease_expires_at is null when no record was taken."
  required:
    - object
    - lease_id
    - lease_expires_at
    - records
  properties:
    object:
      type: string
      const: mailbox_lease
    lease_id:
      "$ref": "#/MailboxLeaseId"
    lease_expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    records:
      type: array
      items:
        "$ref": "#/MailboxRecord"
  additionalProperties: false
A2aStreamResponse:
  type: object
  description: "An A2A StreamResponse as a push notification carries it: exactly one of task, statusUpdate, artifactUpdate and message. Relay reads the task the event names, the state of its status and its sequence number, and nothing else."
  minProperties: 1
  maxProperties: 1
  properties:
    task:
      type: object
    statusUpdate:
      type: object
    artifactUpdate:
      type: object
    message:
      type: object
  additionalProperties: false
OpaqueEventRequest:
  type: object
  description: "An AG-UI event for a subscriber: the recipient and the payload as text. Relay carries the payload without reading it."
  required:
    - recipient_id
    - payload
  properties:
    recipient_id:
      "$ref": "#/Id_sub"
    payload:
      type: string
      minLength: 1
      maxLength: 65536
  additionalProperties: false
OpaqueEvent:
  type: object
  description: "An appended opaque event: its durable handle and its position in the subscriber's stream."
  required:
    - object
    - stream
    - id
    - mailbox_id
    - cursor
    - payload_digest
  properties:
    object:
      type: string
      const: opaque_event
    stream:
      type: string
      const: ag_ui
    id:
      "$ref": "#/Id_mbr"
    mailbox_id:
      type: string
      pattern: "^mbx_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    cursor:
      type: string
      maxLength: 512
    payload_digest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
  additionalProperties: false
McpRequest:
  type: object
  description: "One JSON-RPC 2.0 request of the Model Context Protocol. A request without id is a notification and gets no response body."
  required:
    - jsonrpc
    - method
  properties:
    jsonrpc:
      type: string
      const: "2.0"
    id:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: integer
    method:
      type: string
      minLength: 1
      maxLength: 64
    params:
      type: object
      description: "The parameters of the method. _meta carries io.modelcontextprotocol/protocolVersion, io.modelcontextprotocol/clientInfo and io.modelcontextprotocol/clientCapabilities; tools/call carries name and arguments."
  additionalProperties: false
McpResponse:
  type: object
  description: "One JSON-RPC 2.0 response of the Model Context Protocol: a result or an error. A result carries resultType complete; Relay never answers input_required."
  required:
    - jsonrpc
  properties:
    jsonrpc:
      type: string
      const: "2.0"
    id:
      oneOf:
        - type: string
          maxLength: 128
        - type: integer
        - type: "null"
    result:
      type: object
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
          maxLength: 1024
        data:
          type: object
      additionalProperties: false
  additionalProperties: false
MailboxAckRequest:
  type: object
  description: "Acknowledges records of one lease."
  required:
    - lease_id
    - record_ids
  properties:
    lease_id:
      "$ref": "#/MailboxLeaseId"
    record_ids:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        "$ref": "#/Id_mbr"
  additionalProperties: false
MailboxAck:
  type: object
  description: "The outcome of an acknowledgement, one result for each record: acked, already_acked, lease_lost (the lease ran out and another lease holds the record, or the record is dead-lettered) or not_found."
  required:
    - object
    - results
    - acked_cursor
  properties:
    object:
      type: string
      const: mailbox_ack
    results:
      type: array
      items:
        type: object
        required:
          - record_id
          - result
        properties:
          record_id:
            "$ref": "#/Id_mbr"
          result:
            type: string
            enum:
              - acked
              - already_acked
              - lease_lost
              - not_found
        additionalProperties: false
    acked_cursor:
      "$ref": "#/MailboxCursor"
  additionalProperties: false
MailboxRecords:
  type: object
  description: "Records after a position, in stream order (AG-24). cursor is the position to continue from. resync_required says the position given no longer holds (another epoch, or outside the stream): the reader starts over from cursor, which is then the acknowledged position."
  required:
    - object
    - records
    - cursor
    - has_more
    - resync_required
  properties:
    object:
      type: string
      const: mailbox_records
    records:
      type: array
      maxItems: 100
      items:
        "$ref": "#/MailboxRecord"
    cursor:
      "$ref": "#/MailboxCursor"
    has_more:
      type: boolean
    resync_required:
      type: boolean
  additionalProperties: false
MailboxRecordList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/MailboxRecord"
  description: "A page of mailbox records."
RelationshipLevel:
  type: string
  description: "The relationship level a recipient holds towards a sender, copied from Access relationship events (AG-59). A level is a policy input and never an authority."
  enum:
    - unknown
    - known
    - verified
    - trusted
ContentEncryption:
  type: string
  description: "The name of the scheme the sender encrypted the envelope with, as the sender states it. Relay records it and does not interpret it."
  pattern: "^[A-Za-z0-9][A-Za-z0-9._+:/-]{0,63}$"
EncryptedEnvelope:
  type: object
  description: "An end-to-end encrypted envelope (AG-56). ciphertext is the envelope in base64, at most x-relay-limits encrypted_envelope.max_bytes once decoded. Relay holds no key for it."
  required:
    - content_encryption
    - ciphertext
  properties:
    content_encryption:
      "$ref": "#/ContentEncryption"
    ciphertext:
      type: string
      minLength: 4
      maxLength: 349528
      pattern: "^[A-Za-z0-9+/]+={0,2}$"
  additionalProperties: false
MailboxMessageRequest:
  type: object
  description: "A message to the mailbox of another agent. first_contact_token is a Privacy Pass token of type 0x0002 (RFC 9578) in unpadded base64url, needed only while the recipient's relationship level towards the sender is unknown (AG-60)."
  required:
    - to
    - encrypted_envelope
  properties:
    to:
      "$ref": "#/Id_agt"
    encrypted_envelope:
      "$ref": "#/EncryptedEnvelope"
    first_contact_token:
      type: string
      pattern: "^[A-Za-z0-9_-]{472}$"
  additionalProperties: false
MailboxMessageReceipt:
  type: object
  description: "The answer to a sent message: the identifier of its record. It says nothing about the recipient's relationship level or block list."
  required:
    - object
    - id
    - created_at
  properties:
    object:
      type: string
      const: mailbox_message_receipt
    id:
      "$ref": "#/Id_mbr"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
MailboxMessage:
  type: object
  description: "What Relay records of a message that carries an encrypted envelope (AG-67): the sender, the recipient, the size of the envelope in bytes, the time, the trust label, relationship and content_encryption, with the record's identifier and position. No field is derived from the content. content_marking says how the envelope is to be treated: encrypted, untrusted content (AG-57)."
  required:
    - object
    - id
    - mailbox_id
    - epoch
    - seq
    - sender
    - recipient
    - size
    - sent_at
    - trust_label
    - relationship
    - content_encryption
    - content_marking
  properties:
    object:
      type: string
      const: mailbox_message
    id:
      "$ref": "#/Id_mbr"
    mailbox_id:
      "$ref": "#/Id_mbx"
    epoch:
      type: integer
      minimum: 1
    seq:
      type: integer
      minimum: 1
    sender:
      "$ref": "#/Id_agt"
    recipient:
      "$ref": "#/Id_agt"
    size:
      type: integer
      minimum: 1
    sent_at:
      "$ref": "#/Timestamp"
    trust_label:
      "$ref": "#/TrustLabel"
    relationship:
      "$ref": "#/RelationshipLevel"
    content_encryption:
      "$ref": "#/ContentEncryption"
    content_marking:
      type: string
      const: encrypted_untrusted_content
  additionalProperties: false
MailboxMessageList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/MailboxMessage"
  description: "A page of messages."
MailboxEnvelope:
  type: object
  description: "A message with its encrypted envelope as it was sent, in base64. ciphertext is null once the content was erased."
  required:
    - object
    - message
    - ciphertext
  properties:
    object:
      type: string
      const: mailbox_envelope
    message:
      "$ref": "#/MailboxMessage"
    ciphertext:
      oneOf:
        - type: string
          maxLength: 349528
        - type: "null"
  additionalProperties: false
MailboxBlockRequest:
  type: object
  description: "Blocks a sender (blocked true) or lifts the block (blocked false)."
  required:
    - sender
    - blocked
  properties:
    sender:
      "$ref": "#/Id_agt"
    blocked:
      type: boolean
  additionalProperties: false
MailboxBlock:
  type: object
  description: "The block of a sender on the caller's mailbox (AG-61)."
  required:
    - object
    - sender
    - state
    - blocked_at
    - lifted_at
  properties:
    object:
      type: string
      const: mailbox_block
    sender:
      "$ref": "#/Id_agt"
    state:
      type: string
      enum:
        - blocked
        - lifted
    blocked_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    lifted_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
MailboxAbuseReportRequest:
  type: object
  description: "An abuse report of one message. statement is the reporter's own account of the content, attached only by the reporter's choice; it is carried as the reporter's statement, unverified."
  required:
    - record_id
  properties:
    record_id:
      "$ref": "#/Id_mbr"
    statement:
      type: string
      minLength: 1
      maxLength: 8192
  additionalProperties: false
MailboxAbuseReport:
  type: object
  description: "An abuse report as recorded (AG-61)."
  required:
    - object
    - record_id
    - reported_at
    - statement_attached
  properties:
    object:
      type: string
      const: mailbox_abuse_report
    record_id:
      "$ref": "#/Id_mbr"
    reported_at:
      "$ref": "#/Timestamp"
    statement_attached:
      type: boolean
  additionalProperties: false
CorrelationId:
  type: string
  description: "The sender's correlation identifier, 1 to 128 printable ASCII characters. Returned in outgoing events as the correlationid extension."
  minLength: 1
  maxLength: 128
  pattern: "^[\\x20-\\x7E]+$"
CorrelationKey:
  type: string
  description: "Exact correlation key of a waitpoint match: printable ASCII without spaces, 1 to 256 characters. Matched exactly, never by pattern."
  pattern: "^[\\x21-\\x7E]{1,256}$"
Interruption:
  type: string
  description: "Interruption level of the notification; the only accepted name of this field, no alias is accepted."
  enum:
    - passive
    - active
    - time-sensitive
    - critical
EventLink:
  type: object
  description: "A link of the notification."
  required:
    - rel
    - href
  properties:
    rel:
      type: string
      description: "Link relation, unique in the request. Templates read the link as links.<rel>; primary is the target of a push tap and of the inbox item."
      pattern: "^[a-z][a-z0-9_]{0,31}$"
    href:
      type: string
      description: "Absolute https URI; another scheme is rejected with 422 link_scheme_not_allowed (a mobile deep link uses a universal or app link). Click tracking wraps the link."
      format: uri
      maxLength: 2048
    title:
      type: string
      maxLength: 200
  additionalProperties: false
ItemRef:
  type: object
  description: "The sender's item reference. Relay does not interpret it; it is stored with the notification and returned in notification and delivery events and in the inbox item."
  required:
    - ref
    - version
    - digest
  properties:
    ref:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    version:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[\\x20-\\x7E]+$"
    digest:
      "$ref": "#/Sha256Digest"
  additionalProperties: false
Capability:
  type: string
  description: "Capability URN under the Suiss urn:suiss: prefix; the suffix grows only with an incompatible change. Defined capabilities: urn:suiss:relay:events:1, urn:suiss:relay:waitpoint:1, urn:suiss:relay:escalation:1, urn:suiss:relay:agent_ceiling:1, urn:suiss:relay:webhook_endpoints:1, urn:suiss:relay:product_events:1."
  pattern: "^urn:suiss:relay:[a-z][a-z_]*:[1-9][0-9]*$"
  maxLength: 128
  examples:
    - "urn:suiss:relay:events:1"
RelayConfiguration:
  type: object
  description: "Relay discovery document of the installation."
  required:
    - issuer
    - api_base
    - region
    - access_issuer
    - access_client_id
    - contract_version
    - contract_versions_supported
    - jwks_uri
    - capabilities
  properties:
    issuer:
      type: string
      format: uri
      description: "Base URL of the installation without a trailing slash; the source of outgoing events. Equals byte for byte the suiss_relay value of the Access Suiss discovery document, and this document is found at <suiss_relay>/.well-known/relay-configuration."
    api_base:
      type: string
      format: uri
      description: "<issuer>/v1."
    region:
      "$ref": "#/Region"
    access_issuer:
      type: string
      format: uri
      description: "Issuer of the Access the installation is bound to."
    access_client_id:
      type: string
      minLength: 1
      maxLength: 256
      description: "client_id of Relay's own Access client registration. Every subscriber external_id and responder sub is the pairwise Access sub in this client's sector; resolve PartyRef to sub with Access subjects:resolve using this client_id."
    contract_version:
      "$ref": "#/ApiVersion"
      description: "Latest dated API version."
    contract_versions_supported:
      type: array
      items:
        "$ref": "#/ApiVersion"
      minItems: 1
    jwks_uri:
      type: string
      format: uri
      description: "<issuer>/.well-known/relay-jwks.json: the product event key set."
    capabilities:
      type: array
      items:
        "$ref": "#/Capability"
      uniqueItems: true
    events_endpoint:
      type: string
      format: uri
      description: "Present with urn:suiss:relay:events:1."
    waitpoints_endpoint:
      type: string
      format: uri
      description: "Present with urn:suiss:relay:waitpoint:1."
    escalation_policies_endpoint:
      type: string
      format: uri
      description: "Present with urn:suiss:relay:escalation:1."
    agents_endpoint:
      type: string
      format: uri
      description: "Present with urn:suiss:relay:agent_ceiling:1."
    webhook_endpoints_endpoint:
      type: string
      format: uri
      description: "Present with urn:suiss:relay:webhook_endpoints:1."
  additionalProperties: false
JsonWebKey:
  type: object
  description: "Public Ed25519 key of the product event signature."
  required:
    - kty
    - crv
    - kid
    - use
    - x
  properties:
    kty:
      type: string
      const: OKP
    crv:
      type: string
      const: Ed25519
    kid:
      type: string
      minLength: 1
      maxLength: 128
    use:
      type: string
      const: sig
    x:
      type: string
      description: "Public key, base64url without padding."
      pattern: "^[A-Za-z0-9_-]{43}$"
  additionalProperties: false
JsonWebKeySet:
  type: object
  description: "JSON Web Key Set (RFC 7517)."
  required:
    - keys
  properties:
    keys:
      type: array
      items:
        "$ref": "#/JsonWebKey"
  additionalProperties: false
WaitpointKind:
  type: string
  enum:
    - question
    - review
    - event
WaitpointState:
  type: string
  enum:
    - open
    - stalled
    - resolved
    - expired
    - cancelled
WaitpointTag:
  type: string
  pattern: "^[a-z0-9][a-z0-9_.:-]{0,63}$"
Waiter:
  type: object
  description: "Who waits: an agent or an API client. Result events and the early-response buffer live in the waiter's mailbox."
  required:
    - kind
    - id
  properties:
    kind:
      type: string
      enum:
        - agent
        - api_client
    id:
      type: string
      description: "agt_ for an agent, cli_ for an API client."
      pattern: "^(agt|cli)_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "The spec names the waiter as an agent or an API client; the object shape is chosen by the contract."
Responder:
  type: object
  description: "A responder of a waitpoint or an escalation tier."
  required:
    - kind
    - id
  properties:
    kind:
      type: string
      enum:
        - subscriber
        - agent
    id:
      type: string
      description: "The subscriber's external_id, or an agent's agt_ identifier."
      maxLength: 256
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "The object shape of a responder reference is chosen by the contract."
WaitpointMatch:
  type: object
  description: "First-stage exact match: event type and correlation key. The correlation key is taken only here, at creation; Relay stores only its keyed digest and never returns it in a response, an event or a log (AG-65)."
  required:
    - type
    - correlation_key
  properties:
    type:
      "$ref": "#/EventName"
    correlation_key:
      "$ref": "#/CorrelationKey"
  additionalProperties: false
WaitpointMatchView:
  type: object
  description: "First-stage exact match of a stored waitpoint: the event type only; the correlation key given at creation is never returned (AG-65)."
  required:
    - type
  properties:
    type:
      "$ref": "#/EventName"
  additionalProperties: false
EscalationTier:
  type: object
  description: "One escalation tier."
  required:
    - after
  properties:
    after:
      "$ref": "#/Duration"
      description: "Time after the previous tier, or after creation for the first tier; at least PT1M."
    add_responders:
      type: array
      description: "Responders invited at this tier; each must be in the waitpoint's responders."
      items:
        "$ref": "#/Responder"
      maxItems: 50
    channels:
      type: array
      description: "Channel escalation of this tier."
      items:
        "$ref": "#/Channel"
      uniqueItems: true
    repeat:
      type: integer
      description: "Repeats of this tier at the same interval."
      minimum: 0
      maximum: 5
      default: 0
    skip_if_empty:
      type: boolean
      description: "A tier without a reachable responder is skipped and escalation_tier_skipped is recorded."
      default: true
  additionalProperties: false
EscalationPolicyKey:
  type: string
  description: "Key of an escalation policy, unique in its environment."
  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  minLength: 1
  maxLength: 100
EscalationPolicyDefinition:
  type: object
  description: "An inline escalation policy definition: at least one tier and at most x-relay-limits waitpoint.max_escalation_tiers. More tiers are 422 validation_failed with too_long at /escalation_policy/tiers, the limit and the count sent."
  required:
    - tiers
  properties:
    tiers:
      type: array
      items:
        "$ref": "#/EscalationTier"
      minItems: 1
  additionalProperties: false
EscalationPolicyReference:
  type: object
  description: "Reference to a stored escalation policy."
  required:
    - key
  properties:
    key:
      "$ref": "#/EscalationPolicyKey"
    version:
      type: integer
      minimum: 1
      description: "Without a version the latest version at creation is pinned."
  additionalProperties: false
WaitpointEscalation:
  type: object
  description: "The escalation policy version the waitpoint pinned."
  required:
    - version
    - inline
  properties:
    key:
      oneOf:
        - "$ref": "#/EscalationPolicyKey"
        - type: "null"
    version:
      type: integer
      minimum: 1
    inline:
      type: boolean
      description: "true for an inline definition stored as an anonymous version of this waitpoint; key is then null."
  additionalProperties: false
SurfaceTarget:
  type: object
  description: "One surface of a surface policy step: a registered device of the responder, or a channel; exactly one of the two. in_app is not a surface of a step: the inbox record is written at once, whatever the policy says."
  properties:
    device_id:
      "$ref": "#/Id_dev"
    channel:
      "$ref": "#/Channel"
  minProperties: 1
  maxProperties: 1
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "AG-63 names a surface as a registered device (device_id) or a channel; the object shape is chosen by the contract."
SurfacePolicyStep:
  type: object
  description: "One step of a responder's surface policy: the surfaces invited together and the time after which the next step is invited when no response has come."
  required:
    - surfaces
    - escalate_after
  properties:
    surfaces:
      type: array
      items:
        "$ref": "#/SurfaceTarget"
      minItems: 1
      maxItems: 20
    escalate_after:
      "$ref": "#/Duration"
      description: "Time after this step is invited before the next step is; at least PT1S. The sender gives it; Relay sets no default."
  additionalProperties: false
SurfacePolicyRecipient:
  type: object
  description: "The surface policy of one responder: ordered steps. The first step is invited when the responder is; each next step when the step before it has waited its escalate_after without a response. Surfaces no step names are invited together after the last step."
  required:
    - responder
    - steps
  properties:
    responder:
      "$ref": "#/Responder"
      description: "A responder of the waitpoint; the policy never changes the responders."
    steps:
      type: array
      items:
        "$ref": "#/SurfacePolicyStep"
      minItems: 1
      maxItems: 10
  additionalProperties: false
SurfacePolicy:
  type: object
  description: "The sender's surface policy (AG-63): for each responder it names, on which surfaces the invitation interrupts first and when it moves on. It orders only the interrupting deliveries; the inbox record is written at once. A surface that is not registered for the responder, is not permitted or fails for good is recorded as surface_step_skipped and the next step is invited without waiting. The schedule never extends expires_at, stops when the waitpoint is resolved, cancelled or stalled and goes on from the step it stopped at when the heartbeat returns. A responder without a policy is invited on every device and channel at once. At most 16 kB."
  required:
    - recipients
  properties:
    recipients:
      type: array
      items:
        "$ref": "#/SurfacePolicyRecipient"
      minItems: 1
      maxItems: 50
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "AG-63 gives the rule (ordered steps of a surface set and escalate_after per responder); the member names and the bounds on steps and surfaces are chosen by the contract."
WaitpointProfile:
  type: string
  description: "A profile narrows a waitpoint. guardian_approval is the request of a child that a guardian decides (AG-62): a review whose responders the creator takes from the guardianship and household records, whose expires_at comes from the creator and is never moved, and which takes no default_response, because silence is no response; when it expires only waitpoint.expired is produced."
  enum:
    - guardian_approval
WaitpointAccessLink:
  type: string
  format: uri
  pattern: "^https://"
  maxLength: 2048
  description: "The deep link to the Access approval surface where the decision of this request is given (E-16, AG-32, IN-6). It is an https URL whose origin is the origin of one of the issuers of the tenant's Access environments; any other link is refused at /access_link (E-107, AG-80). A question or a review that carries it is an approval-type request: the link is the only action of its inbox and notification items, no response link is delivered and a response on a channel is never the decision. Kept encrypted at rest with the content."
  x-relay-choice: true
  x-relay-choice-note: "E-16, IN-6 and AG-32 have the approval-type item carry only the deep link to the Access approval surface; that the creator hands the link in with the waitpoint, and the member name, are chosen by the contract."
WaitpointLabel:
  type: string
  description: "A label of the owner: lowercase letters, digits, underscore, dot, colon and hyphen, 1 to 64 characters."
  pattern: "^[a-z0-9][a-z0-9_.:-]{0,63}$"
WaitpointLabels:
  type: object
  description: "Labels of the waitpoint's owner (C-75, AG-8). Relay stores and returns them as they came; it never produces, reads or changes an outcome class or a risk tier."
  properties:
    outcome_class:
      "$ref": "#/WaitpointLabel"
    risk_tier:
      "$ref": "#/WaitpointLabel"
  minProperties: 1
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "C-75 and AG-8 have the outcome class and the risk tier come from the owner as labels; the member names and the label format are chosen by the contract."
WaitpointAction:
  type: object
  description: "One structured action a responder can take (AG-8): its identifier, unique in the waitpoint, and the label shown for it."
  required:
    - id
    - label
  properties:
    id:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,63}$"
    label:
      type: string
      minLength: 1
      maxLength: 80
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "AG-8 names a structured action list; the shape of an action is chosen by the contract."
WaitpointEvidenceField:
  type: object
  description: "One structured field of an evidence pack. It carries its value or, for a sensitive value, the digest of the value and never the value itself (AG-8): exactly one of value and digest, and a field marked sensitive takes only a digest."
  required:
    - name
  properties:
    name:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,63}$"
    value:
      type: string
      maxLength: 500
    digest:
      "$ref": "#/Sha256Digest"
    sensitive:
      type: boolean
      default: false
  additionalProperties: false
WaitpointEvidence:
  type: object
  description: "The evidence pack of a review (AG-8): the sender's structured fields a responder checks before deciding. It is kept encrypted at rest with the content."
  required:
    - source
    - expected_outcome
    - harm_if_wrong
  properties:
    source:
      type: string
      description: "Where the request comes from."
      minLength: 1
      maxLength: 500
    expected_outcome:
      type: string
      description: "What happens when the request is accepted."
      minLength: 1
      maxLength: 1000
    harm_if_wrong:
      type: string
      description: "What is lost when the decision is wrong."
      minLength: 1
      maxLength: 1000
    fields:
      type: array
      items:
        "$ref": "#/WaitpointEvidenceField"
      maxItems: 20
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "AG-8 names the source, the expected outcome and the harm if wrong as structured fields and has sensitive values travel as digests; the member names, the sizes and the fields list are chosen by the contract."
WaitpointCreate:
  type: object
  description: "Waitpoint creation request. kind names the interaction (C-75, AG-8): a question or a review asks its responders for one response, is of class action_required and carries response_schema, responders, subject_digest, content and actions; a review also carries evidence. An event waitpoint waits for an event and takes none of these. A notification that expects no response is an ordinary event and has no waitpoint."
  required:
    - kind
    - match
    - expires_at
  properties:
    kind:
      "$ref": "#/WaitpointKind"
    waiter:
      "$ref": "#/Waiter"
      description: "Defaults to the calling API client."
    match:
      "$ref": "#/WaitpointMatch"
    condition:
      type: object
      description: "Second-stage condition, at most 16 kB."
    response_schema:
      type: object
      description: "JSON Schema the response value must follow, at most 64 kB."
    responders:
      type: array
      description: "Who may respond. The set is the creator's: Relay stores and returns it as it came and never widens or narrows it (AG-12). Responders and deliver_to topics together are at most x-relay-limits waitpoint.max_messages."
      items:
        "$ref": "#/Responder"
      maxItems: 50
    expires_at:
      "$ref": "#/Timestamp"
      description: "Deadline, at most x-relay-limits waitpoint.max_wait ahead. It is written once and never moved."
    heartbeat_interval:
      "$ref": "#/Duration"
      description: "Waiter heartbeat interval, PT1S to P1D; a missed heartbeat makes the waitpoint stalled."
    surface_policy:
      "$ref": "#/SurfacePolicy"
    default_response:
      description: "A response value the creator declares for the case that nobody responds: it follows response_schema, is at most x-relay-limits waitpoint.max_response_bytes as JSON and is handed to the waiter with waitpoint.expired. Relay never records it as a response (AG-18). Not taken with profile guardian_approval."
    subject_digest:
      "$ref": "#/Sha256Digest"
    content:
      type: object
      description: "What responders see, encrypted at rest."
    claim_text:
      type: string
      maxLength: 2000
      description: "Claim the responder confirms, encrypted at rest."
    deliver_to:
      type: array
      description: "Topics the waitpoint is delivered to."
      items:
        "$ref": "#/TopicTarget"
      maxItems: 10
    tags:
      type: array
      items:
        "$ref": "#/WaitpointTag"
      maxItems: 20
      uniqueItems: true
    correlation_id:
      "$ref": "#/CorrelationId"
    escalation_policy:
      oneOf:
        - "$ref": "#/EscalationPolicyReference"
        - "$ref": "#/EscalationPolicyDefinition"
    actions:
      type: array
      description: "The structured actions a responder can take; required for a question and a review. Kept encrypted at rest with the content."
      items:
        "$ref": "#/WaitpointAction"
      minItems: 1
      maxItems: 10
    evidence:
      "$ref": "#/WaitpointEvidence"
      description: "The evidence pack; required for a review and taken by nothing else."
    labels:
      "$ref": "#/WaitpointLabels"
    profile:
      "$ref": "#/WaitpointProfile"
    access_link:
      "$ref": "#/WaitpointAccessLink"
  additionalProperties: false
WaitpointResponder:
  type: object
  description: "Who responded; a human subscriber's external_id is its pairwise Access sub."
  required:
    - recipient_id
    - kind
  properties:
    recipient_id:
      "$ref": "#/RecipientId"
    kind:
      type: string
      enum:
        - subscriber
        - agent
    external_id:
      "$ref": "#/ExternalId"
  additionalProperties: false
EvidenceLevel:
  type: string
  enum:
    - channel_claim
    - relay_session
    - access_aas_ref
WaitpointResponse:
  type: object
  description: "The response that resolved the waitpoint."
  required:
    - id
    - responder
    - evidence_level
    - responded_at
    - response_digest
  properties:
    id:
      "$ref": "#/Id_wpr"
    responder:
      "$ref": "#/WaitpointResponder"
    channel:
      oneOf:
        - "$ref": "#/Channel"
        - type: "null"
    evidence_level:
      "$ref": "#/EvidenceLevel"
    responded_at:
      "$ref": "#/Timestamp"
    value:
      description: "The response value the responder gave, as it was collected; present on a single waitpoint read while it can be read. Relay carries the response, not its validity: it is never an approval (AG-25, E-49)."
    response_digest:
      "$ref": "#/Sha256Digest"
      description: "sha256 of the RFC 8785 (JCS) form of the value."
    access_decision_ref:
      type: string
      description: "The reference of the decision given on the Access approval surface, on a response of evidence level access_aas_ref (AG-27); the waiter verifies the approval at Access."
      maxLength: 512
  additionalProperties: false
Waitpoint:
  type: object
  description: "A waitpoint."
  required:
    - object
    - id
    - kind
    - waiter
    - match
    - expires_at
    - state
    - created_at
    - state_changed_at
  properties:
    object:
      type: string
      const: waitpoint
    id:
      "$ref": "#/Id_wp"
    kind:
      "$ref": "#/WaitpointKind"
    waiter:
      "$ref": "#/Waiter"
    match:
      "$ref": "#/WaitpointMatchView"
    condition:
      type: object
      description: "Second-stage condition, at most 16 kB."
    response_schema:
      type: object
      description: "JSON Schema the response value must follow, at most 64 kB."
    responders:
      type: array
      description: "Who may respond. The set is the creator's: Relay stores and returns it as it came and never widens or narrows it (AG-12). Responders and deliver_to topics together are at most x-relay-limits waitpoint.max_messages."
      items:
        "$ref": "#/Responder"
      maxItems: 50
    expires_at:
      "$ref": "#/Timestamp"
      description: "Deadline, at most x-relay-limits waitpoint.max_wait ahead. It is written once and never moved."
    heartbeat_interval:
      "$ref": "#/Duration"
      description: "Waiter heartbeat interval, PT1S to P1D; a missed heartbeat makes the waitpoint stalled."
    surface_policy:
      "$ref": "#/SurfacePolicy"
    default_response:
      description: "A response value the creator declares for the case that nobody responds: it follows response_schema, is at most x-relay-limits waitpoint.max_response_bytes as JSON and is handed to the waiter with waitpoint.expired. Relay never records it as a response (AG-18). Not taken with profile guardian_approval."
    subject_digest:
      "$ref": "#/Sha256Digest"
    content:
      type: object
      description: "What responders see, encrypted at rest."
    claim_text:
      type: string
      maxLength: 2000
      description: "Claim the responder confirms, encrypted at rest."
    deliver_to:
      type: array
      description: "Topics the waitpoint is delivered to."
      items:
        "$ref": "#/TopicTarget"
      maxItems: 10
    tags:
      type: array
      items:
        "$ref": "#/WaitpointTag"
      maxItems: 20
      uniqueItems: true
    correlation_id:
      "$ref": "#/CorrelationId"
    escalation_policy:
      oneOf:
        - "$ref": "#/WaitpointEscalation"
        - type: "null"
    state:
      "$ref": "#/WaitpointState"
    response:
      oneOf:
        - "$ref": "#/WaitpointResponse"
        - type: "null"
    completion:
      oneOf:
        - "$ref": "#/WaitpointCompletion"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    state_changed_at:
      "$ref": "#/Timestamp"
    heartbeat_due_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    cancel_reason:
      oneOf:
        - type: string
          maxLength: 200
        - type: "null"
    message_class:
      "$ref": "#/MessageClass"
      description: "action_required for a question and a review; absent for an event waitpoint."
    actions:
      type: array
      items:
        "$ref": "#/WaitpointAction"
      maxItems: 10
    evidence:
      "$ref": "#/WaitpointEvidence"
    labels:
      "$ref": "#/WaitpointLabels"
    profile:
      "$ref": "#/WaitpointProfile"
    access_link:
      "$ref": "#/WaitpointAccessLink"
  additionalProperties: false
WaitpointCompletion:
  type: object
  description: "What the completion notification of a long-running job said when it resolved the waitpoint (WH-68): the outcome and the small result the source sent. It is returned only on an authorised read of the waitpoint; the thin waitpoint.resolved event never carries it. null for a waitpoint that no completion notification resolved."
  required:
    - outcome
    - result
    - completed_at
  properties:
    outcome:
      type: string
      enum:
        - completed
        - failed
    result:
      oneOf:
        - type: object
          description: "The result object of the notification, at most 4096 bytes as JSON; kept encrypted at rest. It carries no personal data (WH-69)."
        - type: "null"
    completed_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "WH-68 returns the outcome and the result on the read of the waitpoint; the member name and its shape are chosen by the contract."
WaitpointList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/Waitpoint"
  description: "A page of waitpoints."
WaitpointCancel:
  type: object
  description: "Cancellation of a waitpoint."
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 200
  additionalProperties: false
EscalationPolicyState:
  type: string
  enum:
    - active
    - archived
EscalationPolicyWrite:
  type: object
  description: "A new version of an escalation policy: at least one tier and at most x-relay-limits waitpoint.max_escalation_tiers. More tiers are 422 validation_failed with too_long at /tiers, the limit and the count sent."
  required:
    - tiers
  properties:
    tiers:
      type: array
      items:
        "$ref": "#/EscalationTier"
      minItems: 1
    description:
      type: string
      maxLength: 500
  additionalProperties: false
EscalationPolicy:
  type: object
  description: "An escalation policy with its latest version."
  required:
    - object
    - id
    - key
    - version
    - state
    - tiers
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: escalation_policy
    id:
      "$ref": "#/Id_esp"
    key:
      "$ref": "#/EscalationPolicyKey"
    version:
      type: integer
      minimum: 1
      description: "Latest version."
    state:
      "$ref": "#/EscalationPolicyState"
    description:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    tiers:
      type: array
      items:
        "$ref": "#/EscalationTier"
      minItems: 1
      maxItems: 10
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
EscalationPolicyList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/EscalationPolicy"
  description: "A page of escalation policies."
EscalationPolicyVersion:
  type: object
  description: "An immutable escalation policy version."
  required:
    - object
    - key
    - version
    - tiers
    - created_at
  properties:
    object:
      type: string
      const: escalation_policy_version
    key:
      "$ref": "#/EscalationPolicyKey"
    version:
      type: integer
      minimum: 1
    description:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    tiers:
      type: array
      items:
        "$ref": "#/EscalationTier"
      minItems: 1
      maxItems: 10
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
EscalationPolicyVersionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/EscalationPolicyVersion"
  description: "A page of escalation policy versions."
CeilingDecisionCreate:
  type: object
  description: "The owner's decision on held agent notifications."
  required:
    - decision
    - ceiling_event_id
    - decision_ref
  properties:
    decision:
      type: string
      enum:
        - send_all
        - cancel
        - stop
    ceiling_event_id:
      type: string
      description: "id of the agent.ceiling_exceeded event the decision answers."
      minLength: 1
      maxLength: 512
    decision_ref:
      type: string
      description: "The owner's record of the decision (for Suiss, the Work record), 1 to 256 printable ASCII characters."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    note:
      type: string
      maxLength: 1000
      x-relay-choice: true
      x-relay-choice-note: "The bound of note is chosen by the contract."
  additionalProperties: false
ApiClientScope:
  type: string
  description: "A scope an API client can be assigned. A server client holds server scopes (publish, read, subscribers, config, kill_switch, agents). An agent's client holds only the narrow agent scopes: agent:send, agent:waitpoint, agent:mailbox and presence:read. A client never holds scopes of both groups, and no scope covers a whole group."
  enum:
    - publish
    - read
    - subscribers
    - config
    - kill_switch
    - agents
    - "agent:send"
    - "agent:waitpoint"
    - "agent:mailbox"
    - "presence:read"
  x-relay-choice: true
  x-relay-choice-note: "The spec names the four narrow agent scopes by what they allow and presence:read by name; the other three names are chosen by the contract."
AgentRecordState:
  type: string
  description: "active; suspended while the agent's Access identity is suspended; deleted once the record is deleted or Access deleted the identity. Nothing is delivered to an agent that is not active and its own requests are refused; its mailbox is kept in every state."
  enum:
    - active
    - suspended
    - deleted
AgentAccessBinding:
  type: object
  description: "The agent's Access identity. party is the agent's Access Party identifier, the one Access events name (the binding is at the Party level, AG-75). At creation Relay asks Access's subject resolution for the pairwise sub of the agent's Access tokens in Relay's sector and keeps it with the record; a token authenticates as the agent by that sub. A Party Access does not resolve is refused at /access/party and no agent is created while Access cannot answer (E-106). Every Instance of the Party authenticates as the agent."
  required:
    - party
  properties:
    party:
      type: string
      pattern: "^[\\x21-\\x7E]{1,256}$"
  additionalProperties: false
AgentEndpoints:
  type: object
  description: "Where a wake-up hint for the agent goes. A hint only says that something waits; the message stays in the mailbox."
  properties:
    webhook_endpoint_id:
      description: "A webhook endpoint of this environment that receives signed hints."
      oneOf:
        - "$ref": "#/Id_whe"
        - type: "null"
    a2a_push_endpoint_id:
      description: "A webhook endpoint of this environment that receives A2A push notifications."
      oneOf:
        - "$ref": "#/Id_whe"
        - type: "null"
    realtime:
      type: boolean
      description: "Whether the agent may be woken over a realtime connection."
  additionalProperties: false
Agent:
  type: object
  description: "Agent recipient record. It serves delivery only and changes no authority."
  required:
    - object
    - id
    - name
    - owner_ref
    - access
    - endpoints
    - mailbox
    - topics
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: agent
    id:
      "$ref": "#/Id_agt"
    name:
      type: string
      minLength: 1
      maxLength: 200
    owner_ref:
      type: string
      description: "The owner's record of the agent (for Suiss, the Work record), 1 to 256 printable ASCII characters. Events about the agent name it."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    access:
      type: object
      required:
        - party
      properties:
        party:
          description: "Null once the record's personal data is erased."
          oneOf:
            - type: string
              maxLength: 256
            - type: "null"
      additionalProperties: false
    endpoints:
      type: object
      required:
        - webhook_endpoint_id
        - a2a_push_endpoint_id
        - realtime
      properties:
        webhook_endpoint_id:
          oneOf:
            - "$ref": "#/Id_whe"
            - type: "null"
        a2a_push_endpoint_id:
          oneOf:
            - "$ref": "#/Id_whe"
            - type: "null"
        realtime:
          type: boolean
      additionalProperties: false
    mailbox:
      type: object
      description: "The agent's one mailbox. It is suspended with the agent and never deleted."
      required:
        - id
        - state
      properties:
        id:
          "$ref": "#/Id_mbx"
        state:
          type: string
          enum:
            - active
            - suspended
            - deleted
      additionalProperties: false
    topics:
      type: array
      description: "Keys of the topics the agent is subscribed to."
      items:
        "$ref": "#/TopicKey"
    state:
      "$ref": "#/AgentRecordState"
    suspended_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    deleted_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
AgentCreate:
  type: object
  description: "Register an agent. Only the message fields below enter Relay: nothing of the agent's memory, plan or reasoning is accepted."
  required:
    - name
    - owner_ref
    - access
  properties:
    name:
      type: string
      description: "Display name. Do not put personal data here."
      minLength: 1
      maxLength: 200
    owner_ref:
      type: string
      description: "The owner's record of the agent (for Suiss, the Work record), 1 to 256 printable ASCII characters. Do not put personal data here."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    access:
      "$ref": "#/AgentAccessBinding"
    endpoints:
      "$ref": "#/AgentEndpoints"
    topics:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        "$ref": "#/TopicKey"
  additionalProperties: false
AgentPatch:
  type: object
  description: "JSON Merge Patch of an agent."
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    owner_ref:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    endpoints:
      "$ref": "#/AgentEndpoints"
    topics:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        "$ref": "#/TopicKey"
  additionalProperties: false
AgentList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Agent"
AgentRunState:
  type: string
  enum:
    - active
    - stopped
CeilingDecision:
  type: object
  description: "A recorded ceiling decision."
  required:
    - object
    - id
    - agent_id
    - ceiling_event_id
    - decision
    - decision_ref
    - applied_count
    - agent_state
    - decided_at
  properties:
    object:
      type: string
      const: ceiling_decision
    id:
      "$ref": "#/Id_acd"
    agent_id:
      "$ref": "#/Id_agt"
    ceiling_event_id:
      type: string
      maxLength: 512
    decision:
      type: string
      enum:
        - send_all
        - cancel
        - stop
    decision_ref:
      type: string
      description: "The owner's record of the decision (for Suiss, the Work record), 1 to 256 printable ASCII characters."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    note:
      oneOf:
        - type: string
          maxLength: 1000
        - type: "null"
    applied_count:
      type: integer
      minimum: 0
      description: "Held notifications the decision applied to."
    agent_state:
      "$ref": "#/AgentRunState"
    decided_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
CeilingHoldState:
  type: string
  enum:
    - held
    - released
    - cancelled
    - expired
  description: "held until the owner decides; released by send_all, cancelled by cancel or stop; expired when it was released past its expires_at."
  x-relay-choice: true
  x-relay-choice-note: "The state names are chosen by the contract."
CeilingHold:
  type: object
  description: "A notification of an agent that reached the agent ceiling and was held (AG-49). It is kept until the owner decides and is never deleted."
  required:
    - object
    - notification_id
    - agent_id
    - ceiling_event_id
    - rule_id
    - state
    - held_at
    - expires_at
    - decision_id
    - decided_at
  properties:
    object:
      type: string
      const: ceiling_hold
    notification_id:
      "$ref": "#/Id_ntf"
    agent_id:
      "$ref": "#/Id_agt"
    ceiling_event_id:
      "$ref": "#/Id_oev"
    rule_id:
      "$ref": "#/RuleId"
    state:
      "$ref": "#/CeilingHoldState"
    held_at:
      "$ref": "#/Timestamp"
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    decision_id:
      oneOf:
        - "$ref": "#/Id_acd"
        - type: "null"
    decided_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
CeilingHoldList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/CeilingHold"
AgentResume:
  type: object
  description: "Lifting a stop decision."
  required:
    - decision_ref
  properties:
    decision_ref:
      type: string
      description: "The owner's record of the decision (for Suiss, the Work record), 1 to 256 printable ASCII characters."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x20-\\x7E]+$"
    note:
      type: string
      maxLength: 1000
  additionalProperties: false
AgentState:
  type: object
  description: "The run state of an agent."
  required:
    - object
    - agent_id
    - state
    - changed_at
  properties:
    object:
      type: string
      const: agent_state
    agent_id:
      "$ref": "#/Id_agt"
    state:
      "$ref": "#/AgentRunState"
    decision_ref:
      oneOf:
        - type: string
          description: "The owner's record of the decision (for Suiss, the Work record), 1 to 256 printable ASCII characters."
          minLength: 1
          maxLength: 256
          pattern: "^[\\x20-\\x7E]+$"
        - type: "null"
    changed_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WebhookEndpointUse:
  type: string
  description: "relay_events: Relay's own events, delivered to the tenant (use A). destination: target of a webhook channel step, an endpoint of one of the tenant's consumers (use B)."
  enum:
    - relay_events
    - destination
WebhookEndpointState:
  type: string
  description: "active receives its events. paused holds them until the endpoint is resumed; nothing is dropped. disabled does not attempt new events: they are kept as missed events and recovered once the endpoint is active again. archived receives nothing and does not change any more."
  enum:
    - active
    - paused
    - disabled
    - archived
  x-relay-choice: true
  x-relay-choice-note: "The state names are chosen by the contract within WH-31, WH-36 and WH-37."
WebhookEndpointDisabledReason:
  type: string
  description: "manual: disabled by the tenant or the consumer. failing: disabled automatically after five days of uninterrupted failures (WH-36). gone: the endpoint answered 410."
  enum:
    - manual
    - failing
    - gone
  x-relay-choice: true
  x-relay-choice-note: "The reason names are chosen by the contract within WH-23 and WH-36."
WebhookEventTypes:
  type: array
  description: "Subscribed event types (WH-16): the endpoint receives only these. * is an explicit choice of every type, an empty selection receives nothing. An endpoint of use relay_events names types of Relay's event catalog, an endpoint of use destination names event types of the tenant. * does not cover audit_record.appended (WH-67): that type is received only by an endpoint that names it."
  items:
    oneOf:
      - "$ref": "#/EventName"
      - type: string
        const: "*"
  maxItems: 100
  uniqueItems: true
WebhookSnapshot:
  type: array
  description: "Snapshot allow-list (WH-12, WH-13): the payload fields added to the thin event. It is pinned to the endpoint version: a change opens a new endpoint version, and neither an API version upgrade nor a change of Relay's model changes the payload of an existing version. A field that carries personal data enters only by this explicit choice."
  items:
    type: string
    pattern: "^[a-z][a-z0-9_]{0,63}(\\.[a-z][a-z0-9_]{0,63}){0,3}$"
  maxItems: 50
  uniqueItems: true
  x-relay-choice: true
  x-relay-choice-note: "The shape of the snapshot allow-list is chosen by the contract."
SignatureScheme:
  type: string
  description: "v1a Ed25519 (default) or v1 HMAC-SHA256 for compatibility (WH-4)."
  enum:
    - v1a
    - v1
WebhookDestinationKind:
  type: string
  description: "Destination kind (WH-17). Success is a 2xx answer for https, the broker's durable write acknowledgement for queues and streams and the acknowledged object write for s3 (WH-18); every kind is delivered at least once."
  enum:
    - https
    - kafka
    - nats_jetstream
    - rabbitmq
    - aws_sqs
    - aws_sns
    - aws_eventbridge
    - gcp_pubsub
    - azure_service_bus
    - azure_event_grid
    - s3
WebhookHttpsUrl:
  type: string
  description: "An https URL (WH-40): https only, on the test plane as well; port 443 unless the installation allows another; no user information. Every address the host resolves to is checked again when Relay connects (WH-41), and a redirect is never followed."
  format: uri
  pattern: "^https://"
  maxLength: 2048
WebhookHostPort:
  type: string
  description: "host:port of a broker. The address is checked when Relay connects, as for an https endpoint (WH-43)."
  pattern: "^[A-Za-z0-9]([A-Za-z0-9.-]{0,252}[A-Za-z0-9])?:[0-9]{1,5}$"
  maxLength: 261
WebhookCloudEventsMode:
  type: string
  description: "How the CloudEvent is carried on a queue or stream (WH-8): structured puts the whole event in the message body, binary puts the attributes in the binding's headers and data in the body."
  enum:
    - structured
    - binary
WebhookPem:
  type: string
  description: "A PEM encoded X.509 client certificate chain. It holds no private key; the private key is named by credential_ref_id."
  pattern: "^-----BEGIN CERTIFICATE-----"
  maxLength: 16384
WebhookDestinationHttps:
  type: object
  description: "An HTTPS endpoint signed with the Suiss webhook profile; optionally also authenticated with mutual TLS or an OAuth 2.0 client credentials token."
  required:
    - kind
    - url
  properties:
    kind:
      type: string
      const: https
    url:
      "$ref": "#/WebhookHttpsUrl"
    auth:
      type: string
      description: "Additional authentication: mtls presents client_certificate with the private key credential_ref_id names; oauth2_client_credentials sends a bearer token obtained from token_url with client_id and the client secret credential_ref_id names."
      enum:
        - none
        - mtls
        - oauth2_client_credentials
      default: none
    client_certificate:
      "$ref": "#/WebhookPem"
    token_url:
      "$ref": "#/WebhookHttpsUrl"
    client_id:
      type: string
      minLength: 1
      maxLength: 256
    scopes:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[\\x21\\x23-\\x5B\\x5D-\\x7E]+$"
      maxItems: 20
      uniqueItems: true
    credential_ref_id:
      "$ref": "#/Id_sec"
  additionalProperties: false
WebhookDestinationKafka:
  type: object
  description: "A Kafka topic. The event's subject is the record key, so the events of one subject stay in one partition (WH-20)."
  required:
    - kind
    - brokers
    - topic
  properties:
    kind:
      type: string
      const: kafka
    brokers:
      type: array
      items:
        "$ref": "#/WebhookHostPort"
      minItems: 1
      maxItems: 10
      uniqueItems: true
    topic:
      type: string
      pattern: "^[A-Za-z0-9._-]{1,249}$"
    sasl_mechanism:
      type: string
      enum:
        - plain
        - scram_sha_256
        - scram_sha_512
    username:
      type: string
      minLength: 1
      maxLength: 256
    client_certificate:
      "$ref": "#/WebhookPem"
    credential_ref_id:
      "$ref": "#/Id_sec"
    cloudevents_mode:
      "$ref": "#/WebhookCloudEventsMode"
      default: binary
  additionalProperties: false
WebhookDestinationNatsJetstream:
  type: object
  description: "A NATS JetStream subject; success is the stream's publish acknowledgement."
  required:
    - kind
    - servers
    - subject
  properties:
    kind:
      type: string
      const: nats_jetstream
    servers:
      type: array
      items:
        "$ref": "#/WebhookHostPort"
      minItems: 1
      maxItems: 10
      uniqueItems: true
    subject:
      type: string
      pattern: "^[A-Za-z0-9_-]+(\\.[A-Za-z0-9_-]+)*$"
      maxLength: 256
    username:
      type: string
      minLength: 1
      maxLength: 256
    client_certificate:
      "$ref": "#/WebhookPem"
    credential_ref_id:
      "$ref": "#/Id_sec"
    cloudevents_mode:
      "$ref": "#/WebhookCloudEventsMode"
      default: binary
  additionalProperties: false
WebhookDestinationRabbitmq:
  type: object
  description: "A RabbitMQ exchange, published with publisher confirms."
  required:
    - kind
    - host
    - exchange
  properties:
    kind:
      type: string
      const: rabbitmq
    host:
      "$ref": "#/WebhookHostPort"
    vhost:
      type: string
      minLength: 1
      maxLength: 256
      default: "/"
    exchange:
      type: string
      minLength: 1
      maxLength: 255
    routing_key:
      type: string
      maxLength: 255
    username:
      type: string
      minLength: 1
      maxLength: 256
    client_certificate:
      "$ref": "#/WebhookPem"
    credential_ref_id:
      "$ref": "#/Id_sec"
    cloudevents_mode:
      "$ref": "#/WebhookCloudEventsMode"
      default: binary
  additionalProperties: false
WebhookDestinationAwsSqs:
  type: object
  description: "An Amazon SQS queue, reached with an IAM role (role_arn) or an access key (access_key_id with the secret access key credential_ref_id names). On a FIFO queue the event's subject is the message group."
  required:
    - kind
    - queue_url
    - region
  properties:
    kind:
      type: string
      const: aws_sqs
    queue_url:
      "$ref": "#/WebhookHttpsUrl"
    region:
      "$ref": "#/WebhookAwsRegion"
    role_arn:
      "$ref": "#/WebhookAwsArn"
    access_key_id:
      "$ref": "#/WebhookAwsAccessKeyId"
    credential_ref_id:
      "$ref": "#/Id_sec"
    cloudevents_mode:
      "$ref": "#/WebhookCloudEventsMode"
      default: structured
  additionalProperties: false
WebhookDestinationAwsSns:
  type: object
  description: "An Amazon SNS topic, reached with an IAM role or an access key. On a FIFO topic the event's subject is the message group."
  required:
    - kind
    - topic_arn
    - region
  properties:
    kind:
      type: string
      const: aws_sns
    topic_arn:
      "$ref": "#/WebhookAwsArn"
    region:
      "$ref": "#/WebhookAwsRegion"
    role_arn:
      "$ref": "#/WebhookAwsArn"
    access_key_id:
      "$ref": "#/WebhookAwsAccessKeyId"
    credential_ref_id:
      "$ref": "#/Id_sec"
    cloudevents_mode:
      "$ref": "#/WebhookCloudEventsMode"
      default: structured
  additionalProperties: false
WebhookDestinationAwsEventbridge:
  type: object
  description: "An Amazon EventBridge event bus, reached with an IAM role or an access key. EventBridge has no mutual TLS."
  required:
    - kind
    - event_bus_arn
    - region
  properties:
    kind:
      type: string
      const: aws_eventbridge
    event_bus_arn:
      "$ref": "#/WebhookAwsArn"
    region:
      "$ref": "#/WebhookAwsRegion"
    role_arn:
      "$ref": "#/WebhookAwsArn"
    access_key_id:
      "$ref": "#/WebhookAwsAccessKeyId"
    credential_ref_id:
      "$ref": "#/Id_sec"
  additionalProperties: false
WebhookDestinationGcpPubsub:
  type: object
  description: "A Google Cloud Pub/Sub topic, reached with the service account key credential_ref_id names. With ordering enabled the event's subject is the ordering key."
  required:
    - kind
    - project_id
    - topic
    - credential_ref_id
  properties:
    kind:
      type: string
      const: gcp_pubsub
    project_id:
      type: string
      pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
    topic:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9._~%+-]{2,254}$"
    credential_ref_id:
      "$ref": "#/Id_sec"
    cloudevents_mode:
      "$ref": "#/WebhookCloudEventsMode"
      default: binary
  additionalProperties: false
WebhookDestinationAzureServiceBus:
  type: object
  description: "An Azure Service Bus queue or topic, reached with a managed identity (managed_identity_client_id) or the connection credential credential_ref_id names. With sessions the event's subject is the session."
  required:
    - kind
    - namespace
    - entity
  properties:
    kind:
      type: string
      const: azure_service_bus
    namespace:
      type: string
      description: "Fully qualified namespace host name."
      pattern: "^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$"
      maxLength: 253
    entity:
      type: string
      description: "Queue or topic name."
      minLength: 1
      maxLength: 260
    managed_identity_client_id:
      type: string
      format: uuid
    credential_ref_id:
      "$ref": "#/Id_sec"
    cloudevents_mode:
      "$ref": "#/WebhookCloudEventsMode"
      default: binary
  additionalProperties: false
WebhookDestinationAzureEventGrid:
  type: object
  description: "An Azure Event Grid topic, reached with a managed identity or the access credential credential_ref_id names."
  required:
    - kind
    - endpoint
  properties:
    kind:
      type: string
      const: azure_event_grid
    endpoint:
      "$ref": "#/WebhookHttpsUrl"
    managed_identity_client_id:
      type: string
      format: uuid
    credential_ref_id:
      "$ref": "#/Id_sec"
  additionalProperties: false
WebhookDestinationS3:
  type: object
  description: "An S3 compatible object store (WH-21). Events are written in batches, closed by age, size or count (x-relay-limits webhook.object_batch), as CloudEvents structured JSON lines; the object name comes from the batch identifier, so writing a batch again produces the same object."
  required:
    - kind
    - bucket
    - region
    - access_key_id
    - credential_ref_id
  properties:
    kind:
      type: string
      const: s3
    endpoint:
      "$ref": "#/WebhookHttpsUrl"
    bucket:
      type: string
      pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    region:
      "$ref": "#/WebhookAwsRegion"
    prefix:
      type: string
      pattern: "^[A-Za-z0-9!_.*'()/-]{0,512}$"
    access_key_id:
      "$ref": "#/WebhookAwsAccessKeyId"
    credential_ref_id:
      "$ref": "#/Id_sec"
  additionalProperties: false
WebhookAwsRegion:
  type: string
  pattern: "^[a-z0-9-]{1,32}$"
WebhookAwsArn:
  type: string
  pattern: "^arn:[a-z0-9-]+:[a-z0-9-]+:[a-z0-9-]*:[0-9]{12}:[A-Za-z0-9_+=,.@/:-]{1,512}$"
  maxLength: 640
WebhookAwsAccessKeyId:
  type: string
  description: "Access key identifier. It is not a secret; the secret access key is named by credential_ref_id."
  pattern: "^[A-Z0-9]{16,128}$"
WebhookDestination:
  description: "Where an endpoint delivers (WH-17), by kind. A credential is only ever named by the identifier of a secret reference an operator registered (credential_ref_id); no secret is written into a URL, a connection string or any other field, and none is returned, logged or kept in the attempt log (WH-19)."
  oneOf:
    - "$ref": "#/WebhookDestinationHttps"
    - "$ref": "#/WebhookDestinationKafka"
    - "$ref": "#/WebhookDestinationNatsJetstream"
    - "$ref": "#/WebhookDestinationRabbitmq"
    - "$ref": "#/WebhookDestinationAwsSqs"
    - "$ref": "#/WebhookDestinationAwsSns"
    - "$ref": "#/WebhookDestinationAwsEventbridge"
    - "$ref": "#/WebhookDestinationGcpPubsub"
    - "$ref": "#/WebhookDestinationAzureServiceBus"
    - "$ref": "#/WebhookDestinationAzureEventGrid"
    - "$ref": "#/WebhookDestinationS3"
  x-relay-choice: true
  x-relay-choice-note: "WH-17 names the destination set and its authentication methods; the configuration fields of each kind are chosen by the contract."
WebhookRetrySchedule:
  type: array
  description: "The wait before each attempt, in order (WH-22): the first item is the wait before the first attempt, and the number of items is the number of attempts. 1 to 15 attempts; every wait after the first is PT5S to PT24H; the sum is PT1M to P7D. Each wait gets a deterministic jitter of 20 percent either way, derived from the message identifier. There is no endless retry."
  items:
    "$ref": "#/Duration"
  minItems: 1
  maxItems: 15
WebhookSigningKey:
  type: object
  description: "A signing key of an endpoint (WH-5, WH-6). The public key of a v1a key can always be read; a v1 secret cannot be read back. A previous key still signs until expires_at, next to the active one."
  required:
    - id
    - scheme
    - state
    - public_key
    - activated_at
    - expires_at
  properties:
    id:
      "$ref": "#/Id_whk"
    scheme:
      "$ref": "#/SignatureScheme"
    state:
      type: string
      enum:
        - active
        - previous
    public_key:
      oneOf:
        - "$ref": "#/WebhookPublicKey"
        - type: "null"
    activated_at:
      "$ref": "#/Timestamp"
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
WebhookPublicKey:
  type: string
  description: "Ed25519 public key in the Standard Webhooks form: whpk_ and the base64 of the 32 key bytes."
  pattern: "^whpk_[A-Za-z0-9+/]{43}=$"
  examples:
    - whpk_MCowBQYDK2VwAyEAGb9ECWmEzf6FQbrBZ9w7lshQhqowtrbLDFw4rXAxZuE=
WebhookEndpointCreate:
  type: object
  description: "Webhook endpoint creation request. The environment is the credential's and is never taken from the request (WH-45)."
  required:
    - use
    - destination
    - event_types
  properties:
    use:
      "$ref": "#/WebhookEndpointUse"
    consumer:
      "$ref": "#/WebhookConsumerKey"
    destination:
      "$ref": "#/WebhookDestination"
    event_types:
      "$ref": "#/WebhookEventTypes"
    signature_scheme:
      "$ref": "#/SignatureScheme"
      default: v1a
    snapshot:
      "$ref": "#/WebhookSnapshot"
    description:
      type: string
      minLength: 1
      maxLength: 500
    auto_disable:
      type: boolean
      description: "false keeps the endpoint active however long it fails; its messages still end by their own schedule (WH-36)."
      default: true
    retry_schedule:
      "$ref": "#/WebhookRetrySchedule"
    max_concurrency:
      type: integer
      description: "Attempts in flight to this endpoint at the same time (WH-38)."
      minimum: 1
      maximum: 100
    rate_limit_per_second:
      type: integer
      description: "Attempts started per second to this endpoint (WH-38)."
      minimum: 1
      maximum: 1000
  additionalProperties: false
WebhookEndpointPatch:
  type: object
  description: "Changes to a webhook endpoint; absent fields are left untouched. The destination kind, the use, the consumer and the environment never change."
  properties:
    destination:
      "$ref": "#/WebhookDestination"
    event_types:
      "$ref": "#/WebhookEventTypes"
    snapshot:
      "$ref": "#/WebhookSnapshot"
    description:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 500
        - type: "null"
    state:
      type: string
      description: "active enables a disabled endpoint; disabled stops new attempts. A paused endpoint is resumed with the resume operation."
      enum:
        - active
        - disabled
    auto_disable:
      type: boolean
    retry_schedule:
      oneOf:
        - "$ref": "#/WebhookRetrySchedule"
        - type: "null"
    max_concurrency:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 100
        - type: "null"
    rate_limit_per_second:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 1000
        - type: "null"
  additionalProperties: false
  minProperties: 1
WebhookEndpoint:
  type: object
  description: "A webhook endpoint: one delivery address of a consumer (WH-2)."
  required:
    - object
    - id
    - environment
    - use
    - consumer
    - consumer_id
    - destination
    - event_types
    - signature_scheme
    - signing_keys
    - snapshot
    - payload_version
    - description
    - state
    - disabled_reason
    - managed_by
    - product
    - auto_disable
    - retry_schedule
    - max_concurrency
    - rate_limit_per_second
    - version
    - created_at
    - updated_at
    - archived_at
  properties:
    object:
      type: string
      const: webhook_endpoint
    id:
      "$ref": "#/Id_whe"
    environment:
      "$ref": "#/Environment"
    use:
      "$ref": "#/WebhookEndpointUse"
    consumer:
      oneOf:
        - "$ref": "#/WebhookConsumerKey"
        - type: "null"
    consumer_id:
      oneOf:
        - "$ref": "#/Id_whc"
        - type: "null"
    destination:
      "$ref": "#/WebhookDestination"
    event_types:
      "$ref": "#/WebhookEventTypes"
    signature_scheme:
      oneOf:
        - "$ref": "#/SignatureScheme"
        - type: "null"
      description: "The scheme of the active signing key; null for a destination that is not https, which carries no signature."
    signing_keys:
      type: array
      description: "The active key and, during a rotation overlap, the previous one; the newest first."
      items:
        "$ref": "#/WebhookSigningKey"
      maxItems: 2
    snapshot:
      "$ref": "#/WebhookSnapshot"
    payload_version:
      "$ref": "#/ApiVersion"
      description: "The payload version pinned when the endpoint was created (API-55): upgrading the API version does not change what this endpoint receives."
    description:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    state:
      "$ref": "#/WebhookEndpointState"
    disabled_reason:
      oneOf:
        - "$ref": "#/WebhookEndpointDisabledReason"
        - type: "null"
    managed_by:
      type: string
      description: "product for an endpoint opened for a Suiss product client; the tenant sees it and may narrow its event types but cannot delete or close it."
      enum:
        - tenant
        - product
    product:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    auto_disable:
      type: boolean
    retry_schedule:
      oneOf:
        - "$ref": "#/WebhookRetrySchedule"
        - type: "null"
      description: "null follows the default schedule (x-relay-limits webhook.retry_schedule.default)."
    max_concurrency:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    rate_limit_per_second:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    version:
      type: integer
      description: "The endpoint version; a change of the snapshot allow-list opens the next one (WH-12)."
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
WebhookEndpointList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookEndpoint"
  description: "A page of webhook endpoints."
WebhookEndpointSecret:
  type: object
  description: "A webhook endpoint with the secret of its new signing key. secret is the whsec_ HMAC secret of a v1 key, shown only in this response and never readable again (WH-5); it is null for a v1a key, whose private key never leaves the key store and whose public key is in signing_keys."
  required:
    - object
    - id
    - environment
    - use
    - consumer
    - consumer_id
    - destination
    - event_types
    - signature_scheme
    - signing_keys
    - snapshot
    - payload_version
    - description
    - state
    - disabled_reason
    - managed_by
    - product
    - auto_disable
    - retry_schedule
    - max_concurrency
    - rate_limit_per_second
    - version
    - created_at
    - updated_at
    - archived_at
    - secret
    - previous_key_expires_at
  properties:
    object:
      type: string
      const: webhook_endpoint
    id:
      "$ref": "#/Id_whe"
    environment:
      "$ref": "#/Environment"
    use:
      "$ref": "#/WebhookEndpointUse"
    consumer:
      oneOf:
        - "$ref": "#/WebhookConsumerKey"
        - type: "null"
    consumer_id:
      oneOf:
        - "$ref": "#/Id_whc"
        - type: "null"
    destination:
      "$ref": "#/WebhookDestination"
    event_types:
      "$ref": "#/WebhookEventTypes"
    signature_scheme:
      oneOf:
        - "$ref": "#/SignatureScheme"
        - type: "null"
      description: "The scheme of the active signing key; null for a destination that is not https, which carries no signature."
    signing_keys:
      type: array
      description: "The active key and, during a rotation overlap, the previous one; the newest first."
      items:
        "$ref": "#/WebhookSigningKey"
      maxItems: 2
    snapshot:
      "$ref": "#/WebhookSnapshot"
    payload_version:
      "$ref": "#/ApiVersion"
      description: "The payload version pinned when the endpoint was created (API-55): upgrading the API version does not change what this endpoint receives."
    description:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    state:
      "$ref": "#/WebhookEndpointState"
    disabled_reason:
      oneOf:
        - "$ref": "#/WebhookEndpointDisabledReason"
        - type: "null"
    managed_by:
      type: string
      description: "product for an endpoint opened for a Suiss product client; the tenant sees it and may narrow its event types but cannot delete or close it."
      enum:
        - tenant
        - product
    product:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    auto_disable:
      type: boolean
    retry_schedule:
      oneOf:
        - "$ref": "#/WebhookRetrySchedule"
        - type: "null"
      description: "null follows the default schedule (x-relay-limits webhook.retry_schedule.default)."
    max_concurrency:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    rate_limit_per_second:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    version:
      type: integer
      description: "The endpoint version; a change of the snapshot allow-list opens the next one (WH-12)."
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    secret:
      oneOf:
        - type: string
          pattern: "^whsec_[A-Za-z0-9+/]{43}=$"
        - type: "null"
      x-relay-choice: true
      x-relay-choice-note: "Returning the secret once in the create and rotate responses, in the Standard Webhooks whsec_ form, is chosen by the contract."
    previous_key_expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
WebhookEndpointKeyRotate:
  type: object
  description: "Signing key rotation request (WH-6)."
  properties:
    signature_scheme:
      "$ref": "#/SignatureScheme"
      description: "The scheme of the new key; the endpoint's current scheme when absent."
    overlap:
      "$ref": "#/Duration"
      description: "How long the previous key keeps signing next to the new one: PT0S to P7D, PT24H when absent."
  additionalProperties: false
WebhookEndpointVersion:
  type: object
  description: "A version of a webhook endpoint (WH-12): the snapshot allow-list and the payload version its messages are built with. Versions never change."
  required:
    - object
    - endpoint_id
    - version
    - snapshot
    - payload_version
    - created_at
  properties:
    object:
      type: string
      const: webhook_endpoint_version
    endpoint_id:
      "$ref": "#/Id_whe"
    version:
      type: integer
      minimum: 1
    snapshot:
      "$ref": "#/WebhookSnapshot"
    payload_version:
      "$ref": "#/ApiVersion"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WebhookEndpointVersionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookEndpointVersion"
  description: "A page of endpoint versions, newest first."
WebhookConsumerKey:
  type: string
  description: "The tenant's own reference of a consumer, one of its customers."
  minLength: 1
  maxLength: 256
  pattern: "^[\\x21-\\x7E]+$"
WebhookConsumerCreate:
  type: object
  description: "Consumer creation request."
  required:
    - key
  properties:
    key:
      "$ref": "#/WebhookConsumerKey"
    name:
      type: string
      minLength: 1
      maxLength: 256
    source:
      "$ref": "#/WebhookEventSource"
    subtenant_id:
      "$ref": "#/Id_stn"
  additionalProperties: false
WebhookConsumerPatch:
  type: object
  description: "Changes to a consumer; absent fields are left untouched and null clears a field."
  properties:
    name:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 256
        - type: "null"
    source:
      oneOf:
        - "$ref": "#/WebhookEventSource"
        - type: "null"
  additionalProperties: false
  minProperties: 1
WebhookEventSource:
  type: string
  description: "The CloudEvents source of the events delivered to the consumer (WH-8): the tenant's own value. Relay's tenant identifier is never part of an event a consumer receives."
  minLength: 1
  maxLength: 1024
  pattern: "^[\\x21-\\x7E]+$"
WebhookConsumer:
  type: object
  description: "A consumer (WH-2): the party that receives events of use destination, a customer of the tenant. Its endpoints, messages and portal token are its own; one consumer never sees another's."
  required:
    - object
    - id
    - key
    - name
    - source
    - subtenant_id
    - state
    - version
    - created_at
    - updated_at
    - archived_at
  properties:
    object:
      type: string
      const: webhook_consumer
    id:
      "$ref": "#/Id_whc"
    key:
      "$ref": "#/WebhookConsumerKey"
    name:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    source:
      oneOf:
        - "$ref": "#/WebhookEventSource"
        - type: "null"
    subtenant_id:
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    state:
      type: string
      enum:
        - active
        - archived
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
WebhookConsumerList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookConsumer"
  description: "A page of consumers."
WebhookSource:
  type: object
  description: "A completion source (WH-68): an external system that tells Relay when a long-running job has ended. It signs with the Suiss webhook profile; Relay holds its Ed25519 public key (v1a) or the reference of its HMAC secret (v1), never the secret."
  required:
    - object
    - id
    - name
    - scheme
    - public_key
    - secret_ref_id
    - state
    - created_at
    - updated_at
    - archived_at
  properties:
    object:
      type: string
      const: webhook_source
    id:
      "$ref": "#/Id_whs"
    name:
      type: string
      minLength: 1
      maxLength: 256
    scheme:
      type: string
      description: "The signature scheme of the source: v1a (Ed25519) with public_key, or v1 (HMAC-SHA256) with secret_ref_id."
      enum:
        - v1a
        - v1
    public_key:
      oneOf:
        - "$ref": "#/WebhookPublicKey"
        - type: "null"
    secret_ref_id:
      oneOf:
        - "$ref": "#/Id_sec"
        - type: "null"
    state:
      type: string
      enum:
        - active
        - archived
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
WebhookSourceCreate:
  type: object
  description: "Completion source registration request (WH-68): a name and exactly one of public_key and secret_ref_id."
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 256
    public_key:
      "$ref": "#/WebhookPublicKey"
    secret_ref_id:
      "$ref": "#/Id_sec"
  additionalProperties: false
WebhookSourceList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookSource"
  description: "A page of sources."
CompletionNotification:
  type: object
  description: "A long-running job completion notification (WH-68, WH-50): a structured CloudEvents 1.0 envelope, as Relay's own export.completed is. type is the outcome. Other CloudEvents attributes are allowed and ignored."
  required:
    - specversion
    - id
    - source
    - type
    - data
  properties:
    specversion:
      type: string
      const: "1.0"
    id:
      type: string
      minLength: 1
      maxLength: 512
    source:
      type: string
      minLength: 1
      maxLength: 1024
    type:
      type: string
      enum:
        - job.completed
        - job.failed
    time:
      "$ref": "#/Timestamp"
    datacontenttype:
      type: string
      const: application/json
    data:
      type: object
      required:
        - waitpoint_id
      properties:
        waitpoint_id:
          "$ref": "#/Id_wp"
        result:
          type: object
          description: "A small result of the job, at most 4096 bytes as JSON: a summary such as a status, counters, object identifiers or a reference to the output. It is kept encrypted with the notification and is never part of an event. It carries no personal data (WH-69): the result is not kept against a person, so the erasure of a person does not reach it, and Relay does not inspect it. A source whose output concerns a person sends only a reference to the record in its own system."
      additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "WH-68 has the notification carry a waitpoint reference; the envelope, the two types and the bounded result are chosen by the contract."
CompletionNotificationAnswer:
  type: object
  description: "An empty object, or an error name."
WebhookPortalToken:
  type: object
  description: "A portal token (WH-47): a short-lived bearer token for the embeddable webhook portal, scoped to one consumer in the environment of the credential that minted it."
  required:
    - object
    - token
    - consumer_id
    - expires_at
  properties:
    object:
      type: string
      const: webhook_portal_token
    token:
      type: string
      minLength: 32
      maxLength: 4096
    consumer_id:
      "$ref": "#/Id_whc"
    expires_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WebhookEventSchema:
  type: object
  description: "A JSON Schema 2020-12 document of an event type's data (WH-13, WH-14). It is data: Relay validates payloads against it and never runs tenant code."
  maxProperties: 64
WebhookEventIdentifiers:
  type: array
  description: "The identifier fields of the event type's data: with type and id they are the default, thin payload (WH-13). Other fields reach an endpoint only through its snapshot allow-list."
  items:
    type: string
    pattern: "^[a-z][a-z0-9_]{0,63}$"
  maxItems: 32
  uniqueItems: true
WebhookEventTypeCreate:
  type: object
  description: "Tenant event type creation request (WH-14)."
  required:
    - name
    - schema
  properties:
    name:
      "$ref": "#/EventName"
    description:
      type: string
      minLength: 1
      maxLength: 500
    schema:
      "$ref": "#/WebhookEventSchema"
    identifiers:
      "$ref": "#/WebhookEventIdentifiers"
    example:
      type: object
      description: "An example of the event's data, valid against schema; shown in the portal."
  additionalProperties: false
WebhookEventTypeVersionCreate:
  type: object
  description: "A new schema version of a tenant event type: a schema change always opens a new version (WH-14)."
  required:
    - schema
  properties:
    schema:
      "$ref": "#/WebhookEventSchema"
    identifiers:
      "$ref": "#/WebhookEventIdentifiers"
    example:
      type: object
  additionalProperties: false
WebhookEventType:
  type: object
  description: "An event type of the tenant (WH-14): a versioned schema with an example, kept in the tenant's scope in the same structure as Relay's event catalog."
  required:
    - object
    - id
    - name
    - description
    - state
    - version
    - schema
    - identifiers
    - example
    - created_at
    - updated_at
    - archived_at
  properties:
    object:
      type: string
      const: webhook_event_type
    id:
      "$ref": "#/Id_wet"
    name:
      "$ref": "#/EventName"
    description:
      oneOf:
        - type: string
          maxLength: 500
        - type: "null"
    state:
      type: string
      enum:
        - active
        - archived
    version:
      type: integer
      description: "The current schema version."
      minimum: 1
    schema:
      "$ref": "#/WebhookEventSchema"
    identifiers:
      "$ref": "#/WebhookEventIdentifiers"
    example:
      oneOf:
        - type: object
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
WebhookEventTypeList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookEventType"
  description: "A page of tenant event types."
WebhookEventTypeVersion:
  type: object
  description: "One schema version of a tenant event type. Versions never change."
  required:
    - object
    - event_type_id
    - name
    - version
    - schema
    - identifiers
    - example
    - created_at
  properties:
    object:
      type: string
      const: webhook_event_type_version
    event_type_id:
      "$ref": "#/Id_wet"
    name:
      "$ref": "#/EventName"
    version:
      type: integer
      minimum: 1
    schema:
      "$ref": "#/WebhookEventSchema"
    identifiers:
      "$ref": "#/WebhookEventIdentifiers"
    example:
      oneOf:
        - type: object
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WebhookEventTypeVersionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookEventTypeVersion"
  description: "A page of schema versions, newest first."
WebhookCatalogEvent:
  type: object
  description: "An event type of Relay's event catalog as an endpoint of use relay_events can subscribe to it: its name, the version and schema of its data and an example."
  required:
    - object
    - name
    - summary
    - version
    - dataschema
    - schema
    - example
  properties:
    object:
      type: string
      const: webhook_catalog_event
    name:
      "$ref": "#/EventName"
    summary:
      type: string
      maxLength: 1000
    version:
      type: integer
      minimum: 1
    dataschema:
      type: string
      format: uri
    schema:
      type: object
    example:
      oneOf:
        - type: object
        - type: "null"
  additionalProperties: false
WebhookCatalogEventList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookCatalogEvent"
  description: "A page of catalog event types, by name."
WebhookMessageState:
  type: string
  description: "pending waits for its first attempt, scheduled for a retry, in_flight has an attempt running, held waits because its endpoint is paused or disabled or its circuit breaker is open. The other states are terminal (WH-27): delivered; failed_permanent (410, a 4xx that is not retried, a 3xx, the consumer's abort); exhausted (every attempt of the schedule failed); expired (the event's delivery time ran out); window_exceeded (rate limit or backlog left no room for the attempts within the window); dead_lettered (no attempt could be made: the endpoint was archived, the destination configuration is invalid, the payload is too large or the destination refused it); cancelled. Every terminal state except delivered stays in the dead letter queue and can be recovered."
  enum:
    - pending
    - scheduled
    - in_flight
    - held
    - delivered
    - failed_permanent
    - exhausted
    - expired
    - window_exceeded
    - dead_lettered
    - cancelled
WebhookMessageFailedState:
  type: string
  description: "The terminal states other than delivered (WH-27)."
  enum:
    - failed_permanent
    - exhausted
    - expired
    - window_exceeded
    - dead_lettered
    - cancelled
WebhookReasonCode:
  type: string
  description: "A machine readable reason, for example redirect_not_followed, aborted_by_consumer, gone, payload_too_large, endpoint_archived, destination_invalid, destination_rejected, http_4xx, http_5xx, timeout, connection_failed, tls_failed, address_blocked."
  pattern: "^[a-z0-9_]{1,64}$"
WebhookMessage:
  type: object
  description: "A message (WH-2): the delivery of one event to one endpoint. An event produces at most one message per endpoint, whatever is retried, recovered or replayed; event_id is the webhook-id the consumer deduplicates by."
  required:
    - object
    - id
    - endpoint_id
    - endpoint_version
    - event_id
    - event_type
    - origin
    - state
    - hold_reason
    - reason
    - attempt_count
    - next_attempt_at
    - last_attempt_at
    - last_response_status
    - delivered_at
    - expires_at
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: webhook_message
    id:
      "$ref": "#/Id_whm"
    endpoint_id:
      "$ref": "#/Id_whe"
    endpoint_version:
      type: integer
      minimum: 1
    event_id:
      type: string
      description: "The event identifier: the CloudEvents id and the webhook-id header of every attempt."
      maxLength: 512
    event_type:
      "$ref": "#/EventName"
    origin:
      type: string
      description: "event: the event matched the endpoint's subscription. replay: the event was replayed to the endpoint. test: a test event."
      enum:
        - event
        - replay
        - test
    state:
      "$ref": "#/WebhookMessageState"
    hold_reason:
      oneOf:
        - type: string
          enum:
            - endpoint_paused
            - endpoint_disabled
            - breaker_open
        - type: "null"
    reason:
      oneOf:
        - "$ref": "#/WebhookReasonCode"
        - type: "null"
    attempt_count:
      type: integer
      description: "Attempts made, manual ones included."
      minimum: 0
    next_attempt_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    last_attempt_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    last_response_status:
      oneOf:
        - type: integer
          minimum: 100
          maximum: 599
        - type: "null"
    delivered_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WebhookMessageList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookMessage"
  description: "A page of messages, newest first."
WebhookEvent:
  type: object
  description: "One of Relay's own events as the development tunnel reads it (WH-45): its identifier, which is the webhook-id of every delivery of the event, its type, when it was recorded and its thin CloudEvents 1.0 envelope (WH-8, WH-11)."
  required:
    - object
    - id
    - type
    - created_at
    - envelope
  properties:
    object:
      type: string
      const: webhook_event
    id:
      type: string
      description: "The event identifier: the CloudEvents id and the webhook-id header of every delivery."
      minLength: 1
      maxLength: 256
    type:
      "$ref": "#/EventName"
    created_at:
      "$ref": "#/Timestamp"
    envelope:
      type: object
      description: "The structured CloudEvents 1.0 envelope of the event with its thin data, as asyncapi/events.yaml describes it for the event type."
      required:
        - specversion
        - id
        - source
        - type
        - time
        - data
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
        source:
          type: string
        type:
          "$ref": "#/EventName"
        time:
          "$ref": "#/Timestamp"
        data:
          type: object
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "The shape of a feed entry is chosen by the contract."
WebhookEventList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookEvent"
  description: "A page of events, newest first."
WebhookAttempt:
  type: object
  description: "One delivery attempt of a message (WH-10): the digest of the raw body, the signature that was sent, the address Relay connected to, the status, the duration and, when the attempt is read by itself, the first 8 kB of the answer. No secret is kept in an attempt."
  required:
    - object
    - id
    - message_id
    - endpoint_id
    - attempt_no
    - trigger
    - result
    - failure_code
    - response_status
    - duration_ms
    - webhook_timestamp
    - body_digest
    - signature
    - destination_ip
    - retry_after
    - started_at
    - finished_at
  properties:
    object:
      type: string
      const: webhook_attempt
    id:
      "$ref": "#/Id_wha"
    message_id:
      "$ref": "#/Id_whm"
    endpoint_id:
      "$ref": "#/Id_whe"
    attempt_no:
      type: integer
      minimum: 1
    trigger:
      type: string
      description: "schedule: an attempt of the retry schedule. manual: a resend, which does not use up the schedule (WH-32). recovery: an attempt of a schedule restarted by recover or a bulk retry. test: a test event."
      enum:
        - schedule
        - manual
        - recovery
        - test
    result:
      oneOf:
        - type: string
          enum:
            - succeeded
            - failed_retryable
            - failed_permanent
            - aborted
            - deferred
        - type: "null"
      description: "null while the attempt runs. aborted: the consumer answered webhook-delivery: abort-message (WH-26). deferred: a 429 or 503 with Retry-After put the attempt off without using up the schedule (WH-25)."
    failure_code:
      oneOf:
        - "$ref": "#/WebhookReasonCode"
        - type: "null"
    response_status:
      oneOf:
        - type: integer
          minimum: 100
          maximum: 599
        - type: "null"
    duration_ms:
      oneOf:
        - type: integer
          minimum: 0
        - type: "null"
    webhook_timestamp:
      oneOf:
        - type: integer
          minimum: 0
        - type: "null"
      description: "The webhook-timestamp of this attempt, Unix seconds; every attempt has a new one (WH-7)."
    body_digest:
      type: string
      description: "SHA-256 of the raw body, lowercase hex."
      pattern: "^[0-9a-f]{64}$"
    signature:
      oneOf:
        - type: string
          maxLength: 1024
        - type: "null"
      description: "The webhook-signature header that was sent."
    destination_ip:
      oneOf:
        - type: string
          maxLength: 45
        - type: "null"
      description: "The validated address Relay connected to."
    retry_after:
      oneOf:
        - "$ref": "#/Duration"
        - type: "null"
    started_at:
      "$ref": "#/Timestamp"
    finished_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    response_body:
      oneOf:
        - type: object
          required:
            - encoding
            - content
            - truncated
          properties:
            encoding:
              type: string
              enum:
                - utf8
                - base64
            content:
              type: string
              maxLength: 10924
            truncated:
              type: boolean
          additionalProperties: false
        - type: "null"
      description: "The first 8 kB of the answer, as the consumer sent it; it may hold personal data and is kept for the response body retention of the delivery log. Present only when one attempt is read; null once it was erased."
  additionalProperties: false
WebhookAttemptList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/WebhookAttempt"
  description: "A page of attempts, in attempt order."
WebhookTestRequest:
  type: object
  description: "Test event request (WH-45)."
  properties:
    event_type:
      "$ref": "#/EventName"
      description: "The event type whose example is sent; webhook_endpoint.tested when absent. A test event is delivered whatever the endpoint's subscription."
  additionalProperties: false
WebhookRecoverRequest:
  type: object
  description: "Recover request (WH-31): queues again every message of the endpoint, created at or after since, that failed or was never attempted; each starts its schedule from the beginning."
  required:
    - since
  properties:
    since:
      "$ref": "#/Timestamp"
    until:
      "$ref": "#/Timestamp"
  additionalProperties: false
WebhookRetryRequest:
  type: object
  description: "Filtered bulk retry request (WH-31): the messages of the endpoint that match every given filter start their schedule from the beginning."
  properties:
    event_types:
      type: array
      items:
        "$ref": "#/EventName"
      minItems: 1
      maxItems: 100
      uniqueItems: true
    states:
      type: array
      items:
        "$ref": "#/WebhookMessageFailedState"
      minItems: 1
      uniqueItems: true
    reasons:
      type: array
      items:
        "$ref": "#/WebhookReasonCode"
      minItems: 1
      maxItems: 20
      uniqueItems: true
    since:
      "$ref": "#/Timestamp"
    until:
      "$ref": "#/Timestamp"
  additionalProperties: false
  minProperties: 1
WebhookReplayRequest:
  type: object
  description: "Replay request (WH-31): delivers the events still in retention, created at or after since, to this endpoint, for example one that was just added. An event the endpoint already has a message for is not delivered again."
  required:
    - since
  properties:
    since:
      "$ref": "#/Timestamp"
    until:
      "$ref": "#/Timestamp"
    event_types:
      "$ref": "#/WebhookEventTypes"
      description: "The event types to replay; the endpoint's subscription when absent."
  additionalProperties: false
WebhookCancelRetriesRequest:
  type: object
  description: "Scheduled retry cancellation request (WH-31): the pending, scheduled and held messages of the endpoint that match every given filter become cancelled."
  properties:
    event_types:
      type: array
      items:
        "$ref": "#/EventName"
      minItems: 1
      maxItems: 100
      uniqueItems: true
    since:
      "$ref": "#/Timestamp"
    until:
      "$ref": "#/Timestamp"
  additionalProperties: false
WebhookRecovery:
  type: object
  description: "The outcome of a recovery operation: how many messages it selected. The messages are attempted at a controlled rate within the endpoint's limits, fairly between tenants, without holding back live traffic (WH-33); the event identifier of every one of them is unchanged and its attempt number goes on."
  required:
    - object
    - operation
    - endpoint_id
    - selected
  properties:
    object:
      type: string
      const: webhook_recovery
    operation:
      type: string
      enum:
        - recover
        - retry
        - replay
        - cancel_retries
    endpoint_id:
      "$ref": "#/Id_whe"
    selected:
      type: integer
      minimum: 0
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "WH-31 names the recovery operations; their answer shape is chosen by the contract."
WebhookEndpointHealth:
  type: object
  description: "The health of an endpoint (WH-39): success rate and latency over the window, the last successful delivery, the age of the backlog, the circuit breaker, why it is disabled and a summary of the latest failures."
  required:
    - object
    - endpoint_id
    - state
    - disabled_reason
    - window
    - succeeded
    - failed
    - success_rate_bp
    - latency_ms
    - last_success_at
    - last_failure_at
    - failing_since
    - disable_at
    - backlog
    - breaker
    - recent_failures
  properties:
    object:
      type: string
      const: webhook_endpoint_health
    endpoint_id:
      "$ref": "#/Id_whe"
    state:
      "$ref": "#/WebhookEndpointState"
    disabled_reason:
      oneOf:
        - "$ref": "#/WebhookEndpointDisabledReason"
        - type: "null"
    window:
      "$ref": "#/Duration"
    succeeded:
      type: integer
      minimum: 0
    failed:
      type: integer
      minimum: 0
    success_rate_bp:
      oneOf:
        - type: integer
          minimum: 0
          maximum: 10000
        - type: "null"
      description: "Successful attempts of the window in basis points; null without attempts."
    latency_ms:
      oneOf:
        - type: object
          required:
            - p50
            - p95
            - p99
          properties:
            p50:
              type: integer
              minimum: 0
            p95:
              type: integer
              minimum: 0
            p99:
              type: integer
              minimum: 0
          additionalProperties: false
        - type: "null"
    last_success_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    last_failure_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    failing_since:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
      description: "The start of the uninterrupted failure the automatic disable counts from (WH-36); one successful delivery clears it."
    disable_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
      description: "When the endpoint is disabled automatically if it keeps failing; null while the clock has not started or auto_disable is false."
    backlog:
      type: object
      required:
        - waiting
        - held
        - oldest_at
      properties:
        waiting:
          type: integer
          minimum: 0
        held:
          type: integer
          minimum: 0
        oldest_at:
          oneOf:
            - "$ref": "#/Timestamp"
            - type: "null"
      additionalProperties: false
    breaker:
      type: object
      required:
        - state
        - opened_at
        - retry_at
      properties:
        state:
          type: string
          enum:
            - closed
            - open
            - half_open
        opened_at:
          oneOf:
            - "$ref": "#/Timestamp"
            - type: "null"
        retry_at:
          oneOf:
            - "$ref": "#/Timestamp"
            - type: "null"
      additionalProperties: false
    recent_failures:
      type: array
      items:
        type: object
        required:
          - code
          - count
          - last_at
        properties:
          code:
            "$ref": "#/WebhookReasonCode"
          count:
            type: integer
            minimum: 1
          last_at:
            "$ref": "#/Timestamp"
        additionalProperties: false
      maxItems: 20
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "WH-39 names what the health panel shows; the fields and the 24 hour window are chosen by the contract."
OperationsContactsReplace:
  type: object
  description: "The tenant's operations contact addresses (WH-56): the recipients of Relay's operational e-mails about its webhook endpoints. The whole list is replaced."
  required:
    - emails
  properties:
    emails:
      type: array
      items:
        type: string
        format: email
        maxLength: 254
      maxItems: 5
      uniqueItems: true
  additionalProperties: false
OperationsContacts:
  type: object
  description: "The tenant's operations contact addresses of this environment (WH-56). Without an address, or without a sender address in the installation configuration, an operational e-mail is skipped and recorded with the reason operations_email_unavailable; the webhook and panel notices are not affected."
  required:
    - object
    - emails
    - updated_at
  properties:
    object:
      type: string
      const: operations_contacts
    emails:
      type: array
      items:
        type: string
        format: email
        maxLength: 254
      maxItems: 5
    updated_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "WH-56 sets at most five operations contact addresses per tenant; the resource and its fields are chosen by the contract."
WebhookPortalEndpointCreate:
  type: object
  description: "Endpoint creation request of the portal: an https endpoint of the token's consumer. Use, consumer and environment come from the token."
  required:
    - url
    - event_types
  properties:
    url:
      "$ref": "#/WebhookHttpsUrl"
    event_types:
      "$ref": "#/WebhookEventTypes"
    signature_scheme:
      "$ref": "#/SignatureScheme"
      default: v1a
    description:
      type: string
      minLength: 1
      maxLength: 500
  additionalProperties: false
WebhookPortalEndpointPatch:
  type: object
  description: "Changes the portal may make to an endpoint of the token's consumer; absent fields are left untouched."
  properties:
    url:
      "$ref": "#/WebhookHttpsUrl"
    event_types:
      "$ref": "#/WebhookEventTypes"
    description:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 500
        - type: "null"
    state:
      type: string
      enum:
        - active
        - disabled
  additionalProperties: false
  minProperties: 1
DevicePlatform:
  type: string
  description: "Push platform of a device: Apple Push Notification service, Firebase Cloud Messaging, Huawei Push Kit, a Web Push subscription or a UnifiedPush distributor."
  enum:
    - apns
    - fcm
    - hms
    - web_push
    - unified_push
DevicePermission:
  type: string
  description: "The operating system's notification permission as the app reports it. Relay sends push only to granted devices, and to provisional ones for marketing and social messages; any other device is skipped with no_permission and the route moves on. The permission never changes a preference."
  enum:
    - granted
    - denied
    - provisional
    - not_determined
DeviceState:
  type: string
  description: "active: registered and seen recently. stale: not seen for the stale period, still a target. disabled: soft deleted, never a target again; a new registration of the same token creates a new device."
  enum:
    - active
    - stale
    - disabled
DeviceDisabledReason:
  type: string
  description: "Why a device was disabled: unregistered (the push service reported the token invalid), logout (the app removed it), removed (the tenant removed it), replaced (the app registered a new token for it), inactive (not seen for the inactivity period), device_limit (the subscriber registered more than the active device limit), reassigned (another subscriber registered the token) or erased (the subscriber was erased)."
  enum:
    - unregistered
    - logout
    - removed
    - replaced
    - inactive
    - device_limit
    - reassigned
    - erased
ApnsEnvironment:
  type: string
  description: "The APNs environment the token was issued for. It is not the Relay environment (live or test)."
  enum:
    - production
    - sandbox
AndroidChannelImportance:
  type: string
  description: "Importance of an Android notification channel as the app reports it."
  enum:
    - none
    - min
    - low
    - default
    - high
AndroidChannel:
  type: object
  description: "An Android notification channel the app created and its current importance."
  required:
    - id
    - importance
  properties:
    id:
      type: string
      pattern: "^[A-Za-z0-9._-]{1,64}$"
    importance:
      "$ref": "#/AndroidChannelImportance"
  additionalProperties: false
DeviceAppId:
  type: string
  description: "The app the token belongs to: an iOS bundle id, an Android package name, a Firebase or HMS app id, or the tenant's name for a web app."
  pattern: "^[A-Za-z0-9._:/-]{1,256}$"
DeviceToken:
  type: string
  description: "The push token: an APNs device token, an FCM or HMS registration token, or the push service endpoint URL of a Web Push or UnifiedPush subscription. Relay stores it encrypted, finds it by a keyed digest and never returns it; logs and responses carry only its fingerprint."
  minLength: 1
  maxLength: 4096
WebPushKeys:
  type: object
  description: "The keys of a Web Push or UnifiedPush subscription (RFC 8291), as the browser's PushSubscription returns them in base64url. Stored encrypted with the token and never returned."
  required:
    - p256dh
    - auth
  properties:
    p256dh:
      type: string
      pattern: "^[A-Za-z0-9_-]{86,88}={0,2}$"
    auth:
      type: string
      pattern: "^[A-Za-z0-9_-]{22,24}={0,2}$"
  additionalProperties: false
DeviceRegistration:
  type: object
  description: "Registers a push token for the subscriber, or refreshes it: the mobile SDK sends it on every app start. Registering a token the subscriber already has is idempotent and updates last_seen_at, the permission and the channels. A token registered by another subscriber is moved to this one and device.reassigned is emitted. previous_token names the token this one replaces (onNewToken, pushsubscriptionchange); that device is disabled. When the subscriber has more active devices than the limit, the least recently seen one is disabled with device_limit; a registration is never refused for the limit."
  required:
    - platform
    - token
    - app
    - permission
  properties:
    platform:
      "$ref": "#/DevicePlatform"
    token:
      "$ref": "#/DeviceToken"
    keys:
      "$ref": "#/WebPushKeys"
      description: "Required for web_push and unified_push; not allowed for other platforms."
    app:
      "$ref": "#/DeviceAppId"
    apns_environment:
      "$ref": "#/ApnsEnvironment"
      description: "Required for apns; not allowed for other platforms."
    permission:
      "$ref": "#/DevicePermission"
    android_channels:
      type: array
      maxItems: 50
      uniqueItems: true
      items:
        "$ref": "#/AndroidChannel"
    locale:
      "$ref": "#/Locale"
    timezone:
      "$ref": "#/TimeZone"
    interruption_permissions:
      "$ref": "#/DeviceInterruptionPermissions"
    previous_token:
      "$ref": "#/DeviceToken"
  additionalProperties: false
DeviceInterruptionPermission:
  type: string
  description: "One interruption permission as the app reads it from the operating system."
  enum:
    - granted
    - denied
    - not_determined
DeviceInterruptionPermissions:
  type: object
  description: "The interruption permissions the device reports on every app start (CH-65): on iOS critical_alerts (the Critical Alerts entitlement and the user's grant) and time_sensitive; on Android dnd_access (Do Not Disturb access of the channel that carries critical). A level the device cannot take is delivered one level lower and never dropped: critical without critical_alerts or dnd_access goes as time-sensitive, time-sensitive with time_sensitive denied as active. A device that reports nothing keeps the level."
  properties:
    critical_alerts:
      "$ref": "#/DeviceInterruptionPermission"
    time_sensitive:
      "$ref": "#/DeviceInterruptionPermission"
    dnd_access:
      "$ref": "#/DeviceInterruptionPermission"
  additionalProperties: false
DeviceTokenRemoval:
  type: object
  description: "Names a device by its token, as the app or the tenant holds it."
  required:
    - token
  properties:
    token:
      "$ref": "#/DeviceToken"
  additionalProperties: false
Device:
  type: object
  description: "A push target of a subscriber. The token is never returned; token_fingerprint is a short keyed digest of it that also appears in device events."
  required:
    - object
    - id
    - subscriber_id
    - platform
    - app
    - token_fingerprint
    - apns_environment
    - permission
    - android_channels
    - locale
    - state
    - disabled_reason
    - registered_at
    - last_seen_at
    - deleted_at
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: device
    id:
      "$ref": "#/Id_dev"
    subscriber_id:
      "$ref": "#/Id_sub"
    platform:
      "$ref": "#/DevicePlatform"
    app:
      "$ref": "#/DeviceAppId"
    token_fingerprint:
      type: string
      pattern: "^[0-9a-f]{16}$"
    apns_environment:
      oneOf:
        - "$ref": "#/ApnsEnvironment"
        - type: "null"
    permission:
      "$ref": "#/DevicePermission"
    android_channels:
      type: array
      items:
        "$ref": "#/AndroidChannel"
    locale:
      oneOf:
        - "$ref": "#/Locale"
        - type: "null"
    timezone:
      description: "The IANA time zone the device reported with its registration; null when it reported none or one Relay does not know."
      oneOf:
        - "$ref": "#/TimeZone"
        - type: "null"
    interruption_permissions:
      description: "The interruption permissions the device reported with its last registration; null when it reported none."
      oneOf:
        - "$ref": "#/DeviceInterruptionPermissions"
        - type: "null"
    state:
      "$ref": "#/DeviceState"
    disabled_reason:
      oneOf:
        - "$ref": "#/DeviceDisabledReason"
        - type: "null"
    registered_at:
      "$ref": "#/Timestamp"
    last_seen_at:
      "$ref": "#/Timestamp"
    deleted_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
DeviceList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Device"
MessagingChannel:
  type: string
  enum:
    - slack
    - teams
    - telegram
    - discord
TeamsConversationReference:
  type: object
  description: "The conversation reference a Teams bot captured: the Bot Framework service URL (https, a Bot Framework host) and the conversation ID."
  required:
    - service_url
    - conversation_id
  properties:
    service_url:
      type: string
      format: uri
      maxLength: 512
    conversation_id:
      type: string
      minLength: 1
      maxLength: 512
  additionalProperties: false
MessagingTargetPut:
  type: object
  required:
    - provider_account_id
    - conversation
  properties:
    provider_account_id:
      "$ref": "#/Id_pva"
    conversation:
      oneOf:
        - type: string
          description: "A Slack user or conversation ID, a Telegram chat ID, or a Discord channel ID (user:<id> for a direct message)."
          pattern: "^(user:)?[A-Za-z0-9_.:@-]{1,128}$"
        - "$ref": "#/TeamsConversationReference"
  additionalProperties: false
MessagingTarget:
  type: object
  description: "Where a subscriber is reached on a messaging channel. The conversation itself is never returned."
  required:
    - object
    - id
    - subscriber_id
    - channel
    - provider_account_id
    - state
    - created_at
    - updated_at
    - deleted_at
  properties:
    object:
      type: string
      const: messaging_target
    id:
      "$ref": "#/Id_mtg"
    subscriber_id:
      "$ref": "#/Id_sub"
    channel:
      "$ref": "#/MessagingChannel"
    provider_account_id:
      "$ref": "#/Id_pva"
    state:
      type: string
      enum:
        - active
        - disabled
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    deleted_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
MessagingInstallationCreate:
  type: object
  required:
    - channel
    - channel_identity_id
  properties:
    channel:
      type: string
      enum:
        - slack
        - discord
        - telegram
    channel_identity_id:
      "$ref": "#/Id_chi"
    redirect_uri:
      type: string
      format: uri
      pattern: "^https://"
      maxLength: 2048
  additionalProperties: false
MessagingInstallation:
  type: object
  required:
    - object
    - channel
    - state
    - authorize_url
    - expires_at
    - provider_account_id
  properties:
    object:
      type: string
      const: messaging_installation
    channel:
      "$ref": "#/MessagingChannel"
    state:
      type: string
      enum:
        - pending
        - installed
    authorize_url:
      oneOf:
        - type: string
          format: uri
        - type: "null"
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    provider_account_id:
      oneOf:
        - "$ref": "#/Id_pva"
        - type: "null"
  additionalProperties: false
ChannelAdapter:
  type: object
  required:
    - object
    - provider
    - channels
    - adapter_version
    - activated
    - in_use
    - warning
    - deprecations
  properties:
    object:
      type: string
      const: channel_adapter
    provider:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,31}$"
    channels:
      type: array
      items:
        "$ref": "#/Channel"
    adapter_version:
      type: string
      pattern: "^[0-9]{1,4}\\.[0-9]{1,4}\\.[0-9]{1,4}$"
    activated:
      type: boolean
    in_use:
      type: boolean
    warning:
      type: boolean
    deprecations:
      type: array
      items:
        type: object
        required:
          - api
          - sunset_on
        properties:
          api:
            type: string
            maxLength: 128
          sunset_on:
            oneOf:
              - type: string
                format: date
              - type: "null"
        additionalProperties: false
  additionalProperties: false
ChannelAdapterList:
  type: object
  required:
    - object
    - data
  properties:
    object:
      type: string
      const: list
    data:
      type: array
      items:
        "$ref": "#/ChannelAdapter"
  additionalProperties: false
ProviderAccountStatus:
  type: object
  description: "The panel warnings of a provider account: data sent abroad (CH-6), adapter deprecation (CH-4) and circuit breaker state (T-25)."
  required:
    - object
    - provider_account_id
    - channel
    - provider
    - data_residency
    - adapter
    - circuit_breaker
  properties:
    object:
      type: string
      const: provider_account_status
    provider_account_id:
      "$ref": "#/Id_pva"
    channel:
      "$ref": "#/Channel"
    provider:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,31}$"
    data_residency:
      type: object
      required:
        - sends_data_abroad
        - reference_region
        - abroad_countries
        - in_installation
        - processing_countries
        - declared_processing_countries
        - transfer_basis
        - scc_notified_on
      properties:
        sends_data_abroad:
          type: boolean
        reference_region:
          type: string
          enum:
            - tr
            - eu
            - us
        abroad_countries:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z]{2}$"
        in_installation:
          type: boolean
        processing_countries:
          "$ref": "#/CountryList"
        declared_processing_countries:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z]{2}$"
        transfer_basis:
          "$ref": "#/TransferBasis"
        scc_notified_on:
          oneOf:
            - type: string
              format: date
            - type: "null"
      additionalProperties: false
    adapter:
      type: object
      required:
        - declared
        - adapter_version
        - activated
        - deprecation_warning
        - deprecations
      properties:
        declared:
          type: boolean
        adapter_version:
          oneOf:
            - type: string
              maxLength: 32
            - type: "null"
        activated:
          type: boolean
        deprecation_warning:
          type: boolean
        deprecations:
          type: array
          items:
            type: object
            required:
              - api
              - sunset_on
            properties:
              api:
                type: string
                maxLength: 128
              sunset_on:
                oneOf:
                  - type: string
                    format: date
                  - type: "null"
            additionalProperties: false
      additionalProperties: false
    circuit_breaker:
      type: object
      required:
        - provider
        - account
        - observed_by
      properties:
        provider:
          "$ref": "#/BreakerState"
        account:
          "$ref": "#/BreakerState"
        observed_by:
          type: string
          const: node
      additionalProperties: false
  additionalProperties: false
BreakerState:
  type: string
  description: "A circuit breaker state as the answering node sees it; a breaker that saw no call is closed (T-25)."
  enum:
    - closed
    - open
    - half_open
EmailDomainCheckList:
  type: object
  required:
    - object
    - data
  properties:
    object:
      type: string
      const: list
    data:
      type: array
      maxItems: 2
      items:
        "$ref": "#/EmailDomainCheck"
  additionalProperties: false
EmailDomainCheck:
  type: object
  description: "The sending domain wizard of one e-mail stream (CH-36)."
  required:
    - object
    - stream
    - domain
    - verified
    - checked_at
    - records
    - findings
    - spf
    - dmarc
  properties:
    object:
      type: string
      const: email_domain_check
    stream:
      type: string
      enum:
        - transactional
        - marketing
    domain:
      type: string
      maxLength: 253
    verified:
      type: boolean
    checked_at:
      type: string
      format: date-time
    records:
      type: array
      maxItems: 8
      items:
        type: object
        required:
          - purpose
          - type
          - name
          - value
        properties:
          purpose:
            type: string
            enum:
              - return_path
              - dkim
              - spf
              - dmarc
          type:
            type: string
            enum:
              - CNAME
              - TXT
          name:
            type: string
            maxLength: 253
          value:
            oneOf:
              - type: string
                maxLength: 4096
              - type: "null"
        additionalProperties: false
    findings:
      type: array
      maxItems: 64
      items:
        type: object
        required:
          - severity
          - code
          - subject
        properties:
          severity:
            type: string
            enum:
              - error
              - warning
              - suggestion
          code:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,63}$"
          subject:
            type: string
            maxLength: 253
        additionalProperties: false
    spf:
      type: object
      required:
        - record
        - lookups
        - void_lookups
      properties:
        record:
          oneOf:
            - type: string
              maxLength: 4096
            - type: "null"
        lookups:
          type: integer
          minimum: 0
        void_lookups:
          type: integer
          minimum: 0
      additionalProperties: false
    dmarc:
      oneOf:
        - type: object
          required:
            - name
            - policy
            - org_domain
          properties:
            name:
              type: string
              maxLength: 253
            policy:
              oneOf:
                - type: string
                  maxLength: 16
                - type: "null"
            org_domain:
              type: string
              maxLength: 253
          additionalProperties: false
        - type: "null"
  additionalProperties: false
EmailWarmupPlanList:
  type: object
  description: "The warm-up plans of the active email_warmup_plans data set (CH-42)."
  required:
    - object
    - data
  properties:
    object:
      type: string
      const: list
    data:
      type: array
      items:
        type: object
        required:
          - id
          - applies_to
          - until_day
          - steps
        properties:
          id:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,63}$"
          applies_to:
            type: string
            enum:
              - domain
              - ip
          until_day:
            type: integer
            minimum: 1
            maximum: 365
          steps:
            type: array
            items:
              type: object
              required:
                - from_day
                - daily_cap
                - domain_hourly_cap
                - domains
              properties:
                from_day:
                  type: integer
                  minimum: 1
                daily_cap:
                  type: integer
                  minimum: 1
                domain_hourly_cap:
                  type: integer
                  minimum: 1
                domains:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 1
              additionalProperties: false
        additionalProperties: false
  additionalProperties: false
ChannelCostQuote:
  type: object
  description: "The cost of a paid channel selection per provider account (CH-18). A price the data does not hold is unpriced, never zero."
  required:
    - object
    - channel
    - country
    - category
    - quantity
    - data
  properties:
    object:
      type: string
      const: channel_cost_quote
    channel:
      type: string
      enum:
        - sms
        - voice
        - whatsapp
    country:
      type: string
      pattern: "^[A-Z]{2}$"
    category:
      oneOf:
        - type: string
          maxLength: 32
        - type: "null"
    quantity:
      type: integer
      minimum: 1
    data:
      type: array
      items:
        type: object
        required:
          - provider_account_id
          - provider
          - routable
          - paid
          - priced
          - source
          - currency
          - unit
          - unit_price_micros
          - total_micros
          - tier_from
        properties:
          provider_account_id:
            "$ref": "#/Id_pva"
          provider:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,31}$"
          routable:
            type: boolean
          paid:
            type: boolean
          priced:
            type: boolean
          source:
            type: string
            enum:
              - provider_declaration
              - whatsapp_rate_card
          currency:
            oneOf:
              - type: string
                pattern: "^[A-Z]{3}$"
              - type: "null"
          unit:
            oneOf:
              - type: string
                maxLength: 32
              - type: "null"
          unit_price_micros:
            oneOf:
              - type: integer
                minimum: 0
              - type: "null"
          total_micros:
            oneOf:
              - type: integer
                minimum: 0
              - type: "null"
          tier_from:
            oneOf:
              - type: integer
                minimum: 0
              - type: "null"
        additionalProperties: false
  additionalProperties: false
MessagingInboundRequest:
  type: object
  description: "A provider's own request body; Relay reads it only after the signature verified on the raw body."
MessagingInboundAnswer:
  type: object
  description: "What the provider expects in return, or an error name."
ProviderWebhookRequest:
  type: object
  description: "An SMS or e-mail provider's own webhook body; Relay reads it only after the request verified on the raw body."
ProviderWebhookAnswer:
  type: object
  description: "An empty object, or an error name."

Id_wtp:
  type: string
  description: "WhatsApp template identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^wtp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - wtp_01j9zq3k4m5n6p7q8r9s0t1v2w
WhatsappTemplateStatus:
  type: string
  description: "Relay's lifecycle of a WhatsApp template: pending_approval until Meta approves it; only approved is sent. rejected carries Meta's reason; paused and disabled follow Meta's PAUSED and DISABLED (and deletion or archiving)."
  enum:
    - pending_approval
    - approved
    - rejected
    - paused
    - disabled
WhatsappTemplateCategory:
  type: string
  description: "WhatsApp template category. Relay's class maps to a fixed category: security to authentication; transactional, operational and action_required to utility; marketing and social to marketing."
  enum:
    - authentication
    - utility
    - marketing
WhatsappTemplateComponent:
  type: object
  description: A component of the Meta template as it is submitted to Meta; text placeholders are {{1}} or {{name}}.
  required:
    - type
  properties:
    type:
      type: string
      enum:
        - HEADER
        - BODY
        - FOOTER
        - BUTTONS
    format:
      type: string
      maxLength: 32
    text:
      type: string
      maxLength: 1024
    buttons:
      type: array
      maxItems: 10
      items:
        type: object
  additionalProperties: false
WhatsappTemplateRegistration:
  type: object
  description: "Registers a Meta template of a WhatsApp provider account. Templates are immutable and named with their version (order_shipped_v3): new content is a new name, going back is going back to the older name."
  required:
    - provider_account_id
    - waba_id
    - name
    - language
    - message_class
    - components
  properties:
    provider_account_id:
      type: string
      format: uuid
      description: The WhatsApp provider account the template belongs to.
    waba_id:
      type: string
      pattern: "^[0-9]{1,32}$"
      description: The WhatsApp Business Account of the template.
    name:
      type: string
      pattern: "^[a-z0-9_]{1,512}$"
      description: The Meta template name.
    language:
      type: string
      pattern: "^[a-z]{2,3}([_-][A-Za-z0-9]{2,8}){0,2}$"
      description: "The template language, as a Meta code (en_US) or a locale (en-US)."
    message_class:
      "$ref": "#/MessageClass"
    components:
      type: array
      minItems: 1
      maxItems: 10
      items:
        "$ref": "#/WhatsappTemplateComponent"
  additionalProperties: false
WhatsappTemplate:
  type: object
  description: "A registered WhatsApp template with Relay's state next to Meta's status and category. preview is the text Meta approved, with its placeholders; category_drift is set when Meta's category differs from the class's category; edit_quota is what is left of Meta's edit limits."
  required:
    - object
    - id
    - provider_account_id
    - waba_id
    - name
    - language
    - message_class
    - category
    - meta_category
    - status
    - meta_status
    - meta_template_id
    - rejection_reason
    - quality
    - sendable
    - components
    - approved_components
    - preview
    - category_drift
    - edit_quota
    - status_changed_at
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: whatsapp_template
    id:
      "$ref": "#/Id_wtp"
    provider_account_id:
      type: string
      format: uuid
    waba_id:
      type: string
      maxLength: 32
    name:
      type: string
      maxLength: 512
    language:
      type: string
      maxLength: 35
    message_class:
      "$ref": "#/MessageClass"
    category:
      "$ref": "#/WhatsappTemplateCategory"
    meta_category:
      oneOf:
        - "$ref": "#/WhatsappTemplateCategory"
        - type: "null"
    status:
      "$ref": "#/WhatsappTemplateStatus"
    meta_status:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    meta_template_id:
      oneOf:
        - type: string
          maxLength: 32
        - type: "null"
    rejection_reason:
      oneOf:
        - type: string
          maxLength: 512
        - type: "null"
    quality:
      oneOf:
        - type: string
          maxLength: 32
        - type: "null"
    sendable:
      type: boolean
      description: Only an approved template is sent.
    components:
      type: array
      items:
        "$ref": "#/WhatsappTemplateComponent"
    approved_components:
      oneOf:
        - type: array
          items:
            "$ref": "#/WhatsappTemplateComponent"
        - type: "null"
    preview:
      type: object
      required:
        - header
        - body
        - footer
        - placeholders
      properties:
        header:
          oneOf:
            - type: string
            - type: "null"
        body:
          oneOf:
            - type: string
            - type: "null"
        footer:
          oneOf:
            - type: string
            - type: "null"
        placeholders:
          type: array
          items:
            type: string
      additionalProperties: false
    category_drift:
      oneOf:
        - type: object
          required:
            - expected
            - actual
            - cost_increase
          properties:
            expected:
              "$ref": "#/WhatsappTemplateCategory"
            actual:
              "$ref": "#/WhatsappTemplateCategory"
            cost_increase:
              type: boolean
          additionalProperties: false
        - type: "null"
    edit_quota:
      type: object
      required:
        - remaining
        - next_at
        - reason
      properties:
        remaining:
          type: integer
          minimum: 0
        next_at:
          oneOf:
            - "$ref": "#/Timestamp"
            - type: "null"
        reason:
          oneOf:
            - type: string
              enum:
                - daily
                - monthly
            - type: "null"
      additionalProperties: false
    status_changed_at:
      "$ref": "#/Timestamp"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
WhatsappTemplateList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/WhatsappTemplate"
WhatsappWebhookNotification:
  type: object
  description: "A WhatsApp Business Account notification as Meta sends it; Relay verifies X-Hub-Signature-256 over the raw body before it reads it. Changes Relay does not subscribe to are acknowledged and ignored."
  required:
    - object
    - entry
  properties:
    object:
      type: string
      maxLength: 64
    entry:
      type: array
      maxItems: 1000
      items:
        type: object
  additionalProperties: false
Id_snd:
  type: string
  description: "Sender identity identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^snd_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - snd_01j9zq3k4m5n6p7q8r9s0t1v2w
ProviderName:
  type: string
  description: "Adapter name of a provider, as its declaration names it."
  pattern: "^[a-z][a-z0-9_]{1,31}$"
ProviderAccountRole:
  type: string
  description: "Route role of a provider account (CH-13)."
  enum:
    - primary
    - backup
TransferBasis:
  type: string
  description: "Transfer basis of a provider that processes data outside the installation (CH-6)."
  enum:
    - none
    - adequacy
    - scc
    - explicit_consent
    - derogation
CountryList:
  type: array
  description: "ISO 3166-1 alpha-2 countries where the provider processes the data (CH-6)."
  maxItems: 16
  uniqueItems: true
  items:
    type: string
    pattern: "^[A-Z]{2}$"
ProviderSettings:
  type: object
  description: "Non-secret provider settings, such as a sender number identifier or a region; a secret never goes here."
  maxProperties: 64
SecretView:
  type: object
  description: "A stored secret reference as it is shown: its fingerprint (HMAC-SHA256 under the installation's fingerprint key), version and state. The reference and the secret are never returned (INV-51)."
  required:
    - fingerprint
    - version
    - state
  properties:
    fingerprint:
      type: string
      pattern: "^[0-9a-f]{64}$"
    version:
      type: integer
      minimum: 1
    state:
      type: string
      enum:
        - active
        - retired
  additionalProperties: false
ProviderAccount:
  type: object
  description: "A provider account of a channel (C-45): its route role, verification, health, data residency and the fingerprint of its credential. Only a verified, active account receives traffic (CH-14)."
  required:
    - object
    - id
    - channel
    - provider
    - ownership
    - role
    - priority
    - weight
    - state
    - traffic
    - verification_state
    - verified_at
    - verification_rule_id
    - health
    - health_checked_at
    - in_installation
    - processing_countries
    - transfer_basis
    - scc_notified_on
    - settings
    - credential
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: provider_account
    id:
      "$ref": "#/Id_pva"
    channel:
      "$ref": "#/Channel"
    provider:
      "$ref": "#/ProviderName"
    ownership:
      type: string
      enum:
        - shared
        - tenant
    role:
      "$ref": "#/ProviderAccountRole"
    priority:
      type: integer
      minimum: 0
      maximum: 99
    weight:
      type: integer
      minimum: 0
      maximum: 10000
    state:
      type: string
      enum:
        - active
        - disabled
        - archived
    traffic:
      type: string
      enum:
        - standard
        - security
    verification_state:
      type: string
      enum:
        - unverified
        - pending
        - verified
        - failed
    verified_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    verification_rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    health:
      type: string
      enum:
        - unknown
        - healthy
        - degraded
        - down
    health_checked_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    in_installation:
      type: boolean
    processing_countries:
      "$ref": "#/CountryList"
    transfer_basis:
      "$ref": "#/TransferBasis"
    scc_notified_on:
      oneOf:
        - type: string
          format: date
        - type: "null"
    settings:
      "$ref": "#/ProviderSettings"
    credential:
      oneOf:
        - "$ref": "#/SecretView"
        - type: "null"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
ProviderAccountList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/ProviderAccount"
ProviderAccountPatch:
  type: object
  description: "JSON Merge Patch of the fields of a provider account that hold no secret. A provider outside the installation needs at least one processing country, and the scc basis needs its notification date (CH-6)."
  properties:
    role:
      "$ref": "#/ProviderAccountRole"
    priority:
      type: integer
      minimum: 0
      maximum: 99
    weight:
      type: integer
      minimum: 0
      maximum: 10000
    in_installation:
      type: boolean
    processing_countries:
      "$ref": "#/CountryList"
    transfer_basis:
      "$ref": "#/TransferBasis"
    scc_notified_on:
      oneOf:
        - type: string
          format: date
        - type: "null"
    settings:
      "$ref": "#/ProviderSettings"
  additionalProperties: false
SenderIdentityKind:
  type: string
  enum:
    - email_domain
    - email_address
    - sms_sender
    - phone_number
    - whatsapp_number
    - bot
SenderIdentity:
  type: object
  description: "A sender identity of a provider account (C-25). Only an approved identity that is neither suspended nor archived is used to send."
  required:
    - object
    - id
    - provider_account_id
    - subtenant_id
    - channel
    - kind
    - value
    - country
    - approval_state
    - suspended_at
    - suspension_rule_id
    - sms_type
    - state
    - archived_at
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: sender_identity
    id:
      "$ref": "#/Id_snd"
    provider_account_id:
      "$ref": "#/Id_pva"
