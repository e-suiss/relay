      type: integer
      minimum: 1
    definition:
      "$ref": "#/WorkflowDefinition"
    definition_digest:
      type: string
      description: SHA-256 of the canonical definition, lowercase hex.
      pattern: "^[0-9a-f]{64}$"
    promoted_from:
      oneOf:
        - type: integer
          minimum: 1
          description: Version this one republished (rollback).
        - type: "null"
    published_at:
      "$ref": "#/Timestamp"
    published_by:
      type: string
      maxLength: 256
  additionalProperties: false
WorkflowVersionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/WorkflowVersion"
WorkflowManager:
  type: object
  description: "The single manager of a workflow (WF-4)."
  required:
    - managed_by
  properties:
    managed_by:
      type: string
      enum:
        - panel
        - code
  additionalProperties: false
PublishRequest:
  type: object
  description: Optional publication note recorded in the audit log.
  properties:
    note:
      type: string
      maxLength: 500
  additionalProperties: false
PublicationAccepted:
  type: object
  description: "Publication accepted for the publication gate; the result appears on the workflow."
  required:
    - object
    - workflow_key
    - publication
  properties:
    object:
      type: string
      const: workflow_publication
    workflow_key:
      "$ref": "#/WorkflowKey"
    publication:
      "$ref": "#/Publication"
  additionalProperties: false
EventTypeMapping:
  type: object
  required:
    - object
    - id
    - type
    - source
    - workflow
    - to_pointer
    - data_fields
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: event_type_mapping
    id:
      "$ref": "#/Id_cem"
    type:
      type: string
      description: CloudEvents type.
      minLength: 1
      maxLength: 256
    source:
      oneOf:
        - type: string
          description: "Exact CloudEvents source to match; null matches any source."
          maxLength: 1024
        - type: "null"
    workflow:
      "$ref": "#/WorkflowKey"
    to_pointer:
      type: string
      description: JSON Pointer into data locating a recipient target or an array of them.
      maxLength: 256
    tenant_pointer:
      oneOf:
        - type: string
          description: JSON Pointer into data locating a subtenant id.
          maxLength: 256
        - type: "null"
    data_fields:
      type: array
      description: Allow-list of JSON Pointers copied into event data. The empty pointer copies the whole object.
      items:
        type: string
        maxLength: 256
      minItems: 1
      maxItems: 100
      uniqueItems: true
    state:
      type: string
      enum:
        - active
        - archived
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
EventTypeMappingWrite:
  type: object
  description: Tenant-defined mapping from a CloudEvents type to a workflow, with a field allow-list instead of a transformation script.
  required:
    - type
    - workflow
    - to_pointer
    - data_fields
  properties:
    type:
      type: string
      minLength: 1
      maxLength: 256
    source:
      oneOf:
        - type: string
          maxLength: 1024
        - type: "null"
    workflow:
      "$ref": "#/WorkflowKey"
    to_pointer:
      type: string
      maxLength: 256
    tenant_pointer:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    data_fields:
      type: array
      items:
        type: string
        maxLength: 256
      minItems: 1
      maxItems: 100
      uniqueItems: true
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "The spec defines the type-to-workflow table and a field allow-list; recipient and subtenant pointers are chosen by the contract because CloudEvents carry no recipients."
EventTypeMappingList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/EventTypeMapping"
KillSwitch:
  type: object
  required:
    - object
    - id
    - scope_kind
    - target_kind
    - state
    - reason
    - origin
    - created_by
    - status
    - created_at
  properties:
    object:
      type: string
      const: kill_switch
    id:
      "$ref": "#/Id_ksw"
    scope_kind:
      type: string
      enum:
        - platform
        - tenant
        - subtenant
        - campaign
        - workflow
        - api_client
        - sender
    scope_ref:
      oneOf:
        - type: string
          maxLength: 128
        - type: "null"
    channel:
      oneOf:
        - "$ref": "#/Channel"
        - type: "null"
    target_kind:
      type: string
      enum:
        - all
        - provider_account
        - template
    target_ref:
      oneOf:
        - type: string
          maxLength: 128
        - type: "null"
    message_class:
      oneOf:
        - "$ref": "#/MessageClass"
          description: null means every class except security.
        - type: "null"
    state:
      type: string
      enum:
        - "on"
        - "off"
        - canary
        - paused_until
    canary_percent:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 99
        - type: "null"
    paused_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    reason:
      type: string
      maxLength: 2000
    ticket_ref:
      oneOf:
        - type: string
          maxLength: 512
        - type: "null"
    origin:
      type: string
      enum:
        - operator
        - dead_man
    created_by:
      type: string
      maxLength: 256
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    supersedes_id:
      oneOf:
        - "$ref": "#/Id_ksw"
        - type: "null"
    status:
      type: string
      enum:
        - active
        - released
    released_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    released_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    release_reason:
      oneOf:
        - type: string
          maxLength: 2000
        - type: "null"
    effect:
      description: "When the kill switch took effect (TN-44): effect_delay_ms from its engaging transaction to the end of its queue sweep, the deliveries it holds paused in its own scope and when the sweep ended; null until the sweep ended. A platform record shows the paused deliveries of its own scope only."
      oneOf:
        - type: object
          required:
            - paused_count
            - effect_delay_ms
            - effective_at
          properties:
            paused_count:
              type: integer
              minimum: 0
            effect_delay_ms:
              type: integer
              minimum: 0
            effective_at:
              "$ref": "#/Timestamp"
          additionalProperties: false
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
KillSwitchList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/KillSwitch"
KillSwitchEngage:
  type: object
  required:
    - scope_kind
    - reason
  properties:
    scope_kind:
      type: string
      enum:
        - tenant
        - subtenant
        - campaign
        - workflow
        - api_client
        - sender
      description: API clients with the kill_switch scope may use only campaign and workflow.
    scope_ref:
      type: string
      description: Identifier of the scoped object (stn_, campaign, workflow key, cli_, sender).
      maxLength: 128
    channel:
      "$ref": "#/Channel"
    target_kind:
      type: string
      enum:
        - all
        - provider_account
        - template
      default: all
    target_ref:
      type: string
      maxLength: 128
    message_class:
      "$ref": "#/MessageClass"
      description: Omit to stop every class except security. Stopping security is a separate choice that needs step-up.
    state:
      type: string
      enum:
        - "off"
        - canary
        - paused_until
      default: "off"
    canary_percent:
      type: integer
      minimum: 1
      maximum: 99
    paused_until:
      "$ref": "#/Timestamp"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    ticket_ref:
      type: string
      maxLength: 512
    ttl:
      "$ref": "#/Duration"
      description: "Time to live; required unless no_ttl is true."
    no_ttl:
      type: boolean
      description: A record without TTL needs explicit approval (operator session with step-up).
  additionalProperties: false
PlatformKillSwitchEngage:
  type: object
  description: "Platform kill switch; applies to every tenant and both environments."
  required:
    - reason
  properties:
    channel:
      "$ref": "#/Channel"
    target_kind:
      type: string
      enum:
        - all
        - provider_account
        - template
      default: all
    target_ref:
      type: string
      maxLength: 128
    message_class:
      "$ref": "#/MessageClass"
      description: Omit to stop every class except security. Stopping security is a separate choice that needs step-up.
    state:
      type: string
      enum:
        - "off"
        - canary
        - paused_until
      default: "off"
    canary_percent:
      type: integer
      minimum: 1
      maximum: 99
    paused_until:
      "$ref": "#/Timestamp"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    ticket_ref:
      type: string
      maxLength: 512
    ttl:
      "$ref": "#/Duration"
      description: "Time to live; required unless no_ttl is true."
    no_ttl:
      type: boolean
      description: A record without TTL needs explicit approval (operator session with step-up).
  additionalProperties: false
KillSwitchReplace:
  type: object
  description: "Replace the state of a kill switch, keeping its dimensions. Tightening needs no step-up; relaxing needs an operator session with step-up."
  required:
    - state
    - reason
  properties:
    state:
      type: string
      enum:
        - "off"
        - canary
        - paused_until
    canary_percent:
      type: integer
      minimum: 1
      maximum: 99
    paused_until:
      "$ref": "#/Timestamp"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    ttl:
      "$ref": "#/Duration"
    no_ttl:
      type: boolean
  additionalProperties: false
KillSwitchRelease:
  type: object
  description: "Release is a relaxation: operator session with step-up only. PAUSED deliveries are not resumed automatically."
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
KillSwitchResume:
  type: object
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
KillSwitchBulkCancel:
  type: object
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
KillSwitchActionResult:
  type: object
  required:
    - object
    - kill_switch_id
    - action
    - affected
    - has_more
  properties:
    object:
      type: string
      const: kill_switch_action
    kill_switch_id:
      "$ref": "#/Id_ksw"
    action:
      type: string
      enum:
        - resume
        - bulk_cancel
    affected:
      type: integer
      minimum: 0
    has_more:
      type: boolean
  additionalProperties: false
ErrorDescription:
  type: object
  description: Description of one error code, served from the error catalog.
  required:
    - object
    - code
    - family
    - type
    - title
    - status
    - retryable
    - retry_after
    - description
  properties:
    object:
      type: string
      const: error_code
    code:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    family:
      type: string
    type:
      type: string
      format: uri
    title:
      type: string
    status:
      type: integer
      minimum: 400
      maximum: 599
    retryable:
      type: boolean
    retry_after:
      type: object
      required:
        - kind
        - seconds
        - max_seconds
      properties:
        kind:
          type: string
          enum:
            - none
            - fixed
            - window
            - range
        seconds:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        max_seconds:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
      additionalProperties: false
    description:
      type: string
  additionalProperties: false
VirtualClock:
  type: object
  description: Virtual clock of the test environment.
  required:
    - object
    - offset_ms
    - business_now
  properties:
    object:
      type: string
      const: virtual_clock
    offset_ms:
      type: integer
      minimum: 0
    business_now:
      "$ref": "#/Timestamp"
  additionalProperties: false
SimulatedResult:
  type: object
  description: "One result of the fake provider with the addresses that produce it on each kind of target."
  required:
    - object
    - result
    - email
    - phone
    - token
    - description
  properties:
    object:
      type: string
      const: simulated_result
    result:
      type: string
      enum:
        - delivered
        - sent_only
        - delayed_delivery
        - hard_bounce
        - soft_bounce
        - complaint
        - not_delivered
        - unregistered
        - rate_limited
        - transient_error
        - timeout
        - auth_error
        - sender_config_error
        - content_rejected
        - unknown_code
    email:
      type: string
      description: "The email address <result>@sim.relay.test."
    phone:
      type: string
      description: "The E.164 number +9905550000NN."
      pattern: "^\\+9905550000[0-9]{2}$"
    token:
      type: string
      description: "The push, Web Push, WhatsApp or messaging target sim:<result>."
    description:
      type: string
    seed_recipients:
      type: array
      description: "The seed recipient addresses that give this result: <seed>@seed.relay.test and +9905551000NN."
      items:
        type: string
  additionalProperties: false
SimulatedResultList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/SimulatedResult"
SeedRecipient:
  type: object
  description: "One seed recipient of the test plane. Its external id is the seed name; its addresses are in the fake provider's table."
  required:
    - object
    - external_id
    - email
    - phone
    - email_result
    - description
    - set_up
  properties:
    object:
      type: string
      const: seed_recipient
    external_id:
      type: string
      enum:
        - seed_no_consent
        - seed_opted_out
        - seed_quiet_hours
        - seed_capped
        - seed_bounced
        - seed_no_device
        - seed_fallback_timezone
    email:
      type: string
      description: "<seed>@seed.relay.test"
    phone:
      type: string
      pattern: "^\\+9905551000[0-9]{2}$"
    email_result:
      type: string
      description: "The fake provider's result for the e-mail address."
    description:
      type: string
    set_up:
      type: boolean
      description: "false until the setup job of the test plane ran."
  additionalProperties: false
SeedRecipientList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/SeedRecipient"
SeedReset:
  type: object
  required:
    - object
    - status
  properties:
    object:
      type: string
      const: seed_reset
    status:
      type: string
      enum:
        - queued
  additionalProperties: false
TestRender:
  type: object
  description: "The rendered output of a delivery kept sealed in the test plane. A security_subtype or retention none render is kept as its digest only: output is null and digest_only names the reason. output is also null once its key is erased."
  required:
    - content_digest
    - digest_only
    - locale
    - output
    - rendered_at
  properties:
    content_digest:
      type: string
      pattern: "^[0-9a-f]{64}$"
    digest_only:
      oneOf:
        - type: string
          enum:
            - security_subtype
            - retention_none
        - type: "null"
    locale:
      oneOf:
        - "$ref": "#/Locale"
        - type: "null"
    output:
      oneOf:
        - type: object
          description: "The channel's rendered fields, such as subject and text for e-mail or title and body for the inbox. E-mail HTML is never in it: it is shown only through sandbox_url."
        - type: "null"
    sandbox_url:
      description: "For a render with HTML, the short-lived link of the sandboxed preview origin, shown only in an iframe with an empty sandbox attribute (TP-24, TP-39); null when no preview host is configured or the render has no HTML."
      oneOf:
        - type: string
          format: uri
        - type: "null"
    rendered_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
TestInboxDelivery:
  type: object
  description: "A delivery of a test plane message: its decision chain and its render."
  required:
    - delivery_id
    - channel
    - status
    - gates
    - decisions
    - render
  properties:
    delivery_id:
      "$ref": "#/Id_dlv"
    channel:
      "$ref": "#/Channel"
    status:
      "$ref": "#/DeliveryStatus"
    reason:
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    gates:
      type: string
      enum:
        - passed
        - stopped
        - deferred
    deferred_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    decisions:
      type: array
      items:
        "$ref": "#/DecisionStep"
    render:
      oneOf:
        - "$ref": "#/TestRender"
        - type: "null"
  additionalProperties: false
TestInboxMessage:
  type: object
  description: "One message of the test inbox: a test plane notification with its decisions and renders."
  required:
    - object
    - notification_id
    - recipient_id
    - workflow
    - state
    - created_at
    - deliveries
  properties:
    object:
      type: string
      const: test_inbox_message
    notification_id:
      "$ref": "#/Id_ntf"
    event_id:
      oneOf:
        - "$ref": "#/Id_evt"
        - type: "null"
    recipient_id:
      type: string
      description: "The recipient: sub_… for a subscriber, agt_… for an agent."
    workflow:
      "$ref": "#/WorkflowRef"
    message_class:
      "$ref": "#/MessageClass"
    state:
      type: string
      enum:
        - active
        - cancelled
        - expired
    close_rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    deliveries:
      type: array
      items:
        "$ref": "#/TestInboxDelivery"
  additionalProperties: false
TestInboxMessageList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/TestInboxMessage"
VirtualClockAdvance:
  type: object
  required:
    - by
  properties:
    by:
      "$ref": "#/Duration"
      description: Forward step, at most 366 days. The clock never moves back.
  additionalProperties: false
AccessSecurityEventToken:
  type: string
  description: "A Security Event Token (RFC 8417) Access pushed: a compact JWS of typ secevent+jwt whose claims are iss, aud, iat, jti, sub_id, events with one member keyed urn:suiss:access:event:<type>, and access_tenant on a platform product subscription. Event types and their members are in the event catalog."
  maxLength: 65536
  pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\s*$"
AccessSetError:
  type: object
  description: The RFC 8935 error body of a refused SET.
  required:
    - err
    - description
  properties:
    err:
      type: string
      enum:
        - invalid_request
        - invalid_key
        - invalid_issuer
        - invalid_audience
        - authentication_failed
        - access_denied
    description:
      type: string
      maxLength: 512
  additionalProperties: false
Role:
  type: object
  required:
    - object
    - key
    - scope
    - rank
    - description
  properties:
    object:
      type: string
      const: role
    key:
      type: string
      enum:
        - installation_operator
        - tenant_admin
        - tenant_operator
    scope:
      type: string
      enum:
        - installation
        - tenant
    rank:
      type: integer
      description: "installation_operator 3 > tenant_admin 2 > tenant_operator 1."
    description:
      type: string
  additionalProperties: false
RouteKey:
  type: string
  description: Route key, unique in the environment.
  pattern: "^[a-z][a-z0-9_]{0,63}$"
  examples:
    - critical_alert
  x-relay-choice: true
  x-relay-choice-note: "The spec names a route key but no pattern; the category key pattern is reused."
RouteState:
  type: string
  enum:
    - active
    - archived
RouteNode:
  description: "A node of a route tree: a channel name, a channel sent only to the last active device, single, all, last_active, user_preference or escalate. A tree is at most 4 levels deep, leaves included, and names at most 10 channels; a leaf is addressed by its JSON Pointer inside the tree."
  oneOf:
    - "$ref": "#/Channel"
    - "$ref": "#/RouteDeviceNode"
    - "$ref": "#/RouteSingleNode"
    - "$ref": "#/RouteAllNode"
    - "$ref": "#/RouteLastActiveNode"
    - "$ref": "#/RouteUserPreferenceNode"
    - "$ref": "#/RouteEscalateNode"
  x-relay-choice: true
  x-relay-choice-note: "The spec bounds the depth at 4 without saying whether leaves count; they do."
RouteDeviceNode:
  type: object
  description: "Push only to the recipient's last active device; without one known, every active device."
  required:
    - channel
    - strategy
  properties:
    channel:
      type: string
      enum:
        - push
        - web_push
    strategy:
      type: string
      const: last_active_device
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "A recipient without a known last active device gets the default fan out to every active device."
RouteSingleNode:
  type: object
  description: "Try the nodes in order and stop at the first success. on_failure (the default) moves on only after a permanent failure, an exhausted retry budget or a skipped channel; a transient failure or an unknown outcome never moves it. after_delay also moves on when the current node is not delivered within the delay, which must be above zero."
  required:
    - single
  properties:
    single:
      type: array
      minItems: 1
      items:
        "$ref": "#/RouteNode"
    trigger:
      oneOf:
        - type: string
          const: on_failure
        - type: object
          required:
            - after_delay
          properties:
            after_delay:
              "$ref": "#/Duration"
          additionalProperties: false
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "A channel the gates skip moves a single node on like a permanent failure."
RouteAllNode:
  type: object
  description: Send to every node.
  required:
    - all
  properties:
    all:
      type: array
      minItems: 1
      items:
        "$ref": "#/RouteNode"
  additionalProperties: false
RouteLastActiveNode:
  type: object
  description: "Send to one channel: the recipient's last active channel of the list when it can be sent, else the first one of the list that can."
  required:
    - last_active
  properties:
    last_active:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        "$ref": "#/Channel"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "Without a usable last active channel the list order decides; a skipped channel gives way to the next one, a permanent failure of the chosen one fails the node."
RouteUserPreferenceNode:
  type: object
  description: "Send to one channel: the recipient's most preferred channel of the list when it can be sent, else the first one of the list that can."
  required:
    - user_preference
  properties:
    user_preference:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        "$ref": "#/Channel"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "Without a usable preferred channel the list order decides; a skipped channel gives way to the next one, a permanent failure of the chosen one fails the node."
RouteEscalateNode:
  type: object
  description: "Escalate unless the recipient engages: the first step opens at once, and each next step opens after the previous step's after unless a stop signal came; a step that fails moves on at once. Only reliable evidence stops it: in-app seen, read or clicked, a push SDK receipt, a human e-mail click or the customer's event of event_type. An e-mail open and a likely bot click never stop it. seen is also met by read and clicked, read by clicked. The timers run whatever the delivery outcome, unknown included."
  required:
    - escalate
  properties:
    escalate:
      type: object
      required:
        - unless
        - ladder
      properties:
        unless:
          type: string
          enum:
            - seen
            - read
            - clicked
            - event
        event_type:
          type: string
          description: "Required with unless event, not allowed otherwise."
          pattern: "^[a-z0-9][a-z0-9_.-]{0,127}$"
        ladder:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - after
              - node
            properties:
              after:
                description: "Time to wait on this step for the stop signal before the next step opens; above zero."
                "$ref": "#/Duration"
              node:
                "$ref": "#/RouteNode"
            additionalProperties: false
      additionalProperties: false
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "The spec writes a ladder of {after, node} without saying what after counts from; here the first step opens at once and after is the wait on that step. seen is met by read and clicked, read by clicked; event_type is required with unless event."
Route:
  type: object
  description: "Named route policy. Not versioned: a change applies to every decision made after it; a notification keeps the tree it was created with."
  required:
    - object
    - id
    - key
    - name
    - tree
    - state
    - version
    - created_at
    - updated_at
    - archived_at
  properties:
    object:
      type: string
      const: route
    id:
      "$ref": "#/Id_rte"
    key:
      "$ref": "#/RouteKey"
    name:
      type: string
      minLength: 1
      maxLength: 200
    tree:
      "$ref": "#/RouteNode"
    state:
      "$ref": "#/RouteState"
    version:
      type: integer
      minimum: 1
      description: "Optimistic concurrency version; the ETag carries it."
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
RouteList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Route"
RouteCreate:
  type: object
  description: Create a named route.
  required:
    - key
    - name
    - tree
  properties:
    key:
      "$ref": "#/RouteKey"
    name:
      type: string
      minLength: 1
      maxLength: 200
    tree:
      "$ref": "#/RouteNode"
  additionalProperties: false
RouteReplace:
  type: object
  description: Replace the name and tree of a route.
  required:
    - name
    - tree
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    tree:
      "$ref": "#/RouteNode"
  additionalProperties: false
CategoryState:
  type: string
  enum:
    - active
    - archived
PreferenceValue:
  type: string
  enum:
    - opt_in
    - opt_out
    - unset
  description: "Stored preference value; unset falls back to the next level."
PreferenceLevel:
  type: string
  enum:
    - category_channel
    - channel
    - workflow
    - scope_key
PreferenceSource:
  type: string
  enum:
    - user
    - tenant
    - category_default
    - class_default
    - locked
  description: "Where the effective value of a cell comes from: the subscriber's own switch, the tenant (an opt_out it wrote or the category being turned off), the category's channel default, the class default matrix, or the lock of a locked category."
ConsentStatus:
  type: string
  enum:
    - none
    - pending
    - pending_iys
    - active
    - revoked
    - expired
  description: "Status of a commercial consent as Access records it. none means never asked and is not revoked; a revoked record of any source wins. pending_iys is an approval that belongs in İYS and is not valid until İYS holds it (PC-30): it becomes active once Relay has written it and read it back, and expired when that did not happen within three business days."
ConsentKind:
  type: string
  enum:
    - explicit_opt_in
    - soft_opt_in
    - legitimate_interest
    - none
SuppressionReason:
  type: string
  enum:
    - hard_bounce
    - complaint
    - invalid
    - soft_bounce
    - manual
    - refusal
FrequencyFate:
  type: string
  enum:
    - drop
    - defer
    - digest
    - inbox_only
  description: "What happens to a notification over the frequency limit. Class defaults: marketing drop, operational defer, social digest. digest collects the capped deliveries of a subscriber on the category and channel in one window released when a slot frees; when it fires, the first delivery goes with the digest data and the others are recorded skipped with digest.folded (PC-58 (6))."
SuppressionState:
  type: string
  enum:
    - active
    - expired
    - lifted
  description: "active until lifted or, for a suppression with expires_at, until that time passes (expired)."
  x-relay-choice: true
  x-relay-choice-note: "Derived from lifted_at and expires_at; the names are chosen by the contract."
CategoryKey:
  type: string
  description: Tenant category key, unique in the environment.
  pattern: "^[a-z][a-z0-9_]{0,63}$"
  examples:
    - order_updates
ChannelDefaults:
  type: object
  description: "Default of each channel for subscribers who set nothing. A channel left out falls back to the class default matrix. A marketing category may not default email, sms, voice or whatsapp to on."
  propertyNames:
    "$ref": "#/Channel"
  additionalProperties:
    type: string
    enum:
      - "on"
      - "off"
ChannelDefaultsPatch:
  type: object
  description: "Merge patch of channel defaults: on or off sets a channel, null removes it so it falls back to the class default matrix."
  propertyNames:
    "$ref": "#/Channel"
  additionalProperties:
    oneOf:
      - type: string
        enum:
          - "on"
          - "off"
      - type: "null"
CategoryFrequency:
  type: object
  description: "Frequency limit of a category: at most limit notifications per subscriber in each window. Only marketing, social and operational categories have one."
  required:
    - limit
    - window
    - fate
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 10000
    window:
      description: "ISO 8601 duration from PT1H to P7D."
      "$ref": "#/Duration"
    fate:
      "$ref": "#/FrequencyFate"
  additionalProperties: false
CategoryDensity:
  type: object
  description: "Density threshold of a category (WF-30): once a subscriber (per recipient) or one of its device channels (per device: push and web_push are counted per channel, other channels per subscriber) received limit deliveries of the category within window, the next deliveries are collected into a digest window as long as window, released as one delivery with the digest data; the others are recorded skipped with digest.folded. Only social, marketing and operational categories (operational only with digest_allowed) have one."
  x-relay-choice: true
  x-relay-choice-note: "The spec sets no bounds and no window for the density digest: limit 1 to 1000, window PT1M to PT24H, per defaults to recipient, and the digest window is a fixed window of the threshold's length."
  required:
    - limit
    - window
    - per
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 1000
    window:
      description: "ISO 8601 duration from PT1M to PT24H."
      "$ref": "#/Duration"
    per:
      type: string
      enum:
        - recipient
        - device
  additionalProperties: false
CategoryDensityInput:
  type: object
  description: "Density threshold of a category; per defaults to recipient."
  required:
    - limit
    - window
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 1000
    window:
      description: "ISO 8601 duration from PT1M to PT24H."
      "$ref": "#/Duration"
    per:
      type: string
      enum:
        - recipient
        - device
  additionalProperties: false
Category:
  type: object
  description: "Tenant category. A workflow names its category, and the workflow's message class must be the category's class."
  required:
    - object
    - id
    - key
    - name
    - message_class
    - locked
    - enabled
    - channel_defaults
    - default_expires_in
    - frequency
    - digest_allowed
    - default_route
    - density
    - state
    - builtin
    - version
    - created_at
    - updated_at
    - archived_at
  properties:
    object:
      type: string
      const: category
    id:
      "$ref": "#/Id_ctg"
    key:
      "$ref": "#/CategoryKey"
    name:
      type: string
      minLength: 1
      maxLength: 200
    message_class:
      "$ref": "#/MessageClass"
    locked:
      type: boolean
      description: "A locked category keeps at least one channel open for every subscriber. Always true for security."
    enabled:
      type: boolean
      description: "false turns the category off for the whole tenant."
    channel_defaults:
      "$ref": "#/ChannelDefaults"
    default_expires_in:
      description: "Expiry of notifications of this category, PT1M to P30D. null applies the class default: transactional PT6H, operational PT24H, social PT48H, marketing P2D, action_required PT24H, system PT1H. Never set for security."
      oneOf:
        - "$ref": "#/Duration"
        - type: "null"
    frequency:
      oneOf:
        - "$ref": "#/CategoryFrequency"
        - type: "null"
    digest_allowed:
      type: boolean
      description: "Whether subscribers may choose a digest for this operational category. Social categories are always digestible."
    default_route:
      description: "Key of the route a channel step of this category's workflows sends through when the step names neither a route nor a channel. A step's own route or channel wins over it."
      oneOf:
        - "$ref": "#/RouteKey"
        - type: "null"
    density:
      description: "Density threshold (WF-30); null for none."
      oneOf:
        - "$ref": "#/CategoryDensity"
        - type: "null"
    state:
      "$ref": "#/CategoryState"
    builtin:
      type: boolean
      description: "true for the built-in security category of the Access platform tenant; it cannot be archived."
    version:
      type: integer
      minimum: 1
      description: "Optimistic concurrency version; the ETag carries it."
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
CategoryList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Category"
Subtenant:
  type: object
  description: "A sub-tenant: an organization of the tenant in Access, mirrored by Relay (TN-3)."
  required:
    - object
    - id
    - access_organization_id
    - name
    - state
    - archived_at
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: subtenant
    id:
      "$ref": "#/Id_stn"
    access_organization_id:
      type: string
      maxLength: 128
    name:
      type: string
      maxLength: 200
    state:
      type: string
      enum:
        - active
        - archived
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
SubtenantList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Subtenant"
CategoryCreate:
  type: object
  description: "Create a category. message_class is fixed here. locked defaults to false (always true for security), enabled to true, channel_defaults to empty and digest_allowed to false; default_expires_in and frequency left out apply the class defaults."
  required:
    - key
    - name
    - message_class
  properties:
    key:
      "$ref": "#/CategoryKey"
    name:
      type: string
      minLength: 1
      maxLength: 200
    message_class:
      "$ref": "#/MessageClass"
    locked:
      type: boolean
    enabled:
      type: boolean
    channel_defaults:
      "$ref": "#/ChannelDefaults"
    default_expires_in:
      description: "ISO 8601 duration from PT1M to P30D; not allowed for security."
      "$ref": "#/Duration"
    frequency:
      "$ref": "#/CategoryFrequency"
    digest_allowed:
      type: boolean
      description: Only operational categories may allow a digest.
    default_route:
      description: "Key of an active route; an unknown key is 422 validation_failed at /default_route (not_found), an archived route not_allowed."
      "$ref": "#/RouteKey"
    density:
      description: "Density threshold (WF-30); a class without one is 422 validation_failed at /density (not_allowed)."
      "$ref": "#/CategoryDensityInput"
  additionalProperties: false
CategoryPatch:
  type: object
  description: "JSON Merge Patch of a category. key, message_class and builtin cannot be changed."
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    locked:
      type: boolean
    enabled:
      type: boolean
    channel_defaults:
      "$ref": "#/ChannelDefaultsPatch"
    default_expires_in:
      description: "ISO 8601 duration from PT1M to P30D; null applies the class default."
      oneOf:
        - "$ref": "#/Duration"
        - type: "null"
    frequency:
      description: "Written as a whole object; null removes the limit."
      oneOf:
        - "$ref": "#/CategoryFrequency"
        - type: "null"
    digest_allowed:
      type: boolean
    default_route:
      description: "Key of an active route; null removes the default route."
      oneOf:
        - "$ref": "#/RouteKey"
        - type: "null"
    density:
      description: "Written as a whole object; null removes the threshold."
      oneOf:
        - "$ref": "#/CategoryDensityInput"
        - type: "null"
  additionalProperties: false
CategorySubtenantSetting:
  type: object
  description: "Overrides of a category for one subtenant. A null override inherits the category's value."
  required:
    - object
    - category
    - subtenant_id
    - enabled
    - channel_defaults
    - frequency
    - default_expires_in
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: category_subtenant_setting
    category:
      "$ref": "#/CategoryKey"
    subtenant_id:
      "$ref": "#/Id_stn"
    enabled:
      oneOf:
        - type: boolean
        - type: "null"
    channel_defaults:
      oneOf:
        - "$ref": "#/ChannelDefaults"
        - type: "null"
    frequency:
      oneOf:
        - "$ref": "#/CategoryFrequency"
        - type: "null"
    default_expires_in:
      oneOf:
        - "$ref": "#/Duration"
        - type: "null"
    version:
      type: integer
      minimum: 0
      description: "Version of the setting; 0 when the subtenant has none."
    created_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    updated_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
CategorySubtenantSettingWrite:
  type: object
  description: "Full replacement of a subtenant's overrides; an absent or null field inherits the category's value."
  properties:
    enabled:
      oneOf:
        - type: boolean
        - type: "null"
    channel_defaults:
      oneOf:
        - "$ref": "#/ChannelDefaults"
        - type: "null"
    frequency:
      oneOf:
        - "$ref": "#/CategoryFrequency"
        - type: "null"
    default_expires_in:
      description: "ISO 8601 duration from PT1M to P30D; not allowed for security."
      oneOf:
        - "$ref": "#/Duration"
        - type: "null"
  additionalProperties: false
PreferenceCell:
  type: object
  description: "One category and channel of a subscriber. web_push follows push and voice follows sms. The embeddable preference component, the hosted preference page and an app's own notification settings screen render the same cell (X-18, X-51)."
  required:
    - category
    - category_name
    - channel
    - value
    - effective
    - source
    - locked
    - lock_beneficiary
    - digest_allowed
    - disabled_by_admin
    - disabled_in_device_settings
  properties:
    category:
      "$ref": "#/CategoryKey"
    category_name:
      type: string
      minLength: 1
      maxLength: 200
      description: "The category's name as the tenant wrote it, the label of the row."
    channel:
      "$ref": "#/Channel"
    value:
      "$ref": "#/PreferenceValue"
    effective:
      type: boolean
      description: Whether the channel is open for this category after every level is applied.
    source:
      "$ref": "#/PreferenceSource"
    locked:
      type: boolean
      description: "Whether the category is locked (PC-6): the cell is shown as a label, not a switch, and the last open channel of the category cannot be closed."
    lock_beneficiary:
      description: "Whom the lock of a locked category serves (PC-6, X-51), written beside its label: subscriber for a security category, which protects the subscriber's own account, and tenant for a category the tenant declared locked because its service needs it. null for a category that is not locked."
      oneOf:
        - type: string
          enum:
            - subscriber
            - tenant
        - type: "null"
    digest_allowed:
      type: boolean
      description: "Whether the subscriber may receive this category as a digest: always for social, for operational when the category allows it (PC-17). Closing such a cell offers the three choices Instant, Digest and Never, none preselected."
    disabled_by_admin:
      type: boolean
      description: "The tenant turned this cell off: it turned the category off or wrote opt_out on the subscriber's behalf (PC-15). Shown as \"your administrator turned this off\"; the subscriber cannot turn it on."
    disabled_in_device_settings:
      type: boolean
      description: "For push and web_push: the subscriber has devices on the channel and the operating system permission of none of them allows this category (PC-16). Shown as \"turned off in device settings\"; the preference itself is kept and applies again once the permission is back."
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "X-51 adds the lock beneficiary, the administrator's and the device settings' states; carrying them, the category name and the digest choice on every cell is chosen by the contract so every surface renders from one read."
ChannelPreference:
  type: object
  description: Channel-level switch across all categories.
  required:
    - channel
    - value
  properties:
    channel:
      "$ref": "#/Channel"
    value:
      "$ref": "#/PreferenceValue"
  additionalProperties: false
WorkflowPreference:
  type: object
  required:
    - workflow
    - value
  properties:
    workflow:
      "$ref": "#/WorkflowKey"
    value:
      "$ref": "#/PreferenceValue"
  additionalProperties: false
ScopeKeyPreference:
  type: object
  required:
    - scope_key
    - value
  properties:
    scope_key:
      type: string
      minLength: 1
      maxLength: 256
    value:
      "$ref": "#/PreferenceValue"
  additionalProperties: false
TimeRange:
  type: object
  description: "Weekly time range in the subscriber's time zone. An end before the start crosses midnight; start and end differ."
  required:
    - day
    - start
    - end
  properties:
    day:
      type: string
      enum:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
    start:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples:
        - "22:00"
    end:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples:
        - "07:30"
  additionalProperties: false
DigestChoices:
  type: object
  description: "Digest choice by category key. Only social categories and operational categories that allow a digest may be chosen."
  propertyNames:
    "$ref": "#/CategoryKey"
  additionalProperties:
    type: string
    enum:
      - instant
      - digest
PreferenceProfile:
  type: object
  description: "The subscriber's delivery profile. Only the subscriber writes it."
  required:
    - quiet_hours
    - schedule
    - dnd_until
    - quiet_hours_email
    - digest
  properties:
    quiet_hours:
      type: array
      items:
        "$ref": "#/TimeRange"
      maxItems: 28
    schedule:
      type: array
      description: Weekly availability.
      items:
        "$ref": "#/TimeRange"
      maxItems: 28
    dnd_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    quiet_hours_email:
      type: boolean
      description: "Email is outside quiet hours unless this is true."
    digest:
      "$ref": "#/DigestChoices"
  additionalProperties: false
SubscriberPreferences:
  type: object
  description: "A subscriber's preferences: one cell for every active category other than system and every channel, so no cell is undefined, beside the channel, workflow and scope key switches and the profile."
  required:
    - object
    - subscriber_id
    - cells
    - channels
    - workflows
    - scope_keys
    - profile
  properties:
    object:
      type: string
      const: subscriber_preferences
    subscriber_id:
      "$ref": "#/Id_sub"
    cells:
      type: array
      items:
        "$ref": "#/PreferenceCell"
    channels:
      type: array
      items:
        "$ref": "#/ChannelPreference"
    workflows:
      type: array
      items:
        "$ref": "#/WorkflowPreference"
    scope_keys:
      type: array
      items:
        "$ref": "#/ScopeKeyPreference"
    profile:
      "$ref": "#/PreferenceProfile"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "subscriber_id is added so a client can match the response to the subscriber."
PreferencePageLink:
  type: object
  description: "A link to the hosted preference page of one subscriber (X-51, PC-18): a page that works without JavaScript and without signing in, opened by a signed, expiring token that only opens this page for this subscriber in the environment of the credential that minted it."
  required:
    - object
    - subscriber_id
    - url
    - expires_at
  properties:
    object:
      type: string
      const: preference_page_link
    subscriber_id:
      "$ref": "#/Id_sub"
    url:
      type: string
      format: uri
      maxLength: 2048
      description: "The page's address on Relay's public root, on its self-explanatory path: /bildirim-tercihleri/ for a Turkish subscriber, /notification-preferences/ otherwise."
    expires_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
PreferenceWrite:
  type: object
  description: "One preference switch. category_channel needs category and channel; channel needs channel only; workflow needs workflow; scope_key needs scope_key."
  required:
    - level
    - value
  properties:
    level:
      "$ref": "#/PreferenceLevel"
    category:
      "$ref": "#/CategoryKey"
    channel:
      "$ref": "#/Channel"
    workflow:
      "$ref": "#/WorkflowKey"
    scope_key:
      type: string
      minLength: 1
      maxLength: 256
    value:
      "$ref": "#/PreferenceValue"
  additionalProperties: false
PreferencesPatch:
  type: object
  description: "Preference writes of the tenant on behalf of a subscriber; the tenant may only write opt_out."
  required:
    - preferences
  properties:
    preferences:
      type: array
      items:
        "$ref": "#/PreferenceWrite"
      minItems: 1
      maxItems: 100
  additionalProperties: false
PreferenceProfileWrite:
  type: object
  description: "Profile fields to write; an absent field is untouched and digest is replaced as a whole."
  properties:
    quiet_hours:
      type: array
      items:
        "$ref": "#/TimeRange"
      maxItems: 28
    schedule:
      type: array
      items:
        "$ref": "#/TimeRange"
      maxItems: 28
    dnd_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    quiet_hours_email:
      type: boolean
    digest:
      "$ref": "#/DigestChoices"
  additionalProperties: false
MyPreferencesPatch:
  type: object
  description: "The subscriber's own preference writes and profile; at least one of them."
  minProperties: 1
  properties:
    preferences:
      type: array
      items:
        "$ref": "#/PreferenceWrite"
      minItems: 1
      maxItems: 100
    profile:
      "$ref": "#/PreferenceProfileWrite"
  additionalProperties: false
Consent:
  type: object
  description: "Read-only copy of a commercial consent recorded by Access for one brand and channel."
  required:
    - object
    - id
    - brand
    - channel
    - status
    - consent_kind
    - recipient_type
    - source
    - occurred_at
  properties:
    object:
      type: string
      const: consent
    id:
      "$ref": "#/Id_cns"
    brand:
      description: "Subtenant that is the brand of the consent; null is the tenant itself."
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    channel:
      "$ref": "#/Channel"
    status:
      "$ref": "#/ConsentStatus"
    consent_kind:
      oneOf:
        - "$ref": "#/ConsentKind"
        - type: "null"
    recipient_type:
      oneOf:
        - "$ref": "#/LegalType"
        - type: "null"
    source:
      type: string
      description: Where the consent was given, as Access names it.
      maxLength: 64
    occurred_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
ConsentList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Consent"
Suppression:
  type: object
  description: "An address that Relay does not deliver to on one channel. The address is held only as a keyed digest and is never returned."
  required:
    - object
    - id
    - channel
    - reason
    - state
    - expires_at
    - created_at
    - lifted_at
    - lifted_by
    - lift_reason
  properties:
    object:
      type: string
      const: suppression
    id:
      "$ref": "#/Id_sup"
    channel:
      "$ref": "#/Channel"
    reason:
      "$ref": "#/SuppressionReason"
    state:
      "$ref": "#/SuppressionState"
    expires_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    lifted_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    lifted_by:
      description: Reference of the actor that lifted the suppression.
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    lift_reason:
      oneOf:
        - type: string
          maxLength: 2000
        - type: "null"
  additionalProperties: false
SuppressionList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Suppression"
SuppressionCreate:
  type: object
  description: "Manual suppression of an address on one channel."
  required:
    - channel
    - address
  properties:
    channel:
      "$ref": "#/Channel"
    address:
      type: string
      description: "The email address, E.164 phone number or device token to suppress. It is digested and never stored or returned in clear."
      minLength: 1
      maxLength: 512
      writeOnly: true
    reason:
      type: string
      enum:
        - manual
        - invalid
      default: manual
    expires_at:
      description: "Future time the suppression ends; only for reason manual."
      "$ref": "#/Timestamp"
  additionalProperties: false
SuppressionLift:
  type: object
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
SmsDestinationPolicy:
  type: object
  description: "The country allow-list of the security SMS of a tenant environment (CH-54)."
  additionalProperties: false
  required:
    - object
    - region_countries
    - allowed_countries
  properties:
    object:
      type: string
      const: sms_destination_policy
    region_countries:
      type: array
      description: "The countries of the tenant's region; always allowed."
      items:
        "$ref": "#/SmsDestinationCountry"
    allowed_countries:
      type: array
      description: "The countries the tenant added, sorted."
      maxItems: 250
      items:
        "$ref": "#/SmsDestinationCountry"
SmsDestinationPolicyWrite:
  type: object
  description: "Full replacement of the countries the tenant adds to the allow-list; an empty list leaves only the countries of its region."
  additionalProperties: false
  required:
    - allowed_countries
  properties:
    allowed_countries:
      type: array
      items:
        type: string
        maxLength: 2
SmsDestinationCountry:
  type: string
  description: "ISO 3166-1 alpha-2 country code."
  pattern: "^[A-Z]{2}$"
SmsDestinationStopKind:
  type: string
  enum:
    - prefix
    - country
  description: "prefix: a number block, the E.164 number without its last digits (x-relay-limits sms_destination.block_digits). country: every number of a country."
  x-relay-choice: true
  x-relay-choice-note: "CH-54 stops a prefix or a country; the names are chosen by the contract."
SmsDestinationStopState:
  type: string
  enum:
    - active
    - lifted
  description: "active until it is lifted; a stop never ends by itself."
  x-relay-choice: true
  x-relay-choice-note: "The state names are chosen by the contract."
SmsDestinationStop:
  type: object
  description: "A stop of security SMS to a number block or a country, opened by the SMS pumping detection (CH-54). It holds no phone number of a recipient."
  required:
    - object
    - id
    - kind
    - value
    - country
    - rule_id
    - detail
    - state
    - created_at
    - lifted_at
    - lifted_by
    - lift_reason
  properties:
    object:
      type: string
      const: sms_destination_stop
    id:
      "$ref": "#/Id_sds"
    kind:
      "$ref": "#/SmsDestinationStopKind"
    value:
      type: string
      description: "The stopped destination: an ISO 3166-1 alpha-2 country code, or the E.164 prefix of a number block."
      pattern: "^(\\+[1-9][0-9]{1,14}|[A-Z]{2})$"
    country:
      type: string
      description: "ISO 3166-1 alpha-2 country of the destination."
      pattern: "^[A-Z]{2}$"
    rule_id:
      description: "The detection that opened the stop: destination.pumping_prefix or destination.pumping_country."
      "$ref": "#/RuleId"
    detail:
      "$ref": "#/SmsDestinationStopDetail"
    state:
      "$ref": "#/SmsDestinationStopState"
    created_at:
      "$ref": "#/Timestamp"
    lifted_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    lifted_by:
      description: Reference of the actor that lifted the stop.
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    lift_reason:
      oneOf:
        - type: string
          maxLength: 2000
        - type: "null"
  additionalProperties: false
SmsDestinationStopDetail:
  type: object
  description: "What the detection counted when it opened the stop: the sends counted to the destination in the detection window (current), in the baseline window (baseline) and the count that trips the detection (threshold); for a country stopped by escalation, the number of its stopped number blocks (prefix_stops)."
  properties:
    current:
      type: integer
      minimum: 0
    baseline:
      type: integer
      minimum: 0
    threshold:
      type: integer
      minimum: 0
    window:
      type: string
      maxLength: 32
    prefix_stops:
      type: integer
      minimum: 0
  additionalProperties: false
SmsDestinationStopList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/SmsDestinationStop"
SmsDestinationStopLift:
  type: object
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  additionalProperties: false
SecuritySignals:
  type: object
  description: "Signals the sender evaluated itself and hands to the router of an otp_oob notification (E-32, E-33): whether the recipient's mobile application is active (BDDK Bilgi Sistemleri Yönetmeliği m.34/7) and whether the SIM of the number changed recently. Relay never produces these signals; when present they are inputs of the OTP channel chain inside the sender's permitted channels. With sim_changed true the channels bound to the SIM (sms, voice) are tried after WhatsApp when the recipient's WhatsApp reachability is known."
  properties:
    mobile_app_active:
      type: boolean
    sim_changed:
      type: boolean
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "E-33 makes the two signals router inputs when the sender supplies them; the field name, the shape and the effect of sim_changed on the order are chosen by the contract. mobile_app_active is carried with the frozen chain inputs and changes no order."
DryRunDecision:
  type: object
  description: "The decision Relay would make for one channel in dry_run."
  required:
    - channel
    - decision
    - reason
    - rule_id
    - deferred_until
  properties:
    channel:
      "$ref": "#/Channel"
    decision:
      type: string
      enum:
        - send
        - skip
        - defer
    reason:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
    rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    deferred_until:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    detail:
      type: object
      description: "The detail of the decision as the rule records it. A compliance decision names the row of the compliance table that decided: compliance_row, compliance_country, compliance_version, required_consent and recipient_type."
  additionalProperties: false
Id_tpv:
  type: string
  description: "Template version identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^tpv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - tpv_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_lay:
  type: string
  description: "Layout identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^lay_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - lay_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_lyv:
  type: string
  description: "Layout version identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^lyv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - lyv_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_prt:
  type: string
  description: "Partial identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^prt_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - prt_01j9zq3k4m5n6p7q8r9s0t1v2w
Id_ptv:
  type: string
  description: "Partial version identifier: prefix plus 26 lowercase Crockford base32 characters of a UUIDv7."
  pattern: "^ptv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  examples:
    - ptv_01j9zq3k4m5n6p7q8r9s0t1v2w
TemplateKey:
  type: string
  description: "Key of a template, layout or partial, unique in its tenant or subtenant: a slug of lowercase letters and digits joined by single hyphens, the same form as a workflow step's template key."
  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  minLength: 1
  maxLength: 100
  examples:
    - order-shipped
TemplateOwner:
  type: string
  description: "Owner of a template: the tenant, a subtenant, or a producer product whose template is protected."
  enum:
    - tenant
    - subtenant
    - producer
TemplateType:
  type: string
  description: "Transactional or marketing; follows the message class of the category (marketing for a marketing category) and never converts into the other after the first publication."
  enum:
    - transactional
    - marketing
Sensitivity:
  type: string
  description: "Sensitivity class of a template. A sensitive push shows only lock_screen_body on the lock screen and fetches in_app_body when the app opens."
  enum:
    - public
    - personal
    - sensitive
SmsEncodingPolicy:
  type: string
  description: "SMS encoding policy of a template; turkish_shift is the default. A provider not verified for the Turkish single shift table receives ucs2."
  enum:
    - transliterate
    - turkish_shift
    - ucs2
SmsEncoding:
  type: string
  description: Planned SMS encoding of a render.
  enum:
    - GSM7
    - GSM7_TR
    - UCS2
SensitivityApproval:
  type: object
  description: "Explicit confirmation of the sensitivity class after the sensitive term dictionary matched the fixed text or variable names."
  required:
    - matched_terms
    - approved_by
    - approved_at
  properties:
    matched_terms:
      type: array
      items:
        type: string
        maxLength: 64
      maxItems: 200
    approved_by:
      type: string
      maxLength: 256
    approved_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
SmsCell:
  type: object
  required:
    - body
  properties:
    body:
      type: string
      maxLength: 262144
      description: "Liquid source; no emoji in the template text."
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
VoiceCell:
  type: object
  description: "The text a voice call reads in the cell's language (otp_oob and commercial voice messages). A commercial voice variant names its sender by the brand's legal_name, the trade name."
  required:
    - body
  properties:
    body:
      type: string
      maxLength: 262144
      description: "Liquid source of the spoken text."
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
PushCell:
  type: object
  required:
    - title
    - body
  properties:
    title:
      type: string
      maxLength: 262144
    subtitle:
      type: string
      maxLength: 262144
    body:
      type: string
      maxLength: 262144
    lock_screen_body:
      type: string
      maxLength: 262144
      description: "Neutral text for the lock screen; required for a sensitive template."
    in_app_body:
      type: string
      maxLength: 262144
      description: "Full content fetched when the app opens; required for a sensitive template."
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
EmailCell:
  type: object
  required:
    - subject
    - html
    - text
  properties:
    subject:
      type: string
      maxLength: 262144
    preheader:
      type: string
      maxLength: 262144
    html_kind:
      type: string
      enum:
        - mjml
        - raw_html
      default: mjml
      description: "raw_html is for enterprise tenants; it is shown only in the sandboxed preview."
    html:
      type: string
      maxLength: 262144
    text:
      type: string
      maxLength: 262144
      description: Plain text body; required and separate from the HTML.
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
WhatsappCell:
  type: object
  required:
    - template_name
    - parameters
  properties:
    template_name:
      type: string
      maxLength: 512
      description: Approved Meta template name; new content is a new name.
    language:
      type: string
      maxLength: 35
    parameters:
      type: array
      maxItems: 100
      items:
        type: object
        required:
          - name
          - value
        properties:
          name:
            type: string
            maxLength: 128
          value:
            type: string
            maxLength: 262144
        additionalProperties: false
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
InboxCell:
  type: object
  required:
    - title
    - body
  properties:
    title:
      type: string
      maxLength: 262144
    body:
      type: string
      maxLength: 262144
    avatar_url:
      type: string
      maxLength: 2048
    actions:
      type: array
      maxItems: 5
      items:
        type: object
        required:
          - label
          - url
        properties:
          label:
            type: string
            maxLength: 262144
          url:
            type: string
            maxLength: 262144
        additionalProperties: false
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
WebhookCell:
  type: object
  required:
    - body
  properties:
    body:
      type: string
      maxLength: 262144
      description: "JSON body template in restricted mode; values are encoded with the JSON encoder."
    machine_translated:
      type: boolean
    translation_approved_by:
      oneOf:
        - type: string
          maxLength: 256
        - type: "null"
  additionalProperties: false
TemplateCells:
  type: object
  description: "The channel × locale matrix: content is written per channel and never derived from another channel. A channel without a variant is skipped with rule_id template.variant_missing."
  properties:
    sms:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/SmsCell"
    push:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/PushCell"
    web_push:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/PushCell"
    email:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/EmailCell"
    whatsapp:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/WhatsappCell"
    in_app:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/InboxCell"
    webhook:
      type: object
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/WebhookCell"
    voice:
      type: object
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "The spec names a voice channel and its linter rule but no voice variant; a text variant read by the call is chosen."
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        "$ref": "#/VoiceCell"
  additionalProperties: false
BrandFields:
  type: object
  description: "Brand fields (brand.*). A subtenant inherits every field it does not set from the tenant."
  properties:
    logo_url:
      type: string
      format: uri
      maxLength: 2048
    primary_color:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
    secondary_color:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
    sender_name:
      type: string
      maxLength: 100
    footer:
      type: string
      maxLength: 2000
    legal_name:
      type: string
      maxLength: 200
    mersis:
      type: string
      pattern: "^[0-9]{16}$"
    contact:
      type: string
      maxLength: 500
    postal_address:
      type: string
      maxLength: 500
  additionalProperties: false
TemplateDefinition:
  type: object
  description: "Template definition: the shared layer and the channel × locale matrix. The same definition is accepted by the file format, the management API and the producer API. The variable schema comes from the workflow version that uses the template."
  required:
    - default_locale
    - cells
  properties:
    default_locale:
      "$ref": "#/Locale"
    sensitivity:
      oneOf:
        - "$ref": "#/Sensitivity"
        - type: "null"
    sensitivity_approval:
      oneOf:
        - "$ref": "#/SensitivityApproval"
        - type: "null"
    sms_encoding:
      "$ref": "#/SmsEncodingPolicy"
    transliterate:
      type: boolean
      default: false
      description: "Transliterate SMS text outside the legal text; off by default except for security messages."
    allow_raw:
      type: boolean
      default: false
      description: "Allows the raw filter in this template."
    layout:
      oneOf:
        - "$ref": "#/TemplateKey"
        - type: "null"
    partials:
      type: array
      items:
        "$ref": "#/TemplateKey"
      maxItems: 50
      uniqueItems: true
    producer_brand:
      oneOf:
        - "$ref": "#/BrandFields"
        - type: "null"
      description: "Producer templates only: the producer's brand values; the tenant overrides only logo_url, primary_color, sender_name and footer."
    cells:
      "$ref": "#/TemplateCells"
  additionalProperties: false
TemplateCreate:
  type: object
  required:
    - key
    - name
    - category
    - definition
  properties:
    key:
      "$ref": "#/TemplateKey"
    name:
      type: string
      minLength: 1
      maxLength: 200
    category:
      "$ref": "#/CategoryKey"
    definition:
      "$ref": "#/TemplateDefinition"
  additionalProperties: false
TemplateDraft:
  type: object
  required:
    - definition
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    category:
      "$ref": "#/CategoryKey"
    definition:
      "$ref": "#/TemplateDefinition"
  additionalProperties: false
Template:
  type: object
  required:
    - object
    - id
    - key
    - name
    - owner
    - category
    - message_class
    - type
    - protected
    - state
    - version
    - created_at
    - updated_at
  properties:
    object:
      type: string
      const: template
    id:
      "$ref": "#/Id_tpl"
    key:
      "$ref": "#/TemplateKey"
    name:
      type: string
      maxLength: 200
    owner:
      "$ref": "#/TemplateOwner"
    product:
      oneOf:
        - type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: "null"
      description: Producer product of a producer-owned template.
    subtenant:
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    category:
      "$ref": "#/CategoryKey"
    message_class:
      "$ref": "#/MessageClass"
    type:
      "$ref": "#/TemplateType"
    protected:
      type: boolean
      description: "True for a producer-owned template: the tenant cannot change its text."
    state:
      type: string
      enum:
        - active
        - archived
    live_version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    draft:
      oneOf:
        - "$ref": "#/TemplateDefinition"
        - type: "null"
    draft_checksum:
      oneOf:
        - type: string
          pattern: "^[0-9a-f]{64}$"
        - type: "null"
      description: "SHA-256 of the draft content, lowercase hex; publication can name it to refuse a draft changed meanwhile."
    version:
      type: integer
      minimum: 1
      description: "Optimistic concurrency version; the ETag carries it."
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
TemplateList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/Template"
GateFinding:
  type: object
  description: "One publication gate result. A hard finding blocks publication; warnings pass only when accepted and are recorded on the version."
  required:
    - check
    - level
    - message
  properties:
    check:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      maxLength: 64
      examples:
        - plain_text_missing
    level:
      type: string
      enum:
        - hard
        - warning
    channel:
      "$ref": "#/Channel"
    locale:
      "$ref": "#/Locale"
    message:
      type: string
      maxLength: 1000
    detail:
      type: object
  additionalProperties: false
TemplateVariables:
  type: object
  description: "Variable paths the template reads, extracted at publication: always read and read only under a condition."
  required:
    - always
    - conditional
  properties:
    always:
      type: array
      items:
        type: string
        maxLength: 256
    conditional:
      type: array
      items:
        type: string
        maxLength: 256
  additionalProperties: false
TemplateVersion:
  type: object
  description: "Published template version; immutable."
  required:
    - object
    - id
    - template_key
    - version
    - state
    - definition
    - checksum
    - variables
    - measures
    - findings
    - warnings_accepted
    - published_at
    - published_by
  properties:
    object:
      type: string
      const: template_version
    id:
      "$ref": "#/Id_tpv"
    template_key:
      "$ref": "#/TemplateKey"
    version:
      type: integer
      minimum: 1
    state:
      type: string
      enum:
        - published
        - archived
    live:
      type: boolean
    definition:
      "$ref": "#/TemplateDefinition"
    checksum:
      type: string
      pattern: "^[0-9a-f]{64}$"
