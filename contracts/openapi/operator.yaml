            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
              "$ref": "./components/headers.yaml#/Deprecation"
            Sunset:
              "$ref": "./components/headers.yaml#/Sunset"
            Link:
              "$ref": "./components/headers.yaml#/Link"
            Idempotency-Key:
              "$ref": "./components/headers.yaml#/Idempotency-Key"
            Idempotency-Replayed:
              "$ref": "./components/headers.yaml#/Idempotency-Replayed"
          content:
            "application/json":
              schema:
                "$ref": "./components/schemas.yaml#/ChannelIdentity"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "404":
          "$ref": "./components/responses.yaml#/NotFound"
        "409":
          "$ref": "./components/responses.yaml#/Conflict"
        "413":
          "$ref": "./components/responses.yaml#/PayloadTooLarge"
        "415":
          "$ref": "./components/responses.yaml#/UnsupportedMediaType"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_invalid_session
        - auth_insufficient_role
        - auth_missing_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_tenant_suspended
        - auth_csrf_failed
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - malformed_request
        - unsupported_media_type
        - payload_too_large
        - validation_failed
        - unknown_field
        - auth_step_up_required
        - auth_step_up_unavailable
        - channel_identity_not_found
        - channel_identity_retired
        - auth_delegation_required
      x-relay-role: tenant_admin
      x-relay-weight: 1
      x-relay-idempotency: required
      x-relay-step-up: always
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "Paths, bodies and response shapes of channel management are chosen by the contract; a secret is only ever named by its reference and shown by its fingerprint (TN-26)."
components:
  securitySchemes:
    access_bearer:
      type: oauth2
      description: "Short-lived Access access token obtained with OAuth 2.0 client credentials for an API client registered in Access. The client is bound to one tenant, one environment and optionally one subtenant. Relay validates the token with the cached Access JWKS: iss, aud (Relay server API), exp and nbf on every request, an allow-list of algorithms (EdDSA or Ed25519 for Ed25519 keys, ES256, PS256), no unsigned tokens. The token names the Access tenant in tenant_id, the Access client in client_id and, when present, the environment in suiss_environment, which must be the client's. Relay has no API keys of its own. The token endpoint is discovered from the Access issuer."
      flows:
        clientCredentials:
          tokenUrl: "https://access.example.com/oauth2/token"
          scopes:
            publish: Send events and batches, and cancel.
            read: Query events, notifications, deliveries and history.
            subscribers: Write subscribers, devices, topics and subscriptions.
            config: Write workflows, templates, layouts, partials, routes, recurrences, CloudEvents mappings and webhook endpoints.
            kill_switch: Engage and tighten kill switches of campaign and workflow scope only.
    mtls:
      type: mutualTLS
      description: "Optional additional layer for enterprise tenants: RFC 8705 certificate-bound Access tokens. It is used together with access_bearer, never alone. Behind a proxy that terminates TLS, the client certificate is read from the RFC 9440 Client-Cert header (and Client-Cert-Chain) only when the connection comes from a configured client certificate proxy; the header from any other peer is ignored."
    operator_session:
      type: apiKey
      in: cookie
      name: relay_operator_session
      description: "Operator session started through Access OIDC on the operator API. Requests carry Relay-Tenant and Relay-Environment; mutating requests carry Relay-Csrf-Token."
      x-relay-choice: true
    operator_bearer:
      type: oauth2
      description: "Access access token of an operator whose audience is the Relay operator API, used by the CLI, signed with EdDSA or Ed25519 (Ed25519 keys), ES256 or PS256. Step-up uses the RFC 9470 challenge."
      flows:
        authorizationCode:
          authorizationUrl: "https://access.example.com/oauth2/authorize"
          tokenUrl: "https://access.example.com/oauth2/token"
          scopes: {}
      x-relay-choice: true
  schemas:
    Operator:
      type: object
      required:
        - object
        - id
        - display_name
        - status
        - created_at
      properties:
        object:
          type: string
          const: operator
        id:
          "$ref": "./components/schemas.yaml#/Id_opr"
        display_name:
          type: string
          maxLength: 200
        status:
          type: string
          enum:
            - active
            - suspended
            - deleted
          description: Mirrors the Access user lifecycle.
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    RoleGrant:
      type: object
      description: tenant_id and environment are null for the installation operator role.
      required:
        - role
        - tenant_id
        - environment
      properties:
        role:
          type: string
          enum:
            - installation_operator
            - tenant_admin
            - tenant_operator
        tenant_id:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Id_ten"
            - type: "null"
        environment:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Environment"
            - type: "null"
      additionalProperties: false
    OperatorSession:
      type: object
      required:
        - object
        - id
        - operator
        - roles
        - auth_time
        - expires_at
        - csrf_token
      properties:
        object:
          type: string
          const: operator_session
        id:
          "$ref": "./components/schemas.yaml#/Id_oss"
        operator:
          "$ref": "#/components/schemas/Operator"
        roles:
          type: array
          items:
            "$ref": "#/components/schemas/RoleGrant"
        auth_time:
          "$ref": "./components/schemas.yaml#/Timestamp"
        acr:
          type: string
          maxLength: 128
        step_up_valid_until:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        expires_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        csrf_token:
          type: string
          description: Send in Relay-Csrf-Token on mutating cookie-authenticated requests.
          minLength: 32
          maxLength: 128
      additionalProperties: false
    StepUpStart:
      type: object
      properties:
        return_to:
          type: string
          description: Panel path to return to after step-up.
          pattern: "^/[^/].*$"
          maxLength: 512
      additionalProperties: false
    StepUpChallenge:
      type: object
      required:
        - object
        - authorization_url
        - expires_at
      properties:
        object:
          type: string
          const: step_up_challenge
        authorization_url:
          type: string
          description: "Access authorization URL with acr_values, max_age and prompt=login."
          format: uri
        expires_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    Role:
      "$ref": "./components/schemas.yaml#/Role"
    RoleList:
      allOf:
        - "$ref": "./components/schemas.yaml#/ListEnvelope"
        - properties:
            data:
              type: array
              items:
                "$ref": "./components/schemas.yaml#/Role"
    RoleAssignment:
      type: object
      required:
        - object
        - id
        - operator_id
        - role
        - status
        - granted_by
        - created_at
      properties:
        object:
          type: string
          const: role_assignment
        id:
          "$ref": "./components/schemas.yaml#/Id_rla"
        operator_id:
          "$ref": "./components/schemas.yaml#/Id_opr"
        role:
          type: string
          enum:
            - installation_operator
            - tenant_admin
            - tenant_operator
        tenant_id:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Id_ten"
            - type: "null"
        environment:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Environment"
            - type: "null"
        status:
          type: string
          enum:
            - active
            - revoked
        granted_by:
          type: string
          maxLength: 256
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        revoked_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
        revoked_by:
          oneOf:
            - type: string
              maxLength: 256
            - type: "null"
      additionalProperties: false
    RoleAssignmentList:
      allOf:
        - "$ref": "./components/schemas.yaml#/ListEnvelope"
        - properties:
            data:
              type: array
              items:
                "$ref": "#/components/schemas/RoleAssignment"
    RoleAssignmentCreate:
      type: object
      description: Assign a tenant role in the selected tenant. The operator must have signed in once.
      required:
        - operator_id
        - role
        - reason
      properties:
        operator_id:
          "$ref": "./components/schemas.yaml#/Id_opr"
        role:
          type: string
          enum:
            - tenant_admin
            - tenant_operator
        environments:
          type: array
          items:
            "$ref": "./components/schemas.yaml#/Environment"
          minItems: 1
          uniqueItems: true
          default:
            - live
            - test
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    RevokeRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    TenantSuspension:
      type: object
      description: "Suspension. Grounds other than abuse, security or legal take effect at least 7 days after notice; abuse, security and legal take effect at once with a reasoned notice within 24 hours. The appeal window is 14 days after the suspension takes effect. These values await legal approval."
      required:
        - object
        - id
        - tenant_id
        - ground
        - reason
        - effective_at
        - notice_due_at
        - appeal_until
        - state
        - created_by
        - created_at
      properties:
        object:
          type: string
          const: tenant_suspension
        id:
          "$ref": "./components/schemas.yaml#/Id_tsp"
        tenant_id:
          "$ref": "./components/schemas.yaml#/Id_ten"
        subtenant_id:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Id_stn"
            - type: "null"
        ground:
          type: string
          enum:
            - abuse
            - security
            - legal
            - other
        reason:
          type: string
          maxLength: 2000
        effective_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        notice_due_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        appeal_until:
          "$ref": "./components/schemas.yaml#/Timestamp"
        state:
          type: string
          enum:
            - scheduled
            - effective
            - lifted
            - cancelled
        created_by:
          type: string
          maxLength: 256
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        lifted_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
      additionalProperties: false
    SuspendRequest:
      type: object
      required:
        - ground
        - reason
      properties:
        ground:
          type: string
          enum:
            - abuse
            - security
            - legal
            - other
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        subtenant_id:
          "$ref": "./components/schemas.yaml#/Id_stn"
        effective_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
          description: "Required for ground other and at least 7 days ahead; must be absent for the other grounds."
      additionalProperties: false
    ResumeRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        subtenant_id:
          "$ref": "./components/schemas.yaml#/Id_stn"
      additionalProperties: false
    TenantCounters:
      type: object
      description: "Aggregates only; never tenant record content."
      required:
        - notifications_24h
        - queued_deliveries
        - paused_deliveries
        - active_kill_switches
      properties:
        notifications_24h:
          type: integer
          minimum: 0
        queued_deliveries:
          type: integer
          minimum: 0
        paused_deliveries:
          type: integer
          minimum: 0
        active_kill_switches:
          type: integer
          minimum: 0
      additionalProperties: false
    TenantOverview:
      type: object
      required:
        - object
        - id
        - access_tenant_id
        - region
        - status
        - counters
        - created_at
      properties:
        object:
          type: string
          const: tenant_overview
        id:
          "$ref": "./components/schemas.yaml#/Id_ten"
        access_tenant_id:
          type: string
          maxLength: 128
        region:
          type: string
          enum:
            - tr
            - eu
            - us
        status:
          type: string
          enum:
            - active
            - suspended
            - closed
        platform_product:
          oneOf:
            - type: string
              enum:
                - access
                - work
                - executor
                - one
                - pay
            - type: "null"
        api_version:
          oneOf:
            - "$ref": "./components/schemas.yaml#/ApiVersion"
            - type: "null"
        suspensions:
          type: array
          items:
            "$ref": "#/components/schemas/TenantSuspension"
        counters:
          "$ref": "#/components/schemas/TenantCounters"
        created_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
      additionalProperties: false
    TenantOverviewList:
      allOf:
        - "$ref": "./components/schemas.yaml#/ListEnvelope"
        - properties:
            data:
              type: array
              items:
                "$ref": "#/components/schemas/TenantOverview"
    CriticalInterruption:
      type: object
      description: "A tenant's opening of the critical interruption level (CH-20, TN-23). Closed by default."
      required:
        - object
        - tenant_id
        - enabled
        - templates
        - entitlements
        - updated_at
      properties:
        object:
          type: string
          const: critical_interruption
        tenant_id:
          "$ref": "./components/schemas.yaml#/Id_ten"
        enabled:
          type: boolean
        templates:
          type: array
          description: Template keys declared critical in advance; empty when closed.
          items:
            "$ref": "./components/schemas.yaml#/TemplateKey"
          maxItems: 50
        entitlements:
          type: array
          description: The platform entitlement evidence the tenant presented; empty when closed.
          items:
            "$ref": "#/components/schemas/CriticalEntitlement"
          maxItems: 3
        updated_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
      additionalProperties: false
    CriticalEntitlement:
      type: object
      description: "A reference to the platform permission the tenant holds, such as the Apple Critical Alerts entitlement request; a reference, never a file."
      required:
        - platform
        - reference
      properties:
        platform:
          type: string
          enum:
            - apns
            - fcm
            - hms
        reference:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
    CriticalInterruptionWrite:
      type: object
      description: "enabled true opens or changes the opening and needs templates and entitlements; enabled false closes it."
      required:
        - enabled
        - reason
      properties:
        enabled:
          type: boolean
        templates:
          type: array
          items:
            "$ref": "./components/schemas.yaml#/TemplateKey"
          minItems: 1
          maxItems: 50
        entitlements:
          type: array
          items:
            "$ref": "#/components/schemas/CriticalEntitlement"
          minItems: 1
          maxItems: 3
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    SendModeSetting:
      type: object
      required:
        - object
        - level
        - mode
        - updated_at
        - updated_by
      properties:
        object:
          type: string
          const: send_mode_setting
        level:
          type: string
          enum:
            - installation
            - tenant
            - channel
            - category_channel
        category:
          oneOf:
            - type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
            - type: "null"
        channel:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Channel"
            - type: "null"
        mode:
          "$ref": "./components/schemas.yaml#/SendMode"
        updated_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        updated_by:
          type: string
          maxLength: 256
      additionalProperties: false
    SendModeList:
      type: object
      description: "Every send mode level of the tenant and environment, plus the installation default. Resolution order: (tenant, category, channel), (tenant, channel), (tenant), installation."
      required:
        - object
        - data
        - has_more
        - next_cursor
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            "$ref": "#/components/schemas/SendModeSetting"
        has_more:
          type: boolean
          const: false
        next_cursor:
          type: "null"
      additionalProperties: false
    SendModeWrite:
      type: object
      description: "Set one level; mode null clears the level. category requires channel. off is not a kill switch."
      required:
        - mode
        - reason
      properties:
        category:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        channel:
          "$ref": "./components/schemas.yaml#/Channel"
        mode:
          oneOf:
            - "$ref": "./components/schemas.yaml#/SendMode"
            - type: "null"
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    SupportDelegation:
      type: object
      required:
        - object
        - id
        - operator_id
        - access
        - reason
        - granted_by
        - starts_at
        - expires_at
        - status
      properties:
        object:
          type: string
          const: support_delegation
        id:
          "$ref": "./components/schemas.yaml#/Id_dlg"
        operator_id:
          "$ref": "./components/schemas.yaml#/Id_opr"
        access:
          type: string
          enum:
            - read
          description: Read-only access with masked personal data.
        reason:
          type: string
          maxLength: 2000
        granted_by:
          type: string
          maxLength: 256
        starts_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        expires_at:
          "$ref": "./components/schemas.yaml#/Timestamp"
        status:
          type: string
          enum:
            - active
            - revoked
            - expired
        revoked_at:
          oneOf:
            - "$ref": "./components/schemas.yaml#/Timestamp"
            - type: "null"
      additionalProperties: false
    SupportDelegationList:
      allOf:
        - "$ref": "./components/schemas.yaml#/ListEnvelope"
        - properties:
            data:
              type: array
              items:
                "$ref": "#/components/schemas/SupportDelegation"
    SupportDelegationCreate:
      type: object
      required:
        - operator_id
        - reason
      properties:
        operator_id:
          "$ref": "./components/schemas.yaml#/Id_opr"
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        duration:
          "$ref": "./components/schemas.yaml#/Duration"
          description: "Validity, PT15M to P3D; default PT4H."
      additionalProperties: false
    ProviderAccountCreate:
      type: object
      required:
        - channel
        - provider
        - ownership
        - role
        - priority
        - transfer_basis
      properties:
        channel:
          "$ref": "./components/schemas.yaml#/Channel"
        provider:
          "$ref": "./components/schemas.yaml#/ProviderName"
        ownership:
          type: string
          enum:
            - shared
            - tenant
        credential_ref:
          "$ref": "./components/schemas.yaml#/SecretRef"
        role:
          "$ref": "./components/schemas.yaml#/ProviderAccountRole"
        priority:
          type: integer
          minimum: 0
          maximum: 99
        weight:
          type: integer
          minimum: 0
          maximum: 10000
        in_installation:
          type: boolean
        processing_countries:
          "$ref": "./components/schemas.yaml#/CountryList"
        transfer_basis:
          "$ref": "./components/schemas.yaml#/TransferBasis"
        scc_notified_on:
          type: string
          format: date
        settings:
          "$ref": "./components/schemas.yaml#/ProviderSettings"
      additionalProperties: false
    CredentialRotation:
      type: object
      required:
        - credential_ref
      properties:
        credential_ref:
          "$ref": "./components/schemas.yaml#/SecretRef"
      additionalProperties: false
    SenderIdentityReview:
      type: object
      required:
        - approval_state
      properties:
        approval_state:
          type: string
          enum:
            - pending
            - approved
            - rejected
      additionalProperties: false
    SenderIdentitySuspension:
      type: object
      required:
        - rule_id
      properties:
        rule_id:
          "$ref": "./components/schemas.yaml#/RuleId"
      additionalProperties: false
