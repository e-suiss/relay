        - approved
        - rejected
    suspended_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    suspension_rule_id:
      oneOf:
        - "$ref": "#/RuleId"
        - type: "null"
    sms_type:
      oneOf:
        - type: string
          enum:
            - alphanumeric
            - short_code
            - long_number
            - toll_free
            - ten_dlc
        - type: "null"
    state:
      type: string
      enum:
        - active
        - archived
    archived_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
SenderIdentityList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - properties:
        data:
          type: array
          items:
            "$ref": "#/SenderIdentity"
SenderIdentityCreate:
  type: object
  required:
    - provider_account_id
    - kind
    - value
  properties:
    provider_account_id:
      "$ref": "#/Id_pva"
    subtenant_id:
      "$ref": "#/Id_stn"
    kind:
      "$ref": "#/SenderIdentityKind"
    value:
      type: string
      minLength: 1
      maxLength: 320
    country:
      type: string
      pattern: "^[A-Z]{2}$"
  additionalProperties: false
SenderIdentityPatch:
  type: object
  description: "JSON Merge Patch of a sender identity; null clears the sub-tenant or the country."
  properties:
    subtenant_id:
      oneOf:
        - "$ref": "#/Id_stn"
        - type: "null"
    country:
      oneOf:
        - type: string
          pattern: "^[A-Z]{2}$"
        - type: "null"
  additionalProperties: false
ChannelIdentityKind:
