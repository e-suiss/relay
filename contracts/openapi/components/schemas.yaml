        - type: integer
          minimum: 1
        - type: "null"
    errors:
      type: array
      items:
        "$ref": "./problem.yaml#/FieldError"
    requested_at:
      "$ref": "#/Timestamp"
    finished_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
Workflow:
