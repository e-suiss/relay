        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_missing_credentials
        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_insufficient_scope
        - auth_tenant_suspended
        - auth_subscriber_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
      x-relay-scopes:
        - preferences
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
      x-relay-choice: true
      x-relay-choice-note: "Path chosen by the contract; the subscriber comes from the token, never from the request."
    patch:
      operationId: updateMyPreferences
      tags:
        - preferences
      summary: Update my preferences
      description: "The subscriber writes any preference value (opt_in, opt_out or unset) and its profile: quiet hours, weekly schedule, do not disturb, whether quiet hours apply to email, and digest choices. Closing the last open channel of a locked or security category is 422 preference_last_channel. A digest choice for a category that is neither social nor a digest-allowed operational category is 422 preference_digest_not_allowed. The writes are applied together or not at all; the response is the read shape."
      parameters:
