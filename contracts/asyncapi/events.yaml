asyncapi: "3.1.0"
info:
  title: Relay Event Catalog
  version: "2026-11-01"
  description: "Single catalog of every event name (noun.verb_past). A concept is never published under two names, and cancelled is the only spelling of that state. The catalog feeds the portal, SDKs and webhook verifiers. Outgoing events use the CloudEvents 1.0 envelope; each event type has a versioned data schema and a schema change opens a new version. Default payloads are thin: type, id and related identifiers, no personal data."
  license:
    name: Apache-2.0
defaultContentType: application/cloudevents+json
