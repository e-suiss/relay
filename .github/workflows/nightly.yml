name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: docker compose -f deploy/compose.yaml --profile chaos up -d --wait
      # OP-93
      - run: |
          curl -fsS -X POST http://localhost:8474/proxies -H 'content-type: application/json' \
            -d '{"name":"valkey","listen":"0.0.0.0:26379","upstream":"valkey:6379","enabled":true}'
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - run: mix deps.audit
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends softhsm2 opensc
      - run: rustup toolchain install
        working-directory: native/pkcs11_port
      - run: rustup toolchain install
        working-directory: native/mjml_port
      - run: native/build.sh
      - run: mix test --include integration --include nightly
        env:
          TOXIPROXY_URL: http://localhost:8474
          CHAOS_VALKEY_URL: redis://localhost:26379
      - shell: bash
        run: mix run bench/fanout_100k.exs | tee fanout-bench.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fanout-bench-${{ github.run_id }}
          path: fanout-bench.txt
      - shell: bash
        run: mix run bench/breaker_open.exs | tee breaker-bench.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: breaker-bench-${{ github.run_id }}
          path: breaker-bench.txt
      - shell: bash
        run: mix run bench/load_shed_latency.exs | tee load-shed-bench.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-shed-bench-${{ github.run_id }}
          path: load-shed-bench.txt

  live-destinations:
    uses: ./.github/workflows/live-destinations.yml

  region-acceptance:
    uses: ./.github/workflows/region-acceptance.yml

  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/compose.yaml up -d --wait postgres valkey minio
      - run: docker pull ghcr.io/e-suiss/relay:main
      - run: SMOKE_KEEP=1 deploy/smoke.sh ghcr.io/e-suiss/relay:main
      - run: load/run.sh load/targets/health.txt 200/1s 60s
      - run: load/budget.sh "$(ls -d load/output/*-health | tail -n 1)/report.json" health
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-${{ github.run_id }}
          path: load/output

  load-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      MIX_ENV: dev
      SOFTHSM2_CONF: ${{ github.workspace }}/deploy/softhsm/softhsm2.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-plane
      # OP-93
      - run: load/accept.sh 50 30
      - run: load/budget.sh "$(ls -d load/output/*-accept | tail -n 1)/report.json" accept
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - if: failure()
        run: tail -n 200 "$RUNNER_TEMP/relay.log"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-accept-${{ github.run_id }}
          path: |
            load/output
            !load/output/**/targets.txt
          if-no-files-found: ignore
