      minLength: 1
      maxLength: 128
    workflow:
      "$ref": "#/WorkflowKey"
    to:
      type: array
      description: Recipients, 1 to 100.
      items:
        "$ref": "#/RecipientTarget"
      minItems: 1
      maxItems: 100
    actor:
      "$ref": "#/Actor"
    tenant:
      description: "Subtenant within the API client's tenant."
      "$ref": "#/Id_stn"
    data:
      type: object
      description: Event data, at most 256 kB, validated against the event schema of the published workflow version. Do not send preformatted values.
    dedup_key:
      type: string
      description: "Business key; the same key opens no new notification for the same recipient."
      minLength: 1
      maxLength: 512
    channels:
      type: array
      description: "Narrows the workflow's steps to these channels; never adds steps."
      items:
        "$ref": "#/Channel"
      minItems: 1
      uniqueItems: true
    overrides:
      "$ref": "#/Overrides"
    send_at:
      description: Future send time, at most 90 days ahead.
      "$ref": "#/Timestamp"
    expires_at:
      description: "After this instant nothing is sent; the notification ends expired. Required for security subtypes."
      "$ref": "#/Timestamp"
    priority:
      "$ref": "#/Priority"
    security_subtype:
      "$ref": "#/SecuritySubtype"
    on_expire:
      "$ref": "#/OnExpire"
    cancellation_key:
      type: string
      description: "Optional cancellation key; need not be unique."
      minLength: 1
      maxLength: 256
      pattern: "^[\\x21-\\x7E]+$"
    retention:
      type: string
      enum:
        - none
      description: "Do not store rendered content (not for the security class; rejected together with in_app)."
    metadata:
      "$ref": "#/Metadata"
    send_mode:
      "$ref": "#/SendMode"
      description: "Explicit send mode for this request. Accepted only in the test environment; a live client gets auth_environment_mismatch."
      x-relay-choice: true
      x-relay-choice-note: "The spec allows a per-request mode only in test but names no field; a body field is chosen."
  additionalProperties: false
BatchRequest:
  type: object
  required:
    - events
  properties:
    events:
      type: array
      description: "At most 500 events; at most 100 recipients per event; body at most 5 MB."
