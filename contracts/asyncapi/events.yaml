  tenantWebhooks:
    address: null
    title: tenantWebhooks
    description: "Tenant webhook endpoints and event destinations (use A). Endpoints subscribe to chosen types; an empty selection receives nothing. Delivery follows the shared Suiss webhook profile and is at least once."
