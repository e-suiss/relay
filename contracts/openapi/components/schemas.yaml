    - name
    - category
    - event_schema
    - steps
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      maxLength: 2000
    category:
      type: string
      description: Tenant category key.
      pattern: "^[a-z][a-z0-9_]{0,63}$"
    message_class:
      "$ref": "#/MessageClass"
    event_schema:
      type: object
      description: "JSON Schema 2020-12 for event data; incoming data is validated against it at accept time."
    steps:
      type: array
      items:
        "$ref": "#/ChannelStep"
      minItems: 1
      maxItems: 50
    overrides:
      "$ref": "#/Overrides"
      description: "Workflow-level overrides of every step. Precedence is request, step, workflow, tenant default; a raw block cannot set a policy field (policy_field_not_overridable)."
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "The spec names a workflow level of overrides but no field; the definition carries an overrides field of the request's shape."
  additionalProperties: false
