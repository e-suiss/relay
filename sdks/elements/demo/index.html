<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay web components</title>
    <style>
      body {
        margin: 0;
        padding: 0 16px;
        font-family: system-ui, sans-serif;
      }
      body.dark {
        background: #111418;
        color: #f1f3f5;
      }
      main {
        display: grid;
        gap: 24px;
      }
      relay-preference-center.branded {
        --relay-color-accent: #0b5c3b;
        --relay-color-accent-text: #ffffff;
      }
      body.dark relay-preference-center.branded {
        --relay-color-accent: #8fd3b0;
        --relay-color-accent-text: #0b1220;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Relay web components</h1>
      <relay-inbox-popover tags="shipping"></relay-inbox-popover>
      <relay-inbox tags="shipping"></relay-inbox>
      <relay-preference-center class="branded" heading-level="2"></relay-preference-center>
      <relay-webhook-portal></relay-webhook-portal>
      <relay-toaster></relay-toaster>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
