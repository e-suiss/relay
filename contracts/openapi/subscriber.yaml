        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_insufficient_scope
        - auth_tenant_suspended
        - auth_subscriber_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - idempotency_key_missing
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - device_not_found
      x-relay-scopes:
        - "devices:write"
      x-relay-weight: 1
      x-relay-idempotency: required
      x-relay-step-up: false
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "Path and the logout reason are chosen by the contract."
  "/v1/subscriber/push_receipts":
    post:
      operationId: recordMyPushReceipt
      tags:
        - devices
      summary: Record a push receipt
      description: "The mobile or web SDK reports that a push of the token's subscriber was displayed or clicked (actor client_sdk). A displayed receipt is the only delivery evidence of a push and raises the delivery to delivered; a clicked receipt is engagement and leaves delivery as it is. Both are recorded in the delivery's ledger and are decision input (DS-13, DS-12). A delivery of another subscriber or of another channel is 404. occurred_at is the device's time, never later than the server's."
      parameters:
        - "$ref": "./components/parameters.yaml#/RelayVersion"
        - "$ref": "./components/parameters.yaml#/RelayBeta"
        - "$ref": "./components/parameters.yaml#/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PushReceipt"
      security:
        - subscriber_bearer:
            - "devices:write"
      responses:
        "202":
          description: Recorded.
          headers:
            Request-Id:
              "$ref": "./components/headers.yaml#/Request-Id"
            Relay-Version:
              "$ref": "./components/headers.yaml#/Relay-Version"
            RateLimit:
              "$ref": "./components/headers.yaml#/RateLimit"
            RateLimit-Policy:
              "$ref": "./components/headers.yaml#/RateLimit-Policy"
            X-RateLimit-Limit:
              "$ref": "./components/headers.yaml#/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "./components/headers.yaml#/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "./components/headers.yaml#/X-RateLimit-Reset"
            Deprecation:
