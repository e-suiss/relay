            Link:
              "$ref": "./components/headers.yaml#/Link"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RealtimePoll"
        "400":
          "$ref": "./components/responses.yaml#/BadRequest"
        "401":
          "$ref": "./components/responses.yaml#/Unauthorized"
        "403":
          "$ref": "./components/responses.yaml#/Forbidden"
        "422":
          "$ref": "./components/responses.yaml#/UnprocessableContent"
        "429":
          "$ref": "./components/responses.yaml#/TooManyRequests"
        "500":
          "$ref": "./components/responses.yaml#/InternalError"
        "503":
          "$ref": "./components/responses.yaml#/ServiceUnavailable"
      x-relay-errors:
        - auth_missing_credentials
        - auth_malformed_credentials
        - auth_invalid_token
        - auth_expired_token
        - auth_insufficient_scope
        - auth_tenant_suspended
        - auth_subscriber_suspended
        - unsupported_api_version
        - unsupported_beta_feature
        - rate_limited
        - internal_error
        - service_unavailable
        - validation_failed
      x-relay-scopes:
        - "inbox:read"
      x-relay-weight: 1
      x-relay-idempotency: not_applicable
      x-relay-step-up: false
      x-relay-stage: 9
      x-relay-choice: true
      x-relay-choice-note: "IN-23 names long-poll as the last fallback but no path; /v1/realtime/poll, its JSON shape and the 25 second wait are contract choices."
components:
  securitySchemes:
    subscriber_bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Relay subscriber token from the token exchange. Scopes: inbox:read, inbox:write, preferences, devices:write, presence:write. Access tokens are never accepted here."
  schemas:
    TokenExchangeRequest:
      type: object
      description: RFC 8693 token exchange request.
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          type: string
          const: "urn:ietf:params:oauth:grant-type:token-exchange"
        subject_token:
          type: string
          description: "The end user's DPoP-bound Access access token: typ at+jwt, aud Relay's Access client_id, access_tenant and client_id naming the registered Access client, sub the pairwise subject."
          minLength: 1
          maxLength: 8192
        subject_token_type:
          type: string
          const: "urn:ietf:params:oauth:token-type:access_token"
        requested_token_type:
          type: string
          const: "urn:suiss:relay:token-type:subscriber"
          x-relay-choice: true
          x-relay-choice-note: Token type URI chosen by the contract.
        scope:
          type: string
          description: "Space-separated subset of inbox:read inbox:write preferences devices:write presence:write. Default: inbox:read inbox:write preferences."
          pattern: "^(inbox:read|inbox:write|preferences|devices:write|presence:write)( (inbox:read|inbox:write|preferences|devices:write|presence:write))*$"
      additionalProperties: false
    TokenExchangeResponse:
      type: object
      description: RFC 8693 token exchange response. The tenant identifier is never written into a field the client can see.
      required:
        - access_token
        - issued_token_type
        - token_type
        - expires_in
        - scope
        - subscriber_id
        - environment
      properties:
        access_token:
          type: string
          description: "Relay subscriber token: asymmetrically signed, audience is the Relay inbox and realtime surface, carries the environment and the allowed realtime streams."
        issued_token_type:
          type: string
          const: "urn:suiss:relay:token-type:subscriber"
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 900
          description: "Lifetime in seconds; 15 minutes by default. SDKs renew before expiry."
        scope:
          type: string
        subscriber_id:
          "$ref": "./components/schemas.yaml#/Id_sub"
          x-relay-choice: true
        environment:
          "$ref": "./components/schemas.yaml#/Environment"
      additionalProperties: false
    PushReceipt:
      type: object
      description: "A push receipt of the SDK (DS-13)."
      required:
        - delivery_id
        - receipt
      properties:
        delivery_id:
          "$ref": "./components/schemas.yaml#/Id_dlv"
        receipt:
          type: string
          enum:
            - displayed
            - clicked
        occurred_at:
          type: string
          format: date-time
      additionalProperties: false
    PushReceiptRecorded:
      type: object
      required:
        - object
        - delivery_id
        - receipt
      properties:
        object:
          type: string
          enum:
            - push_receipt
        delivery_id:
          "$ref": "./components/schemas.yaml#/Id_dlv"
        receipt:
          type: string
          enum:
            - displayed
            - clicked
      additionalProperties: false
    RealtimePoll:
      type: object
      description: "The envelopes of a long-poll and the cursor to send next."
      required:
        - events
        - cursor
      properties:
        events:
          type: array
          maxItems: 501
          items:
            "$ref": "#/components/schemas/RealtimeEnvelope"
        cursor:
          type: string
          maxLength: 512
      additionalProperties: false
    RealtimeEnvelope:
      type: object
      description: "The realtime envelope {t, v, ts, d} with counters on every message and the resume cursor id; the AsyncAPI catalog (channel inboxRealtime) has the body of each type."
      required:
        - t
        - v
        - ts
        - d
        - counters
      properties:
        t:
          type: string
          enum:
            - inbox.item_created
            - inbox.item_updated
            - inbox.items_bulk_updated
            - inbox.counters_changed
            - stream.resync_required
        v:
          type: integer
          minimum: 1
        ts:
          "$ref": "./components/schemas.yaml#/Timestamp"
        id:
          type: string
          maxLength: 512
        d:
          type: object
        counters:
          type: object
          required:
            - unseen
            - unread
            - total
            - version
          properties:
            unseen:
              type: integer
              minimum: 0
            unread:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
            version:
              type: integer
              minimum: 0
          additionalProperties: false
      additionalProperties: false
x-relay-family:
  - client
x-relay-subscriber-scopes:
  - "inbox:read"
  - "inbox:write"
  - preferences
  - "devices:write"
  - "presence:write"
x-relay-error-catalog: "../errors.yaml"
