      type: string
      maxLength: 256
    credential_ref_id:
      "$ref": "#/Id_sec"
    brands:
      type: array
      items:
        "$ref": "#/IysBrand"
    quota:
      type: object
      description: "The consent quota of the İYS subscription (consentLimit, usedConsentLimit): full when the limit is reached and may not be exceeded, warning from 80 percent of it, unknown while it was not read."
      required:
        - state
        - consent_limit
        - used_consent_limit
        - checked_at
      properties:
        state:
          type: string
          enum:
            - unknown
            - ok
            - warning
            - full
        consent_limit:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        used_consent_limit:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        checked_at:
          oneOf:
            - "$ref": "#/Timestamp"
            - type: "null"
      additionalProperties: false
    blocked_code:
      description: "The İYS error code of the last request İYS refused for the connection itself (no access, a closed subscription); null once İYS answered again. While it is recent nothing is sent."
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    blocked_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    version:
      type: integer
      minimum: 1
    created_at:
      "$ref": "#/Timestamp"
    updated_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "PC-29 names the two connection modes, the iysCode, the brands and their bindings and PC-34 the quota; the resource and its fields are chosen by the contract."
IysConnectionTest:
  type: object
  description: "What İYS answered to a test of the connection (PC-29, PC-34). token is ok or the reason no token was issued (an İYS error code, http_ and a status, credential_unavailable or unavailable); brands and subscription are present when a token was issued."
  required:
    - object
    - token
    - tested_at
  properties:
    object:
      type: string
      const: iys_connection_test
    token:
      type: string
      maxLength: 64
    brands:
      type: object
      required:
        - result
        - found
        - missing
      properties:
        result:
          type: string
          maxLength: 64
        found:
          type: array
          description: "The brand codes İYS lists for the connection."
          items:
            "$ref": "#/IysCode"
        missing:
          type: array
          description: "The configured brand codes İYS does not list."
          items:
            "$ref": "#/IysCode"
      additionalProperties: false
    subscription:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          maxLength: 64
        status:
          oneOf:
            - type: string
              maxLength: 64
            - type: "null"
        consent_limit:
          oneOf:
            - type: integer
            - type: "null"
        used_consent_limit:
          oneOf:
            - type: integer
            - type: "null"
      additionalProperties: false
    tested_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "The connection test and its shape are chosen by the contract within PC-29 and PC-34."
IysUpload:
  type: object
  description: "One consent movement on its way to İYS (PC-30). status is approval (ONAY) or rejection (RET). state: pending until it is sent, uploaded until İYS's status is read back, confirmed once it agrees, failed when İYS refused it for good, expired when an approval was not recorded within three business days, skipped when there was nothing to write. An upload never shows an address."
  required:
    - object
    - id
    - brand_code
    - channel
    - status
    - recipient_id
    - origin
    - state
    - consent_at
    - deadline_at
    - attempts
    - error_code
    - error_at
    - transaction_ref
    - registered_at
    - trace_ref
    - created_at
    - settled_at
  properties:
    object:
      type: string
      const: iys_upload
    id:
      "$ref": "#/Id_iyu"
    brand_code:
      oneOf:
        - "$ref": "#/IysCode"
        - type: "null"
    channel:
      "$ref": "#/Channel"
    status:
      type: string
      enum:
        - approval
        - rejection
    recipient_id:
      oneOf:
        - "$ref": "#/Id_sub"
        - type: "null"
    origin:
      type: string
      description: "access is a consent Access announced; refusal a refusal notice applied in Relay."
      enum:
        - access
        - refusal
    state:
      type: string
      enum:
        - pending
        - uploaded
        - confirmed
        - failed
        - expired
        - skipped
    consent_at:
      "$ref": "#/Timestamp"
    deadline_at:
      description: "The end of the three business days of an approval; null for a rejection."
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    attempts:
      type: integer
      minimum: 0
    error_code:
      description: "The İYS error code (H followed by digits), http_ and a status, or Relay's own reason: brand_not_mapped, invalid_ and a field, readback_mismatch, deadline_passed, superseded."
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    error_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    transaction_ref:
      description: "The İYS transaction identifier of the movement."
      oneOf:
        - type: string
          maxLength: 128
        - type: "null"
    registered_at:
      description: "When İYS recorded the movement."
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
    trace_ref:
      description: "The X-Trace-Id of the İYS answer, for a support request to İYS."
      oneOf:
        - type: string
          maxLength: 64
        - type: "null"
    created_at:
      "$ref": "#/Timestamp"
    settled_at:
      oneOf:
        - "$ref": "#/Timestamp"
        - type: "null"
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "PC-30 decides the states of the write path and that a permanent failure is kept for the operator; the resource and its fields are chosen by the contract."
IysUploadList:
  allOf:
    - "$ref": "#/ListEnvelope"
    - type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/IysUpload"
  description: "A page of uploads."
SubscriberLookupRequest:
  type: object
  description: "The address to find subscribers by: exactly one of email and phone."
  properties:
    email:
      "$ref": "#/Email"
    phone:
      "$ref": "#/E164"
  oneOf:
    - required:
        - email
    - required:
        - phone
  additionalProperties: false
SubscriberLookup:
  type: object
  description: "The subscribers whose active address is the one sent, with masked personal fields; at most x-relay-limits subscriber_lookup.max_matches."
  required:
    - object
    - data
    - truncated
  properties:
    object:
      type: string
      const: subscriber_lookup
    data:
      type: array
      items:
        "$ref": "#/Subscriber"
      maxItems: 5
    truncated:
      type: boolean
      description: "More subscribers share the address than the answer holds."
  additionalProperties: false
RuleEntry:
  type: object
  description: "One rule of the rule dictionary with its sentence in every language the dictionary carries."
  required:
    - rule_id
    - reason
    - kind
    - outcome
    - detail
    - deprecated
    - description
  properties:
    rule_id:
      "$ref": "#/RuleId"
    reason:
      type: string
      maxLength: 64
    kind:
      type: string
      enum:
        - gate
        - filter
        - shaper
        - terminal
        - admission
    outcome:
      type: string
      enum:
        - skip
        - defer
        - expire
        - cancel
        - pause
        - reject
        - fail
        - resume
        - alarm
    detail:
      type: array
      description: "The detail fields a decision records for the rule; nothing else is shown."
      items:
        type: string
        maxLength: 64
    deprecated:
      type: boolean
    description:
      type: object
      description: "The one sentence explanation by language tag."
      propertyNames:
        "$ref": "#/Locale"
      additionalProperties:
        type: string
  additionalProperties: false
RuleDictionary:
  type: object
  description: "Every rule of the rule dictionary in force, by rule_id."
  required:
    - object
    - data
  properties:
    object:
      type: string
      const: rule_dictionary
    data:
      type: array
      items:
        "$ref": "#/RuleEntry"
  additionalProperties: false
RetentionSetting:
  type: object
  description: "The retention period of one record class in days: the legal period of the tenant's region and sector, the tenant's longer period when set, and the period in force."
  required:
    - retention_class
    - legal_days
    - days
    - effective_days
  properties:
    retention_class:
      type: string
      enum:
        - commercial_message
        - commercial_consent
        - delivery_record
    legal_days:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    days:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 36525
        - type: "null"
    effective_days:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
  additionalProperties: false
TenantSettings:
  type: object
  description: "The tenant settings of the console."
  required:
    - object
    - region
    - default_timezone
    - default_locale
    - version
    - retention
  properties:
    object:
      type: string
      const: tenant_settings
    region:
      "$ref": "#/Region"
    default_timezone:
      "$ref": "#/TimeZone"
    default_locale:
      "$ref": "#/Locale"
    version:
      type: integer
      minimum: 1
      description: "The tenant record's version; updateTenantSettings names it to refuse a concurrent change."
    retention:
      type: array
      items:
        "$ref": "#/RetentionSetting"
  additionalProperties: false
RouteUsageWorkflow:
  type: object
  description: "A version of an active workflow whose channel steps name the route."
  required:
    - key
    - state
    - version
    - steps
  properties:
    key:
      "$ref": "#/WorkflowKey"
    state:
      type: string
      enum:
        - published
        - draft
        - pending
    version:
      oneOf:
        - type: integer
          minimum: 1
        - type: "null"
    steps:
      type: array
      description: "The keys of the channel steps that name the route."
      items:
        type: string
        maxLength: 128
  additionalProperties: false
RouteUsage:
  type: object
  description: "Where a route is used."
  required:
    - object
    - route_key
    - workflows
    - categories
  properties:
    object:
      type: string
      const: route_usage
    route_key:
      "$ref": "#/RouteKey"
    workflows:
      type: array
      items:
        "$ref": "#/RouteUsageWorkflow"
    categories:
      type: array
      description: "The active categories that name the route as their default route."
      items:
        "$ref": "#/CategoryKey"
  additionalProperties: false
EscalationPolicyUsageVersion:
  type: object
  required:
    - version
    - open
    - stalled
  properties:
    version:
      type: integer
      minimum: 1
    open:
      type: integer
      minimum: 0
    stalled:
      type: integer
      minimum: 0
  additionalProperties: false
EscalationPolicyUsage:
  type: object
  description: "The open and stalled waitpoints that pinned a version of the policy."
  required:
    - object
    - policy_key
    - latest_version
    - versions
  properties:
    object:
      type: string
      const: escalation_policy_usage
    policy_key:
      "$ref": "#/EscalationPolicyKey"
    latest_version:
      type: integer
      minimum: 1
    versions:
      type: array
      items:
        "$ref": "#/EscalationPolicyUsageVersion"
  additionalProperties: false
WorkflowPublicationCheck:
  type: object
  description: "The workflow publication gate's result on the draft, computed without publishing."
  required:
    - object
    - publishable
    - errors
  properties:
    object:
      type: string
      const: workflow_publication_check
    publishable:
      type: boolean
    errors:
      type: array
      items:
        "$ref": "./problem.yaml#/FieldError"
  additionalProperties: false
TemplatePublicationCheck:
  type: object
  description: "The template publication gate's findings on the draft, computed without publishing."
  required:
    - object
    - publishable
    - checksum
    - findings
  properties:
    object:
      type: string
      const: template_publication_check
    publishable:
      type: boolean
      description: "No hard finding blocks the draft; warnings still need accept_warnings."
    checksum:
      type: string
      pattern: "^[0-9a-f]{64}$"
    findings:
      type: array
      items:
        "$ref": "#/GateFinding"
  additionalProperties: false
WaitpointStats:
  type: object
  description: "Exact waitpoint figures of the tenant environment at as_of."
  required:
    - object
    - as_of
    - open
    - stalled
    - silent
    - resolved_last_7_days
    - resolved_by_escalation_last_7_days
    - evidence_levels_last_7_days
    - held_notifications
  properties:
    object:
      type: string
      const: waitpoint_stats
    as_of:
      "$ref": "#/Timestamp"
    open:
      type: integer
      minimum: 0
    stalled:
      type: integer
      minimum: 0
    silent:
      type: integer
      minimum: 0
    resolved_last_7_days:
      type: integer
      minimum: 0
    resolved_by_escalation_last_7_days:
      type: integer
      minimum: 0
    evidence_levels_last_7_days:
      type: object
      required:
        - channel_claim
        - relay_session
        - access_aas_ref
      properties:
        channel_claim:
          type: integer
          minimum: 0
        relay_session:
          type: integer
          minimum: 0
        access_aas_ref:
          type: integer
          minimum: 0
      additionalProperties: false
    held_notifications:
      type: integer
      minimum: 0
  additionalProperties: false
VariantReportRow:
  type: object
  description: "Exact counts of the deliveries created on one UTC day for one variant of a workflow channel step, channel and test flag."
  required:
    - day
    - workflow
    - step
    - variant
    - channel
    - is_test
    - accepted
    - sent
    - delivered
    - seen
    - human_clicks
    - bot_clicks
    - recomputed_at
  properties:
    day:
      type: string
      format: date
    workflow:
      "$ref": "#/WorkflowKey"
    step:
      type: string
      maxLength: 128
    variant:
      type: string
      maxLength: 128
    channel:
      "$ref": "#/Channel"
    is_test:
      type: boolean
    accepted:
      type: integer
      minimum: 0
    sent:
      type: integer
      minimum: 0
    delivered:
      type: integer
      minimum: 0
    seen:
      type: integer
      minimum: 0
    human_clicks:
      type: integer
      minimum: 0
    bot_clicks:
      type: integer
      minimum: 0
    recomputed_at:
      "$ref": "#/Timestamp"
  additionalProperties: false
VariantReport:
  type: object
  description: "The A/B variant report of a period of the tenant environment."
  required:
    - object
    - from
    - to
    - rows
  properties:
    object:
      type: string
      const: variant_report
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    rows:
      type: array
      items:
        "$ref": "#/VariantReportRow"
  additionalProperties: false
RenderProblemReportRow:
  type: object
  description: "The deliveries created on one UTC day for one channel, template and test flag that failed to render for one failure_reason (problem render_failed) or fell back to the tenant default locale (problem template_locale_missing, reason null)."
  required:
    - day
    - channel
    - template
    - is_test
    - problem
    - reason
    - deliveries
  properties:
    day:
      type: string
      format: date
    channel:
      "$ref": "#/Channel"
    template:
      oneOf:
        - "$ref": "#/TemplateKey"
        - type: "null"
    is_test:
      type: boolean
    problem:
      type: string
      enum:
        - render_failed
        - template_locale_missing
    reason:
      oneOf:
        - type: string
          enum:
            - missing_variable
            - render_timeout
            - output_too_large
            - schema_violation
            - inbox_item_too_large
        - type: "null"
    deliveries:
      type: integer
      minimum: 1
  additionalProperties: false
RenderProblemReport:
  type: object
  description: "The render and locale problem report of a period of the tenant environment."
  required:
    - object
    - from
    - to
    - rows
  properties:
    object:
      type: string
      const: render_problem_report
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    rows:
      type: array
      items:
        "$ref": "#/RenderProblemReportRow"
  additionalProperties: false
FallbackTimezoneReport:
  type: object
  description: "The sends in an inferred time zone of a period of the tenant environment, per UTC day and source (X-6, WF-46)."
  required:
    - object
    - from
    - to
    - rows
  properties:
    object:
      type: string
      const: fallback_timezone_report
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    rows:
      type: array
      items:
        type: object
        required:
          - day
          - source
          - deliveries
        properties:
          day:
            type: string
            format: date
          source:
            type: string
            enum:
              - device
              - country
              - tenant_default
          deliveries:
            type: integer
            minimum: 1
        additionalProperties: false
  additionalProperties: false
TenantSettingsUpdate:
  type: object
  description: "A change of the tenant settings. A member left out keeps its value. A retention period may only extend the legal period of the tenant's region and sector, and null clears the tenant's own period."
  required:
    - version
  properties:
    version:
      type: integer
      minimum: 1
      description: "The version getTenantSettings returned."
    default_timezone:
      "$ref": "#/TimeZone"
    default_locale:
      "$ref": "#/Locale"
    retention:
      type: object
      properties:
        commercial_message:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 36525
            - type: "null"
        commercial_consent:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 36525
            - type: "null"
        delivery_record:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 36525
            - type: "null"
      additionalProperties: false
  additionalProperties: false
