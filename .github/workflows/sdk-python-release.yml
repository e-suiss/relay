name: sdk-python-release

on:
  push:
    tags:
      - "sdk-python-v*"

permissions:
  contents: read

concurrency:
  group: sdk-python-release
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.7"
  UV_EXCLUDE_NEWER: "2026-11-11T00:00:00Z"
  PYTHON_VERSION: "3.15.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#sdk-python-v}"
          grep -qx "version = \"$version\"" pyproject.toml
          grep -qx "__version__ = \"$version\"" src/esuiss_relay/_version.py
      - run: uv build --python ${{ env.PYTHON_VERSION }} --out-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: sdks/python/dist

  # X-50
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/esuiss-relay/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
