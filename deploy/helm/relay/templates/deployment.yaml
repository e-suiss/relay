{{- range .Values.nodes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    app.kubernetes.io/name: relay
    app.kubernetes.io/instance: {{ $.Release.Name }}
    relay.suiss.app/node: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      relay.suiss.app/node: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay
        app.kubernetes.io/instance: {{ $.Release.Name }}
        relay.suiss.app/node: {{ .name }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: {{ include "relay.image" $ }}
          env:
            {{- include "relay.env" $ | nindent 12 }}
            - name: RELAY_ROLES
              value: {{ join "," .roles | quote }}
          ports:
            - name: http
              containerPort: 4000
          livenessProbe:
            httpGet: {path: /livez, port: http}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database-password
              mountPath: /run/secrets/relay
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: database-password
          secret:
            secretName: {{ $.Values.database.passwordSecret }}
            items:
              - key: password
                path: database-password
        - name: tmp
          emptyDir: {}
{{- end }}
