      type: array
      items:
        "$ref": "#/ChannelStep"
      minItems: 1
      maxItems: 50
    overrides:
      "$ref": "#/Overrides"
      description: "Workflow-level overrides of every step. Precedence is request, step, workflow, tenant default; a raw block cannot set a policy field (policy_field_not_overridable)."
      x-relay-stage: 6
      x-relay-choice: true
      x-relay-choice-note: "The spec names a workflow level of overrides but no field; the definition carries an overrides field of the request's shape."
  additionalProperties: false
  x-relay-choice: true
  x-relay-choice-note: "Until tenant categories exist (later stage), the definition declares message_class next to category; afterwards the class must match the category's class."
WorkflowDefinitionRequest:
