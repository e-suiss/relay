build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
    ignoreAnnotated:
      - Composable
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 25
  LongMethod:
    threshold: 120
  NestedBlockDepth:
    threshold: 6
  CognitiveComplexMethod:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  InstanceOfCheckForException:
    active: false
